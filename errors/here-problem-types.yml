- name: HERE Batch API v7 error messages
  scope: Batch geocoding jobs
  field: error text (human-readable, no numeric code)
  docs: https://docs.here.com/geocoding-and-search/docs/error-messages
  note: '26 documented message/cause/action triples, alphabetical by message text. Notable entries:'
  codes:
  - http: 413
    code: Input exceeds maximum size limit
    meaning: Input over 500 MB uncompressed
    action: Trim the input or split the job into smaller jobs
  - http: 413
    code: Input exceeds maximum record count limit
    meaning: Over 1,000,000 records per job
    action: Trim the input or split the job
  - http: 429
    code: Too many concurrent Jobs running
    meaning: Startable-job queue of 500 exceeded
    action: Stop or wait for existing jobs to complete
  - http: 400
    code: Job has already been completed
    meaning: A completed job cannot be restarted or stopped
    action: Create and start a new job
  - http: 400
    code: Job has been deleted
    meaning: A deleted job cannot be started or stopped
    action: Create and start a new job
  - http: 404
    code: Job not found
    meaning: No job with that ID is visible to the calling user
    action: Verify the job ID and the user access
  - http: 403
    code: User not authorized to access Job
    meaning: Caller lacks access to the job
    action: Verify the user has access
  - http: 400
    code: Invalid billing tags
    meaning: Billing tags must be 4-16 chars, [A-Za-z0-9-_.], up to 6 joined by + or , (not mixed)
    action: Provide valid billing tags
retry_guidance:
  status: 429
  header: Retry-After
  detail: A 429 carries Retry-After (seconds). Tour Planning v3 additionally returns X-RateLimit-Limit and X-RateLimit-Reset.
    HERE notes that a sudden traffic surge can produce 429/503 for up to about 10 minutes even inside quota.
  source: https://docs.here.com/policies/docs/limits-and-quotas
