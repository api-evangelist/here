clis:
- name: OLP CLI (HERE platform command line interface)
  status: current
  official: true
  install: brew tap heremaps/olp-cli && brew install olp-cli
  install_repo: https://github.com/heremaps/homebrew-olp-cli
  docs: https://docs.here.com/workspace/docs/olp-cli-getting-started
  purpose: Access HERE platform services (catalogs, layers, pipelines, IAM, rate-limit rules) from a shell or script.
  command_groups:
  - group: catalog
    detail: create, list, show, update, delete catalogs and layers
  - group: pipeline
    detail: create, activate, deactivate, delete pipelines and pipeline versions
  - group: iam
    detail: apps, groups, roles, grants, access filters
  - group: ratelimit rule
    detail: list active rate-limit rules for identities in the organization; show one rule by identity type and
      endpointId
  - group: ratelimit endpoint
    detail: list rate-limit endpoints for a service; show one by endpointId
  - group: artifact
    detail: publish and resolve platform artifacts
  note: The rate-limit command groups are the CLI face of the IAM Rate Limit Rules API v1 captured in openapi/here-rate-limit-rules-v1-openapi.yml.
