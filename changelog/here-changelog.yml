generated: '2026-09-13'
method: searched
source: https://docs.here.com/routing/docs/routing-v8-changelog (and the 25 sibling per-product changelogs indexed
  below)
scheme: per-product dated changelog; semantic-ish MAJOR.MINOR.PATCH where MAJOR is the URL path version
note: HERE does not publish one platform changelog. Each API has its own dated table with the feature-lifecycle
  change types defined in https://docs.here.com/policies/docs/product-lifecycle-policy (Added / Changed / Deprecated
  / Documentation / Fixed / Known issue / Other / Performance / Removed / Security). Monthly platform highlights
  are published separately on the developer blog.
platform_release_notes: https://www.here.com/learn/blog?type=developer&category=release-notes
recent:
  product: HERE Routing API v8
  url: https://docs.here.com/routing/docs/routing-v8-changelog
  current_version: 8.162.0
  last_updated: '2026-09-07'
  window: 2026-05-12 to 2026-09-07
  breaking: 0
  deprecations: 1
  additions: 5
  entries:
  - version: 8.162.0
    date: '2026-09-07'
    type: Changed
    highlight: Improved ETA on Functional Class 5 roads.
  - version: 8.162.0
    date: '2026-08-27'
    type: Changed
    highlight: ETA calculation and speed for trucks now takes slope into account.
  - version: 8.162.0
    date: '2026-08-26'
    type: Fixed
    highlight: Fixed a case of failed waypoint matching when the waypoint is close to roads that are only open for
      emergency vehicles.
  - version: 8.162.0
    date: '2026-08-18'
    type: Added
    highlight: Error E605502 with 400 HTTP status is returned for a route import request too complex to calculate
      within the request time limits.
  - version: 8.161.0
    date: '2026-08-11'
    type: Added
    highlight: Added ev[maxDrivingTimeBeforeCharge] and ev[minTimeAtFirstChargingStation] parameters.
  - version: 8.160.0
    date: '2026-07-16'
    type: Fixed
    highlight: Highway exit-and-reentry maneuvers caused by transport mode access restrictions are no longer penalized.
  - version: 8.160.0
    date: '2026-07-16'
    type: Fixed
    highlight: Fixed avoid[features]=uTurns producing tighter u-turns when a u-turn could not be avoided.
  - version: 8.159.0
    date: '2026-07-10'
    type: Deprecated
    highlight: Deprecated mlDuration. return=mlDuration is still accepted but no longer returns a value.
  - version: 8.159.0
    date: '2026-07-10'
    type: Changed
    highlight: Bicycle routes may now pass a traffic closure in pedestrian mode where the road is open to pedestrians.
  - version: 8.158.0
    date: '2026-07-09'
    type: Changed
    highlight: Combining arrivalTime with any ev parameter now correctly returns an error.
  - version: 8.157.0
    date: '2026-07-01'
    type: Changed
    highlight: Increased u-turn penalties for bus mode to match truck.
  - version: 8.157.0
    date: '2026-06-29'
    type: Added
    highlight: Added vehicle[trailerLength] parameter.
  - version: 8.156.0
    date: '2026-06-08'
    type: Added
    highlight: Added currencyUnsupported notice code.
  - version: 8.155.0
    date: '2026-05-18'
    type: Added
    highlight: Added ev[auxiliaryPowerCurve] support for the empirical consumption model.
  - version: 8.154.2
    date: '2026-05-12'
    type: Added
    highlight: Added toll support for South Korea (beta).
