tools:
- name: list-endpoints
  title: List API Endpoints
  description: Lists all API paths and their HTTP methods with summaries, organized by path. Results can be passed
    directly into 'get-endpoint'.
  input_schema:
    title: string (required) — title of the OpenAPI spec
- name: get-endpoint
  title: Get Endpoint Details
  description: Gets detailed information about a specific API endpoint, including security schemes and servers.
  input_schema:
    path: string (required)
    method: string (required)
    title: string (required)
- name: search-endpoints
  title: Search API Endpoints
  description: Deep search through paths, operations and parameters to discover relevant API endpoints.
  input_schema:
    pattern: string (required) — case-insensitive search pattern
- name: list-specs
  title: List OpenAPI Specs
  description: Lists all available OpenAPI specs. Use the title to select a spec.
  input_schema: {}
- name: get-server-variables
  title: Get Server Variables
  description: Gets the server variables for each server within a specific OpenAPI spec.
  input_schema:
    title: string (required)
- name: search
  title: Search Documentation
  description: Searches through documentation with the given search query, returning a list of results with ID,
    title and URL.
  input_schema:
    query: string (required)
- name: fetch
  title: Fetch Documentation Page
  description: Gets detailed content for documentation by ID returned from the search tool. Recipe IDs are prefixed
    with recipe:, reference page IDs with ref:.
  input_schema:
    id: string (required)
