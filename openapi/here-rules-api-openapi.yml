openapi: 3.2.0
info:
  version: 2.6.11
  title: HERE Tracking Rules API
  description: 'HERE Tracking is a cloud product designed to address location tracking problems for a wide range of Location IoT industry verticals.


    HERE Tracking also includes end-user mobile and web applications that can be used to demonstrate the product.'
  license:
    name: HERE Documentation License
    url: https://legal.here.com/en-gb/terms/documentation-license
servers:
- url: https://tracking.hereapi.com/
- url: https://tracking.api.here.com/
tags:
- description: The Rules service creates and manages rules.
  name: Rules
paths:
  /rules/v4/health:
    get:
      summary: Gets service health
      security: []
      responses:
        '200':
          description: 'OK


            The service is performing as expected

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Health status
                example:
                  message: healthy
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Rules
      operationId: getRulesV4Health
      x-operation-id-source: derived
  /rules/v4/version:
    get:
      summary: Gets service version
      security: []
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                description: "OK\nService returns its current version number\nschema:\n    type: object\n    properties:\n        \"service-name\":\n            type: string\n            description: Version of service\n    example:\n        servicename: \"1.0.0\"\n"
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Rules
      operationId: getRulesV4Version
      x-operation-id-source: derived
  /rules/v4:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - name: projectId
      schema:
        type: string
        minLength: 1
        maxLength: 50
        description: 'Project ID.

          Any HERE Tracking user must be a member of a Tracking project.

          The project ID can be implicitly resolved if the user calling the API is a member of a single project.

          If the user is a member of multiple projects, the `projectId` query parameter needs to be specified explicitly.

          '
      in: query
      required: false
    post:
      summary: Creates a rule
      description: 'Creates a rule of the specified rule `type` and with the defined `threshold`.

        After the rule has been created, it needs to be associated to a device to get activated.


        Detention rule

        ---

        For a rule of the `detention` type the threshold is defined as a duration in seconds.

        A `DETENTION_STARTED` event gets triggered when the device has remained

        stationary for longer than the threshold duration.

        A `DETENTION_ENDED` event will be generated when the device starts moving again.


        Utilization rule

        ---

        For a rule of the `utilization` type the threshold is defined as a duration in seconds.

        An `UNUTILIZED` event will

        be generated when the device has been stationary for longer than the threshold duration,

        and `UTILIZED` event gets triggered when the device starts moving again after having been stationary.


        Dwelling rule

        ---

        For a rule of the `dwelling` type the threshold is defined as a duration in seconds.

        A `DWELLING_STARTED` event gets triggered when a dwelling time of the device

        inside any device-associated geofence exceeds the threshold duration.

        When the device exits the geofence, a `DWELLING_ENDED` event will be generated.


        Online rule

        ---

        For a rule of the `online` type there is no threshold defined.

        A `TRUE_TO_FALSE` event gets triggered when the

        device is late for the planned ingestion schedule by more than 5 minutes.

        A `FALSE_TO_TRUE` event is generated when the device starts ingesting again after having been offline.

        The planned ingestion schedule needs to be configured in the device `desired shadow`

        (the `desired.system.powerSave.sendMs` or `desired.system.rate.sendMs` property).


        Stock rule

        ---

        For a rule of the `stock` type the threshold is defined as `minVolume` and/or `maxVolume` values.

        When creating a stock rule, also a geofence ID needs to be specified.

        When the number of devices inside the specified geofence exceeds `maxVolume`, an `OVERSTOCK`

        event will be generated. Similarly, when the number of devices inside the specified geofence

        gets below `minVolume`, an `UNDERSTOCK` event will be generated. When the number of

        devices inside the specified geofence is between `minVolume` and `maxVolume`, a `NORMAL_VOLUME`

        event will be generated. Note that the stock rule only gets triggered for devices that are associated

        to the specified geofence. There can be up to 10 stock rules in a tracking project.


        Shipment estimate change

        ---

        For a rule of the `shipmentEtaChange` type the threshold is defined as a ETD/ETA estimation deviation in seconds.

        A `SHIPMENT_ESTIMATE_CHANGED` event gets triggered when the new ETD/ETA estimates values differ

        from the previous estimates more than the defined threshold.

        If the `segmentEtaChange` property is set to `true`, then the event is triggered

        from segment level ETD/ETA estimate changes, not from shipment level ETD/ETA

        estimate changes.


        Shipment schedule rule

        ---

        For a rule of the `shipmentSchedule` type there are `before` and `after` deviation time thresholds

        from the planned shipment ETD/ETA.

        A `SHIPMENT_EARLY` event gets triggered when the shipment is ahead

        of schedule by the number of `before` seconds.

        A `SHIPMENT_DELAYED` event gets triggered when the shipment is behind

        schedule by the number of `after` seconds.

        A `SHIPMENT_ON_TIME` event gets triggered when the shipment is on time.


        When a rule has been successfully created, the response body will contain the created rule ID.'
      security:
      - UserToken: []
      - ClientToken: []
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: Detention
                type: object
                properties:
                  type:
                    type: string
                    description: The rule type
                    enum:
                    - detention
                  threshold:
                    description: 'Detention event is triggered when the asset has been continuously stationary for longer

                      than the threshold duration.

                      '
                    type: object
                    properties:
                      durationS:
                        type: integer
                        description: Duration in seconds
                        minimum: 0
                        maximum: 2147483647
                    required:
                    - durationS
                    additionalProperties: false
                  name:
                    type: string
                    maxLength: 50
                    description: Rule name
                  description:
                    type: string
                    maxLength: 1000
                    description: Rule description
                required:
                - type
                - threshold
                additionalProperties: false
              - title: Dwelling
                type: object
                properties:
                  type:
                    type: string
                    description: The rule type
                    enum:
                    - dwelling
                  threshold:
                    description: 'Dwelling event is triggered when the asset has been continuously inside a geofence

                      for longer than the threshold duration.

                      '
                    type: object
                    properties:
                      durationS:
                        type: integer
                        description: Duration in seconds
                        minimum: 0
                        maximum: 2147483647
                    required:
                    - durationS
                    additionalProperties: false
                  name:
                    type: string
                    maxLength: 50
                    description: Rule name
                  description:
                    type: string
                    maxLength: 1000
                    description: Rule description
                required:
                - type
                - threshold
                additionalProperties: false
              - title: Online
                type: object
                properties:
                  type:
                    type: string
                    description: The rule type
                    enum:
                    - online
                  name:
                    type: string
                    maxLength: 50
                    description: Rule name
                  description:
                    type: string
                    maxLength: 1000
                    description: Rule description
                required:
                - type
                additionalProperties: false
              - title: Shipment ETD/ETA change
                type: object
                properties:
                  type:
                    type: string
                    description: The rule type
                    enum:
                    - shipmentEtaChange
                  threshold:
                    type: object
                    properties:
                      deviation:
                        type: integer
                        description: 'Shipment ETA change event is triggered if shipment ETD or ETA changes

                          more than deviation seconds. If `segmentEtaChange` is set to `true`

                          event is triggered if segment ETD or ETA changes more than deviation

                          seconds.

                          '
                        minimum: 600
                        maximum: 2147483647
                      segmentEtaChange:
                        type: boolean
                        description: 'If set to `true` the event is triggered from segment level ETD/ETA changes,

                          otherwise from shipment level ETD/ETA changes. Default is `false`.

                          '
                    required:
                    - deviation
                    additionalProperties: false
                  name:
                    type: string
                    maxLength: 50
                    description: Rule name
                  description:
                    type: string
                    maxLength: 1000
                    description: Rule description
                required:
                - type
                - threshold
                additionalProperties: false
              - title: Shipment Schedule
                type: object
                properties:
                  type:
                    type: string
                    description: The rule type
                    enum:
                    - shipmentSchedule
                  threshold:
                    type: object
                    properties:
                      before:
                        type: integer
                        description: Allowed time deviation in seconds from the planned ETD/ETA in case the shipment is ahead of schedule
                        minimum: 0
                        maximum: 2147483647
                      after:
                        type: integer
                        description: Allowed time deviation in seconds from the planned ETD/ETA in case the shipment is behind the schedule
                        minimum: 0
                        maximum: 2147483647
                    additionalProperties: false
                  name:
                    type: string
                    maxLength: 50
                    description: Rule name
                  description:
                    type: string
                    maxLength: 1000
                    description: Rule description
                required:
                - type
                - threshold
                additionalProperties: false
              - title: Stock
                type: object
                properties:
                  type:
                    type: string
                    description: The rule type
                    enum:
                    - stock
                  geofenceId:
                    description: Geofence ID
                    type: string
                    format: uuid
                  threshold:
                    type: object
                    properties:
                      maxVolume:
                        type: integer
                        description: A maximum volume of stock
                        minimum: 0
                      minVolume:
                        type: integer
                        description: A minimum volume of stock
                        minimum: 0
                    additionalProperties: false
                  name:
                    type: string
                    maxLength: 50
                    description: Rule name
                  description:
                    type: string
                    maxLength: 1000
                    description: Rule description
                required:
                - type
                - geofenceId
                - threshold
                additionalProperties: false
              - title: Utilization
                type: object
                properties:
                  type:
                    type: string
                    description: The rule type
                    enum:
                    - utilization
                  threshold:
                    description: 'Utilization event is triggered when the asset starts moving

                      indicating that the asset is utilized, and also when the asset stops

                      moving and has been stationary for longer than the threshold duration

                      indicating that the asset is unutilized.

                      '
                    type: object
                    properties:
                      durationS:
                        type: integer
                        description: Duration in seconds
                        minimum: 0
                        maximum: 2147483647
                    required:
                    - durationS
                    additionalProperties: false
                  name:
                    type: string
                    maxLength: 50
                    description: Rule name
                  description:
                    type: string
                    maxLength: 1000
                    description: Rule description
                required:
                - type
                - threshold
                additionalProperties: false
      tags:
      - Rules
      responses:
