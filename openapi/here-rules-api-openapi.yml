      responses:
        '200':
          description: 'Response body contains an array of rule objects, `count` indicates the number of returned rules,

            and `pageToken` is the next page token if available.


            If no rules are found, an object with an empty data array is returned.

            '
          content:
            application/json:
              example:
                items:
                - ruleId: f4c26630-5d26-4cd1-a57e-g7834e72cb99
                  rule:
                    type: dwelling
                    threshold:
