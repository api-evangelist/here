  /batch/jobs/{jobId}/results:
    get:
      tags:
      - Batch Jobs
      summary: Returns the results of a job
      description: 'Fetches the results of the job with the specified ID, given that it has completed successfully, as a downloadable stream of data.


        If the job does not (yet) have any results available, this operation responds with a `404 - NOT FOUND` response.'
      operationId: getJobResults
      parameters:
      - name: jobId
        in: path
        description: Identifier that was auto-generated on job creation and uniquely identifies the job.
        required: true
        schema:
          type: string
          minLength: 1
        example: JOB-3fa85f64-5717-4562-b3fc-2c963f66afa6
      - name: X-Request-ID
        in: header
        description: User-provided token that can be used to trace a request or a group of requests sent to the service.
        schema:
          type: string
      responses:
        '200':
          description: 'The results of the job as a downloadable stream. Formatted according to the output format descriptor provided during creation/modification of the job. '
          headers:
            Transfer-Encoding:
              description: Encoding is expected to be `chunked` for streaming downloads of unknown size
              style: simple
              schema:
                type: string
                example: chunked
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Content-Disposition:
              description: The format is expected to be `attachment` or `attachment; filename="JOB-<id>-results.txt"`
              style: simple
              schema:
                type: string
                example: attachment; filename="JOB-3fa85f64-5717-4562-b3fc-2c963f66afa6-results.txt"
            Content-Encoding:
              description: Content may be compressed to reduce bandwidth requirements
              style: simple
              schema:
                type: string
                example: gzip
          content:
            text/plain:
              schema:
                type: string
                format: binary
              examples:
                Geocoder job results:
                  $ref: '#/components/examples/GeocoderJobOutput'
        '204':
          description: API response when the job has no results.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            text/plain:
              schema:
                type: 'null'
        '401':
          description: API response in case of unauthorized access.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                Unauthorized:
                  $ref: '#/components/examples/UnauthorizedErrorExample'
        '403':
          description: API response in case of forbidden access.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                Forbidden:
                  $ref: '#/components/examples/ForbiddenErrorExample'
        '404':
          description: "API response when either:\n - a job with the specified ID could not be located, or\n - the results of the job is unavailable."
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Job Not Found:
                  $ref: '#/components/examples/JobNotFoundErrorExample'
                Job Results Not Found:
                  $ref: '#/components/examples/JobResultsUnavailableErrorExample'
        default:
          description: API response in case of errors.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKey: []
      - Bearer: []
    servers:
