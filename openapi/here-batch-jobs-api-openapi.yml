      description: Production environment URL
  /batch/jobs/{jobId}/start:
    put:
      tags:
      - Batch Jobs
      summary: Starts a job
      description: 'Schedules a job for immediate execution and responds with a `200 - OK` if successful.

        If the job is already running this operation does nothing and will respond with the same `200 - OK` response.


        If the job was previously halted, this operation will continue execution from the point where it was stopped.

        If you wish to restart a job from its beginning, you should create a new job and delete the existing one.


        Take note, this operation will return a `429 - TOO MANY REQUESTS` if the allowed number of concurrently running jobs is exceeded.'
      operationId: startJob
      parameters:
      - name: jobId
        in: path
        description: Identifier that was auto-generated on job creation and uniquely identifies the job.
        required: true
        schema:
          type: string
          minLength: 1
        example: JOB-3fa85f64-5717-4562-b3fc-2c963f66afa6
      - name: X-Request-ID
        in: header
        description: User-provided token that can be used to trace a request or a group of requests sent to the service.
        schema:
          type: string
      responses:
        '200':
          description: 'Response if the job was successfully scheduled for execution.


            The job''s status will change to `queued` if the job was successfully validated and scheduled for execution.


            When the job starts execution the status will change to `inProgress`.'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
              examples:
                Geocoder job:
                  $ref: '#/components/examples/GeocoderJobPendingExample'
                Reverse Geocoder job:
                  $ref: '#/components/examples/ReverseGeocoderJobPendingExample'
        '400':
          description: Response if the job could not be executed due to incomplete request information.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API response in case of unauthorized access.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                Unauthorized:
                  $ref: '#/components/examples/UnauthorizedErrorExample'
        '403':
          description: API response in case of forbidden access.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                Forbidden:
                  $ref: '#/components/examples/ForbiddenErrorExample'
        '404':
          description: API response when the job with the specified ID could not be located.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Job not found:
                  $ref: '#/components/examples/JobNotFoundErrorExample'
        '429':
          description: Response if the allowed number of concurrently running jobs is exceeded.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Too many concurrent jobs:
                  $ref: '#/components/examples/MaxConcurrentJobsErrorExample'
        default:
          description: API response in case of errors.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKey: []
      - Bearer: []
    servers:
    - url: https://batch.search.hereapi.com/v7
      description: Production environment URL
  /batch/jobs/{jobId}/stop:
    put:
      tags:
      - Batch Jobs
      summary: Stops a job
      description: 'This operation will schedule a job to be halted and responds with a `200 - OK` if successful. If the job is **not** currently running, then this operation does nothing but will still return a `200 - OK` response.


        Once the job has been stopped, you can continue from where the job halted by starting it again.'
