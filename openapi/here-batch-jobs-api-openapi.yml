          description: Response if the job was successfully scheduled to be halted. The job's status will change to `stopped` once the job is successfully halted.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
