openapi: 3.2.0
info:
  title: Geocoding and Search API v7 Multi Revgeocode API
  version: '7.155'
  description: This document describes the Geocoding and Search API.
security:
- Bearer: []
- ApiKey: []
tags:
- name: Multi Revgeocode
paths:
  /multi-revgeocode:
    servers:
    - url: https://multi-revgeocode.search.hereapi.com/v1
    post:
      summary: Multi-Reverse Geocode
      description: This endpoint returns addresses/places for a list of geo-coordinates specified in the request.
      parameters:
      - $ref: '#/components/parameters/addressNamesVariantLookupRevgeocode'
      - $ref: '#/components/parameters/typesRevgeocode'
      - $ref: '#/components/parameters/withRevgeocode'
      - $ref: '#/components/parameters/langAutosuggestBrowseDiscoverGeocodeLookupRevgeocode'
      - $ref: '#/components/parameters/limitMultiRevgeocode'
      - $ref: '#/components/parameters/politicalView'
      - $ref: '#/components/parameters/showMapReferencesGeocodeLookupRevgeocode'
      - $ref: '#/components/parameters/showNavAttributes'
      - $ref: '#/components/parameters/showRelatedRevgeocode'
      - $ref: '#/components/parameters/showRevgeocode'
      - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: The search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSearchMultiReverseGeocodeResponse'
        '400':
          description: 'Client error: request failed validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 'Client error: http method not supported.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 'Client error: request body exceeds size limit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'Client error: request body has unsupported content type.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Client error: Rate limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporary server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: "Takes a newline-separated list of requests, following the URL query parameter syntax. Each line can only contain the following parameters.\n\n* The mandatory `id` parameter to identify the sub-request. Its value must be unique per request, with a size limit of 64 characters and\n  can only contain alphanumeric characters, underscores, or dashes.\n\n  If sub-requests in the HTTP body contain same IDs, the system processes only the first occurrence and ignores the rest.\n\n* A mandatory location context: either `at` or `in:circle` must be specified, but not both at the same time.\n  The supported values are the same as for their query parameter counterparts in the Reverse Geocode endpoint.\n\n* An optional `bearing` parameter, to expresses the direction in which an asset is heading in degrees starting at true north and continuing clockwise around the compass.\n  North is 0 degrees, east is 90 degrees, south is 180 degrees, and west is 270 degrees. Values are expected to be of type Integer.\n\n  For additional constraints related to the `bearing` parameter, see the parameter description in the Reverse Geocode endpoint.\n\nNo other parameters are allowed in the body. The body parameters must not be used in the URL.\nOther request parameters can be used in the URL as specified in the corresponding section.\nThese are active for all sub-requests and combined with the location context from a body line, build a complete sub-request.\nNote that Multi-Reverse Geocode requests can only use `limit`-parameter values of up to ten. It is recommended to keep the value as low as possible for good performance.\n\nAt most, one hundred sub-requests are allowed per Multi Reverse Geocode request.\n"
        required: true
        content:
          text/plain; charset=UTF-8:
            schema:
              type: string
            example: 'id=1&at=52.4,13.4

              id=2&at=52.3,13.4'
          application/x-www-form-urlencoded:
            schema:
              type: string
            example: 'id=1&at=52.4,13.4

              id=2&at=52.3,13.4'
      tags:
      - Multi Revgeocode
      operationId: postMultiRevgeocode
      x-operation-id-source: derived
components:
  schemas:
    Segment:
      type: object
      properties:
        ref:
          type: string
          description: 'The segment reference follows the format `{segmentId}(#{offset})?`,

            representing its relative position from the result location to a segment.'
        side:
          type: string
          description: "The side of the link the attribute is applicable to\n\n- for `resultType=houseNumber` and `resultType=place`: side of the entity to the link\n- for `resultType=street`:\n  - on endpoints *Geocode* and *Lookup*: side of the entity to the link, it is always \"both\"\n  - on endpoints *Reverse Geocode* and *Multi-Reverse Geocode*: relative side from input to the link\n"
    OpenSearchMultiReverseGeocodeResponseItem:
      type: object
      required:
      - id
      - items
      properties:
        id:
          type: string
          description: The ID for the query provided by the client
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/ReverseGeocodeResultItem'
          description: The results are presented as a JSON list of candidates in ranked order (most-likely to least-likely) based on the matched location criteria.
    PointAddressSection:
      type: object
      required:
      - hmcId
      properties:
        hmcId:
          type: string
          description: The point address ID in HERE Map Content
        partitionId:
          type: string
          description: '**ALPHA**


            Unique identifier that references a specific subset of geo-location related layers

            (e.g., address, location, street, or place) in the HERE Map Content'
    AddressUsage:
      type: object
      required:
      - usageType
      properties:
        usageType:
          type: string
          enum:
          - nonResidential
          - residential
          description: A flag specifying whether the address is residential. (only rendered if `show=addressUsage` is provided.)
    ErrorResponse:
      type: object
      required:
      - status
      - title
      - correlationId
      - requestId
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP status code
        title:
          type: string
          description: Human-readable error description
        code:
          type: string
          description: Error code
        cause:
          type: string
          description: Human-readable explanation for the error
        action:
          type: string
          description: Human-readable action for the user
        correlationId:
          type: string
          description: Auto-generated ID univocally identifying this request
        requestId:
          type: string
          description: Request identifier provided by the user
    MultiResultErrorSection:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          description: Human-readable error description
    StreetInfo:
      type: object
      properties:
        baseName:
          type: string
          description: Base name part of the street name.
        streetType:
          type: string
          description: Street type part of the street name.
        streetTypePrecedes:
          type: boolean
          description: Defines if the street type is before or after the base name.
        streetTypeAttached:
          type: boolean
          description: Defines if the street type is attached or unattached to the base name.
        prefix:
          type: string
          description: A prefix is a directional identifier that precedes, but is not included in, the base name of a road.
        suffix:
          type: string
          description: A suffix is a directional identifier that follows, but is not included in, the base name of a road.
        direction:
          type: string
          description: Indicates the official directional identifiers assigned to highways, typically either "North/South" or "East/West"
        language:
          type: string
          description: BCP 47 compliant language code
    MapReferenceSection:
      type: object
      properties:
        links:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/LinkInfoSection'
          description: An identifier for link and the side of link the attribute is applicable to
        pointAddress:
          allOf:
          - $ref: '#/components/schemas/PointAddressSection'
          description: The section containing the point address reference
        microPointAddress:
          allOf:
          - $ref: '#/components/schemas/MicroPointAddressSection'
          description: '**RESTRICTED**


            The section containing the micro point address reference. This type of reference is only returned by Lookup endpoint or Geocode endpoint when showMapReference=''microPointAddress'' parameter is provided.'
        segments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Segment'
          description: The section containing the segment references
        country:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: country ID in HERE Map Content
        state:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: state ID in HERE Map Content
        county:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: county ID in HERE Map Content
        city:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: city ID in HERE Map Content
        district:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: district ID in HERE Map Content
        subdistrict:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: subdistrict ID in HERE Map Content
        cmVersion:
          allOf:
          - $ref: '#/components/schemas/CmVersionSection'
          description: cmVerison info in HERE Map Content
    FunctionalClass:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          description: '


            Description of supported values:


            - `1`: allowing for high volume, maximum speed traffic movement

            - `2`: allowing for high volume, high speed traffic movement

            - `3`: providing a high volume of traffic movement

            - `4`: providing for a high volume of traffic movement at moderate speeds between neighbourhoods

            - `5`: roads whose volume and traffic movement are below the level of any functional class'
    ReverseGeocodeResultItem:
      type: object
      required:
      - title
      - id
      - address
      properties:
        title:
          type: string
          description: The localized display name of this result item.
        id:
          type: string
          description: The unique identifier for the result item. This ID can be used for a Look Up by ID search as well.
        politicalView:
          type: string
          description: ISO3 country code of the item political view (default for international). This response element is populated when the politicalView parameter is set in the query
        resultType:
          type: string
          enum:
          - addressBlock
          - administrativeArea
          - houseNumber
          - locality
          - place
          - postalCodePoint
          - street
          description: '

            Type of the result item.


            Note: `addressBlock` result item is either a block or subblock.


            `resultType` values can get added to the list without further notice.

            '
        houseNumberType:
          type: string
          enum:
          - MPA
          - PA
          - interpolated
          description: "Indicates the address type which affects the precision of the address and the coordinate accuracy.\n\nDescription of supported values:\n\n- **RESTRICTED** `MPA`: A Micro Point Address represents a secondary address for a Point\n  Address; for example, building, floor (level) and suite (unit).\n  Micro Point Addresses can be used to enhance Point Address with\n  greater address detail and higher coordinate accuracy. This result\n  type is only returned by Lookup, Geocode, Autocomplete or (Multi) Reverse Geocode endpoints when\n  `with=MPA` parameter is provided.\n- `PA`: A Point Address represents an individual address as a point object.\n  Point Addresses are coming from trusted sources. There is a\n  high certainty that the address exists at that position. A\n  Point Address result contains two types of coordinates. One is the\n  access point (or navigation coordinates), which is the point to\n  start or end a drive. The other point is the position or display\n  point. This point varies per source and country. The point can be\n  the rooftop point, a point close to the building entry, or a point\n  close to the building, driveway or parking lot that belongs to the\n  building.\n- `interpolated`: An interpolated address. These are approximate positions as a\n  result of a linear interpolation based on address ranges. Address\n  ranges, especially in the USA, are typical per block. For\n  interpolated addresses, we cannot say with confidence that the\n  address exists in reality. But the interpolation provides a good\n  location approximation that brings people in most use cases close\n  to the target location. The access point of an interpolated address\n  result is calculated based on the address range and the road\n  geometry. The position (display) point is pre-configured offset\n  from the street geometry. Compared to Point Addresses, interpolated\n  addresses are less accurate."
        addressUsage:
          allOf:
          - $ref: '#/components/schemas/AddressUsage'
          description: '**ALPHA, RESTRICTED**'
        addressBlockType:
          type: string
          enum:
          - block
          - subblock
          description: '

            Type of the address block result if the `resultType` field is set to `addressBlock`.


            `addressBlockType` values can get added to the list without further notice.

            '
        localityType:
          type: string
          enum:
          - city
          - district
          - postalCode
          - subdistrict
          description: '

            Type of the locality result if the `resultType` field is set to `locality`.


            `localityType` values can get added to the list without further notice.

            '
        administrativeAreaType:
          type: string
          enum:
          - country
          - county
          - state
          description: '

            Type of the administrative area result if the `resultType` field is set to `administrativeArea`.


            `administrativeAreaType` values can get added to the list without further notice.

            '
        address:
          allOf:
          - $ref: '#/components/schemas/RgcAddress'
          description: Postal address of the result item.
        postalCodeDetails:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PostalCodeDetails_Usps_Zip'
            - $ref: '#/components/schemas/PostalCodeDetails_Usps_ZipPlus4'
          description: 'Additional information for `postalCodePoint` results (only rendered if `show=postalCodeDetails` is

            provided and only in the countries which are using ZIP codes - USA, PRI, VIR, GUM, MNP, ASM and JPN)'
        position:
          allOf:
          - $ref: '#/components/schemas/DisplayResponseCoordinate'
          description: The coordinates (latitude, longitude) of a pin on a map corresponding to the searched place.
        access:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/BasicAccessPoint'
          description: Coordinates of the response item on a HERE map navigable link (for example, for driving or walking).
        distance:
          type: integer
          format: int64
          description: 'The distance "as the crow flies" from the search center to this result item in meters.

            For example: "172039"'
          example: 172039
        mapView:
          allOf:
          - $ref: '#/components/schemas/MapView'
          description: The bounding box enclosing the geometric shape (area or line) that an individual result covers. `place` typed results have no `mapView`.
        categories:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Category'
          description: The list of categories assigned to this place.
        foodTypes:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Category'
          description: The list of food types assigned to this place.
        houseNumberFallback:
          type: boolean
          description: If true, indicates that the requested house number was corrected to match the nearest known house number. This field is visible only when the value is true.
        estimatedPointAddress:
          type: boolean
          description: 'If true, indicates that the coordinates of `position` and `access` points of the Point Address are

            estimated.

            This field is visible only for result items with resultType `houseNumber` and houseNumberType `PA` and

            only when the value is `true`'
        timeZone:
          allOf:
          - $ref: '#/components/schemas/TimeZoneInfo'
          description: Provides time zone information for this place. (rendered only if `show=tz` is provided.)
        streetInfo:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/StreetInfo'
          description: Street Details (only rendered if `show=streetInfo` is provided.)
        countryInfo:
          allOf:
          - $ref: '#/components/schemas/CountryInfo'
          description: Country Details (only rendered if `show=countryInfo` is provided.)
        estimatedAreaFallback:
          type: boolean
          description: '**ALPHA**


            Indicates that the admin result is not retrieved from a carto shape but from the closest street.

            (Only rendered, if `with=estimatedAreaFallback` is provided.)'
        mapReferences:
          allOf:
          - $ref: '#/components/schemas/MapReferenceSection'
          description: Return the map references of the location objects.
        related:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/RelatedAddress'
          description: List of related objects
        navigationAttributes:
          allOf:
          - $ref: '#/components/schemas/NavigationAttributes'
          description: 'Return requested additional attributes for segments in a road network if `showNavAttributes` parameter

            is specified with valid value and relevant data is available. The value is a comma-separated list

            of the sections to be enabled.'
    PostalCodeDetails_Usps_ZipPlus4:
      type: object
      required:
      - postalCode
      properties:
        postalCode:
          type: string
          description: The postal code.
        postalEntity:
          type: string
          enum:
          - USPS
          description: 'The postal entity. This could be a governmental authority, a regulatory authority, or a designated postal operator.


            Description of supported values:


            - `USPS`: The USPS postal code system.'
        postalCodeType:
          type: string
          enum:
          - ZIP+4
          description: 'The postal code type. Currently supported values: `ZIP` and `ZIP+4`


            Description of supported values:


            - `ZIP+4`: Nine-digit code that identifies a small geographic delivery area that is serviceable by a single carrier; appears in the last line of the address on a mail piece.'
        recordTypeCode:
          type: string
          enum:
          - F
          - G
          - H
          - P
          - R
          - S
          description: 'The USPS ZIP+4 Record Type Code.


            Description of supported values:


            - `F`: Firm

            - `G`: General delivery

            - `H`: High-rise

            - `P`: PO Box

            - `R`: Rural route/contract

            - `S`: Street'
    CmVersionSection:
      type: object
      required:
      - region
      - dvn
      properties:
        region:
          type: string
          description: Region ID
        dvn:
          type: string
          description: "Map version details (DVN) containing the base line for the map schema and an identifier for the weekly or quarterly update.\n\n- Format: YYQ<weekly/quaterly update>\n  - Example: 23150 (map schema: Q1/2023, weekly update 50)\n"
    SpeedLimit:
      type: object
      required:
      - maxSpeed
      - speedUnit
      properties:
        maxSpeed:
          type: integer
          format: int32
          description: Used in combination with speed limit unit to indicate allowable speed limit at a location, for unlimited speed, the value is "999"
        direction:
          type: string
          enum:
          - E
          - N
          - NE
          - NW
          - S
          - SE
          - SW
          - W
          description: Rendered in compass value, which is N, S, E, W, NE, SE, NW, SW
        speedUnit:
          type: string
          enum:
          - kph
          - mph
          description: Country defined speed unit
        source:
          type: string
          enum:
          - derived
          - posted
          description: 'A generalised identification of the source of `Speed Limit` information.


            Description of supported values:


            - `derived`: Based on administrative regulations, for example: highway exit/entry ramps that do not have posted speed limits.

            - `posted`: Based on a posted speed limit sign, speed limit information painted on the road, or data obtained from official sources.'
    CountryInfo:
      type: object
      properties:
        alpha2:
          type: string
          description: '[ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code'
        alpha3:
          type: string
          description: '[ISO 3166-1 alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3) country code'
    DisplayResponseCoordinate:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          format: double
          description: 'Latitude of the address. For example: `"52.19404"`'
        lng:
          type: number
          format: double
          description: 'Longitude of the address. For example: `"8.80135"`'
    OpenSearchMultiReverseGeocodeErrorResult:
      type: object
      required:
      - id
      - error
      properties:
        id:
          type: string
          description: The ID for the query provided by the client
        error:
          allOf:
          - $ref: '#/components/schemas/MultiResultErrorSection'
          description: Error information
    RgcAddress:
      type: object
      properties:
        label:
          type: string
          description: 'Assembled address value built out of the address components according to the regional postal rules.

            These are the same rules for all endpoints. It may not include all the input terms. For example:

            "Schulstraße 4, 32547 Bad Oeynhausen, Germany"'
        countryCode:
          type: string
          description: 'A three-letter country code. For example: "DEU"'
        countryName:
          type: string
          description: 'The localised country name. For example: "Deutschland"'
        stateCode:
          type: string
          description: 'A state code or state name abbreviation – country specific. For example, in the United States it is the two letter state abbreviation: "CA" for California.'
        state:
          type: string
          description: 'The state division of a country. For example: "North Rhine-Westphalia"'
        countyCode:
          type: string
          description: 'A county code or county name abbreviation – country specific. For example, for Italy it is the province abbreviation: "RM" for Rome.'
        county:
          type: string
          description: A division of a state; typically, a secondary-level administrative division of a country or equivalent.
        city:
          type: string
          description: 'The name of the primary locality of the place. For example: "Bad Oyenhausen"'
        district:
          type: string
          description: 'A division of city; typically an administrative unit within a larger city or a customary name of a city''s neighborhood. For example: "Bad Oyenhausen"'
        subdistrict:
          type: string
          description: 'A subdivision of a district. For example: "Minden-Lübbecke"'
        street:
          type: string
          description: 'Name of street. For example: "Schulstrasse"'
        block:
          type: string
          description: Name of block.
        subblock:
          type: string
          description: Name of sub-block.
        postalCode:
          type: string
          description: 'An alphanumeric string included in a postal address to facilitate mail sorting, such as post code, postcode, or ZIP code. For example: "32547"'
        houseNumber:
          type: string
          description: 'House number. For example: "4"'
        building:
          type: string
          description: Name of building.
        unit:
          type: string
          description: Secondary unit information. It may include building, floor (level), and suite (unit) details. This field is returned by Geocode, Autocomplete, (Multi) Reverse Geocode and Lookup endpoints only.
    Physical:
      type: object
      properties:
        boatFerry:
          type: boolean
          description: 'The segment represents a generalised route of a boat ferry for passengers or vehicles over water,

            including routes to pedestrian only islands, tourist areas, commuter ferry routes open to only pedestrians, etc.


            - `true`: The road is a boat ferry.

            - `false`: The road isn''t a boat ferry.'
        bridge:
          type: boolean
          description: 'Identifies a structure that allows a road, railway, or walkway to pass over another road,

            railway, waterway, or valley serving map display and route guidance functionalities.


            - `true`: The road is a bridge.

            - `false`: The road isn''t a bridge.'
        deliveryRoad:
          type: boolean
          description: 'Indication of a delivery road.


            - `true`: The physical characteristic of the road is that it functions as a delivery road.

            - `false`: The physical characteristic of the road is that it doesn''t function as a delivery road.'
        movableBridge:
          type: boolean
          description: 'Movable Bridge indicates a bridge that moves to allow passage (usually) for boats or barges.


            - `true`: The road is a movable bridge.

            - `false`: The road isn''t a movable bridge.

            '
        multiplyDigitized:
          type: boolean
          description: 'Multiply Digitised identifies separately digitised roads, i.e., roads that are digitised with one line per

            direction of traffic instead of one line per road.


            - `true`: The physical characteristic of the road is that it functions as multiplyDigitized.

            - `false`: The physical characteristic of the road is that it doesn''t function as multiplyDigitized.'
        paved:
          type: boolean
          description: 'Indicates whether the navigable segment is paved.


            - `true`: The physical characteristic of the road is paved.

            - `false`: The physical characteristic of the road isn''t paved.'
        private:
          type: boolean
          description: 'Private identifies roads that are not maintained by an organisation responsible for maintenance of

            public roads.


            - `true`: The road is private..

            - `false`: The road isn''t private.'
        railFerry:
          type: boolean
          description: 'The segment represents a generalised route of a ferry for passengers or vehicles via rail.


            - `true`: The road is a rail flerry.

            - `false`: The road isn''t a rail flerry.

            '
        tunnel:
          type: boolean
          description: 'Identifies an enclosed (on all sides) passageway through or under an obstruction.


            - `true`: The road is a tunnel.

            - `false`: The road isn''t a tunnel.

            '
    RelatedAddress:
      type: object
      required:
      - relationship
      - id
      properties:
        relationship:
          type: string
          enum:
          - MPA
          - intersection
          - nearbyAddress
          - parentPA
          description: "\n\nDescription of supported values:\n\n- **RESTRICTED** `MPA`: Micro Point Addresses related to a result items with\n  `resultType` = `houseNumber` and `houseNumberType` = `PA`;\n  for example, buildings, floors (levels) or suites (units)\n  associated to this address. This type of relationship is\n  only returned by the Lookup endpoint and the Geocode endpoint\n  when the `showRelated=MPA` parameter is provided.\n- `intersection`: The Intersections nearest to the address. This type of relationship is\n  only returned by Reverse Geocode, Geocode or Multi-Reverse Geocode\n  endpoints when `showRelated=intersections` parameter is provided.\n- `nearbyAddress`: Nearby address on the same street of main result. This type of\n  relationship is only returned by Reverse Geocode endpoint or\n  Multi-Reverse Geocode endpoint when `showRelated=nearbyAddress`\n  parameter is provided.\n- **RESTRICTED** `parentPA`: The Point Address to which the Micro Point Address\n  belongs; for example the house number to which this\n  suite is associated. This type of relationship is only\n  returned by the Lookup, the Geocode and the (Multi) Reverse Geocode endpoints when\n  the `showRelated=parentPA` parameter is provided."
        title:
          type: string
          description: The localized display name of this related entity.
        id:
          type: string
          description: The ID of the related entity.
        resultType:
          type: string
          enum:
          - addressBlock
          - administrativeArea
          - houseNumber
          - intersection
          - locality
          - place
          - postalCodePoint
          - street
          description: The resultType of the related entity.
        houseNumberType:
          type: string
          enum:
          - MPA
          - PA
          - interpolated
          description: "The houseNumberType of the related entity.\n\nDescription of supported values:\n\n- **RESTRICTED** `MPA`: A Micro Point Address represents a secondary address for a Point\n  Address; for example, building, floor (level) and suite (unit).\n  Micro Point Addresses can be used to enhance Point Address with\n  greater address detail and higher coordinate accuracy. This result\n  type is only returned by Lookup, Geocode, Autocomplete or (Multi) Reverse Geocode endpoints when\n  `with=MPA` parameter is provided.\n- `PA`: A Point Address represents an individual address as a point object.\n  Point Addresses are coming from trusted sources. There is a\n  high certainty that the address exists at that position. A\n  Point Address result contains two types of coordinates. One is the\n  access point (or navigation coordinates), which is the point to\n  start or end a drive. The other point is the position or display\n  point. This point varies per source and country. The point can be\n  the rooftop point, a point close to the building entry, or a point\n  close to the building, driveway or parking lot that belongs to the\n  building.\n- `interpolated`: An interpolated address. These are approximate positions as a\n  result of a linear interpolation based on address ranges. Address\n  ranges, especially in the USA, are typical per block. For\n  interpolated addresses, we cannot say with confidence that the\n  address exists in reality. But the interpolation provides a good\n  location approximation that brings people in most use cases close\n  to the target location. The access point of an interpolated address\n  result is calculated based on the address range and the road\n  geometry. The position (display) point is pre-configured offset\n  from the street geometry. Compared to Point Addresses, interpolated\n  addresses are less accurate."
        address:
          allOf:
          - $ref: '#/components/schemas/RelatedResultAddress'
          description: The address of the related entity. The fields are only rendered, if they differ from the main result item.
        position:
          allOf:
          - $ref: '#/components/schemas/DisplayResponseCoordinate'
          description: The coordinates (latitude, longitude) of a pin on a map corresponding to the searched place.
        access:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/BasicAccessPoint'
          description: Coordinates of the response item on a HERE map navigable link (for example, for driving or walking).
        distance:
          type: integer
          format: int64
          description: 'The distance "as the crow flies" from the search center to this related address'' position in meters.

            It is only returned by Reverse Geocode endpoint or Multi-Reverse Geocode endpoint.'
        routeDistance:
          type: integer
          format: int64
          description: 'The distance from routing position of the nearby address to the street result, the distance is

            calculated based on the underlying road geometry. It is only returned by Reverse Geocode endpoint or

            Multi-Reverse Geocode endpoint.'
        bearing:
          type: integer
          format: int32
          description: 'Bearing (measured clockwise from true north) from the projected coordinate on the street to the

            display position of the related location. True clockwise degree, 0 is north. It is only returned by

            Reverse Geocode endpoint or Multi-Reverse Geocode endpoint.'
        mapView:
          allOf:
          - $ref: '#/components/schemas/MapView'
          description: "The bounding box enclosing the geometric shape (area or line) that the related address covers. It is\n only returned by Reverse Geocode endpoint or Multi-Reverse Geocode endpoint."
        mapReferences:
          allOf:
          - $ref: '#/components/schemas/MapReferenceSection'
          description: 'Return the map references of the location objects. It is only returned by Reverse Geocode endpoint

            or Multi-Reverse Geocode endpoint.'
    PostalCodeDetails_Usps_Zip:
      type: object
      required:
      - postalCode
      properties:
        postalCode:
          type: string
          description: The postal code.
        postalEntity:
          type: string
          enum:
          - USPS
          description: 'The postal entity. This could be a governmental authority, a regulatory authority, or a designated postal operator.


            Description of supported values:


            - `USPS`: The USPS postal code system.'
        postalCodeType:
          type: string
          enum:
          - ZIP
          description: 'The postal code type. Currently supported values: `ZIP` and `ZIP+4`


            Description of supported values:


            - `ZIP`: A 5-digit code that identifies a specific geographic delivery area. ZIP codes can represent an area within a state, or a single building or company that has a very high mail volume.'
        zipClassificationCode:
          type: string
          enum:
          - M
          - P
          - U
          description: 'The ZIP Classification Code.


            Description of supported values:


            - `M`: Military ZIP code.

            - `P`: ZIP code having only Post Office boxes.

            - `U`: Unique ZIP code: A ZIP assigned to a company, agency, or entity with sufficient mail volume, based on average daily volume of letter-size pieces.'
