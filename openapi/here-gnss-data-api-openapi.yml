              gnss-GenericAssistData:
              - gnss-ID:
                  gnss-id: gps
                gnss-TimeModels: []
                gnss-NavigationModel: {}
                gnss-Almanac: {}
                gnss-UTC-Model: {}
                gnss-AuxiliaryInformation: {}
          - gnss: bds
            lpp:
