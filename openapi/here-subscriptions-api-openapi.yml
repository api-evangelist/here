              example:
                status: 404
                title: Resource not found
                correlationId: c622ba3c-2b75-446c-a37b-6e871bce3edf
                code: E404100
                cause: Subscription key not found
                requestId: REQ-38f62707-746f-4071-ad3d-3c06d64785a7
