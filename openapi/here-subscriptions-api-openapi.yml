              example:
                status: 403
                title: Access Denied
                correlationId: 01ae70f6-d756-4352-b219-b7ee4820f184
                code: E403100
                cause: Not an admin user
                requestId: REQ-e48e44df-6290-43e4-85eb-8f8a8258e1d8
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
