      - Bearer: []
      - apiKey: []
  /subscriptions:
    get:
      tags:
      - Subscriptions
      summary: Get active subscriptions
      description: Endpoint to get a paginated list of active subscriptions for an organization
      operationId: getActiveSubscriptions
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Active subscriptions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionSummaryDto'
              example:
                content:
                - id: 7a8f9b2c-ef1d-4c5e-96a7-b8c9d0e1f2a3
                  subscriptionKey: SUBSCRIPTION-fafc5397-4044-48b8-9ff7-ae2a17c42238
                  keyType: SINGLE_DEVICE
                - id: 0e3ad78d-0de7-41e4-8391-2b2b4138560b
                  subscriptionKey: SUBSCRIPTION-0e3ad78d-0de7-41e4-8391-2b2b4138560b
                  keyType: SINGLE_DEVICE
                totalElements: 2
                totalPages: 1
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                status: 400
                title: Invalid argument type
                correlationId: 2f2afe17-220e-4318-9299-954280d6b04f
                code: E400104
                cause: 'Invalid argument type: size, expected int'
