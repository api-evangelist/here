          content:
            application/json:
              example:
                status: 404
                title: Resource not found
                correlationId: 2546e826-e2c5-4e47-a149-54561756ccd1
                cause: Unable to find com.here.wego.userservice.entity.SubscriptionEntity with id d5c4d553-8272-4432-9b13-9135abee6d54
                code: E404100
                requestId: REQ-4b61ab20-7819-422c-98d5-85d8f7eb5722
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                status: 500
                title: Internal Server Error
                correlationId: 414ed0d4-5804-4173-a136-404ffed07c69
                code: E500100
      security:
      - Bearer: []
      - apiKey: []
    put:
      tags:
      - Subscriptions
      summary: Update subscription by Subscription Key
      description: Endpoint to update an existing subscription's details.
      operationId: updateSubscriptionByKey
      parameters:
      - name: subscriptionKey
        in: path
        description: Unique subscription key of the subscription to update
        required: true
        schema:
          type: string
        example: d5c4d553-8272-4432-9b13-9135abee6d53
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdatePublicRequestDto'
            example:
              zuoraSubscriptionId: SUBSCRIPTION-f3f51e10-f22d-4df7-9c28-3367854bca66
        required: true
      responses:
        '204':
          description: Subscription updated successfully
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                status: 400
                title: Zuora Subscription error
                correlationId: 2f2afe17-220e-4318-9299-954280d6b04f
                code: E400500
                cause: Zuora subscription 'SUBSCRIPTION-f3f51e10-f22d-4df7-9c28-3367854bca66' is not active
