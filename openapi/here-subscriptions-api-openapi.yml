      operationId: createSubscriptionKeysPublic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequestDto'
            example:
              keyType: SINGLE_DEVICE
              numKeys: 2
              expirationTime: '2024-05-30T23:59:59'
              featureGroups:
              - name: Feature Group Name
              - id: 321e4567-e89b-12d3-a456-426655440123
        required: true
      responses:
        '201':
          description: Subscription keys created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreatedSubscriptionDto'
              example:
              - id: 2550e4f5-547d-43ea-adf8-e3d3ff281583
                subscriptionKey: 05e7fcb4-33d4-421d-b43c-447ca6c1364b
              - id: 18a533ed-b2c3-467b-a56a-06e5d2e5a858
                subscriptionKey: 82b5debe-969e-4a3a-836f-b416df5a4a6f
        '400':
          description: Invalid request parameters
