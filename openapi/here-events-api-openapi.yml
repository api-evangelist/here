  /events/v3/{trackingId}:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    get:
      summary: Gets event history for a device or a shipment
      description: 'Gets all events for a device or a shipment.

        A device is identified by the `trackingId`.

        For shipments, `shipmentId` can be used as a `trackingId`.


        The results are listed in descending order based on the timestamp.


        An event is uniquely identified by `trackingId`-`ruleId`-`timestamp` key,

        with an exception of dwelling and stock rule events.

        Dwelling events also need `geofenceId` to be specified,

        whereas for stock events `trackingId` is not applicable.


        A single event can be fetched using `ruleId`, `before` and `after` query parameters.


        A time range can be defined with `before` and `after` timestamps. The response will contain

        an array of events that were recorded within the range.

        The default value for `before` parameter is the current time, and for the `after` parameter

        it is one day in the past from the current time.

        The `after` parameter value is not allowed to be earlier than two weeks in the past from the

        `before` timestamp, otherwise an error is returned.


        If the request is supplied with `eventSource` query parameter, the response will contain

        events generated by the defined source only.


        If the request is supplied with `eventType` query parameter, the response will contain

        events of the specified type only.


        If the request is supplied with `ruleId` query parameter, the response will only contain events

        for the specified rule ID.


        If the request is supplied with `initialState` query parameter, the response will contain

        events having the specified initial state.


        All the aforementioned query parameters can be combined together.'
      tags:
      - Events
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - name: trackingId
        in: path
        schema:
          type: string
          minLength: 1
          maxLength: 50
          description: This is a unique ID associated with the device data in HERE Tracking. The `trackingId` gets assigned to a device when the device is claimed by a user. Alternatively, a valid `shipmentId` may be used.
        required: true
      - name: before
        description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.

          The accepted range is from 1 to the current time.

          '
        in: query
        required: false
        schema:
          type: number
          minimum: 1
      - name: after
        description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.

          The accepted range is from 0 to the current time.

          '
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      - name: eventSource
        in: query
        required: false
        schema:
          oneOf:
          - description: 'The event source rule type.

              '
            type: string
            enum:
            - acceleration
            - attach
            - battery
            - detention
            - dwelling
            - geofence
            - humidity
            - online
            - pressure
            - shipmentEtaChange
            - shipmentSchedule
            - stock
            - tamper
            - temperature
            - utilization
          - type: array
            items:
              description: 'The event source rule type.

                '
              type: string
              enum:
              - acceleration
              - attach
              - battery
              - detention
              - dwelling
              - geofence
              - humidity
              - online
              - pressure
              - shipmentEtaChange
              - shipmentSchedule
              - stock
              - tamper
              - temperature
              - utilization
      - name: eventType
        in: query
        required: false
        schema:
          oneOf:
          - description: 'Type of the event.


              An event is created every time an associated rule or geofence is triggered by a device ingestion.

              The event type depends on the data the device sends.


              Sensors that report numerical data (such as battery, humidity, pressure and temperature sensors),

              generate an event when the reported sensor reading of the device goes in or out of range, which is configured in the rule.

              This produces events of BELOW_RANGE, IN_RANGE and ABOVE_RANGE types.


              Sensors that report boolean data (such as attach and tamper sensors), generate events when the device

              transitions from one state to another, either from `false` to `true` or vice versa.

              This produces events of FALSE_TO_TRUE and TRUE_TO_FALSE types.

              The same event types are also generated by the online rule when the device state changes from `offline`

              (when the device has stopped ingesting data) to `online` (when the device data ingestion has resumed)

              or vice versa.


              The acceleration sensor generates events whenever the reported sensor reading

              crosses the acceleration threshold (for example, when the device was dropped).

              This produces events of the type EVENT.

              Such events are stateless.


              Events of INSIDE_GEOFENCE and OUTSIDE_GEOFENCE types are generated when the device enters or exits

              a geofence associated with the device.


              Events of DWELLING_STARTED type are generated when the device has

              stayed inside an associated geofence for longer than the threshold duration.

              DWELLING_ENDED type events are generated when dwelling of the device has ended.


              Events of DETENTION_STARTED type are generated when the device has been

              stationary for longer than the threshold duration, regardless whether the device is inside

              or outside of any geofence.

              DETENTION_ENDED type events will be generated when the device starts moving again.


              Events of UNUTILIZED type are generated when the device has been stationary for longer than the

              threshold duration.

              UTILIZED type events are generated when the device starts moving again after having been stationary.


              Events of OVERSTOCK, NORMAL_VOLUME and UNDERSTOCK types are generated when the number of assets

              inside a geofence crosses the `minVolume` and `maxVolume` thresholds of an associated stock rule.


              Event of SHIPMENT_ESTIMATE_CHANGED is generated when the estimated departure (ETD) or arrival (ETA) times

              deviate from the original estimates more than the defined threshold.


              Events of SHIPMENT_EARLY, SHIPMENT_ON_TIME and SHIPMENT_DELAYED types are generated when a shipment

              is too early, on time or delayed.

              '
            type: string
            enum:
            - BELOW_RANGE
            - IN_RANGE
            - ABOVE_RANGE
            - FALSE_TO_TRUE
            - TRUE_TO_FALSE
            - EVENT
            - INSIDE_GEOFENCE
            - OUTSIDE_GEOFENCE
            - OVERSTOCK
            - NORMAL_VOLUME
            - UNDERSTOCK
            - DWELLING_STARTED
            - DWELLING_ENDED
            - DETENTION_STARTED
            - DETENTION_ENDED
            - UTILIZED
            - UNUTILIZED
            - SHIPMENT_EARLY
            - SHIPMENT_ON_TIME
            - SHIPMENT_DELAYED
            - SHIPMENT_ESTIMATE_CHANGED
          - type: array
            items:
              description: 'Type of the event.


                An event is created every time an associated rule or geofence is triggered by a device ingestion.

                The event type depends on the data the device sends.


                Sensors that report numerical data (such as battery, humidity, pressure and temperature sensors),

                generate an event when the reported sensor reading of the device goes in or out of range, which is configured in the rule.

                This produces events of BELOW_RANGE, IN_RANGE and ABOVE_RANGE types.


                Sensors that report boolean data (such as attach and tamper sensors), generate events when the device

                transitions from one state to another, either from `false` to `true` or vice versa.

                This produces events of FALSE_TO_TRUE and TRUE_TO_FALSE types.

                The same event types are also generated by the online rule when the device state changes from `offline`

                (when the device has stopped ingesting data) to `online` (when the device data ingestion has resumed)

                or vice versa.


                The acceleration sensor generates events whenever the reported sensor reading

                crosses the acceleration threshold (for example, when the device was dropped).

                This produces events of the type EVENT.

                Such events are stateless.


                Events of INSIDE_GEOFENCE and OUTSIDE_GEOFENCE types are generated when the device enters or exits

                a geofence associated with the device.


                Events of DWELLING_STARTED type are generated when the device has

                stayed inside an associated geofence for longer than the threshold duration.

                DWELLING_ENDED type events are generated when dwelling of the device has ended.


                Events of DETENTION_STARTED type are generated when the device has been

                stationary for longer than the threshold duration, regardless whether the device is inside

                or outside of any geofence.

                DETENTION_ENDED type events will be generated when the device starts moving again.


                Events of UNUTILIZED type are generated when the device has been stationary for longer than the

                threshold duration.

                UTILIZED type events are generated when the device starts moving again after having been stationary.


                Events of OVERSTOCK, NORMAL_VOLUME and UNDERSTOCK types are generated when the number of assets

                inside a geofence crosses the `minVolume` and `maxVolume` thresholds of an associated stock rule.


                Event of SHIPMENT_ESTIMATE_CHANGED is generated when the estimated departure (ETD) or arrival (ETA) times

                deviate from the original estimates more than the defined threshold.


                Events of SHIPMENT_EARLY, SHIPMENT_ON_TIME and SHIPMENT_DELAYED types are generated when a shipment

                is too early, on time or delayed.

                '
              type: string
              enum:
              - BELOW_RANGE
              - IN_RANGE
              - ABOVE_RANGE
              - FALSE_TO_TRUE
              - TRUE_TO_FALSE
              - EVENT
              - INSIDE_GEOFENCE
              - OUTSIDE_GEOFENCE
              - OVERSTOCK
              - NORMAL_VOLUME
              - UNDERSTOCK
              - DWELLING_STARTED
              - DWELLING_ENDED
              - DETENTION_STARTED
              - DETENTION_ENDED
              - UTILIZED
              - UNUTILIZED
              - SHIPMENT_EARLY
              - SHIPMENT_ON_TIME
              - SHIPMENT_DELAYED
              - SHIPMENT_ESTIMATE_CHANGED
      - name: ruleId
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            format: uuid
            description: 'ID of the rule or geofence. Must be a valid UUIDv4.

