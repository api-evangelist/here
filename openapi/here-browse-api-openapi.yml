    EvPaymentSupport:
      type: object
      required:
      - id
      - accepted
      properties:
        id:
          type: string
          enum:
          - authByCarPlugAndCharge
          - creditCard
          - debitCard
          - onlineApplePay
          - onlineGooglePay
          - onlinePaypal
          - operatorApp
          description: 'payment method identifier.


            Description of supported values:


            - `authByCarPlugAndCharge`: indicates whether this EV station supports Plug&Charge.ISO 15118 Plug&Charge enables drivers to plug in and charge up instantly using automatic EV-to-charging station authentication technology.

            - `creditCard`: indicates if this EV station accepts credit card payment or not.

            - `debitCard`: indicates if this EV station accepts debit card payment or not.

            - `onlineApplePay`: indicates whether this EV station accepts Apple Pay (TM) authentication and payment method.

            - `onlineGooglePay`:  indicates whether this EV station accepts Google Pay (TM) authentication and payment method.

            - `onlinePaypal`: indicates whether this EV station accepts PayPal (TM) authentication and payment method.

            - `operatorApp`: indicates whether this EV station support authentication and payment through an app from the Charging Point Operator.'
        accepted:
          type: boolean
          description: set to `true` if the related payment method is accepted at the EV station
    Phoneme:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          description: The actual phonetic transcription in the NT-SAMPA format.
        language:
          type: string
          description: The [BCP 47](https://en.wikipedia.org/wiki/IETF_language_tag) language code.
        preferred:
          type: boolean
          description: Whether or not it is the preferred phoneme.
    TripadvisorImageVariants:
      type: object
      properties:
        thumbnail:
          allOf:
          - $ref: '#/components/schemas/TripadvisorImageVariant'
          description: 'An object that provides access to Tripadvisor (TM) image variant of *thumbnail* size.


            The object''s `href` value contains a URL linking to a 50x50px image that has been cropped, resized, and optimized by Tripadvisor.

            '
        small:
          allOf:
          - $ref: '#/components/schemas/TripadvisorImageVariant'
          description: 'An object that provides access to Tripadvisor (TM) image variant of *small* size.


            The object''s `href` value contains a URL linking to a 150x150px image that has been cropped, resized, and optimized by Tripadvisor.

            '
        medium:
          allOf:
          - $ref: '#/components/schemas/TripadvisorImageVariant'
          description: 'An object that provides access to Tripadvisor (TM) image variant of *medium* size.


            The object''s `href` value contains a URL pointing to an image with a maximum dimension of

            250px (either height or width, depending on the photo''s orientation), with the other dimension scaled

            proportionally to preserve the aspect ratio.


            The `href` value matches that of the grandparent object.

            '
        large:
          allOf:
          - $ref: '#/components/schemas/TripadvisorImageVariant'
          description: 'An object that provides access to Tripadvisor (TM) image variant of *large* size.


            The object''s `href` `value contains a URL pointing to an image with a maximum dimension of

            550px (either height or width, depending on the photo''s orientation), with the other dimension scaled proportionally to preserve the aspect ratio

            '
        original:
          allOf:
          - $ref: '#/components/schemas/TripadvisorImageVariant'
          description: 'An object that provides access to Tripadvisor (TM) image variant in its *original* size.


            The object’s `href` value contains a URL pointing to the photo in its original resolution and aspect ratio.

            '
    ContactInformation:
      type: object
      properties:
        phone:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Contact'
        mobile:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Contact'
        tollFree:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Contact'
        fax:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Contact'
        www:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Contact'
        email:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Contact'
    Media:
      type: object
      properties:
        images:
          allOf:
          - $ref: '#/components/schemas/ImageMediaCollection'
          description: 'This object enables access to images linked to the place result and is returned when the query

            specifies either `show=tripadvisor` or `show=tripadvisorImageVariants` as a parameter.'
        editorials:
          allOf:
          - $ref: '#/components/schemas/EditorialMediaCollection'
          description: 'An object containing editorial content that describes the place result.

            Returned when the query includes the parameter `show=tripadvisor`.'
        ratings:
          allOf:
          - $ref: '#/components/schemas/RatingMediaCollection'
          description: 'An object that provides 3rd party supplier ratings about the place result.

            Currently only Tripadvisor (TM) ratings are provided.

            This object is returned when the query includes the parameter `show=tripadvisor`.'
    MapView:
      type: object
      required:
      - west
      - south
      - east
      - north
      properties:
        west:
          type: number
          format: double
          description: 'Longitude of the western-side of the box. For example: "8.80068"'
        south:
          type: number
          format: double
          description: 'Latitude of the southern-side of the box. For example: "52.19333"'
        east:
          type: number
          format: double
          description: 'Longitude of the eastern-side of the box. For example: "8.8167"'
        north:
          type: number
          format: double
          description: 'Latitude of the northern-side of the box. For example: "52.19555"'
    TripadvisorImage:
      type: object
      required:
      - href
      - supplier
      properties:
        href:
          type: string
          description: 'The URL points to the default image provided by Tripadvisor (TM). These default images are typically sized for the *medium* format used by Tripadvisor.

            In rare cases, the image may be larger than expected. To ensure consistent rendering across all scenarios, we recommend enforcing maximum dimensions when displaying the image.'
        supplier:
          allOf:
          - $ref: '#/components/schemas/TripadvisorMediaSupplier'
          description: Information about the supplier of this image.
        variants:
          allOf:
          - $ref: '#/components/schemas/TripadvisorImageVariants'
          description: 'An object containing key-value pairs, where each key represents a specific image size

            (e.g., `thumbnail`, `small`, `medium`, `large`, `original`) and the corresponding value is

            an object containing the URL of that image variant.

            This object is returned when the query includes the parameter `show=tripadvisorImageVariants`.

            '
    TripadvisorImageVariant:
      type: object
      required:
      - href
      properties:
        href:
          type: string
          description: The URL to the actual image
    FuelStationAttributes:
      type: object
      properties:
        fuelTypes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/CarFuel'
            - $ref: '#/components/schemas/TruckFuel'
          description: '**BETA, RESTRICTED**


            List of fuel types available or not available at this place'
        payAtThePump:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that payment can be made at fuel pumps via credit card or other method at this place

            - `false` indicates that payment can not be made at fuel pumps via credit card or other method at this place

            '
        highVolumePumps:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that high volume pumps for commercial vehicles are available at this place

            - `false` indicates that high volume pumps for commercial vehicles are not available at this place

            '
  securitySchemes:
    Bearer:
      description: 'A token obtained from a separate endpoint using client credentials and an OAuth 1.0a HMAC-SHA256 signed request.

        For more information on how to get a bearer token, see the

        [Identity and Access Management Developer Guide](https://www.here.com/docs/bundle/identity-and-access-management-developer-guide/).

        '
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKey:
      description: 'A key generated specifically to authenticate API requests.

        For more information on how to get an API key, see the

        [Identity and Access Management Developer Guide](https://www.here.com/docs/bundle/identity-and-access-management-developer-guide/).

        '
      type: apiKey
      name: apiKey
      in: query
externalDocs:
  description: The developer guide, release notes, and migration guide are available here.
  url: https://www.here.com/docs/category/geocoding-search-v7
