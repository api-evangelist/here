          - subdistrict
          description: '

            Type of the locality result if the `resultType` field is set to `locality`.


            `localityType` values can get added to the list without further notice.

            '
        administrativeAreaType:
          type: string
          enum:
          - country
          - county
          - state
          description: '

            Type of the administrative area result if the `resultType` field is set to `administrativeArea`.


            `administrativeAreaType` values can get added to the list without further notice.

            '
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Postal address of the result item.
        position:
          allOf:
          - $ref: '#/components/schemas/DisplayResponseCoordinate'
          description: The coordinates (latitude, longitude) of a pin on a map corresponding to the searched place.
        access:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/ExtendedAccessPoint'
          description: 'Coordinates of the response item on a HERE map navigable link (for example, for driving or walking).


            When a response item is of type `"place"`, it can contain more than one access object.

            Each access object contains a position (`lat`, `lng`), with potentially a type (field `type`),

            a textual label (field `label`) and a `primary` boolean field set to true for the main access to the place.


            The first object in the `access` array is the primary access to the place.


            Response items of other types than `"place"` have a maximum of one access position.

            '
        driveThrough:
          type: boolean
          description: 'Set to `true` if the related business allows customers to purchase products

            (or use the service provided by the business) without leaving their cars.'
        distance:
          type: integer
          format: int64
          description: 'The distance "as the crow flies" from the search center to this result item in meters. For example: "172039".


            When searching along a route this is the distance along the route plus the distance from the route polyline to this result item.'
          example: 172039
        excursionDistance:
          type: integer
          format: int64
          description: Two times the distance from the polyline to this result item in meters while searching along the route
        mapView:
          allOf:
          - $ref: '#/components/schemas/MapView'
          description: The bounding box enclosing the geometric shape (area or line) that an individual result covers. `place` typed results have no `mapView`.
        categories:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Category'
          description: The list of categories assigned to this place.
        chains:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Chain'
          description: The list of chains assigned to this place.
        references:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/SupplierReference'
          description: The list of supplier references available for this place.
        foodTypes:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Category'
          description: The list of food types assigned to this place.
        contacts:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/ContactInformation'
          description: Contact information like phone, email, WWW.
        openingHours:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/OpeningHours'
          description: 'A list of hours during which the place is open for business.

            This field is optional: When it is not present, it means that we are lacking data about the place opening hours.

            Days without opening hours have to be considered as closed.'
        timeZone:
          allOf:
          - $ref: '#/components/schemas/TimeZoneInfo'
          description: Provides time zone information for this place. (rendered only if `show=tz` is provided.)
        extended:
          allOf:
          - $ref: '#/components/schemas/ExtendedAttribute'
          description: Extended attributes section to contain detailed information for specific result types.
        phonemes:
          allOf:
          - $ref: '#/components/schemas/PhonemesSection'
          description: Phonemes for address and place names. (rendered only if `show=phonemes` is provided.)
        media:
          allOf:
          - $ref: '#/components/schemas/Media'
          description: '**BETA, RESTRICTED**


            A set of rich media types aggregated from multiple sources. When the current place has no ratings, description or images, this element is not present.'
        streetInfo:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/StreetInfo'
          description: Street Details (only rendered if `show=streetInfo` is provided.)
        accessRestrictions:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/AccessRestrictionAttributes'
          description: 'A list of access restrictions related to a `place` result item.


            A place response item has a restricted access when the place is not publicly accessible without a specific authorization, membership or customer relationship.

            Examples: the place is for customers or visitors only.


            This field is optional: When it is not present, it means that the place response item has no known access restriction.'
          example:
