openapi: 3.2.0
info:
  version: 2.2.0
  title: Cost Management API v2 Usage API
  description: Provides API reference details for Usage API v2 which you can use to retrieve billable usage information. Usage billing rates are dependent on your licensing terms.
  termsOfService: https://developer.here.com/terms-conditions
  license:
    name: HERE Documentation License
    url: https://legal.here.com/en-gb/terms/documentation-license
servers:
- url: https://usage.bam.api.here.com/v2
  description: Production server.
tags:
- name: Usage
  description: Usage
paths:
  /usage/realms/{realmId}:
