  parameters:
    advancedFeatures:
      name: advancedFeatures
      description: 'A list of advanced features separated by commas (`,`), to return results for.


        | Feature        | Description |

        |----------------|-------------|

        | `deepCoverage` | More complete flow coverage |

        | `lanes`        | Lane level traffic information about lanes designated for High Occupancy Vehicles or at highway forks/splits |


        **NOTE:** Advanced features are billed at a separate price point to normal requests. Please

        contact HERE sales for further details.

        '
      in: query
      style: form
      explode: false
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
          - deepCoverage
          - lanes
        uniqueItems: true
      examples:
        criticalOnly:
          value:
          - deepCoverage
          summary: Deep coverage
        criticalAndMajor:
          value:
          - deepCoverage
          - lanes
          summary: Deep coverage and Lanes
    latestEndTime:
      name: latestEndTime
      description: 'The latest end time that is accepted for an incident to be included in the results.


        Format is **RFC 3339**, section 5.6 as defined by `date-time`. Will always be UTC time.

        '
      schema:
        $ref: '#/components/schemas/Time'
      in: query
      style: form
      example: '2019-10-20T00:00:00.00Z'
    minJamFactor:
      name: minJamFactor
      description: 'The minimum jam factor value for flow items to be included in the response. All flow items

        with a _lower_ jam factor than the value specified by the `minJamFactor` parameter are

        omitted. The parameter can be used by clients that require flow data for congested roadways

        only.


        The value must be in the range `0.0` to `10.0` (inclusive).


        Default: `0.0`

        '
      in: query
      style: form
      required: false
      schema:
        type: number
        default: 0
      example: 5
    units:
      name: units
      description: 'Units of measurement to be used in incident descriptions.

        The default is metric.

        '
      in: query
      style: form
      required: false
      schema:
        type: string
        enum:
        - metric
        - imperial
        default: metric
        example: metric
    earliestStartTime:
      name: earliestStartTime
      description: 'The earliest start time that is accepted for an incident to be included in the results.


        Format is **RFC 3339**, section 5.6 as defined by `date-time`. Will always be UTC time.

        '
      schema:
        $ref: '#/components/schemas/Time'
      in: query
      style: form
      example: '2019-10-10T00:00:00.00Z'
    functionalClasses:
      name: functionalClasses
      description: 'A list of functional classes separated by commas (`,`), to return results for. The

        functional class is used to group roads depending on speed, importance, and

        connectivity.


        Functional classes are integers from `1` to `5` inclusive where functional class `1` are

        the most important and functional class `5` are the least important. The table below

        describes the roads that fall into each class.


        | Functional Class | Description |

        |------------------|-------------|

        | 1                | These roads are meant for high volume, maximum speed traffic between and through major metropolitan areas. There are very few, if any, speed changes. Access to this road is usually controlled. |

        | 2                | These roads are used to channel traffic to Main Roads (functionalClass=1) for travel between and through cities in the shortest amount of time. There are very few, if any speed changes. |

        | 3                | These roads interconnect First Class Roads (2) and provide a high volume of traffic movement at a lower level of mobility than First Class Roads (2). |

        | 4                | These roads provide for a high volume of traffic movement at moderate speeds between neighborhoods. These roads connect with higher Functional Class roads to collect and distribute traffic between neighborhoods. |

        | 5                | These roads'' volume and traffic movements are below the level of any other road. |

        '
      in: query
      style: form
      required: false
      schema:
        type: array
        items:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
        default:
        - 1
        - 2
        - 3
        - 4
        - 5
      examples:
        all:
          value:
          - 1
          - 2
          - 3
          - 4
          - 5
          summary: All functional classes (default)
        one:
          value:
          - 1
          summary: Only functional class 1
        one_two_three:
          value:
          - 1
          - 2
          - 3
          summary: Functional classes 1 - 3
    originalId:
      name: originalId
      description: 'Identifier of the first traffic incident in a chain of updates. Once an incident chain

        has been created, this value will never change.

        '
      in: path
      required: true
      schema:
        type: string
      example: '2349753562597427858'
    in:
      name: in
      description: "Return flow items within a geographical area.\nArea within which to return flow.\n\nA geographic area can be one of the following:\n\n * A circular area, provided as latitude, longitude, and radius (in meters)\n\n   Format: `circle:{latitude},{longitude};r={radius}`\n\n   Type: `circle:{decimal},{decimal};r={integer}`\n\n   Example: `circle:13.1,-43.1;r=10000`\n\n * A bounding box, provided as _west longitude_, _south latitude_, _east longitude_, _north latitude_\n\n   Format: `bbox:{west longitude},{south latitude},{east longitude},{north latitude}`\n\n   Example: `bbox:13.08836,52.33812,13.761,52.6755`\n\n * A corridor, provided as a polyline in\n   [Flexible Polyline](https://github.com/heremaps/flexible-polyline) encoding and a\n   radius/width (in meters). The radius is measured perpendicular to each segment of the\n   polyline on both sides, so a radius of 50 meters will cover an area 50 meters on either\n   side of the polyline and be 100 meters wide from one side to the other. The maximum \n   point number for a corridor is 300.\n\n   Format: `corridor:{polyline};r={radius}`\n\n   Example: `corridor:BF05xgKuy2xCx9B7vUl0OhnR54EqSzpEl-HxjD3pBiGnyGi2CvwFsgD3nD4vB6e;r=50`\n\n * A list of topology segments, provided as series of segment references and optional refReplacements (rr). The maximum number of supported segment references is 100.\n   \n   Format: `segmentRef:{segment refs};rr={refReplacements}`\n\n   Example With refReplacements  : `segmentRef:$0:377894451:$1:192255763#+0..1,$0:377894451:$1:79189699#+0..1;rr=hrn:here:data::olp-here:rib-2:6074:,here:cm:segment`\n            \n   Example Without refReplacements : `segmentRef:hrn:here:data::olp-here:rib-2:6074::377894451:here:cm:segment:192255763#+0..1,hrn:here:data::olp-here:rib-2:6074::377894451:here:cm:segment:79189699#+0..1`\n"
      in: query
      style: form
      required: true
      schema:
        type: string
      examples:
        circle:
          value: circle:13.1,-43.1;r=10000
          summary: A circular area
        bbox:
          value: bbox:13.08836,52.33812,13.761,52.6755
          summary: A bounding box
        corridor:
          value: corridor:BF05xgKuy2xCx9B7vUl0OhnR54EqSzpEl-HxjD3pBiGnyGi2CvwFsgD3nD4vB6e;r=50
          summary: A corridor
        segmentRef:
          value: segmentRef:$0:377894451:$1:192255763#+0..1,$0:377894451:$1:79189699#+0..1,$0:377894451:$1:186625495#-0..1;rr=hrn:here:data::olp-here:rib-2:6074:,here:cm:segment
          summary: A list of topology segments
    XRequestIdParam:
      name: X-Request-Id
      in: header
      description: 'User-provided token that can be used to trace a request or a group of requests sent to the service. This can be any string but UUID is preferred.

        '
      schema:
        type: string
      example: 8230d7ad-3f1c-4191-a8dd-f3c42026da89
    exactSegmentRefMatching:
      name: exactSegmentRefMatching
      in: query
      description: 'Match segment references exactly with catalog versions when the value is set to true.

        Catalog versions are ignored to match when the value is set to false.

        '
      required: false
      schema:
        type: boolean
        default: false
    locationReferencing:
      name: locationReferencing
      description: 'The location referencing scheme (or schemes) to be used in the response. Multiple location

        referencing schemes can be specified separated by commas (`,`).


        |Location Referencing | Description |

        |------------------|-------------|

        | `none`           | The response will not contain any location references such as tmc, olr, HMC topology segments or shape points. |

        | `olr`            | Open Location References is a TISA location referencing standard also called TPEGOpenLR. Please visit https://tisa.org/ for more details. TISA Specifications are also published by ISO https://www.iso.org/ Specifications: ISO/TS 21219-22:2017 |

        | `shape`          | Shape points. Defines a location by a series of geo-coordinates. |

        | `tmc`            | Traffic Message Channel (TMC) location referencing method uses tables of pre-coded locations. For details please refer ISO specifications ISO 14819-3:2013 and ISO 14819-2:2013. |

        | `segmentRef`     | Topology Segment references. Defines a location by a series of reference to the HMC Topology Segment. |

        '
      in: query
      style: form
      required: true
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - none
          - olr
          - shape
          - tmc
          - segmentRef
        minItems: 1
        uniqueItems: true
      examples:
        olr:
          value: olr
          summary: Only return locations as OLR
        tmc_plus_olr:
          value: tmc,olr
          summary: Return locations with both TMC and OLR
    maxJamFactor:
      name: maxJamFactor
      description: 'The maximum jam factor value for flow items to be included in the response. All flow items

        with a _higher_ jam factor than the value specified by the `maxJamFactor` parameter are

        omitted. This parameter can be used by clients that require flow data only for

        congestion-free roads.


        The values must be in the range `0.0` to `10.0` (inclusive).


        Default: `1.0`

        '
      in: query
      style: form
      required: false
      schema:
        type: number
        default: 10
      example: 8
    type:
      name: type
      description: 'A list of incident type values separated by commas (`,`), to return results for.


        | Type              | Description |

        |-------------------|-------------|

        | `accident`        | | Indicates that there has been a collision

        | `construction`    | | Indicates that building or roadworks are taking place

        | `congestion`      | | Indicates that there has been a build up of vehicles

        | `disabledVehicle` | | Indicates that a vehicle is unable to move and is obstructing the road

        | `massTransit`     | | Indicates that a large amount of people are migrating from one location to another

        | `plannedEvent`    | | Indicates that an organised event is taking place causing disruption

        | `roadHazard`      | | Indicates that there are dangerous objects on the surface of the road

        | `roadClosure`     | | Indicates that the road has been closed, e.g. police presence

        | `weather`         | | Indicates that weather conditions are causing disruptions

        | `laneRestriction` | | Indicates that some of the lanes have access restrictions

        | `other`           | | Indicates that an incident not explainable with the types above has occurred

        '
      in: query
      style: form
      required: false
      schema:
        type: string
      examples:
        accidentOnly:
          value: accident
          summary: Only incidents of type accident
        roadHazardAndWeather:
          value: roadHazard,weather
          summary: Incidents of type roadHazard or weather
    useRefReplacements:
      name: useRefReplacements
      in: query
      description: 'Use replacement strings for compact representation of HMC topology segment references.

        '
      required: false
      schema:
        type: boolean
        default: true
    criticality:
      name: criticality
      description: 'The severity of the incident that has occured, with the following possible values: low (least severe), minor, major, and critical (most severe).

        A list of criticality values separated by commas (`,`), to return results for.

        '
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - low
          - minor
          - major
          - critical
        uniqueItems: true
      examples:
        criticalOnly:
          value:
          - critical
          summary: Only critical incidents
        criticalAndMajor:
          value:
          - critical
          - major
          summary: Critical and Major incidents
    lang:
      name: lang
      description: 'The language to be used for the incident descriptions. Parameter value must follow

        specification: BCP47. Supported values are available on  [iana.org](https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry)

        '
      in: query
      style: form
      required: false
      schema:
        type: string
      example: en-US
  requestBodies:
    geospatialFiltersBodyIncidents:
      content:
        application/json:
          schema:
            type: object
            properties:
              in:
                $ref: '#/components/schemas/RequestBodyIn'
              locationReferencing:
                description: 'The location referencing scheme (or schemes) to be used in the response. Multiple location

                  referencing schemes can be specified separated by commas (`,`).


                  |Location Referencing | Description |

                  |------------------|-------------|

                  | `none`           | The response will not contain any location references such as tmc, olr, HMC topology segments or shape points. |

                  | `olr`            | Open Location References is a TISA location referencing standard also called TPEGOpenLR. Please visit https://tisa.org/ for more details. TISA Specifications are also published by ISO https://www.iso.org/ Specifications: ISO/TS 21219-22:2017 |

                  | `shape`          | Shape points. Defines a location by a series of geo-coordinates. |

                  | `tmc`            | Traffic Message Channel (TMC) location referencing method uses tables of pre-coded locations. For details please refer ISO specifications ISO 14819-3:2013 and ISO 14819-2:2013. |

                  | `segmentRef`     | Topology Segment references. Defines a location by a series of reference to the HMC Topology Segment. |

                  '
