          description: End time of day, in hh:mm:ss format, if absent, end of the day. The period is exclusive of the given value.
          default: 00:00:00
    EvFacilityType:
      description: "Extensible enum: `hotel` `restaurant` `cafe` `mall` `supermarket` `sport` `recreationArea` `nature` `museum` `bikeSharing` `busStop` `taxiStand` `tramStop` `metroStation` `trainStation` `airport` `parkingLot` `carpoolParking` `fuelStation` `wifi` `business` `education` `finance` `health` `service` `store` `fastFood` `bakery` `truckStop` `playground` `toilets` `...`  \n\n* `hotel`: A place to stay overnight.\n* `restaurant`: A place to eat.\n* `cafe`: A place to have a coffee or other drinks.\n* `mall`: A shopping mall.\n* `supermarket`: A place to buy groceries.\n* `sport`: Sport facilities: gym, field etc.\n* `recreationArea`: A place for recreation, like a park, beach etc.\n* `nature`: Located in, or close to, a park, nature reserve etc.\n* `museum`: A museum or other cultural facility.\n* `bikeSharing`: A bike/e-bike/e-scooter sharing location.\n* `busStop`: A bus stop.\n* `taxiStand`: A taxi stand.\n* `tramStop`: A tram stop.\n* `metroStation`: A metro station.\n* `trainStation`: A train station.\n* `airport`: An airport.\n* `parkingLot`: A parking lot.\n* `carpoolParking`: A parking lot for carpooling.\n* `fuelStation`: A fuel station.\n* `wifi`: Wifi or other type of internet available.\n* `business`: Business facilities.\n* `education`: Educational facilities.\n* `finance`: Financial facilities.\n* `health`: Health facilities.\n* `service`: Service facilities.\n* `store`: A store.\n* `fastFood`: A fast food restaurant.\n* `bakery`: A bakery.\n* `truckStop`: A truck stop, rest area or similar.\n* `playground`: A playground or other place for children to play.\n* `toilets`: Toilets available for public use.\n\nAs it is possible that new facility types are supported in the future,\nunknown types should be ignored.\n"
      x-extensible-enum:
