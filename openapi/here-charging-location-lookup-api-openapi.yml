          minItems: 1
          maxItems: 7
        periods:
          type: array
          items:
            $ref: '#/components/schemas/TimePeriodType'
    Location:
      description: A point representation of a location.
      type: object
      properties:
        lat:
          description: Latitude in degrees
          type: number
          format: double
          example: 52.531
        lng:
          description: Longitude in degrees
          type: number
          format: double
          example: 13.384
      required:
      - lat
      - lng
    EvseStatus:
      description: "* `available`: The EVSE/connector is able to start a new charging session.\n* `blocked`: The EVSE/connector is not accessible because of a physical\n  barrier, for example a car.\n* `charging`: The EVSE/connector is in use.\n* `inoperative`: The EVSE/connector is temporarily not available for use,\n  but not broken or defect.\n* `outOfOrder`: The EVSE/connector is currently out of order.\n* `reserved`: The EVSE/connector is reserved for a particular EV driver\n  and is unavailable for other drivers.\n* `unknown`: No status information available or the EVSE/connector is\n  offline.\n* `operational`: The EVSE/connector was operational when checked the last time,\n  but the actual latest status is not available at the moment.\n"
      enum:
      - available
      - blocked
      - charging
      - inoperative
      - outOfOrder
      - reserved
      - unknown
      - operational
      type: string
    DayOfWeek:
      description: Enumeration of the days of the week.
      type: string
      enum:
