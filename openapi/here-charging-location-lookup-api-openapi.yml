    ChargingLocation:
      description: 'An electric vehicle (EV) charging location. The semantics generally

        follow the OCPI 2.2.1 standard.


        Known EV-specific acronyms:

        * EV: Electric Vehicle

        * OCPI: Open Charge Point Interface (a standard with a rather wide

        adoption worldwide, https://evroaming.org/)

        * CPO: Charge Point Operator (company that runs the EV charging

        location)

        * eMSP: e-Mobility Service Provider (customer-facing company)

        * EVSE: Electric Vehicle Supply Equipment (the actual charger that can

        charge one car at a time)


        A charging location includes a collection of one or more EV supply

        equipment (EVSE) instances.


        Typically, the charging location is the exact location of the group of

        EVSEs, simplified to a single point, but it can also be the entrance of

        a parking structure which contains these EVSEs.


        Each EVSE supports more precise position, where applicable.

        '
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        location:
          description: A point representation of the EV charging location's geolocation.
          allOf:
          - $ref: '#/components/schemas/Location'
        supportedVehicles:
          description: "Set of vehicle categories this charging location can support.\nFor example, the same location can be suitable for charging\npassenger cars and motorcycles.\n\nThere may be some further restrictions specified in other\nattributes, for example the available connector types may\nnot be suitable for all vehicles in the supported category.\n\nExtensible enum: `car` `twoWheeler` `truck` `...`  \n\n* `car`: The charging location is suitable for regular passenger cars, and\noptionally also for light commercial vehicles, such as vans, pickups and the\nlike, if signaled by `truckAccess` property.\nThis is the default category, used when there is no explicit information about\nsupport for other vehicle types.\n\n* `twoWheeler`: The charging location is suitable for motor bikes,\ne-scooters, and the like.\n\n* `truck`: The charging location is suitable for heavy vehicle charging,\nincluding, for example, rigid trucks and semi-trailer trucks, requiring more\nphysical space for parking and maneuvering than passenger cars.\n\nAs it is possible that new categories are supported in the future,\nunknown categories should be ignored.\n"
          type: array
          items:
            $ref: '#/components/schemas/EvVehicleCategory'
          uniqueItems: true
        name:
          description: Display name of the location.
          type: string
        accessPoints:
          description: 'A list of points that provide access from road network to the EV

            charging location.


            This is not the same position where the charging location is located,

            but a point on the nearest suitable road.


            It can be rendered on map to illustrate from where to enter the

            charging location.

            '
          type: array
          items:
            $ref: '#/components/schemas/Location'
          uniqueItems: true
        address:
          description: 'Structured address.

            '
          allOf:
          - $ref: '#/components/schemas/Address'
        parkingType:
          description: "The general type of the charging location's parking.\n\nExtensible enum: `alongMotorway` `parkingGarage` `parkingLot` `onDriveway` `onStreet` `undergroundGarage` `...`  \n\n* `alongMotorway`: A parking facility/rest area along a motorway, freeway,\ninterstate, highway etc.\n* `parkingGarage`: Multi-story car park, mainly above ground.\n* `parkingLot`: A cleared area that is intended for parking vehicles, for example\nat super markets or bars.\n* `onDriveway`: The driveway of a house or building.\n* `onStreet`: A public parking space along a street.\n* `undergroundGarage`: Multi-story car park, mainly underground.\n\nAs it is possible that new types are supported in the future,\nunknown types should be ignored.\n"
          allOf:
          - $ref: '#/components/schemas/EvParkingType'
        operator:
          description: Information about the operator, if available.
          allOf:
          - $ref: '#/components/schemas/BusinessDetails'
        suboperator:
          description: Information about the suboperator, if available.
          allOf:
          - $ref: '#/components/schemas/BusinessDetails'
        facilityTypes:
          description: "Types of facilities / amenities nearby the EV charging location.\n\nExtensible enum: `hotel` `restaurant` `cafe` `mall` `supermarket` `sport` `recreationArea` `nature` `museum` `bikeSharing` `busStop` `taxiStand` `tramStop` `metroStation` `trainStation` `airport` `parkingLot` `carpoolParking` `fuelStation` `wifi` `business` `education` `finance` `health` `service` `store` `fastFood` `bakery` `truckStop` `playground` `toilets` `...`  \n\n* `hotel`: A place to stay overnight.\n* `restaurant`: A place to eat.\n* `cafe`: A place to have a coffee or other drinks.\n* `mall`: A shopping mall.\n* `supermarket`: A place to buy groceries.\n* `sport`: Sport facilities: gym, field etc.\n* `recreationArea`: A place for recreation, like a park, beach etc.\n* `nature`: Located in, or close to, a park, nature reserve etc.\n* `museum`: A museum or other cultural facility.\n* `bikeSharing`: A bike/e-bike/e-scooter sharing location.\n* `busStop`: A bus stop.\n* `taxiStand`: A taxi stand.\n* `tramStop`: A tram stop.\n* `metroStation`: A metro station.\n* `trainStation`: A train station.\n* `airport`: An airport.\n* `parkingLot`: A parking lot.\n* `carpoolParking`: A parking lot for carpooling.\n* `fuelStation`: A fuel station.\n* `wifi`: Wifi or other type of internet available.\n* `business`: Business facilities.\n* `education`: Educational facilities.\n* `finance`: Financial facilities.\n* `health`: Health facilities.\n* `service`: Service facilities.\n* `store`: A store.\n* `fastFood`: A fast food restaurant.\n* `bakery`: A bakery.\n* `truckStop`: A truck stop, rest area or similar.\n* `playground`: A playground or other place for children to play.\n* `toilets`: Toilets available for public use.\n\nAs it is possible that new facility types are supported in the future,\nunknown types should be ignored.\n"
          type: array
          items:
            $ref: '#/components/schemas/EvFacilityType'
          uniqueItems: true
        timeZone:
          description: 'The time zone of the charging location. Based on IANA tzdata''s

            TZ-values.

            '
          type: string
          example: Europe/Berlin
        openingHours:
          description: 'The times when the EVSEs at the charging location can be accessed for

            charging.

            '
          allOf:
          - $ref: '#/components/schemas/OpeningHoursType'
        cpoLocationId:
          description: 'CPO''s own id for the location, if available.


            This id may be relevant for some clients to map the `ChargingLocation` data to

            their own or 3rd party systems.

            '
          type: string
        energyMix:
          description: Details on the energy supplied at this location.
          allOf:
          - $ref: '#/components/schemas/EnergyMix'
        connectorGroups:
          description: 'Connector groups for the location.


            Provides an overview of the charging connectors in the location by

            type and power.

            '
          type: array
          items:
            $ref: '#/components/schemas/ConnectorGroup'
          uniqueItems: true
        restrictions:
          description: "Reason(s) for restricted access type, multiple reasons can be\napplied as alternatives (with OR). Note: Private locations are not\neven included.\n\nExtensible enum: `customersOnly` `brandOnly` `carSharingOnly` `taxisOnly` `other` `...`  \n\n* `customersOnly`: Charging for customers of a hotel, restaurant, store\netc\n* `brandOnly`: Vehicle brand-restriction, for example Tesla, BMW\n* `carSharingOnly`: Charging for car sharing\n* `taxisOnly`: Charging for taxis\n* `other`: Charging is restricted due to other reasons\n\nAs it is possible that new restriction reasons are supported\nin the future, unknown reasons should be ignored.\n"
          type: array
          items:
            $ref: '#/components/schemas/EvAccessRestrictionReason'
          uniqueItems: true
        eMobilityServiceProviders:
          description: eMSPs with a roaming agreement enabling access to the EV charging location. The details are without logo or website.
          type: array
          items:
            $ref: '#/components/schemas/BusinessDetails'
          uniqueItems: true
        supportPhoneNumber:
          description: 'The phone number that EV drivers should call when they need

            assistance at the charge location, in E.164 format.

            '
          type: string
        truckRestrictions:
          $ref: '#/components/schemas/TruckRestrictions'
        isPullThrough:
          description: 'Most of the EV charging locations are designed for nose in/out

            parking or parallel parking, requiring manouvering when entering or exiting.

            Locations with at least one EVSE allowing pull through, i.e., exiting without

            reversing, are handy especially for cars or trucks with trailers.

            If the layout is not known, nose or parallel parking can be assumed.

            '
          type: boolean
        vehicleLimitations:
          $ref: '#/components/schemas/VehicleLimitations'
        reservationRequired:
          description: 'Indicates whether a reservation is required for using some EVSEs at the

            charging location. The location may still also have EVSEs that can be used

            without a reservation.


            If true, the driver should check at the EVSE-level whether a reservation is

            needed in advance to be able to charge.

            If false, the driver can use any available EVSEs without reservation.

            Absence indicates the information is not known; typically no reservation is

            required.

            '
          type: boolean
        evses:
          description: Collection of EVSEs that belong to this charging location.
          type: array
          items:
            $ref: '#/components/schemas/Evse'
          uniqueItems: true
        predictions:
          description: '**RESTRICTED** Availability related predictions data. For example the predicted

            availability of a free EVSE and the wait time for a free EVSE if none are free.


            Only present if there are predictions data available for the location.

            '
          type: array
          items:
            $ref: '#/components/schemas/Prediction'
          uniqueItems: true
        tariffs:
          description: "List of tariffs or price plans for the connectors of the charging station.\nTariffs are typically connector-type specific. Hence they are always linked with\nconnectors and/or connector groups, by indexes to this list.\nThe tariffs are included in the response only when there is data available, and when either\n`evses` or `connectorGroups` fields are requested too.\nBy default the list includes tariffs for ad-hoc charging, per connector type, for EVSEs that \naccept payment without registering.\n"
          type: array
          items:
            $ref: '#/components/schemas/Tariff'
        nearbyPlaces:
          x-maturity: alpha
          description: '**ALPHA** List of HERE Places within walking distance from the EV charging

            location, providing conveniences for the EV driver and passengers while the

            vehicle is charging.


            The list is populated only for DC fast charging locations and is sorted by

            the distance from the charging location, nearest first. The list is limited

            to a maximum of 10 places per category, showing the closest ones.

            '
          type: array
          items:
            $ref: '#/components/schemas/NearbyPlace'
          uniqueItems: true
        hasMoreNearbyPlaces:
          x-maturity: alpha
          description: '**ALPHA** Boolean flag indicating whether there are additional nearby places

            beyond those included in the nearbyPlaces list. If true, it means some

            places were filtered out due to the 10-per-category limit, and clients could

            search for more places using the HERE Geocoding and Search API v7 (GS7).

            '
          type: boolean
          default: false
