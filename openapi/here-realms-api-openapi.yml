components:
  parameters:
    realmMembersSearch:
      in: query
      name: q
      required: false
      description: A free text query string used to filter the results. A search against members in the realm will consider the 'userId', 'firstname', 'lastname', 'email', 'clientId', 'name', 'roles', and 'carId' fields of the members. The precise search algorithm used to match members is not specified, but generally any member where one of the considered fields has a full or partial match should be included in the results.
      schema:
        type: string
    limitType:
      in: query
      name: type
      required: false
      description: The type of the limit.
      schema:
        type: string
      example: MaxEntityApps
    realmEntityType:
      in: query
      name: entityType
      required: false
      description: The type of members to return in the result. One of 'user', 'app', or 'car'. If this parameter is omitted, all entity types will be returned.
      schema:
        type: string
        enum:
        - user
        - app
        - car
    filterHrn:
      in: path
      name: filterHrn
      required: true
      description: HRN identifying the filter.
      schema:
        type: string
      example: hrn:here:authorization::HERE:filter/FILTER-7316c7e6-9e05-4086-aef3-cd7240e3c92b
    count:
      in: query
      name: count
      description: Number of records to return. Default is 100 records. Maximum is 100 records.
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 100
    planServiceId:
      in: query
      name: serviceId
      required: false
      description: Only include plans that contain a policy associated with the requested service
      schema:
        type: string
      example: SERVICE-00000000-0000-0000-0000-000000000000
    invitesSearch:
      in: query
      name: q
      required: false
      description: A free text query string used to filter the results.  A search against invites in the realm will consider the 'firstName', 'lastName', and 'emailAddress' fields of the invites.  The precise search algorithm used to match invites is not specified, but generally any invite where one of the considered fields has a full or partial match should be included in the results.
      schema:
        type: string
    policyServiceId:
      in: query
      name: serviceId
      required: false
      description: Only include policies associated with the requested service
      schema:
        type: string
      example: SERVICE-00000000-0000-0000-0000-000000000000
    externalIdAttachment:
      in: query
      name: externalId
      example: A-S00001234
      required: false
      description: ExternalId of the attached ResourcePlan to select a specific one. If not set the one with empty externalId is selected.
      schema:
        type: string
    invite:
      in: path
      name: invite
      required: true
      description: HRN identifying a given invite.
      schema:
        type: string
    realmMembersState:
      in: query
      name: state
      required: false
      description: Only return user members with the given 'state' in the results.
      schema:
        type: string
        enum:
        - enabled
        - disabled
    actionPolicy:
      name: actionPolicy
      in: path
      description: HRN identifying the service action policy
      required: true
      example: hrn:here:authorization::HERE:actionpolicy/ACTIONPOLICY-0000
      schema:
        type: string
    limit:
      in: query
      name: limit
      required: false
      description: Number of records to return. Default is 100 records. Maximum is 100 records.
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 100
    realm:
      in: path
      name: realm
      required: true
      description: HRN identifying the realm
      schema:
        type: string
    XRequestId:
      in: header
      name: X-Request-ID
      schema:
        type: string
      required: false
      description: 'The unique for the request, used to track this request within the service.  X-Request-ID value is NOT propagated to the downstream services.

        '
    vehicleContractId:
      in: query
      name: vehicleContractId
      required: false
      description: Only return user members with matching vehicleContractId. Works only when entityType=car
      schema:
        type: string
    pageToken:
      name: pageToken
      in: query
      description: The cursor for pagination. Present only if there is an additional page of data to view.
      schema:
        type: string
      example: KuMvTQrdHVVKuMDDdcIvTQrdci1FWdcIHVVci1FW
    planHrn:
      in: path
      name: plan
      required: true
      description: 'HRN identifying the plan.

        '
      schema:
        type: string
      example: hrn:here:authorization::HERE:plan/PLAN-7316c7e6-9e05-4086-aef3-cd7240e3c92b
    linkablePermissionResourceType:
      in: query
      name: resourceType
      required: true
      description: 'Only include permissions effective against the requested resource type.

        '
      schema:
        type: string
    member:
      in: path
      name: member
      required: true
      description: HRN identifying member
      schema:
        type: string
      example: hrn:here:account::myrealm:user/HERE-00000000-0000-0000-0000-000000000000
    groupQuery:
      in: query
      name: group
      required: false
      description: 'HRN idenitifying the group to search.

        '
      schema:
        type: string
    XCorrelationId:
      in: header
      name: X-Correlation-ID
      schema:
        type: string
      required: false
      description: 'Correlates HTTP requests between a client and server. If not present in the incoming request, it will be generated.

        '
    resourcePlanHrn:
      in: path
      name: resourcePlan
      required: true
      description: 'HRN identifying the resource plan.

        '
      schema:
        type: string
      example: hrn:here:authorization::myrealm:resourcePlan/my-plan-000
    resourcePolicy:
      in: path
      name: resourcePolicy
      required: true
      description: The HRN of the resource policy
      schema:
        type: string
      example: hrn:here:authorization::myrealm:resourcePolicy/my-policy-0000
    permissionServiceId:
      in: query
      name: serviceId
      required: false
      description: Only include permissions associated with the requested service
      schema:
        type: string
      example: SERVICE-00000000-0000-0000-0000-000000000000
    policyHrn:
      in: path
      name: policy
      required: true
      description: 'HRN identifying the policy.

        '
      schema:
        type: string
      example: hrn:here:authorization::HERE:policy/POLICY-99b7c7d7-867a-4573-8730-4689be1718c9
  schemas:
