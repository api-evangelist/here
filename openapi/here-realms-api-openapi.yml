                description: 'An invite target which is supported in the realm.

                  '
                example: wegopro
              roleName:
                type: string
                enum:
                - OrgAdmin
                - OrgInviter
                - ResourceManager
                - CrossRealmTrustManager
                - LicensingAdmin
                - MarketplaceConsumer
                - MarketplaceProvider
                - MonitoringDashboardEditor
                - RestrictedAccess
                description: 'An optional roleName that this invite target is mapped to.  If an invite target is mapped to a role,

                  an invite with that role sent to a user will by default use the requested invite target in the

                  invite. This value must be unique among all invite targets configured for a realm.

                  '
                example: RestrictedAccess
          description: 'The list of target applications supported in invitations in this realm.

            '
          example:
          - target: platform
          - target: wegopro
            roleName: RestrictedAccess
