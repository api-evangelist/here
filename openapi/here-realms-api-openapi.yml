openapi: 3.2.0
info:
  title: Authorization API v1.1 Realms API
  version: 1.1.0
  description: 'This specification is intended to describe the Authorization v1.1 APIs

    ## Roles

    ### **OrgAdmin** - An entity which has administrative authority over an organization.'
servers:
- url: Use API Lookup for a base URL
security:
- Bearer: []
tags:
- name: Realms
  description: Realms and Realm Membership Management
paths:
  /realms/{realm}/invites/{invite}:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/invite'
    post:
      tags:
      - Realms
      summary: Resend an invitation to a user in a realm
      description: 'Resend an invitation to a new member to the realm.


        Access Control:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * This API is rate limited to a maximum of **6** invites per realm per minute.

        * The calling principal MUST NOT include a project scope.'
      operationId: resendRealmMemberInvite
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or invite not found.
        '429':
          description: Realm invitation is temporarily suspended due to repeated requests. Wait for a while before making a new request.
    put:
      tags:
      - Realms
      summary: Update and send an invitation to a user in a realm
      description: 'Update and resend an invitation to add a new member to the realm,

        optionally assign membership to one or more groups if the Inviter is

        also a **GroupAdmin** for the group and optionally invite with one or

        more roles assigned.


        Access Control:

        * In order to invite a new user to the **"{realm}"**:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * In order to invite a new user to the **"{realm}"** as a member of the **"{group}"**:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** **AND**

        **"manageMembers"** action permission for the resource **"{group}"** in the **"authorization"** service.

        * In order to invite a new user to the **"{realm}"** to have roles. For each **"{role}"**:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** **AND**

        **"manageEntities"** action permission for the resource **"{role}"** in the **"authorization"** service.

        * This API is rate limited to a maximum of **6** invites per realm per minute.

        * The calling principal MUST NOT include a project scope.'
      operationId: sendUpdatedRealmMemberInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmAuthorizationInvite'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmAuthInviteResponse'
        '400':
          description: Invalid name or role.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or group or role not found.
        '422':
          description: Group size limit exceeded.
        '429':
          description: Realm invitation is temporarily suspended due to repeated requests. Wait for a while before making a new request.
    delete:
      tags:
      - Realms
      summary: Cancel a user invitation to a realm
      description: 'Cancel an invitation to the realm.


        Access Control:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: cancelRealmMemberInvite
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or invite not found.
  /realms/{realm}/invites:
    get:
      tags:
      - Realms
      summary: Search for invitations in a realm
      description: 'Search for invitations in the realm, optionally providing a group.


        Access Control:

        * The calling principal must have either **"manageInvites"** or **"readMembers"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: searchRealmMemberInvites
      parameters:
      - $ref: '#/components/parameters/realm'
      - $ref: '#/components/parameters/groupQuery'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/count'
      - $ref: '#/components/parameters/invitesSearch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePageWToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or group not found.
    post:
      tags:
      - Realms
      summary: Create and send a user invitation for a realm
      description: 'Create and send an invitation to add a new member to the realm,optionally assign membership to one or more groups

        if the Inviter is also a **GroupAdmin** for the group and optionally invite with one or more roles assigned.


        Access Control:

        * In order to invite a new user to the **"{realm}"**:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * In order to invite a new user to the **"{realm}"** as a member of the **"{group}"**:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** **AND**

        **"manageMembers"** action permission for the resource **"{group}"** in the **"authorization"** service.

        * In order to invite a new user to the **"{realm}"** to have roles. For each **"{role}"**:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** **AND**

        **"manageEntities"** action permission for the resource **"{role}"** in the **"authorization"** service.

        * This API is rate limited to a maximum of **6** invites per realm per minute.

        * The calling principal MUST NOT include a project scope.'
      operationId: createRealmMemberInvite
      parameters:
      - $ref: '#/components/parameters/realm'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmAuthorizationInvite'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmAuthInviteResponse'
        '400':
          description: Invalid email or name or role.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or group or role not found.
        '422':
          description: Group size limit exceeded.
        '429':
          description: Realm invitation is temporarily suspended due to repeated requests. Wait for a while before making a new request.
  /realms/{realm}/invites/targets:
    get:
      tags:
      - Realms
      summary: Get list of supported invite targets for the realm
      description: 'Get the list of supported invite targets for the realm. An invite target determines what application a

        user is directed to use in the invitation email. The value **"platform"** is available by default in every

        realm. Additional supported values are available depending on the realm''s configuration.


        Access Control:

        * The calling principal must have **"manageInvites"** action permission for the resource **"{realm}"** in the **"account"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getRealmMemberInviteTargets
      parameters:
      - $ref: '#/components/parameters/realm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteTargets'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or group not found.
  /realms/{realm}/limits:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/XCorrelationId'
    - $ref: '#/components/parameters/XRequestId'
    get:
      parameters:
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/limitType'
      tags:
      - Realms
      summary: Get Realm limits
      description: 'Retrieve the list of limits associated with this realm. A limit with the same **"type"** __may__ appear in the list

        multiple times. In this case, the actual limit that is enforced by the same is the highest of all configured values.


        Access Control:

        * The calling principal must have **"readLimits"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getRealmLimits
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmLimitPageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members:
    parameters:
    - $ref: '#/components/parameters/realm'
    get:
      parameters:
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/count'
      - $ref: '#/components/parameters/realmEntityType'
      - $ref: '#/components/parameters/realmMembersSearch'
      - $ref: '#/components/parameters/realmMembersState'
      - $ref: '#/components/parameters/vehicleContractId'
      tags:
      - Realms
      summary: Get realm members
      description: 'Retrieve the list of members within the realm.


        Access Control:

        * The calling principal must have **"readMembers"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getRealmMembers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmMemberPageWToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members/{member}:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    get:
      tags:
      - Realms
      summary: Get realm member
      description: 'Retrieve the user or application details of the member defined by member HRN.


        Access Control:

        * The calling principal must have **"readMembers"** action permission for the resource **"{realm}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getRealmMember
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmMember'
              examples:
                user:
                  value:
                    memberHrn: hrn:here:account::myrealm:user/HERE-64badba9-4242-4859-88d5-74563a8f0899
                    entityType: user
                    info:
                      userId: HERE-64badba9-4242-4859-88d5-74563a8f0899
                      userHrn: hrn:here:account::myrealm:user/HERE-64badba9-4242-4859-88d5-74563a8f0899
                      realm: myrealm
                      firstname: John
                      lastname: Williams
                      email: john.williams@example.com
                      roles:
                      - OrgAdmin
                      - GroupAdmin
                      state: enabled
                      createdTime: 1432216394712
                vehicle:
                  value:
                    memberHrn: hrn:here:account::myrealm:user/HERE-64badba9-4242-4859-88d5-74563a8f0890
                    entityType: car
                    info:
                      userId: HERE-64badba9-4242-4859-88d5-74563a8f0890
                      userHrn: hrn:here:account::myrealm:user/HERE-64badba9-4242-4859-88d5-74563a8f0890
                      realm: myrealm
                      carId: HashedVehicleVIN
                      vehicleContractId: XY/1234
                      roles:
                      - OrgAdmin
                      - GroupAdmin
                      state: enabled
                      createdTime: 1432216394712
                app:
                  value:
                    memberHrn: hrn:here:account::myrealm:app/0123456789ABCDEFGHHIJKLM
                    entityType: app
                    info:
                      clientId: 0123456789ABCDEFGHHIJKLM
                      clientHrn: hrn:here:account::myrealm:app/0123456789ABCDEFGHHIJKLM
                      realm: myrealm
                      name: Some Application
                      description: Application for doing something.
                      ownerId: HERE-00000000-0000-0000-0000-000000000000
                      ownerHrn: hrn:here:account::myrealm:user/HERE-00000000-0000-0000-0000-000000000000
                      defaultScope: hrn:here:authorization::myrealm:project/my-project-0000
                      isRestrictedScope: 'true'
                      appCreationEnabled: 'true'
                      alwaysProjectScope: 'true'
                      status: active
                      roles:
                      - OrgAdmin
                      - GroupAdmin
                      state: enabled
                      createdTime: 1432216394712
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or realm member not found
  /realms/{realm}/members/{member}/roles:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    get:
      tags:
      - Realms
      summary: Get entity roles
      description: 'Retrieve the roles a given entity has been assigned.


        Access Control:

        * The calling principal must have **"readRoles"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getEntityRoleAssignments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or realm member not found
  /realms/{realm}/members/{member}/groups:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/count'
    get:
      tags:
      - Realms
      summary: Get entity group membership
      description: 'Retrieve the groups a given entity is a member of.


        Access Control:

        * The calling principal must have **"readGroups"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getEntityGroupMembership
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPageWToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or realm member not found
  /realms/{realm}/members/{member}/managedGroups:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/count'
    - $ref: '#/components/parameters/pageToken'
    get:
      tags:
      - Realms
      summary: Get entity managed group
      description: 'Retrieve the list of groups over which the provided entity has been

        granted the role of GroupAdmin.


        Access Control:

        * The calling principal must have **"readGroups"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getEntityManagedGroups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPageWToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or realm member not found
  /realms/{realm}/members/{member}/projects:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    get:
      tags:
      - Realms
      summary: Get entity project membership
      description: 'Retrieve the projects a given entity is a member of.


        Access Control:

        * The calling principal must have **"manage"** action permission for the resource **"{member}"** in the **"authorization"** service.'
      operationId: getEntityProjectMembership
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListWithPageToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members/{member}/plans:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags:
      - Realms
      summary: Get Entity Plans
      operationId: getEntityPlans
      description: 'Get all plans attached to the requested entity.


        **Note:** Plans can only be attached to apps. Requesting plans attached to a user will return 404.


        Access Control:

        * The calling principal must have **"readPlans"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      responses:
        '200':
          description: OK.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachedUnscopedPlanPageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members/{member}/plans/{plan}/policies:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/planHrn'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags:
      - Realms
      summary: Get Entity Plan Policies
      operationId: getEntityPlanPolicies
      description: 'Get all policies associated with a plan attached to the requested entity.


        Access Control:

        * The calling principal must have **"readPlans"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      responses:
        '200':
          description: OK.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachedUnscopedPolicyPageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members/{member}/plans/{plan}/policies/{policy}/permissions:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/planHrn'
    - $ref: '#/components/parameters/policyHrn'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags:
      - Realms
      summary: Get Entity Plan Policy Permissions
      operationId: getEntityPlanPolicyPermissions
      description: 'Get all **unscoped** permissions that are in a policy associated with a plan attached to the requested entity.


        Access Control:

        * The calling principal must have **"readPlans"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      responses:
        '200':
          description: OK.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members/{member}/policies:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags:
      - Realms
      summary: Get Entity Policies
      operationId: getEntityPolicies
      description: 'Get all policies attached to the requested entity.


        **Note:** Policies can only be attached to apps. Requesting policies attached to a user will return 404.


        Access Control:

        * The calling principal must have **"readPolicies"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      responses:
        '200':
          description: OK.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachedUnscopedPolicyPageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members/{member}/policies/{policy}/permissions:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/policyHrn'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags:
      - Realms
      summary: Get Entity Policy Permissions
      operationId: getEntityPolicyPermissions
      description: 'Get all **unscoped** permissions that are in a policy attached to the requested entity.


        Access Control:

        * The calling principal must have **"readPolicies"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      responses:
        '200':
          description: OK.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /realms/{realm}/members/{member}/permissions:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/permissionServiceId'
    - $ref: '#/components/parameters/pageToken'
    - $ref: '#/components/parameters/limit'
    get:
      tags:
      - Realms
      summary: Get entity permissions
      description: 'Retrieve the **unscoped** permissions a given entity has been assigned.


        Access Control:

        * The calling principal must have **"readPermissions"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getEntityPermissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPageWithToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Realm or realm member not found
  /realms/{realm}/members/{member}/filters:
    parameters:
    - $ref: '#/components/parameters/realm'
    - $ref: '#/components/parameters/member'
    - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags:
      - Realms
      summary: Get Entity Access Filters
      description: 'Retrieve the Access Filters attached to this entity.


        Access Control:

        * The calling principal must have **"readAccessFilter"** action permission for the resource **"{member}"** in the **"authorization"** service.

        * The calling principal MUST NOT include a project scope.'
      operationId: getEntityAccessFilters
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
