{"openapi":"3.0.2","info":{"title":"Rate Limit Rules API v1","version":"1.0.0","description":"The Rate Limit Rules API provides information about rate limit rules that are actively being enforced\nfor your organization.\n\nAny request to a HERE Platform service may be subject to rate limit rules.  Rate limit rules are applied to a\nrequest using the following criteria:\n* Any rule whose **requestMatchingCriteria** matches the request is a candidate rule.\n* Every candidate rule is applied as long as it is not __overwritten__\n* A rule (**rule1**) is __overwritten__ if a there is a different candidate rule (**rule2**) that meets the following conditions:\n  * The **overwriteControl** for BOTH rules is identical\n  * The **requestMatchingCriteria** for **rule2** is a superset of the **requestMatchingCriteria** for **rule1**\n  * When **overwriteControl** is equal to **byMatchingCriteria**, the **groupingMask** for **rule2** is the same as the **groupingMask** for **rule1**\n  * When **overwriteControl** is equal to **byMatchingCriteriaAndGroupingMask**, the **groupingMask** for **rule2** is the same as OR a superset of the **groupingMask** for **rule1**\n"},"servers":[{"url":"Use API Lookup for a base URL"}],"tags":[{"name":"Rate Limit Rules","description":"Access and manage rate limit rules for API endpoints on the platform\n"},{"name":"Endpoints","description":"Identify information about endpoints subject to rate limit rules on the platform\n"},{"name":"API Information","description":"Additional API Information\n"}],"security":[{"token":[]},{"apiKey":[]}],"paths":{"/identities/me/rules":{"get":{"summary":"Get list of rate limit rules for the caller","operationId":"Rate Limit Rules API v1 getRateLimitRulesMe","description":"Get the list of rate limit rules that are actively enforced for the calling identity.\n","tags":["Rate Limit Rules"],"parameters":[{"$ref":"#/components/parameters/endpointIdRules"},{"$ref":"#/components/parameters/url"},{"$ref":"#/components/parameters/projectHrn"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/xRequestId"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RulePageWithToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/identities/default/rules":{"get":{"summary":"Get list of rate limit rules for the caller's realm","operationId":"Rate Limit Rules API v1 getRateLimitRulesDefault","description":"Get the list of rate limit rules that are actively enforced for any generic identity from the calling identity's realm whose rules are not overridden by custom rules or a custom tier.\n","tags":["Rate Limit Rules"],"parameters":[{"$ref":"#/components/parameters/endpointIdRules"},{"$ref":"#/components/parameters/url"},{"$ref":"#/components/parameters/projectHrn"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/xRequestId"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RulePageWithToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/identities/{identityHrn}/rules":{"get":{"summary":"Get list of rate limit rules for an identity","operationId":"Rate Limit Rules API v1 getRateLimitRulesIdentity","description":"Get the list of rate limit rules that are actively enforced for the given identity.\n\n</br>Access Control:\n* The calling principal must have either **\"readRateLimitRules\"** action permission for the resource **\"{identityHrn}\"** in the **\"iam-config\"** service or\n  **\"manage\"** action permission for the resource **\"{identityHrn}\"** in the **\"account\"** service.\n* The calling principal MUST NOT include a project scope.\n","tags":["Rate Limit Rules"],"parameters":[{"$ref":"#/components/parameters/identityHrn"},{"$ref":"#/components/parameters/endpointIdRules"},{"$ref":"#/components/parameters/url"},{"$ref":"#/components/parameters/projectHrn"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/xRequestId"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RulePageWithToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/identities/me/rules/{ruleHrn}":{"get":{"summary":"Get rate limit rule for the caller","operationId":"Rate Limit Rules API v1 getRateLimitRuleCaller","description":"Get a single rate limit rule that is actively enforced for the calling identity.\n","tags":["Rate Limit Rules"],"parameters":[{"$ref":"#/components/parameters/ruleHrn"},{"$ref":"#/components/parameters/xRequestId"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Rule"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/identities/default/rules/{ruleHrn}":{"get":{"summary":"Get rate limit rule for the caller's realm","operationId"