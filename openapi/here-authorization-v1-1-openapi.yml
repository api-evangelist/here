r>Access Control:\n  * The calling principal must have permission to take all the **\"requiredToMakeLinkable\"** actions against\n    the service inferred via the reserved resource prefix of the resource in the path in the scope of the\n    home project of the resource.\n  * This API works only with tokens that are scoped to the home project of the resource.\n","security":[{"Bearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceSetting"}}}},"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceSetting"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/resources/{resource}/projects":{"parameters":[{"$ref":"#/components/parameters/resource"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/Relation"},{"$ref":"#/components/parameters/includeNonMemberProjects"},{"$ref":"#/components/parameters/includeCrossRealmProjects"},{"$ref":"#/components/parameters/XCorrelationId"}],"get":{"tags":["Resource Info and Management"],"summary":"Get the requested Projects that the resource belongs to or is referenced in(linked to)","operationId":"getResourceProjects","description":"Get the list of Projects that the resource belongs to or is referenced in(linked to).\nWhen includeCrossRealmProjects=true and a cross-realm trust is established between home project or realm\nof the resource and a project or realm that resource is linked to, then returned list will also include that project.\nIn other cases the returned list will only include projects that are in the caller's realm.\n\n**Note:**\n  - If the presented access token has **a project scope**, the response will include:\n    - The home project of the resource\n    - The list of Projects that the resource has been linked to\n  - If the presented access token has **no scope**, the response will include:\n    - The list of Projects filtered out based on the membership of the caller unless includeNonMemberProjects=true.\n\n</br>Access Control for project scoped call:\n  * The calling principal must have permission to take all the **\"requiredToMakeLinkable\"** actions against\n    the service inferred via the reserved resource prefix of the resource in the path in the scope of the\n    home project of the resource.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceProjectListWithPageToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/resources/{resource}/linkable":{"parameters":[{"$ref":"#/components/parameters/resource"},{"$ref":"#/components/parameters/XCorrelationId"}],"get":{"tags":["Resource Info and Management"],"summary":"Get a list of ways the resource has been made linkable","operationId":"getListOfWaysResourceIsLinkable","description":"Get a list of ways this resource has been made linkable.\n\n</br>Access Control:\n  * The calling principal must have permission to take all the **\"requiredToMakeLinkable\"** actions against\n    the service inferred via the reserved resource prefix of the resource in the path in the scope of the\n    home project of the resource.\n  * This API works only with tokens that are scoped to the home project of the resource.\n","parameters":[{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/pageToken"}],"security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/