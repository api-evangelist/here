ler to link to ANY project and all resources available to be linked to ANY project via \n      Resource Plan Attachments or by virtue of being a Linkable resource to the realm\n  - raiEnabled types = [catalog, service, schema, artifact]\n\n</br>Access Control:\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceListDetailedWithPageToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/realm/resources":{"parameters":[{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/Type"},{"$ref":"#/components/parameters/XCorrelationId"}],"get":{"tags":["Resource Info and Management"],"summary":"Get List of all the resources in the realm of the caller","operationId":"listRealmResources","description":"Get List of all the resources in the realm of the caller.\n\n</br>Access Control:\n  * The calling principal must have **\"listRealmResources\"** action permission in the **\"authorization\"** service.\n  * This API works only with tokens that are scoped to a project.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceListDetailedWithPageToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/realm/externalResources":{"parameters":[{"$ref":"#/components/parameters/externalResourcesResourceType"},{"$ref":"#/components/parameters/externalResourcesAction"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"}],"get":{"tags":["Resource Info and Management"],"summary":"Get external resources available in the realm to the caller.","description":"Get the list of resources that have been made specifically available in the caller's realm via\ndirect Plan, Policy, or ResourcePlan attachments and are accessible to the caller according to the caller's\nAccess Filters.</br>\n\n</br>This will specifically include:</br>\n * Any resource that is accessible in the realm via a Plan attachment to the realm and is an exact match in a permission.\n * Any resource that is accessible in the realm via a Policy attachment to the realm and is an exact match in a permission.\n * Any resource that is accessible in the realm via a ResourcePlan attachment to the realm.\n\n</br>The returned list will ONLY include the above.  In addition, it will be further filtered according to the following:\n * If the caller contains NO project scope, the returned list will ONLY include resources accessible to the\n   caller for **unscoped** access according to the Access Filters associated with the caller.\n * If the caller contains a project scope, the returned list will ONLY include resources accessible to the\n   caller for **scoped** access according to the Access Filters associated with the caller.\n * The returned list WILL NOT contain resources that are only available via wildcard permissions specified\n   in an attached Plan or Policy on the realm.\n\n</br>Access Control:\n  * The calling principal MAY include a project scope.\n","operationId":"getRealmExternalResources","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ExternalResourcePageWithTokenNoTotal"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Realm not found"}}}},"/resourceTypes/{resourceType}/actions":{"get":{"tags":["Resource Info and Management"],"summary":"