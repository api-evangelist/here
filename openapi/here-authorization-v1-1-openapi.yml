es/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"head":{"tags":["Project Management"],"summary":"Checks the existance of a project in caller realm.","operationId":"checkProjectExistance","description":"Checks whether a project exists with requested project hrn in caller realm. If project does not exist in the same realm it will return 404.\n\n</br>Access Control:\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK - project exists","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}}},"401":{"$ref":"#/components/responses/Unauthorized"},"404":{"$ref":"#/components/responses/NotFound"}}},"patch":{"tags":["Project Management"],"summary":"Update the specified Project","operationId":"patchProject","description":"Update the specified Project.\n\n</br>Access Control:\n  * The calling principal must have **\"write\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PatchProject"}}}},"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ProjectResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"delete":{"tags":["Project Management"],"summary":"Delete the specified Project","operationId":"deleteProject","description":"Delete the specified Project.\n\n</br>Access Control:\n  * The calling principal must have **\"manage\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"responses":{"202":{"description":"Accepted","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/projects/{project}/resources":{"get":{"parameters":[{"$ref":"#/components/parameters/project"},{"$ref":"#/components/parameters/Type"},{"$ref":"#/components/parameters/Relation"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/XCorrelationId"}],"tags":["Project Resource Management"],"summary":"Get the list of resources in the requested Project & referenced in(linked to) the Project","operationId":"listProjectResources","description":"Get the list of resources in the requested Project & referenced in(linked to) the Project.\n\n</br>Access Control:\n  * The calling principal must have **\"read\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceInProjectListWithPageToken"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"post":{"tags":["Project Resource Management"],"summary":"Add resources to the requested Project as a Resource Home or Resource Reference(Link)","operationId":"addProjectResourceRelations","parameters":[{"$ref":"#/components/parameters/project"},{"$ref":"#/components/parameters/ResourceRelation"},{"$ref":"#/components/parameters/ProjectResourceType"},{"$ref":"#/components/parameters/XCorrelationId"}],"description":"Add a list of resources to the requested Project as a home or a reference(link).\n\n</br>Access Control:\n  * **When relation=home**,\n\n    The requested resources will be assigned to the requested project as their resource home. This API is idempotent.\n    Any preexisting resources that already are homed to the specified project, will be silently ignored.\n    Resource type must be specified either in query parameter or for individual resources.\n    When resource type is specified in individual resources, it will take precedence over resource type specified as query parameter.\n\n    * The calling principal must have **manageResourceHome** action permission for the resource **\"{project}\"** **AND** the **share** action for the resource **\"{resource}\"** in the **\"{authorization}\"** service.\n    * The calling principal must have **manageResourceHome** action permission for the specified project in the **\"{authorization}\"** service **AND** all **requiredToAddToProjects** actions defined by the service for the resource **\"{resource}\"**.\n    * The calling principal MUST NOT include a project scope.\n  * **When relation=reference**,\n\n    Link the resource to the requested Project as a reference(link). The requested resources will be assigned to the requested\n    project as reference(link). The resources **MUST** be available to the caller to attach as a resource reference(link).\n    A resource is referenceable if it has been marked as referenceable and the caller has permission to all\n    reference enabled actions against the resource OR The resource has been made linkable to the project/realm for\n    the project linking enabled action.\n\n    The exclusive list of resources available to the caller to attach as a resource reference(link) is accessible\n    via a call to /resources?referenceable=true or /resources?linkable=true\n\n    * The calling principal must have **manageResourceReferences** action permission for the resource **\"{project}\"** in the **\"{authorization}\"** service.\n    * The calling principal is a **member** of the specified project.\n    * The calling principal must have permission to attach the resource as a referenceable resource. A resource is referenceable to the caller if:\n      * It has been marked as referenceable and The caller has permission to all reference enabled actions against the resource. OR\n      * The resource has been made linkable to the project/realm for the project linking enabled action\n    * This API works for tokens with or without a project scope.\n","requestBody":{"required":false,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceRelationList"}}}},"security":[{"Bearer":[]}],"responses":{"201":{"description":"Created","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceRelationResponseList"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/projects/{project}/resources/{resource}":{"get":{"tags":["Project Resource Management"],"summary":"Get a resource that is linked to a Project as either a Resource Home or Resource Reference(Link)","parameters":[{"$ref":"#/components/parameters/project"},{"$ref":"#/components/parameters/resource"},{"$ref":"#/components/parameters/Relation"},{"$ref":"#/components/parameters/XCorrelationId"}],"operationId":"getProjectResource","description":"Get the resource that is linked to the requested Project. The requested resource\nmay be linked as either a home or a reference(link).\n\n</br>Access Control:\n  * The calling principal must have **\"read\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceInProjectResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"post":{"tags":["Project Resource Management"],"summary":"Add a resource to the requested Project as a Resource Home or Resource Reference(Link)","operationId":"addProjectResourceRelation","parameters":[{"$ref":"#/components/parameters/project"},{"$ref":"#/components/parameters/resource"},{"$ref":"#/components/parameters/ResourceRelation"},{"$ref":"#/components/parameters/externalId"},{"$ref":"#/components/parameters/ProjectResourceType"},{"$ref":"#/components/parameters/XCorrelationId"}],"description":"Add the resource to the requested Project as a home or a reference(link).\n\n</br>Access Control:\n  * **When relation=home**,\n\n    The requested resource will be assigned the requested project as its resource home.\n    The resource **MUST NOT** already have an existing resource home.\n\n    * The calling principal must have **manageResourceHome** action permission for the resource **\"{project}\"** **AND** the **share** action for the resource **\"{resource}\"** in the **\"{authorization}\"** service.\n    * The calling principal must have **manageResourceHome** action permission for the specified project in the **\"{authorization}\"** service **AND** all **requiredToAddToProjects** actions defined by the service for the resource **\"{resource}\"**.\n    * The calling principal MUST NOT include a project scope.\n  * **When relation=reference**,\n\n    Link the resource to the requested Project as a reference(link).  The requested resource will be assigned to the requested\n    project as reference(link). The resource **MUST** be available to the caller to attach as a resource reference(link).\n    A resource is referenceable if it has been marked as referenceable and the caller has permission to all\n    reference enabled actions against the resource OR The resource has been made linkable to the project/realm for\n    the project linking enabled action.\n\n    The exclusive list of resources available to the caller to attach as a resource reference(link) is accessible\n    via a call to /resources?referenceable=true or /resources?linkable=true\n\n    * The calling principal must have **manageResourceReferences** action permission for the resource **\"{project}\"** in the **\"{authorization}\"** service.\n    * The calling principal is a **member** of the specified project.\n    * The calling principal must have permission to attach the resource as a referenceable resource. A resource is referenceable to the caller if:\n      * It has been marked as referenceable and The caller has permission to all reference enabled actions against the resource. OR\n      * The resource has been made linkable to the project/realm for the project linking enabled action\n    * This API works for tokens with or without a project scope.\n","requestBody":{"required":false,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceLinkActionBody"}}}},"security":[{"Bearer":[]}],"responses":{"201":{"description":"Created\n\n* Note: When a resource that has been marked available for linking via the \"Availability\" tab is already linked as a reference, \n        the API will return 201 and update the allowedActions.\n","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceRelationResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"description":"Resource already exists.\n\n* Note: When a resource (service or catalog) is made available for linking via resource plans associated with a realm, \n        the API for linking will return a 409 if the exact configuration that is being linked is already linked. \n        Also, there is a scenario in which a same resource can be linked multiple times with different subresource configurations.\n","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}}}},"delete":{"tags":["Project Resource Management"],"summary":"Remove a Resource Relation(Home or Link) from a project","operationId":"deleteProjectResourceReference","parameters":[{"$ref":"#/components/parameters/project"},{"$ref":"#/components/parameters/resource"},{"$ref":"#/components/parameters/externalIdDelete"},{"$ref":"#/components/parameters/ResourceRelation"},{"$ref":"#/components/parameters/XCorrelationId"}],"description":"Remove the resource from the project.  The requested resource\nmay only be linked as a reference, or added as a home from outside of Projects. Removing other home resource requires\ndeleting the resource from the resource service.\nWhen relation=home, A resource cannot be removed from a project if it belongs to a Resource Policy. Managers of the resource need to remove any\nResourcePolicyAttachments before removing the home.\n\n</br>Access Control:\n  * **When relation=home**,\n    * The calling principal must have **\"manageResourceHome\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service **AND** all **requiredToAddToProjects** actions defined by the service for the specified resource.\n  * **When relation=reference**,\n    * The calling principal must have **\"manageResourceReferences\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service. If not, check if caller is a project member, otherwise check if calling principal can effectively manage the resource.\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"responses":{"204":{"$ref":"#/components/responses/NoContent"},"400":{"$ref":"#/components/responses/BadRequestForDeleteProjectResourceReference"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/projects/{project}/members/{member}":{"parameters":[{"$ref":"#/components/parameters/project"},{"$ref":"#/components/parameters/projectMember"},{"$ref":"#/components/parameters/XCorrelationId"}],"post":{"tags":["Project Access Management"],"summary":"Add the member to the requested Project","operationId":"addProjectMember","description":"Add the member to the requested Project.\n\n</br>Access Control:\n  * The calling principal must have **\"manageMembers\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK. Project Member already exists","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}}},"201":{"description":"Created","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"get":{"tags":["Project Access Management"],"summary":"Get the requested Project Member","operationId":"getProjectMember","description":"Get the requested Project Member.\n\n</br>Access Control:\n  * The calling principal must have **\"read\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":