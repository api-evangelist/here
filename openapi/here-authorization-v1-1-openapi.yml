roject scope.\n","operationId":"getEffectiveProjectPermissionsForMember","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PermissionPageWithTokenNoTotal"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Realm or realm member not found"}}}},"/projects/{project}/members/{member}/linkable/permissions":{"parameters":[{"$ref":"#/components/parameters/project"},{"$ref":"#/components/parameters/projectMember"},{"$ref":"#/components/parameters/linkablePermissionResourceType"},{"$ref":"#/components/parameters/permissionServiceId"},{"$ref":"#/components/parameters/permissionResourceHrn"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"}],"get":{"tags":["Project Access Management"],"summary":"Get project linkable permissions","description":"Get the list of **linkable** permissions that are associated with resources in the realm that have been\nspecifically made available to be linked to the requested project and can be done so by the requested member.\nNote this list does NOT include linkable permissions associated with resource plans attached to the realm.\n\n</br>Access Control:\n* The calling principal must have **\"read\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n* The calling principal MUST NOT include a project scope.\n","operationId":"getProjectLinkablePermissions","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PermissionPageWithToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Realm or realm member not found"}}}},"/projects/{project}/filter":{"parameters":[{"$ref":"#/components/parameters/project"}],"get":{"tags":["Project Access Management"],"summary":"Get Project Access Filter","description":"Retrieve the Access Filter attached to this project.\n\n</br>Access Control:\n* The calling principal must have **\"read\"** action permission for the resource **\"{project}\"** in the **\"authorization\"** service.\n* The calling principal MUST NOT include a project scope.\n","operationId":"getProjectAccessFilter","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AccessFilter"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Project not found or no filter attached"}}}},"/crossRealmTrusts":{"get":{"tags":["Cross Realm Trusts"],"parameters":[{"$ref":"#/components/parameters/sourceRealm"},{"$ref":"#/components/parameters/targetRealm"},{"$ref":"#/components/parameters/sourceProject"},{"$ref":"#/components/parameters/targetProject"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/XCorrelationId"}],"summary":"Get a list of cross realm trusts","operationId":"getCrossRealmTrusts","description":"Get a list of CrossRealmTrusts established for the Realm or Project of the requesting User or App,\nwhere the realm/project is either source or target.\nAn entity can get the CrossRealmTrusts created for its realm/project or granted from its realm/project to other realms/projects\nbased on the \"rlm\" claim in the access token.\nAmong query parameters sourceRealm, sourceProject, targetProject and targetRealm supports only one filter at a time.\nCaller entity's realm must match realm specified in sourceProject or targetProject query parameter.\n\n</br>Access Control:\n  * The calling principal must have **\"readCrossRealmTrust\"** action permission for the resource **\"{realm}\"** in the **\"authorization\"** service. The **\"{realm}\"** here represents the HRN of the target realm. \n  * This permission is granted to all entities by default policy. This permission is also explicitly granted to all entities with roles OrgAdmin or CrossRealmTrustManager.\n  * The calling principal MUST NOT include a project scope.\n","responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CrossRealmTrustListWithPageToken"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/crossRealmTrusts/sources/{sourceProjectOrRealm}/targets/{targetProjectOrRealm}":{"parameters":[{"$ref":"#/components/parameters/sourceProjectOrRealm"},{"$ref":"#/components/parameters/targetProjectOrRealm"},{"$ref":"#/components/parameters/XCorrelationId"}],"post":{"tags":["Cross Realm Trusts"],"summary":"Create or update a cross realm trust","operationId":"createCrossRealmTrust","description":"Create or update a CrossRealmTrust that allows LinkableResources to be received from the source of the resource.\nThe source HRN is defined by either the home project or the realm of the resource.\nThe CrossRealmTrust is established with a target specified in the path which could either be a specific project or the entire realm.\nAn access token from an identity with appropriate privileges in the target realm should be used to create/update the CrossRealmTrust.\n\n</br>Access Control:\n  * The calling principal must have **\"manageCrossRealmTrust\"** action permission for the resource **\"{realm}\"** in the **\"authorization\"** service. The **\"{realm}\"** here represents the HRN of represent the target realm.\n  * This permission is granted to all entities with roles OrgAdmin or CrossRealmTrustManager.\n  * The calling principal MUST NOT include a project scope.\n","requestBody":{"required":false,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CrossRealmTrustRequest"}}}},"responses":{"201":{"description":"Created","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CrossRealmTrust"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"get":{"tags":["Cross Realm Trusts"],"summary":"Get a cross realm trust","operationId":"getCrossRealmTrust","description":"Get a single CrossRealmTrust object identified by source and target realms or projects.\nAn entity can get the CrossRealmTrust created for its realm or granted from its realm to other realms\nbased on the \"rlm\" claim in the access token.\n\n</br>Access Control:\n  * The calling principal must have **\"readCrossRealmTrust\"** action permission for the resource **\"{realm}\"** in the **\"authorization\"** service. The **\"{realm}\"** here represents the HRN of the target realm. \n  * This permission is granted to all entities by default policy. This permission is also explicitly granted to all entities with roles OrgAdmin or CrossRealmTrustManager.\n  * The calling principal MUST NOT include a project scope.\n","responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CrossRealmTrust"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"delete":{"tags":["Cross Realm Trusts"],"summary":"Delete a cross realm trust","operationId":"deleteCrossRealmTrust","description":"Delete an existing CrossRealmTrust to no longer allow LinkableResources to be offered\nby the source Project or Realm into the context of the target Realm or a Project therein.\nDeleting an existing CrossRealmTrust will disable the accessibility of any resources already linked\nto the projects of the target realm. It will also hide any resources already made available to the target realm.\nAn access token from an identity with appropriate privileges in the target realm should be used to delete the CrossRealmTrust.\n\n</br>Access Control:\n  * The calling principal must have **\"manageCrossRealmTrust\"** action permission for the resource **\"{realm}\"** in the **\"authorization\"** service. The **\"{realm}\"** here represents the HRN of represent the target realm. \n  * This permission is granted to all entities with roles OrgAdmin or CrossRealmTrustManager.\n  * The calling principal MUST NOT include a project scope.\n","responses":{"204":{"description":"No content","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/services/{serviceId}":{"parameters":[{"$ref":"#/components/parameters/serviceId"},{"$ref":"#/components/parameters/XCorrelationId"}],"get":{"tags":["Services"],"summary":"Get Service Information by service id","operationId":"getServiceInfoById","description":"Get service information by service id.\n\n</br>Access Control:\n  * The calling principal must have **\"readServices\"** action permission in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","responses":{"200":{"description":"OK.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ServiceInformation"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/services":{"parameters":[{"$ref":"#/components/parameters/serviceIdAlias"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/XCorrelationId"}],"get":{"tags":["Services"],"summary":"Get Service Information","operationId":"getServiceInfo","description":"Get service information. \n\n</br>Access Control:\n  * The calling principal must have **\"readServices\"** action permission in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","responses":{"200":{"description":"OK.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ServiceInformationWithPageToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/services/resourceTypes":{"parameters":[{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/XCorrelationId"}],"get":{"tags":["Services"],"summary":"Get Resource Types","operationId":"getResourceTypes","description":"Get resource types for all services.\n\n</br>Access Control:\n  * The calling principal must have **\"readServices\"** action permission in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","responses":{"200":{"description":"OK.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceTypesWithPageToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}}},"components":{"parameters":{"realmEntityType":{"in":"query","name":"entityType","required":false,"description":"The type of members to return in the result. One of 'user', 'app', or 'car'. If this parameter is omitted, all entity types will be returned.","schema":{"type":"string","enum":["user","app","car"]}},"realmMembersSearch":{"in":"query","name":"q","required":false,"description":"A free text query string used to filter the results. A search against members in the realm will consider the 'userId', 'firstname', 'lastname', 'email', 'clientId', 'name', 'roles', and 'carId' fields of the members. The precise search algorithm used to match members is not specified, but generally any member where one of the considered fields has a full or partial match should be included in the results.","schema":{"type":"string"}},"realmMembersState":{"in":"query","name":"state","required":false,"description":"Only return user members with the given 'state' in the results.","schema":{"type":"string","enum":["enabled","disabled"]}},"realmProjectSearch":{"in":"query","name":"q","required":false,"description":"A free text query string used to filter the results.  A search against projects in the realm will consider the 'id', 'name', 'description', fields of the projects. The precise search algorithm used to match projects is not specified, but generally any projects where one of the considered fields has a full or partial match should be included in the results.","schema":{"type":"string"}},"groupsSearch":{"in":"query","name":"q","required":false,"description":"A free text query string used to filter the results.  A search against groups in the realm will consider the 'id', 'name', and 'description' fields of the groups.  The precise search algorithm used to match groups is not specified, but generally any member where one of the considered fields has a full or partial match should be included in the results.","schema":{"type":"string"}},"groupEntityType":{"in":"query","name":"entityType","required":false,"description":"The type of members to return in the result.  One of 'user', 'app', or 'invite'.  If this parameter is omitted, all entity types will be returned. ","schema":{"type":"string","enum":["user","app","invite"]}},"invitesSearch":{"in":"query","name":"q","required":false,"description":"A free text query string used to filter the results.  A search against invites in the realm will consider the 'firstName', 'lastName', and 'emailAddress' fields of the invites.  The precise search algorithm used to match invites is not specified, but generally any invite where one of the considered fields has a full or partial match should be included in the results.","schema":{"type":"string"}},"member":{"in":"path","name":"member","required":true,"description":"HRN identifying member","schema":{"type":"string"},"example":"hrn:here:account::myrealm:user/HERE-00000000-0000-0000-0000-000000000000"},"entity":{"in":"path","name":"entity","required":true,"description":"HRN identifying a given entity","schema":{"type":"string"}},"externalId":{"in":"query","name":"externalId","example":"A-S00001234","required":false,"description":"For external resource this ID needs to be provided.","schema":{"type":"string"}},"externalIdDelete":{"in":"query","name":"externalId","example":"A-S00001234","required":false,"description":"Delete only the linkedOption with this matching externalId. Note an empty string value for this parameter matches the linkedOption with no externalId value.  If this parameter is omitted, the entire relation and all linkedOptions are removed.  Only relevant when relation=reference.","schema":{"type":"string"}},"externalIdAttachment":{"in":"query","name":"externalId","example":"A-S00001234","required":false,"description":"ExternalId of the attached ResourcePlan to select a specific one. If not set the one with empty externalId is selected.","schema":{"type":"string"}},"externalResourcesResourceType":{"in":"query","name":"type","required":true,"description":"Only include resources of the requested resource type.\n","schema":{"type":"string"}},"externalResourcesAction":{"in":"query","name":"action","required":true,"description":"Only include resources accessible with the requested action via the registered serviceId of the resource's\nresource type.\n","schema":{"type":"string"}},"realm":{"in":"path","name":"realm","required":true,"description":"HRN identifying the realm","schema":{"type":"string"}},"role":{"in":"path","name":"role","required":true,"description":"HRN identifying a given role","schema":{"type":"string"}},"roleName":{"in":"query","name":"roleName","required":false,"description":"The name of the role to be returned in the result set.","schema":{"type":"string"}},"resourceHrn":{"in":"query","name":"resource","required":false,"description":"The hrn of the resource which the roles returned in the result set should be\nassociated with.\n","schema":{"type":"string"}},"roleQuery":{"in":"query","name":"role","required":false,"description":"The HRN of the role the invited user should be assigned.","schema":{"type":"string"}},"groupQuery":{"in":"query","name":"group","required":false,"description":"HRN idenitifying the group to search.\n","schema":{"type":"string"}},"permission":{"in":"path","name":"permission","required":true,"description":"Permission identifier","schema":{"type":"string"}},"count":{"in":"query","name":"count","description":"Number of records to return. Default is 100 records. Maximum is 100 records.","schema":{"type":"integer","minimum":0,"maximum":100,"default":100}},"pageToken":{"name":"pageToken","in":"query","description":"The cursor for pagination. Present only if there is an additional page of data to view.","schema":{"type":"string"},"example":"KuMvTQrdHVVKuMDDdcIvTQrdci1FWdcIHVVci1FW"},"groupId":{"name":"groupId","in":"path","required":true,"description":"HRN identifying a group.","schema":{"type":"string"}},"permissionIdPathParam":{"name":"permissionId","in":"path","required":true,"description":"Permission identifier.","schema":{"type":"string"}},"invite":{"in":"path","name":"invite","required":true,"description":"HRN identifying a given invite.","schema":{"type":"string"}},"resource":{"in":"path","name":"resource","schema":{"type":"string"},"required":true,"description":"The hrn that identifies the resource.\n","example":"hrn:here:data::myrealm:my-catalog"},"linkableToHrn":{"in":"path","name":"linkableToHrn","schema":{"type":"string"},"required":true,"description":"The HRN of the project that the resource is made linkable to or\nthe HRN of the realm that the resource is made linkable to.\nThis property can be used for cross-realm sharing only if cross-realm trust is established.\nIf there is no cross-realm trust established, the linkableToHrn value must be either a project in the same realm as the resource's home project,\nor must be the resource's home project's realm.\n","example":"hrn:here:authorization::myrealm:project/Project-00000"},"project":{"in":"path","name":"project","required":true,"description":"HRN identifying the project","schema":{"type":"string"},"example":"hrn:here:authorization::myrealm:project/my-project-0000"},"projectMember":{"in":"path","name":"member","required":true,"description":"HRN identifying the project member. Either user, app or group","schema":{"type":"string"},"example":"hrn:here:account::myrealm:user/HERE-00000000-0000-0000-0000-000000000000"},"Type":{"in":"query","name":"type","required":false,"description":"The type of the resource.","schema":{"$ref":"#/components/schemas/Type"}},"ProjectResourceType":{"in":"query","name":"type","required":false,"description":"The type of the resource. Required for resource=home. For adding resources of multiple types, use the type property in the request body instead.","schema":{"$ref":"#/components/schemas/Type"}},"resourcePolicy":{"in":"path","name":"resourcePolicy","required":true,"description":"The HRN of the resource policy","schema":{"type":"string"},"example":"hrn:here:authorization::myrealm:resourcePolicy/my-policy-0000"},"resourceQuery":{"in":"query","name":"resource","schema":{"type":"string"},"required":false,"description":"The hrn that identifies the resource.\n","example":"hrn:here:data::myrealm:my-catalog"},"ResourceType":{"in":"query","name":"type","required":true,"description":"The type of the resource.","schema":{"$ref":"#/components/schemas/Type"}},"ResourceTypePath":{"in":"path","name":"resourceType","required":true,"description":"The type of the resource.","schema":{"$ref":"#/components/schemas/Type"}},"Relation":{"in":"query","name":"relation","required":false,"description":"The relation of the resource. A resource is only returned in the response if it matches the requested relation.","schema":{"$ref":"#/components/schemas/Relation"}},"ResourceRelation":{"in":"query","name":"relation","required":true,"description":"The relation of the resource. Must be home or reference(link)","schema":{"$ref":"#/components/schemas/ResourceRelation"}},"RelationResourceReference":{"in":"query","name":"relation","required":true,"description":"The relation of the resource. Must be reference(link)","schema":{"$ref":"#/components/schemas/RelationResourceReference"}},"Referenceable":{"in":"query","name":"referenceable","required":false,"description":"Get all referenceable(linkable) resources available to the caller to attach as a reference(link) to projects. Only supported value is true.\nNote - Can be used as a synonym for linkable\n\nA resource is referenceable(linkable) if it is marked as referenceable:\n  - and the caller has permission to all reference enabled actions against the resource or,\n  - in case of a project scoped token, the caller has effective membership on the projects to attach resources\n    as a reference(link) to the Project.\n","schema":{"type":"boolean"}},"Linkable":{"in":"query","name":"linkable","required":false,"description":"Get all linkable resources available to the caller to attach as a link to project. Only supported value is true.\nNote - Can be used as a synonym for referenceable\n","schema":{"type":"boolean"}},"Access":{"in":"query","name":"access","required":false,"description":"Filter the resources accessible to the caller based on the access types.\nThe default value is 'default'. Not applicable to use along with the query parameter 'referenceable=true' or 'linkable=true'\n\n- If 'default' includes resources where:\n  - The user has access to the resource's home project OR\n  - The user has access to a project that the resource is linked to as a reference OR\n  - The type is raiEnabled and the resource is not in any project and the user has 'read' access to it OR\n  - The type is raiEnabled and the resource is not in any project and the user has 'write' access to it OR\n  - The type is raiEnabled and the resource is not in any project and the user has 'manage' access to it.\n- If 'manage' includes resources where:\n  - The user has access to the resource's home project OR\n  - The type is raiEnabled and the resource is not in any project and the user has 'manage' access to it.\n- If 'readOutsideProject' includes resources where:\n  - The type is raiEnabled and the resource is not in any project and the user has 'read' access to it.\n\nraiEnabled types = [catalog, service, schema, artifact]\n","schema":{"type":"string","enum":["default","manage"]}},"ReferenceableSingle":{"in":"query","name":"referenceable","required":true,"description":"Get the resource only if it is available to the caller to attach as a reference to projects.  A resource is referenceable if it is marked as referenceable and the caller has permission to all reference enabled actions against the resource.  Otherwise 404.  Only supported value is true.","schema":{"type":"boolean"}},"limit":{"in":"query","name":"limit","required":false,"description":"Number of records to return. Default is 100 records. Maximum is 100 records.","schema":{"type":"integer","minimum":0,"maximum":100,"default":100}},"limit10":{"in":"query","name":"limit","required":false,"description":"Number of records to return. Default is 10 records. Maximum is 100 records.","schema":{"type":"integer","minimum":0,"maximum":100,"default":10}},"XCorrelationId":{"in":"header","name":"X-Correlation-ID","schema":{"type":"string"},"required":false,"description":"Correlates HTTP requests between a client and server. If not present in the incoming request, it will be generated.\n"},"XRequestId":{"in":"header","name":"X-Request-ID","schema":{"type":"string"},"required":false,"description":"The unique for the request, used to track this request within the service.  X-Request-ID value is NOT propagated to the downstream services.\n"},"canManage":{"in":"query","name":"canManage","required":false,"description":"if true returns all projects of which the caller(user/app) is a project admin.","schema":{"type":"boolean"}},"isMember":{"in":"query","name":"isMember","required":false,"description":"if true returns all projects of which the caller(user/app) is a member.","schema":{"type":"boolean"}},"onlyIncludeIdentities":{"in":"query","name":"onlyIncludeIdentities","required":false,"description":"If true, returns an effective project members list containing only user and app identities, including those\nthat are members of the project indirectly via a group. It will also return users who are project admins of\nthe specified project, and Resource Managers for the realm. Response will NOT include total number of\nidentities. If false, returns users, apps, and groups that are direct members of the project, excluding any\nusers and apps that only have membership via a group.\nDefaults to false.\n\nSuppose there are a user U and a group G with app A in it.  Suppose user U and group G are the members of the project, then\n* onlyIncludeIdentities=true will return U and A\n* onlyIncludeIdentities=false or absent will return U and G\n","schema":{"type":"boolean"}},"includeNonMemberProjects":{"in":"query","name":"includeNonMemberProjects","required":false,"description":"If true, the list of Projects is **not** filtered out based on the membership of the caller. Defaults to false.","schema":{"type":"boolean"}},"includeCrossRealmProjects":{"in":"query","name":"includeCrossRealmProjects","required":false,"description":"If true, the list of Projects will include projects that resource is linked too across realms, if a valid cross-realm trust is established. Defaults to false.","schema":{"type":"boolean"}},"projectPolicy":{"in":"path","name":"policy","required":true,"description":"HRN identifying the project policy. For HERE provided policies, the HRN format would be - hrn:here:authorization::HERE:platform:policy/read-only-access-to-all-catalogs\n","schema":{"type":"string"},"example":"hrn:here:authorization::myrealm:project/my-project-0000:policy/all-access-catalog-1"},"ProjectPolicyType":{"in":"query","name":"projectPolicyType","required":false,"description":"The type of the Project Policy","schema":{"type":"string","enum":["custom","here-platform"]}},"statusId":{"in":"path","name":"statusId","required":true,"description":"The status id of the resource policy resources batch request\n","schema":{"type":"string"},"example":"STATUS-5161feb8-5bc4-4e1c-a023-f343d6e5c94f"},"actionType":{"in":"query","name":"type","required":true,"description":"The type of action for the resource type.\n\n- projectEnabled : Actions that are enabled for Project access\n- projectLinkingEnabled : Actions that are allowed to be linked\n- projectReferenceEnabled : Actions that are allowed for Project references\n- requiredToMakeLinkable : Actions that are required when an identity is making a resource linkable to a realm or other projects\n- sharingEnabled : Actions that are allowed to be shared\n- projectResourceCreationEnabled : Actions that are marked as resource creation actions for Projects\n","schema":{"type":"string","enum":["projectEnabled","projectLinkingEnabled","projectReferenceEnabled","requiredToMakeLinkable","sharingEnabled","projectResourceCreationEnabled"]}},"sourceProjectOrRealm":{"in":"path","name":"sourceProjectOrRealm","required":true,"description":"HRN identifying the source realm or project","schema":{"type":"string"},"example