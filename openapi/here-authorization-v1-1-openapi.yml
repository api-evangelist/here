trol:\n  * The calling principal must have permission to take all the **\"requiredToMakeLinkable\"** actions against\n    the service inferred via the reserved resource prefix of the resource in the path in the scope of the\n    home project of the resource.\n  * This API works only with tokens that are scoped to the home project of the resource.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DetailedLinkableResource"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"put":{"tags":["Resource Info and Management"],"summary":"Update the linkability of a resource","operationId":"updateResourceLinkability","description":"Update the linkability of this resource against the requested project or realm.\n\n</br>Access Control:\n  * The calling principal must have permission to take all the **\"requiredToMakeLinkable\"** actions against\n    the service inferred via the reserved resource prefix of the resource in the path in the scope of the\n    home project of the resource.\n  * This API works only with tokens that are scoped to the home project of the resource.\n  * This API does not support the resources of type **\"pipeline\"**.\n","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LinkableResource"}}}},"security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DetailedLinkableResource"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"delete":{"tags":["Resource Info and Management"],"summary":"Remove the linkability of a resource","operationId":"removeResourceLinkability","description":"Remove the linkability of this resource against the requested project or realm.\n**Note:** This action does not have any impact on pre-existing links.\n\n</br>Access Control:\n  * The calling principal must have permission to take all the **\"requiredToMakeLinkable\"** actions against\n    the service inferred via the reserved resource prefix of the resource in the path in the scope of the\n    home project of the resource.\n  * This API works only with tokens that are scoped to the home project of the resource.\n","security":[{"Bearer":[]}],"responses":{"204":{"$ref":"#/components/responses/NoContent"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/resourcePolicies":{"parameters":[{"$ref":"#/components/parameters/XCorrelationId"}],"post":{"tags":["Resource Policies"],"summary":"Create a resource policy","operationId":"createResourcePolicy","description":"Create a resource policy. A resource policy packages resources that are to be made linkable to realms.\nA resource policy can be homed to a project or created outside of the context of a project. Once a resource\nhome is created for the resource policy, all access to the resource policy would need to be in the context of\nthe project scope.\n\nFor an unscoped resource policy, the creator is granted \"manageResourcePolicy\", \"addGrant:manageResourcePolicy\"\naccess on the resource policy HRN. For a resource policy scoped to a project all members of the home project\nget the \"projectEnabled\" action \"manageResourcePolicy\" access on the resource policy.\n\n</br>Access Control:\n  * The calling principal must have **\"createResourcePolicy\"** action permission in the **\"authorization\"** service.\n  * The unscoped access to this api is granted via the default authorization policy.\n  * The scoped access to this api is granted via the default \"projectEnabled\" action for members of the project.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicyRequest"}}}},"responses":{"201":{"description":"Created","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicy"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"get":{"tags":["Resource Policies"],"summary":"Get a list of Resource Policies","operationId":"getResourcePolicies","description":"Get a list of Resource Policies.\nIf an unscoped access token is used, all resource policies(unscoped and scoped) within the realm of the caller are returned.\nIf a project scoped access token is used, resource policies within the project are returned.\n\n</br>Access Control:\n  * The calling principal must have **\"readResourcePolicies\"** action permission in the **\"authorization\"** service.\n  * The unscoped access to this api is granted via the default authorization policy.\n  * The scoped access to this api is granted via the default \"projectEnabled\" action for members of the project.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"parameters":[{"$ref":"#/components/parameters/resourceQuery"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/pageToken"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicyList"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/resourcePolicies/{resourcePolicy}":{"parameters":[{"$ref":"#/components/parameters/XCorrelationId"},{"$ref":"#/components/parameters/resourcePolicy"}],"get":{"tags":["Resource Policies"],"summary":"Get a resource policy","operationId":"getResourcePolicy","description":"Get details of a Resource Policy.\n\n</br>Access Control:\n  * The calling principal must have **\"readResourcePolicies\"** action permission in the **\"authorization\"** service.\n  * The unscoped access to this api is granted via the default authorization policy.\n  * The scoped access to this api is granted via the default \"projectEnabled\" action for members of the project.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicy"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"delete":{"tags":["Resource Policies"],"summary":"Delete a resource policy","operationId":"deleteResourcePolicy","description":"Delete a resource policy.\n\n</br>Access Control:\n  * The calling principal must have **\"manageResourcePolicy\"** action permission for the resource **\"{resourcePolicy}\"** in the **\"authorization\"** service.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"responses":{"204":{"description":"No Content","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"patch":{"tags":["Resource Policies"],"summary":"Update a resource policy","operationId":"updateResourcePolicy","description":"Update a resource policy.\n\n</br>Access Control:\n  * The calling principal must have **\"manageResourcePolicy\"** action permission for the resource **\"{resourcePolicy}\"** in the **\"authorization\"** service.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicyPatchRequest"}}}},"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicy"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/resourcePolicies/{resourcePolicy}/resources":{"parameters":[{"$ref":"#/components/parameters/XCorrelationId"},{"$ref":"#/components/parameters/resourcePolicy"}],"post":{"tags":["Resource Policies"],"summary":"Add resources to a resource policy","operationId":"addResourcesToResourcePolicy","description":"Add the specified list of resources to the Resource Policy with allowedActions in a batch.\nA maximum of 100 resources may be contained in a single Resource Policy. If a batch would push the\nResourcePolicy over-limit, the entire batch fails with an error code indicating available capacity.\nNote: The allowed actions list must match the Resource's resource setting allowed actions available\nfor resource policy. By default all \"projectLinkingEnabled\" are allowed to be added for a resource\nin a resource policy.\nAdding a resource to a resource policy enables the ability of the resource to be made linkable to other realms.\nThis batch API response returns a status that can be polled to get information about the batch request.\n\n</br>Access Control:\n  * The calling principal must have **\"manageResourcePolicy\"** action permission for the resource **\"{resourcePolicy}\"** in the **\"authorization\"** service.\n    **AND**\n  * According to the resource setting, The calling principal **must either** have permission to take all the \"requiredToMakeLinkable\" actions against\n    the service inferred via the reserved resource prefix of the resource in the path in the scope of the\n    home project of the resource **or** the Resource's resource setting is configured to allow anyone within the\n    home realm of the resource to create a resource policy.\n  * When the access token is project scoped, all the resources added to a resource policy must either be homed or\n    referenced in the project.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicyResourcesPayload"}}}},"responses":{"202":{"description":"Accepted","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicyResourcesResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"get":{"tags":["Resource Policies"],"summary":"Get all resources in a resource policy","operationId":"getAllResourcesInResourcePolicy","description":"Get a list of resources in a Resource Policy.\n\n</br>Access Control:\n  * The calling principal must have **\"readResourcePolicies\"** action permission in the **\"authorization\"** service.\n  * The unscoped access to this api is granted via the default authorization policy.\n  * The scoped access to this api is granted via the default \"projectEnabled\" action for members of the project.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"parameters":[{"$ref":"#/components/parameters/Type"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/pageToken"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicyResourceList"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/resourcePolicies/{resourcePolicy}/resources/status/{statusId}":{"get":{"tags":["Resource Policies"],"summary":"Get the status of resource policy resources batch addition","operationId":"getResourcePolicyResourcesStatus","parameters":[{"$ref":"#/components/parameters/XCorrelationId"},{"$ref":"#/components/parameters/resourcePolicy"},{"$ref":"#/components/parameters/statusId"}],"description":"Get the status of resource policy resources batch addition.\n\n</br>Access Control:\n  * The calling principal must have **\"manageResourcePolicy\"** action permission for the resource **\"{resourcePolicy}\"** in the **\"authorization\"** service.\n  * The unscoped access to this api is granted via the default authorization policy.\n  * The scoped access to this api is granted via the default \"projectEnabled\" action for members of the project.\n  * This API works for tokens with or without a project scope.\n","security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourcePolicyResourcePartialSuccessList"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/resourcePolicies/{resourcePolicy}/resources/{resource}":{"parameters":[{"$ref":"#/components/parameters/XCorrelationId"},{"$ref":"#/components/parameters/resourcePolicy"},{"$ref":"#/components/parameters/resource"}],"put":{"tags":["Resource Policies"],"summary":"Add a resource to a re