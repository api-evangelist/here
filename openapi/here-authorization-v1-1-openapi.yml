":["OrgAdmin","GroupAdmin"],"state":"enabled","createdTime":1432216394712}}}}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Realm or realm member not found"}}}},"/realms/{realm}/members/{member}/roles":{"parameters":[{"$ref":"#/components/parameters/realm"},{"$ref":"#/components/parameters/member"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"}],"get":{"tags":["Realms"],"summary":"Get entity roles","description":"Retrieve the roles a given entity has been assigned.\n\n</br>Access Control:\n  * The calling principal must have **\"readRoles\"** action permission for the resource **\"{member}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","operationId":"getEntityRoleAssignments","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RolePageWithToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Realm or realm member not found"}}}},"/realms/{realm}/members/{member}/groups":{"parameters":[{"$ref":"#/components/parameters/realm"},{"$ref":"#/components/parameters/member"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/count"}],"get":{"tags":["Realms"],"summary":"Get entity group membership","description":"Retrieve the groups a given entity is a member of.\n\n</br>Access Control:\n  * The calling principal must have **\"readGroups\"** action permission for the resource **\"{member}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","operationId":"getEntityGroupMembership","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GroupPageWToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Realm or realm member not found"}}}},"/realms/{realm}/members/{member}/managedGroups":{"parameters":[{"$ref":"#/components/parameters/realm"},{"$ref":"#/components/parameters/member"},{"$ref":"#/components/parameters/count"},{"$ref":"#/components/parameters/pageToken"}],"get":{"tags":["Realms"],"summary":"Get entity managed group","description":"Retrieve the list of groups over which the provided entity has been\ngranted the role of GroupAdmin.\n\n</br>Access Control:\n  * The calling principal must have **\"readGroups\"** action permission for the resource **\"{member}\"** in the **\"authorization\"** service.\n  * The calling principal MUST NOT include a project scope.\n","operationId":"getEntityManagedGroups","responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GroupPageWToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"description":"Realm or realm member not found"}}}},"/realms/{realm}/members/{member}/projects":{"parameters":[{"$ref":"#/components/parameters/realm"},{"$ref":"#/components/parameters/member"},{"$ref":"#/components/parameters/pageToken"},{"$ref":"#/components/parameters/limit"}],"get":{"tags":["Realms"],"summary":"Get entity project membership","description":"Retrieve the projects a given entity is a member of.\n\n</br>Access Control:\n  * The calling principal must have **\"manage\"** action permission for the resource **\"{member}\"** in the **\"authorization\"** service.\n","operationId":"getEntityProjectMembership","responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ProjectListWithPageToken"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFo