n, all linkable resources are available in both scoped and unscoped access.\n* **strict** - All permissions specified in Plans attached to this realm with the relevant externalIds are\n  ONLY available via this filter with unscoped access.  All resources specified in ResourcePlans attached\n  to this realm with the relevant externalIds are ONLY available via this filter with scoped access.\n","example":"open"},"priority":{"type":"integer","description":"Only included in virtual Access Filters.  The priority assigned to each filter statement in this virtual\nAccess Filter.\n","minimum":0,"maximum":1000,"example":100}}},"AccessFilterStatements":{"type":"object","properties":{"statements":{"type":"array","items":{"$ref":"#/components/schemas/AccessFilterStatement"},"description":"List of statements in this filter."}}},"AccessFilterStatement":{"type":"object","properties":{"description":{"type":"string","description":"Prose description of what this filter statement does.","example":"Block evaluation of all unscoped permissions for any project scoped request."},"permissions":{"type":"string","enum":["unscoped","scoped","linkable"],"description":"The type of permissions that apply to this filter statement.\n* **unscoped** - Applies to all access control via the \"unscoped\" path.  This includes Plans, Policies,\n  Permissions, Groups, and Roles\n* **scoped** - Applies to all access control via the \"scoped\" path.  This includes resources associated\n  with projects and other __projectEnabled__ actions\n* **linkable** - Applies to all access control via the \"linkable\" path.  This includes resources made\n  available to be linked to a project via a directly created __linkable__ resource or a __resourcePlan__\n  attached to the realm\n","example":"unscoped"},"subresources":{"type":"array","items":{"type":"string","maxLength":24},"example":["usa-il-chicago","deu"],"description":"In the case of **scoped** or **linkable** filter statements, the list of subresources that MAY 