en the resource plan attachment expires.\n"}}},"AttachedResourcePolicyPageWithToken":{"allOf":[{"$ref":"#/components/schemas/PageWithToken"},{"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/AttachedResourcePolicy"}}}}]},"AttachedResourcePolicy":{"type":"object","properties":{"hrn":{"type":"string","description":"The hrn of the policy\n","example":"hrn:here:authorization::myrealm:resourcePolicy/my-policy-0000"}}},"ServiceInformationWithPageToken":{"type":"object","allOf":[{"$ref":"#/components/schemas/PageWithToken"},{"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ServiceInformation"},"description":"Service information list."}}}]},"ServiceInformation":{"type":"object","properties":{"serviceId":{"type":"string","example":"SERVICE-00000000-0000-0000-0000-000000000000","description":"The service descriptor id"},"serviceIdAlias":{"type":"string","example":"foo","description":"The alias for the service id"},"allowedActions":{"type":"array","description":"List of allowed actions","items":{"type":"object","properties":{"action":{"type":"string","example":"readResource","description":"The action string"},"resourceRequired":{"type":"boolean","description":"Defines if the action requires use with a resource","example":false}}}},"resourceTypes":{"type":"array","description":"List of resource types","items":{"type":"string","example":"footype","description":"The resource type owned by the service. eg catalog, pipeline, pipeline-template"}}}},"ResourceTypesWithPageToken":{"type":"object","allOf":[{"$ref":"#/components/schemas/PageWithToken"},{"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ResourceTypeInfo"},"description":"List of resource types."}}}]},"ResourceTypeInfo":{"type":"object","properties":{"resourceType":{"type":"string","example":"footype","description":"The resource type owned by the service. eg catalog, pipeline, pipeline-template"},"serviceIdAlias":{"type":"string","example":"foo","description":"The alias for the service id"},"serviceId":{"type":"string","example":"SERVICE-00000000-0000-0000-0000-000000000000","description":"The service descriptor id"}}},"AccessFilterPageWithToken":{"allOf":[{"$ref":"#/components/schemas/PageWithToken"},{"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/AccessFilter"}}}}]},"AccessFilterAttachmentPageWithToken":{"allOf":[{"$ref":"#/components/schemas/PageWithToken"},{"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/AccessFilterAttachment"}}}}]},"AccessFilter":{"type":"object","description":"An Access Filter defines a permission boundary for an access request.  When any access request is made,\nif an Access Filter is applicable to the requesting identity, the request must \"pass\" the filter in order for\nit to continue with the rest of the access evaluation.\n\n</br>Any Access Filter attached to the requester, the requester's realm, or any of the requester's roles is\nconsidered applicable and consulted for an access request.\n\n</br>For all consulted Access Filters and each category of permissions:\n* Each statement in the Access Filters that match the permissions category and the access request's service,\n  action, resource, and scope is collected and sorted according to priority\n* The statement with the highest priority is matched\n* If there is a matched statement with **evaluate=true**, that category of permissions is evaluated in the\n  access request, otherwise they are skipped\n* If there are multiple matched statements with the same highest priority and they have different values for\n  **evaluate**, **evaluate=true** wins and that category of permissions are evaluated\n* If the access request results in **evaluate=true** and the response is **allow** with subresources, the\n  subresources in the response are filtered according to the matching statements' subresources properties.\n","allOf":[{"$ref":"#/components/schemas/AccessFilterIdentifier"},{"$ref":"#/components/schemas/AccessFilterCommonProperties"},{"$ref":"#/components/schemas/AccessFilterVirtualProperties"},{"$ref":"#/components/schemas/AccessFilterStatements"}]},"AccessFilterCustomRequest":{"allOf":[{"$ref":"#/components/schemas/AccessFilterCommonProperties"},{"$ref":"#/components/schemas/AccessFilterStatements"},{"type":"object","properties":{"type":{"type":"string","enum":["custom"],"description":"Identifies this request as a **custom** Access Filter.  Must be **custom**.\n","example":"custom"}}}]},"AccessFilterVirtualRequest":{"allOf":[{"$ref":"#/components/schemas/AccessFilterCommonProperties"},{"$ref":"#/components/schemas/AccessFilterVirtualProperties"},{"type":"object","properties":{"type":{"type":"string","enum":["virtual"],"description":"Identifies this request as a **virtual** Access Filter.  Must be **virtual**.\n","example":"virtual"}}}]},"AccessFilterRequest":{"oneOf":[{"$ref":"#/components/schemas/AccessFilterCustomRequest"},{"$ref":"#/components/schemas/AccessFilterVirtualRequest"}]},"AccessFilterIdentifier":{"type":"object","properties":{"hrn":{"type":"string","description":"The hrn of the filter","example":"hrn:here:authorization::HERE:filter/FILTER-99b7c7d7-867a-4573-8730-4689be1718c9"}}},"AccessFilterCommonProperties":{"type":"object","properties":{"type":{"type":"string","enum":["here-platform","custom","virtual"],"description":"The type of the Access Filter.\n* **here-platform** - A system defined filter.  Cannot be deleted or modified.\n* **custom** - A user defined filter with user defined statements.\n* **virtual** - A user defined filter with automatically generated statements that are associated with plans\n  and resourcePlans attached to the realm with specific externalIds.\n","example":"here-platform"},"name":{"type":"string","description":"The name of the filter","example":"Strict Projects"}}},"AccessFilterVirtualProperties":{"type":"object","properties":{"externalIds":{"type":"array","items":{"type":"string"},"description":"Only included in virtual Access Filters.  The list of externalIds that this virtual Access Filter is linked\nto.  Plans and ResourcePlans attached to this realm with one of the externalIds in this list are used as\nthe basis of this filter.  The list of Plans and ResourcePlans used may be further filtered **if** the\nplanAttachments or resourcePlanAttachments properties are also defined.  The statements in this filter are\nautomatically generated to allow access to each of the permissions and resources defined in those included\nplans.\n","example":["A-12345","A-67890"]},"planAttachments":{"type":"array","items":{"type":"object","properties":{"externalId":{"type":"string","description":"The externalId of plan attachments to filter.  Must match one of the top level externalIds specified\nfor this virtual Access Filter.\n","example":"A-12345"},"planHrns":{"type":"array","items":{"type":"string"},"description":"The list of planHrns that may be used as the basis of this virtual Access Filter's statements for\nany plans that are attached to this realm with the given externalId.\n","example":["hrn:here:authorization::HERE:plan/PLAN-7316c7e6-9e05-4086-aef3-cd7240e3c92b","hrn:here:authorization::HERE:plan/PLAN-457c91d8-f67e-49e6-b629-e72c2f5b1036"]}}},"description":"Only included in virtual Access Filters.  The list of planAttachments that this virtual Access Filter is\nlinked to.  If this field is included, for the externalId of each list entry, **only** Plans that are\nattached to this realm with the defined externalId **and** one of the defined planHrns will be used as the\nbasis of statements in this filter.  Any Plans attached to this realm with the given externalId that are\n**not** in the list of defined planHrns will be excluded from the basis of this filter.  If this field is\nomitted, or there is no entry for any one of the externalIds defined for this virtual Access Filter,\n**