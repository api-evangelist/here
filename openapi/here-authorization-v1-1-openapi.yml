ple":1}}},"AccessFilterAttachment":{"type":"object","allOf":[{"$ref":"#/components/schemas/AccessFilterIdentifier"}],"properties":{"expiresAt":{"type":"string","example":"2030-05-26T19:30:00Z","format":"date-time","description":"The UTC time when the access filter attachment expires.\n"}}},"ActionPolicy":{"type":"object","properties":{"hrn":{"type":"string","example":"hrn:here:authorization::HERE:actionpolicy/ACTIONPOLICY-0000"}}},"ResourcePlanPolicyList":{"allOf":[{"$ref":"#/components/schemas/PageWithToken"},{"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ActionPolicy"},"description":"List of Service Action Policies."}}}]},"ActionPolicyPermissionList":{"allOf":[{"$ref":"#/components/schemas/PageWithToken"},{"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ActivePermissionNoResource"},"description":"List of Service Action Policy Permissions."}}}]}},"responses":{"Unauthorized":{"description":"Access is denied due to invalid credentials","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}},"Forbidden":{"description":"You do not have permission to perform this action","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}},"NotFound":{"description":"The requested resource was not found, see error response for details","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}},"BadRequest":{"description":"Invalid input provided, see error response for details","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}},"BadRequestForDeleteProjectResou