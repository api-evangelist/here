          format: int32
          example: 7
          description: "Sky descriptor value.\nIf the element is in the response and it contains a value, there is an Integer in the String. If the element is in the response and it does not contain a value, there is an asterisk (*) in the String.\n\nThe available values are as follows: \n\n    1 - Sunny\n    2 - Clear\n    3 - Mostly Sunny\n    4 - Mostly Clear\n    5 - Hazy Sunshine\n    6 - Haze\n    7 - Passing Clouds\n    8 - More Sun than Clouds\n    9 - Scattered Clouds\n    10 - Partly Cloudy\n    11 - A Mixture of Sun and Clouds\n    12 - High Level Clouds\n    13 - More Clouds than Sun\n    14 - Partly Sunny\n    15 - Broken Clouds\n    16 - Mostly Cloudy\n    17 - Cloudy\n    18 - Overcast\n    19 - Low Clouds\n    20 - Light Fog\n    21 - Fog\n    22 - Dense Fog\n    23 - Ice Fog\n    24 - Sandstorm\n    25 - Duststorm\n    26 - Increasing Cloudiness\n    27 - Decreasing Cloudiness\n    28 - Clearing Skies\n    29 - Breaks of Sun Later\n    30 - Early Fog Followed by Sunny Skies\n    31 - Afternoon Clouds\n    32 - Morning Clouds\n    33 - Smoke\n    34 - Low Level Haze\n"
        skyDesc:
          type: string
          example: Passing clouds
          description: 'Description of sky conditions.

            See the text descriptions associated with the skyInfo element above.

            '
        temperature:
          type: number
          format: double
          example: 24.39
          description: 'Temperature in Celsius/Fahrenheit.


            The value depends on the units parameter value. The default is Celsius.

            '
        temperatureDesc:
          type: string
          example: Mild
          description: "Temperature description.\n\nThe available values are as follows:\n\n    Extremely Cold\n    Frigid\n    Cold\n    Chilly\n    Nippy\n    Cool\n    Refreshing Cool\n    Mild\n    Pleasantly Warm\n    Warm\n    Hot\n    Extremely Hot\n    Breezy\n    Windy\n    Gusty\n    Blustery\n    Very Windy\n    Extremely Windy\n    High Winds\n    Beautiful\n    Very Nice\n    Nice\n    Dreary\n    Smoggy\n    Low Level Pollution\n    Blowing Snow\n    Blowing Spray\n    Dry\n    Comfortable\n    Crisp\n    Raw\n    Damp\n    Humid\n    Muggy\n    Sultry\n    Steamy\n"
        comfort:
          type: string
          example: '24.31'
          description: 'Comfort level in degrees. This value indicates what the temperature feels like, depending on a variety of environmental factors such as wind speed and humidity.


            If the element is in the response and it contains a value, there is a Double in the String. If the element is in the response and it does not contain a value, there is an asterisk (*) in the String.

            '
        highTemperature:
          type: string
          example: '31.40'
          description: 'The Highest temperature for the day in Celsius/Fahrenheit.


            If the element is in the response and it contains a value, there is a Double in the String. If the element is in the response and it does not contain a value, there is an asterisk (*) in the String.


            The value used depends on the units parameter value. The default is Celsius.

            '
        lowTemperature:
          type: string
          example: '24.6'
