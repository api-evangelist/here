openapi: 3.2.0
info:
  title: Here Weather Report API
  version: '1.0'
  description: 'Operations tagged Weather Report across 2 of this provider''s published API definitions: here-destination-weather-v1-openapi.yml, here-destination-weather-v3-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://weather.cc.api.here.com
  description: Production environment URL.
- url: https://weather.hereapi.com/v3
  description: Production environment URL
tags:
- name: Weather Report
  description: Destination weather report.
paths:
  /weather/1.0/report:
    get:
      tags:
      - Weather Report
      summary: Weather report
      description: Retrieves weather reports, weather forecasts, severe weather alerts.
      operationId: Weather API v1 weatherReport
      parameters:
      - $ref: '#/components/parameters/X-Request-Id'
      - name: app_id
        in: query
        description: Client application Id (for authentication)).
        schema:
          type: string
      - name: app_code
        in: query
        description: Client application Code (for authentication)).
        schema:
          type: string
      - name: product
        in: query
        description: A parameter identifying the type of report to obtain.
        required: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WeatherProduct'
      - name: name
        in: query
        description: Name of a city. If there is more than one match for the name, then the most populous location is in the response. Country, state and street name can be added to this parameter. Latitude and longitude, name or zipcode must be present.
        schema:
          type: string
      - name: zipCode
        in: query
        description: ZIP code of the location. This parameter is supported only for locations in the United States of America. Latitude and longitude, name or zipcode must be present.
        schema:
          type: string
      - name: latitude
        in: query
        description: Geographical coordinates in WGS-84-compliant format, specifying the area covered by the weather report. Latitude and longitude, name or zipcode must be present.
        schema:
          type: number
          format: double
      - name: longitude
        in: query
        description: Geographical coordinates in WGS-84-compliant format, specifying the area covered by the weather report. Latitude and longitude, name or zipcode must be present.
        schema:
          type: number
          format: double
      - name: metric
        in: query
        description: Boolean, defines whether metric or imperial units are used in the response. If set to false, the response contains imperial units (feet, inch, Fahrenheit, miles). The default is `true`.
        required: false
        schema:
          type: boolean
          default: true
      - name: oneobservation
        in: query
        description: Boolean, if set to true, the response only includes the closest location. Only available when the product parameter is set to observation. The default is `false`.
        required: false
        schema:
          type: boolean
          default: false
      - name: hourlydate
        in: query
        description: Date for which hourly forecasts are to be retrieved. The format is YYYY-MM-DD or YYYY-MM-DDThh:mm:ss.
        required: false
        schema:
          type: string
          format: date-time
      - name: language
        in: query
        description: "Defines the language used in the descriptions in the response. For example, the response for a query with language=de has descriptions in German. The default is `en-US`.\nList of supported languages:\n\n|Language|Code|\n|---|---|\n|afrikaans|af-ZA|\n|albanian|sq|\n|amharic|am-ET|\n|arabic|ar|\n|armenian|hy|\n|assamese|as-IN|\n|azerbaijani|az-AZ|\n|basque|eu|\n|belarusian|be|\n|bengali-bd|bn-BD|\n|bengali|bn|\n|bosnian|bs-BA|\n|bulgarian|bg-BG|\n|catalan|ca|\n|chinese_prc|zh-CN|\n|chinese_hk|zh-HK|\n|chinese_tw|zh-TW|\n|croatian|hr-HR|\n|czech|cs-CZ|\n|danish|da-DK|\n|dutch|nl-NL|\n|english|en|\n|english_us|en-US|\n|estonian|et-EE|\n|finnish|fi-FI|\n|french_ca|fr-CA|\n|french|fr|\n|galician|gl|\n|georgian|ka-GE|\n|german|de|\n|greek|el-GR|\n|gujarati|gu-IN|\n|hausa|ha|\n|hebrew|he-IL|\n|hindi|hi-IN|\n|hungarian|hu-HU|\n|icelandic|is-IS|\n|igbo|ig-NG|\n|indonesian|id-ID|\n|italian|it|\n|japanese|ja-JP|\n|kannada|kn-IN|\n|kashmiri|ks-IN|\n|kazakh|kk-KZ|\n|khmer|km-KH|\n|kirghiz|ky-KG|\n|korean|ko-KR|\n|lao|lo-LA|\n|latvian|lv-LV|\n|lingala|ln|\n|lithuanian|lt-LT|\n|macedonian|mk-MK|\n|malagasy|mg-MG|\n|malay|ms-MY|\n|malayalam|ml-IN|\n|marathi|mr-IN|\n|mongolian|mn-MN|\n|norwegian|no-NO|\n|oriya|or-IN|\n|persian-af|fa-AF|\n|farsi|fa|\n|polish|pl-PL|\n|portuguese_br|pt-BR|\n|portuguese|pt-PT|\n|punjabi|pa|\n|pushto|ps|\n|romanian|ro-RO|\n|russian|ru-RU|\n|serbian|sr-YU|\n|sesotho|st|\n|sinhala|si-LK|\n|slovak|sk-SK|\n|slovene|sl-SI|\n|spanish|es-ES|\n|spanish_am|es-US|\n|swahili|sw|\n|swedish|sv|\n|tagalog|tl-PH|\n|tamil|ta|\n|telugu|\"te-IN\t\"|\n|thai|th-TH|\n|tajik|tg-TJ|\n|turkish|tr-TR|\n|turkmen|tk|\n|turkmen_latin|tk|\n|ukrainian|uk-UA|\n|urdu|ur|\n|uzbek|uz-UZ|\n|vietnamese|vi-VN|\n|xhosa|xh|\n|yoruba|yo|\n|zulu|zu|\n"
        required: false
        schema:
          type: string
          default: en-US
      - name: politicalView
        in: query
        description: Specify the political view. Available territories will be seen through the point of view of this country. If this parameter is not specified the neutral international view is made available, where territories may have unresolved claims. This parameter accepts single ISO 3166-1 alpha-3 country code. The country codes are to be provided in all uppercase. Currently the only supported political view is `CHN`. Any political view that is unsupported, falls back to the default view. For example, politicalView=USA or politicalView=FRA does not impact a response in any way.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherReport'
            application/xml:
              schema:
                $ref: '#/components/schemas/WeatherReport'
        '400':
          $ref: '#/components/responses/Error400ReportResponse'
        '401':
          $ref: '#/components/responses/Error401Response'
        '403':
          $ref: '#/components/responses/Error403Response'
        '429':
          $ref: '#/components/responses/Error429Response'
        '500':
          $ref: '#/components/responses/Error500Response'
        '502':
          $ref: '#/components/responses/Error502Response'
        '503':
          $ref: '#/components/responses/Error503Response'
        '504':
          $ref: '#/components/responses/Error504Response'
      security:
      - Bearer: []
    servers:
    - url: https://weather.cc.api.here.com
      description: Production environment URL.
  /report:
    get:
      tags:
      - Weather Report
      summary: Weather report
      description: Retrieves weather reports, weather forecasts, severe weather alerts.
      operationId: Weather API v3 weatherReport
      parameters:
      - $ref: '#/components/parameters/X-Request-Id'
      - name: products
        in: query
        description: A parameter identifying the type of report to obtain. Comma separated values.
        required: true
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/WeatherProduct_2'
      - name: q
        in: query
        description: 'Enter a free-text query.

          Examples:

          "125, Berliner, berlin",

          "Beacon, Boston"'
        required: false
        schema:
          type: string
      - name: zipCode
        in: query
        description: ZIP code of the location. This parameter is supported only for locations in the United States of America. Latitude and longitude, name, or zipcode must be present.
        required: false
        schema:
          type: string
      - name: location
        in: query
        description: 'Geographical location in WGS-84-compliant format.

          Specifying the area covered by the weather report.

          Format: `{lat},{lng}`

          '
        required: false
        schema:
          $ref: '#/components/schemas/LocationString'
      - name: units
        description: Units of measurement used. The default is `metric`.
        in: query
        schema:
          type: string
          default: metric
          enum:
          - metric
          - imperial
      - name: oneObservation
        in: query
        description: Boolean, if set to true, the response only includes the closest location. Only available when the product parameter is set to observation. The default is `false`.
        required: false
        schema:
          type: boolean
          default: false
      - name: hourlyDate
        in: query
        description: Date for which hourly forecasts are to be retrieved. The format is YYYY-MM-DD or YYYY-MM-DDThh:mm:ss.
        required: false
        schema:
          $ref: '#/components/schemas/DateOrTime'
      - name: lang
        in: query
        description: Defines the language used in the descriptions in the response. For example, the response for a query with lang=de-DE has descriptions in German. The default is `en-US`.
        required: false
        schema:
          type: string
          default: en-US
      - name: politicalView
        in: query
        description: Specify the political view. Available territories are seen through the point of view of this country. If this parameter is not specified, the neutral international view is made available, where territories may have unresolved claims. This parameter accepts single ISO 3166-1 alpha-3 country code. The country codes are to be provided in all uppercase. Currently the only supported political view is `CHN`. Any political view that is unsupported falls back to the default view. For example, politicalView=USA or politicalView=FRA does not impact a response in any way.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherReport_2'
              examples:
                observation:
                  $ref: '#/components/examples/WeatherReportObservationExample'
                forecastDailyDetailed:
                  $ref: '#/components/examples/WeatherReportForecastExample'
                forecastDailySimple:
                  $ref: '#/components/examples/WeatherReportForecastSimpleExample'
                forecastHourly:
                  $ref: '#/components/examples/WeatherReportForecastHourlyExample'
                forecastAstronomy:
                  $ref: '#/components/examples/WeatherReportForecastAstronomyExample'
                forecastedAlerts:
                  $ref: '#/components/examples/WeatherReportForecastedAlerstExample'
                nwsAlerts:
                  $ref: '#/components/examples/WeatherReportNWSAlerstExample'
        '400':
          $ref: '#/components/responses/Error400ReportResponse_2'
        '401':
          $ref: '#/components/responses/Error401Response'
        '403':
          $ref: '#/components/responses/Error403Response'
        '429':
          $ref: '#/components/responses/Error429Response_2'
        '500':
          $ref: '#/components/responses/Error500Response_2'
        '502':
          $ref: '#/components/responses/Error502Response_2'
        '503':
          $ref: '#/components/responses/Error503Response_2'
        '504':
          $ref: '#/components/responses/Error504Response_2'
      security:
      - Bearer: []
      - ApiKey: []
    servers:
    - url: https://weather.hereapi.com/v3
      description: Production environment URL
