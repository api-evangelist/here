    AstronomyItem:
      type: object
      properties:
        sunRise:
          type: string
          format: partialTime
          example: 06:37:00
          description: Time when the sun rises.
        sunSet:
          type: string
          format: partialTime
          example: '18:48:00'
          description: Time when the sun sets.
        moonRise:
          type: string
          format: partialTime
          example: 02:57:00
          description: Time when the mmoon rises.
        moonSet:
          type: string
          format: partialTime
          example: '17:47:00'
          description: Time when the moon sets.
        moonPhase:
          type: number
          format: double
          minimum: -1
          maximum: 1
          example: -0.15
          description: 'The moon phase expressed as floating point number between -1 and 1.


            The following logic should be used for displaying moonphase information:


            |Moon phase value|Description|

            |---|---|

            |-0.1 <= moonphase <= 0.1|New moon.|

            |0.1 < moonphase < 0.4|Waxing crescent.|

            |0.4 <= moonphase <= 0.6|First Quarter.|

            |0.6 < moonphase < 0.9|Waxing gibbous.|

            |0.9 <= moonphase or moonphase <= -0.9|Full moon.|

            |-0.9 < moonphase < -0.6|Waning gibbous.|

            |-0.6 <= moonphase <= -0.4|Last Quarter.|

            |-0.4 < moonphase < -0.1|Waning crescent.|

            '
        moonPhaseDescription:
          type: string
          example: Waning crescent
          description: Description of the phase of the moon.
        moonIconName:
          type: string
          example: cw_waning_crescent
          description: Name of the icon for moon phase from the reporting service.
        time:
          type: string
          format: date-time
          example: '2020-08-28T00:00:00.000-05:00'
          description: 'Date and time the forecast was issued. The format is either YYYY-MM-DDThh:mm:ss.SSS + the timezone offset, unless the forecast is for a location in the UTC zone, in which the date and time is terminated by a Z.


            Note: If daylight saving time is in effect for a specified location, times will be adjusted for daylight savings time.

            '
    Address:
      type: object
      properties:
