  schemas:
    AuthError:
      description: Error object reported in case of authentication or authorization errors.
      type: object
      properties:
        error:
          type: string
          description: Error message.
        error_description:
          type: string
          description: Detailed information about the error.
      example:
        Type: Unauthorized
        Message: ApiKey invalid. ApiKey not found.
    NWSAlertsType:
      type: object
      properties:
        warning:
          type: array
          items:
            $ref: '#/components/schemas/NWSAlertItems'
          description: 'Warning issued for location.


            These alerts require immediate notification and are extremely time sensitive. Severe weather warnings are sorted by county ID and should generally only be sent to locations within that particular county. Customer may wish to include warnings from counties within a certain distance threshold such as 25 or 50 kilometers.

            '
        watch:
          type: array
          items:
            $ref: '#/components/schemas/NWSAlertItems'
          description: 'Watch issued for location.


            Includes watches, advisories, special weather statements, and marine warnings.


            These alerts cover an extended time frame from several minutes to several hours; immediate activation is not always necessary for these alerts although it is highly recommended. Severe Weather Watches are listed by zone and should be sent to all locations within a reasonable distance of the respective zone.

            '
    AlertZoneCountyType:
      type: object
      properties:
        value:
          type: string
          example: AZC013
          description: 'Location code (zone code, county code, province code).

            The shape file information for zones, counties and provinces can be found here in National Weather Service GIS - AWIPS Shapefile Database (http://www.nws.noaa.gov/geodata/).

            '
          xml:
            attribute: true
        country:
          type: string
          example: US
          description: 2-letters ISO country code.
          xml:
            attribute: true
        countryName:
          type: string
          example: United States
          description: Full country name.
          xml:
            attribute: true
        state:
          type: string
          example: IL
          description: 2-letters US-state abbreviation.
          xml:
            attribute: true
        stateName:
          type: string
          example: Illinois
          description: Full US-state name.
          xml:
            attribute: true
        name:
          type: string
          example: Maricopa
          description: Location name.
          xml:
            attribute: true
        latitude:
          type: number
          format: double
          example: 41.85003
