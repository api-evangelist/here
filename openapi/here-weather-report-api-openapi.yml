        countryCode:
          type: string
          description: A three-letter country code.
          example: DEU
        countryName:
          type: string
          description: The localised country name.
          example: Deutschland
        state:
          type: string
          description: A code/abbreviation for the state division of a country.
          example: North Rhine-Westphalia
        county:
          type: string
          description: A division of a state; typically, a secondary-level administrative division of a country or equivalent.
          example: Mitte
        city:
          type: string
          description: The name of the primary locality of the place.
          example: Bad Oyenhausen
        district:
          type: string
          description: A division of city; typically an administrative unit within a larger city or a customary name of a city's neighborhood.
          example: Bad Oyenhausen
        subdistrict:
          type: string
          description: A subdivision of a district.
          example: Minden-Lubbecke
        street:
          type: string
          description: Name of street.
          example: Schulstrasse
        postalCode:
          type: string
          description: An alphanumeric string included in a postal address to facilitate mail sorting, such as post code, postcode, or ZIP code.
          example: '32547'
        houseNumber:
          type: string
          description: House number.
          example: '4'
    NWSAlertsType_2:
      type: object
      properties:
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/NWSAlertItems_2'
          description: 'Warnings issued for location.


            These alerts require immediate notification and are extremely time sensitive. Severe weather warnings are sorted by county id and should generally only be sent to locations within that particular county. Customer may wish to include warnings from counties within a certain distance threshold, such as 25 or 50 kilometers.

            '
        watches:
          type: array
          items:
            $ref: '#/components/schemas/NWSAlertItems_2'
          description: 'Watches issued for location.


            Includes watches, advisories, special weather statements, and marine warnings.


            These alerts cover an extended time frame from several minutes to several hours; immediate activation is not always necessary for these alerts, although it is highly recommended. Severe Weather Watches are listed by zone and should be sent to all locations within a reasonable distance of the respective zone.

            '
    ErrorResponse:
