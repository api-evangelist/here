                properties:
                  observation:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeatherItem'
          description: Actual weather conditions.
        forecasts:
          properties:
            forecastLocation:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/LocationMetadata'
                - type: object
                properties:
                  forecast:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeatherItem'
          description: 'Weather seven days detailed forecasts,

            morning, afternoon, evening and night weather forecasts for the next seven days.

            '
        dailyForecasts:
          properties:
            forecastLocation:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/LocationMetadata'
                - type: object
                properties:
                  forecast:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeatherItem'
          description: Daily weather forecasts for the next seven days.
        hourlyForecasts:
          properties:
            forecastLocation:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/LocationMetadata'
                - type: object
                properties:
                  forecast:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeatherItem'
          description: Hourly weather forecasts for the next seven days.
