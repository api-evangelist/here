    NWSAlertItems:
      type: object
      oneOf:
      - $ref: '#/components/schemas/CountyType'
      - $ref: '#/components/schemas/ZoneType'
      - $ref: '#/components/schemas/ProvinceType'
      - properties:
          type:
            type: integer
            format: int32
            example: 5
            description: 'Type of alert.


              |ID|Description|

              |---|---|

              |0|Aviation Weather Warning.|

              |1|Civil Emergency Message [1].|

              |2|Coastal Flood Warning, Watch, or Statement.|

              |3|Flash Flood Watch.|

              |4|Flash Flood Statement.|

              |5|Flash Flood Warning [1].|

              |6|Flood Statement.|

              |7|Flood Warning [1].|

              |8|Urban and Small Stream Flood Advisory [1].|

              |9|Hurricane Local Statement [1].|

              |10|Lakeshore Warning or Statement [1].|

              |11|Marine Weather Statement.|

              |12|Non Precipitation Warning, Watch, or Statement.|

              |13|Public Severe Weather Alert [1].|

              |14|Red Flag Warning.|

              |15|River Ice Statement.|

              |16|River Recreation Statement.|

              |17|River Statement.|

              |18|Snow Avalanche Bulletin.|

              |19|Preliminary Notice of Watch Cancellation - Aviation Message.|

              |20|Special Dispersion Statement.|

              |21|Severe Local Storm Watch or Watch Cancellation.|

              |22|SPC Watch Point Information Message.|

              |23|Severe Local Storm Watch and Areal Outline.|

              |24|Marine Subtropical Storm Advisory.|

              |25|Special Marine Warning [1].|

              |26|Storm Strike Probability Bulletin from the TPC.|

              |27|Special Weather Statement [2].|

              |28|Severe Thunderstorm Warning [1].|

              |29|Severe Weather Statement.|

              |30|Tropical Cyclone Advisory.|

              |31|Tropical Cyclone Advisory for Marine and Aviation Interests.|

              |32|Public Tropical Cyclone Advisory.|

              |33|Tropical Cyclone Update.|

              |34|Tornado Warning [1].|

              |35|Tsunami Watch or Warning [1].|

              |36|Volcanic Activity Advisory.|

              |37|Winter Weather Warning, Watch, or Advisory [1].|

              |38|Air Stagnation Advisory.|


              [1] Watch and Warning Types are highly recommended for immediate activation.


              [2] Watch and Warning description can be more detailed for this type, such as ''Frost advisory in effect''.

              '
          description:
            type: string
            example: Flash Flood Warning
            description: 'Short description of alert.

              '
          severity:
            type: integer
            format: int32
            example: 3
            description: 'The severity of alerts from 1-100 with 1 being the most severe.

              '
          message:
            type: string
            example: FLASH FLOOD WARNING REMAINS IN EFFECT UNTIL 1115 PM MST THIS EVENING FOR MARICOPA COUNTY
            description: 'The warning or watch text is a long string of words describing the warning or watch in detail.

              '
          name:
            type: string
            example: Saint Johns Mission
            description: 'Location name.

              '
          validFromTimeLocal:
            type: string
            format: date-time
            example: '2020-10-11T03:35:00.000-04:00'
            description: 'Date and time at the location the alert was issued by National Weather Service. The format is either YYYY-MM-DDThh:mm:ss.SSS + the timezone offset, unless the forecast is for a location in the UTC zone, in which the date and time is terminated by a Z.

              '
          validUntilTimeLocal:
            type: string
            format: date-time
            example: '2020-10-12T20:00:00.000-04:00'
            description: 'Alert expiration date and time at the location. The format is either YYYY-MM-DDThh:mm:ss.SSS + the timezone offset, unless the forecast is for a location in the UTC zone, in which the date and time is terminated by a Z.

              '
