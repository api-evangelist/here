          temperatureDesc:
            type: string
            example: Mild
            description: "Temperature description.\n\nThe available values are as follows:\n\n    Extremely Cold\n    Frigid\n    Cold\n    Chilly\n    Nippy\n    Cool\n    Refreshing Cool\n    Mild\n    Pleasantly Warm\n    Warm\n    Hot\n    Extremely Hot\n    Breezy\n    Windy\n    Gusty\n    Blustery\n    Very Windy\n    Extremely Windy\n    High Winds\n    Beautiful\n    Very Nice\n    Nice\n    Dreary\n    Smoggy\n    Low Level Pollution\n    Blowing Snow\n    Blowing Spray\n    Dry\n    Comfortable\n    Crisp\n    Raw\n    Damp\n    Humid\n    Muggy\n    Sultry\n    Steamy\n"
          comfort:
