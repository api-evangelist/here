openapi: 3.2.0
info:
  version: 2.6.11
  title: HERE Tracking Shadows API
  description: 'HERE Tracking is a cloud product designed to address location tracking problems for a wide range of Location IoT industry verticals.


    HERE Tracking also includes end-user mobile and web applications that can be used to demonstrate the product.'
  license:
    name: HERE Documentation License
    url: https://legal.here.com/en-gb/terms/documentation-license
servers:
- url: https://tracking.hereapi.com/
- url: https://tracking.api.here.com/
tags:
- description: 'The Shadows service provides an effective way to manage configurations

    for devices that are only intermittently online.'
  name: Shadows
paths:
  /shadows/v2/health:
    get:
      summary: Gets service health
      security: []
      responses:
        '200':
          description: 'OK


            The service is performing as expected

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Health status
                example:
                  message: healthy
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Shadows
      operationId: getShadowsV2Health
      x-operation-id-source: derived
  /shadows/v2/version:
    get:
      summary: Gets service version
      security: []
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                description: "OK\nService returns its current version number\nschema:\n    type: object\n    properties:\n        \"service-name\":\n            type: string\n            description: Version of service\n    example:\n        servicename: \"1.0.0\"\n"
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Shadows
      operationId: getShadowsV2Version
      x-operation-id-source: derived
  /shadows/v2/{trackingId}:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - name: appId
      description: Application identifier. Used together with an external ID to identify a virtual device.
      schema:
        type: string
        minLength: 8
      in: query
      required: false
    put:
      summary: Updates a device shadow
      description: 'Updates the `trackingId` device desired shadow.


        The device shadow consists of `reported` and `desired` shadows.

        Only the `desired` shadow can be updated via this endpoint.

        The `reported` shadow is updated automatically when the device sends telemetry to the ingestion endpoint.'
      security:
      - UserToken: []
      - ClientToken: []
      - DeviceToken: []
      parameters:
      - name: content-length
        in: header
        required: true
        description: 'The size of the shadow in bytes. The size is validated against the

          maximum limit of 1000 bytes.

          '
        schema:
          type: number
          minimum: 0
          maximum: 1000
      - name: trackingId
        in: path
        schema:
          type: string
          minLength: 1
          maxLength: 50
          description: This is a unique ID associated with the device data in HERE Tracking. The `trackingId` gets assigned to a device when the device is claimed by a user.
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                desired:
                  description: 'The desired shadow of the device.

                    '
                  type: object
                  properties:
                    payload:
                      type: object
                      description: 'A free format JSON object.

                        The maximum size is 1000B.

                        '
                    system:
                      description: 'Contains values for the device configuration. HERE Tracking uses these values

                        for various application flows.

                        '
                      type: object
                      properties:
                        powerSave:
                          description: Power save mode parameters.
                          type: object
                          properties:
                            sendMs:
                              description: The rate at which to send sample results in milliseconds in power save mode. A missing or zero value means power save mode is disabled. If present must be bigger than the value of `system.rate.sendMs`.
                              type: number
                              minimum: 0
                        rate:
                          description: This can be used to specify the rates at which the device performs certain tasks.
                          type: object
                          properties:
                            sampleMs:
                              description: The rate at which to sample signals in milliseconds. Must be smaller than the value of `system.rate.sendMs`.
                              type: number
                              minimum: 0
                            sendMs:
                              description: The rate at which to send sample results in milliseconds
                              type: number
                              minimum: 0
                            distanceM:
                              description: Send an update if the device has moved farther than the specified distance in meters
                              type: number
                              minimum: 0
                        syncGeofences:
                          description: A boolean value that sets efficient geofencing on or off
                          type: boolean
                        detectOutliers:
                          description: A boolean value that sets outlier detection on or off
                          type: boolean
                        disableTracking:
                          type: object
                          description: 'Tracking can be disabled and enabled by defining disableTracking object.

                            In order to disable tracking, one must at least provide the begin time of the disabling

                            period and define either position or sensor properties one wants to disable. One can also

                            disable both position and sensors at the same time. By default tracking is enabled.

                            '
                          properties:
                            periods:
                              description: 'Define begin and end of the disabling period. All trace points with timestamp that falls between begin and end times will be disabled according to the settings defined in the position and sensors properties.

                                '
                              type: array
                              minItems: 0
                              maxItems: 1
                              title: Array of periods
                              items:
                                type: object
                                properties:
                                  begin:
                                    type: integer
                                    description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC


                                      Begin time of the tracking disabling period.


                                      Begin must be smaller than end. Begin must be greater or equal to current time.

                                      Begin can be set without end. If there exists already end time which is earlier

                                      than given new begin time, the existing end time will be deleted.

                                      '
                                    minimum: 2
                                    maximum: 4102448400000
                                  end:
                                    type: integer
                                    description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC


                                      End time of the tracking disabling period.


                                      End must be greater than begin. End must be greater or equal to current time.

                                      End can be set without begin if begin is already set.

                                      '
                                    minimum: 2
                                    maximum: 4102448400000
                            position:
                              description: Define position methods to be disabled
                              oneOf:
                              - type: string
                                title: all positioning
                                enum:
                                - all
                                description: 'All positioning data the device sends will be removed before further processing. No geofence and location events will be generated

                                  '
                              - type: array
                                minItems: 1
                                title: specified positioning methods
                                items:
                                  type: string
                                  enum:
                                  - bt
                                  - country
                                  - gsm
                                  - wcdma
                                  - tdscdma
                                  - lte
                                  - cdma
                                  - wlan
                                  - gps
                                  description: 'The items specified in the position array will be removed from the ingestion scan object before further processing. Position may be resolved by the remaining scan properties. Some geofence and location events may be generated.

                                    '
                              - type: string
                                title: re-enable
                                enum:
                                - ''
                                description: 'By setting the position property empty string, all positioning data will be re-enabled during the disabling period.

                                  '
                            sensors:
                              description: Define sensors to be disabled
                              oneOf:
                              - type: string
                                enum:
                                - all
                                title: all sensors
                                description: 'All sensor data the device sends will be removed before further processing. No sensor events will be generated.

                                  '
                              - type: array
                                minItems: 1
                                title: specified sensors
                                items:
                                  type: string
                                  enum:
                                  - accelerationG
                                  - deviceIsAttached
                                  - deviceIsStationary
                                  - batteryIsCharging
                                  - batteryLevel
                                  - pressureHpa
                                  - relativeHumidity
                                  - deviceIsTampered
                                  - temperatureC
                                  - tiltDegree
                                  description: 'The items specified in the sensors array will be removed from the ingestion system.reportedSensorData object before further processing. Sensor events will not be generated for the disabled sensors.

                                    '
                              - type: string
                                title: re-enable
                                enum:
                                - ''
                                description: 'By setting the sensors property empty string, all sensors data will be re-enabled during the disabling period.

                                  '
                        wlanConnectivityEnabled:
                          description: A boolean value that sets wlan connectivity on or off
                          type: boolean
                        wlanConfigurations:
                          description: An array of objects that holds wlan configurations
                          type: array
                          minItems: 0
                          maxItems: 10
                          items:
                            type: object
                            properties:
                              securityMode:
                                description: Selected security mode
                                type: string
                                enum:
                                - none
                                - wpa2psk
                              ssid:
                                description: Name given to a WLAN that is used by the client to access a WLAN network. Please note that the SSID is stored to the device unencrypted. Do not use secure private networks, such as Intranet, for tracker WLAN connectivity.
                                type: string
                                minLength: 1
                                maxLength: 32
                              password:
                                description: WLAN password. Please note that the password is stored to the device unencrypted. Do not use secure private networks, such as Intranet, for tracker WLAN connectivity. Password is required if security mode is other then 'none'.
                                type: string
                                minLength: 8
                                maxLength: 63
                              ssidIsHidden:
                                description: Flag that informs if SSID is hidden
                                type: boolean
                            additionalProperties: false
                            required:
                            - securityMode
                            - ssid
                        sensorLoggingEnabled:
                          description: Flag that sets sensor logging on or off
                          type: boolean
                        sensorLoggingConfigurations:
                          description: An array of objects that holds sensor logging configurations
                          type: array
                          minItems: 0
                          maxItems: 5
                          items:
                            type: object
                            properties:
                              type:
                                description: Type of single sensor logging configuration
                                type: string
                                enum:
                                - acceleration
                                - pressure
                                - temperature
                                - humidity
                                - gnss
                              samplingFrequency:
                                description: Sampling frequrency of single sensor loggin configuration (in milliseconds)
                                type: number
                                minimum: 1
                            additionalProperties: false
                            required:
                            - type
                        sensorLoggingTag:
                          description: Tag for the logged sensor data.
                          type: string
                          minLength: 1
                          maxLength: 50
                      additionalProperties: false
                  additionalProperties: false
              required:
              - desired
              additionalProperties: false
      tags:
      - Shadows
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                description: 'The data that Shadows persists for each device.

                  '
                type: object
                properties:
                  desired:
                    description: 'The desired shadow of the device.

                      '
                    type: object
                    properties:
                      payload:
                        type: object
                        description: 'A free format JSON object.

                          The maximum size is 1000B.

                          '
                      system:
                        type: object
                        description: 'Contains device configuration settings.

                          '
                        properties:
                          powerSave:
                            description: Power save mode parameters.
                            type: object
                            properties:
                              sendMs:
                                description: The rate at which to send sample results in milliseconds in power save mode. A missing or zero value means power save mode is disabled. If present must be bigger than the value of `system.rate.sendMs`.
                                type: number
                                minimum: 0
                          rate:
                            description: This can be used to specify the rates at which the device performs certain tasks.
                            type: object
                            properties:
                              sampleMs:
                                description: The rate at which to sample signals in milliseconds. Must be smaller than the value of `system.rate.sendMs`.
                                type: number
                                minimum: 0
                              sendMs:
                                description: The rate at which to send sample results in milliseconds
                                type: number
                                minimum: 0
                              distanceM:
                                description: Send an update if the device has moved farther than the specified distance in meters
                                type: number
                                minimum: 0
                          syncGeofences:
                            description: A boolean value that sets efficient geofencing on or off
                            type: boolean
                          detectOutliers:
                            description: A boolean value that sets outlier detection on or off
                            type: boolean
                          disableTracking:
                            type: object
                            description: 'Tracking can be disabled and enabled by defining disableTracking object.

                              In order to disable tracking, one must at least provide the begin time of the disabling

                              period and define either position or sensor properties one wants to disable. One can also

                              disable both position and sensors at the same time. By default tracking is enabled.

                              '
                            properties:
                              periods:
                                description: 'Define begin and end of the disabling period. All trace points with timestamp that falls between begin and end times will be disabled according to the settings defined in the position and sensors properties.

                                  '
                                type: array
                                minItems: 0
                                maxItems: 1
                                title: Array of periods
                                items:
                                  type: object
                                  properties:
                                    begin:
                                      type: integer
                                      description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC


                                        Begin time of the tracking disabling period.


                                        Begin must be smaller than end. Begin must be greater or equal to current time.

                                        Begin can be set without end. If there exists already end time which is earlier

                                        than given new begin time, the existing end time will be deleted.

                                        '
                                      minimum: 2
                                      maximum: 4102448400000
                                    end:
                                      type: integer
                                      description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC


                                        End time of the tracking disabling period.


                                        End must be greater than begin. End must be greater or equal to current time.

                                        End can be set without begin if begin is already set.

                                        '
                                      minimum: 2
                                      maximum: 4102448400000
                              position:
                                description: Define position methods to be disabled
                                oneOf:
                                - type: string
                                  title: all positioning
                                  enum:
                                  - all
                                  description: 'All positioning data the device sends will be removed before further processing. No geofence and location events will be generated

                                    '
                                - type: array
                                  minItems: 1
                                  title: specified positioning methods
                                  items:
                                    type: string
                                    enum:
                                    - bt
                                    - country
                                    - gsm
                                    - wcdma
                                    - tdscdma
                                    - lte
                                    - cdma
                                    - wlan
                                    - gps
                                    description: 'The items specified in the position array will be removed from the ingestion scan object before further processing. Position may be resolved by the remaining scan properties. Some geofence and location events may be generated.

                                      '
                                - type: string
                                  title: re-enable
                                  enum:
                                  - ''
                                  description: 'By setting the position property empty string, all positioning data will be re-enabled during the disabling period.

                                    '
                              sensors:
                                description: Define sensors to be disabled
                                oneOf:
                                - type: string
                                  enum:
                                  - all
                                  title: all sensors
                                  description: 'All sensor data the device sends will be removed before further processing. No sensor events will be generated.

                                    '
                                - type: array
                                  minItems: 1
                                  title: specified sensors
                                  items:
                                    type: string
                                    enum:
                                    - accelerationG
                                    - deviceIsAttached
                                    - deviceIsStationary
                                    - batteryIsCharging
                                    - batteryLevel
                                    - pressureHpa
                                    - relativeHumidity
                                    - deviceIsTampered
                                    - temperatureC
                                    - tiltDegree
                                    description: 'The items specified in the sensors array will be removed from the ingestion system.reportedSensorData object before further processing. Sensor events will not be generated for the disabled sensors.

                                      '
                                - type: string
                                  title: re-enable
                                  enum:
                                  - ''
                                  description: 'By setting the sensors property empty string, all sensors data will be re-enabled during the disabling period.

                                    '
                          stateVersion:
                            description: 'The version of the state of a device. This should be incremented only by HERE Tracking.

                              '
                            type: integer
                            minimum: 0
                          lastModifiedGeofenceTimestamp:
                            description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.


                              The time of the last update to geofences that device is associated

                              with. This value is zero when device hasn''t yet been associated with

                              any geofence. This is set by HERE Tracking when any geofences

                              associated with the device is modified or removed. Also adding and

                              removing geofence associations update this value.

                              '
                            maximum: 4102448400000
                            minimum: 0
                            type: integer
                          sensorAlarmConfig:
                            description: 'The device sensors alarm configuration.

                              '
                            type: object
                            properties:
                              alertTemperatureCMin:
                                type: number
                                description: A lower threshold value for temperature in degrees Celsius.
                              alertTemperatureCMax:
                                type: number
                                description: An upper threshold value for temperature in degrees Celsius.
                              alertRelativeHumidityMin:
                                type: number
                                description: A lower threshold value for relative humidity percentage.
                              alertRelativeHumidityMax:
                                type: number
                                description: An upper threshold value for relative humidity percentage.
                              alertAccelerationGMin:
                                type: number
                                description: A lower threshold value for acceleration in g-forces.
                              alertAccelerationGMax:
                                type: number
                                description: An upper threshold value for acceleration in g-forces.
                              alertTiltDegreeMin:
                                type: number
                                description: A lower threshold value for tilt in degrees.
                              alertTiltDegreeMax:
                                type: number
                                description: An upper threshold value for tilt in degrees.
                              alertPressureHpaMin:
                                type: number
                                description: A lower threshold value for pressure in hectopascals.
                              alertPressureHpaMax:
                                type: number
                                description: An upper threshold value for pressure in hectopascals.
                              alertBatteryLevelPMin:
                                type: number
                                description: A lower threshold value for battery level percentage.
                              alertBatteryLevelPMax:
                                type: number
                                description: An upper threshold value for battery level percentage.
                              isAttachAlertEnabled:
                                type: boolean
                                default: false
                                description: True if attach sensor alert in device is enabled.
                              isTamperAlertEnabled:
                                type: boolean
                                default: false
                                description: True if tamper sensor alert in device is enabled.
                          wlanConnectivityEnabled:
                            description: A boolean value that sets wlan connectivity on or off
                            type: boolean
                          wlanConfigurations:
                            description: An array of objects that holds wlan configurations
                            type: array
                            minItems: 0
                            maxItems: 10
                            items:
                              type: object
                              properties:
                                securityMode:
                                  description: Selected security mode
                                  type: string
                                  enum:
                                  - none
                                  - wpa2psk
                                ssid:
                                  description: Name given to a WLAN that is used by the client to access a WLAN network. Please note that the SSID is stored to the device unencrypted. Do not use secure private networks, such as Intranet, for tracker WLAN connectivity.
                                  type: string
                                  minLength: 1
                                  maxLength: 32
                                password:
                                  description: WLAN password. Please note that the password is stored to the device unencrypted. Do not use secure private networks, such as Intranet, for tracker WLAN connectivity. Password is required if security mode is other then 'none'.
                                  type: string
                                  minLength: 8
                                  maxLength: 63
                                ssidIsHidden:
                                  description: Flag that informs if SSID is hidden
                                  type: boolean
                              additionalProperties: false
                              required:
                              - securityMode
                              - ssid
                          sensorLoggingEnabled:
                            description: Flag that sets sensor logging on or off
                            type: boolean
                          sensorLoggingConfigurations:
                            description: An array of objects that holds sensor logging configurations
                            type: array
                            minItems: 0
                            maxItems: 5
                            items:
                              type: object
                              properties:
                                type:
                                  description: Type of single sensor logging configuration
                                  type: string
                                  enum:
                                  - acceleration
                                  - pressure
                                  - temperature
                                  - humidity
                                  - gnss
                                samplingFrequency:
                                  description: Sampling frequrency of single sensor loggin configuration (in milliseconds)
                                  type: number
                                  minimum: 1
                              additionalProperties: false
                              required:
                              - type
                          sensorLoggingTag:
                            description: Tag for the logged sensor data.
                            type: string
                            minLength: 1
                            maxLength: 50
                        required:
                        - stateVersion
                        - lastModifiedGeofenceTimestamp
                      timestamp:
                        description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.


                          The time of the last update to the desired shadow.

                          '
                        maximum: 4102448400000
                        minimum: 2
                        type: integer
                  reported:
                    description: 'The `reported` shadow contains the most recent position, sensor readings and settings that the

                      device has sent. The reported shadow may also contain additional properties generated by HERE

                      Tracking based on the device-ingested telemetry.

                      Such properties are stored in `system.computed` property of the shadow.


                      In case the most recent telemetry did not contain all the possible

                      fields, the last known information will remain in the shadow. This means that one can

                      see, for example, the last reported temperature or tracker firmware information in the reported shadow,

                      even if the device did not send that information in the latest telemetry.

                      '
                    type: object
                    properties:
                      payload:
                        type: object
                        description: 'A free format JSON object.

                          The maximum size is 1000B.

                          '
                      position:
                        type: object
                        description: The device location
                        properties:
                          accuracy:
                            description: Uncertainty circle radius in meters (degree of confidence according to the 'confidence' parameter).
                            type: number
                            minimum: 0
                          alt:
                            description: Altitude in meters (referenced to the WGS-84 ellipsoid) negative or positive.
                            type: number
                          altaccuracy:
                            description: Uncertainty of the altitude estimate in meters (degree of confidence according to the 'confidence' parameter).
                            type: number
                            minimum: 0
                          confidence:
                            description: Confidence level in percent for the accuracy/uncertainty. If not specified, the default is 68 (this corresponds to a 68% probability that the true position is within the accuracy/uncertainty radius of the position; the higher the number, the greater the confidence level).
                            type: integer
                            minimum: 50
                            maximum: 95
                          heading:
                            description: GPS/GNSS heading in degrees, clockwise from true north. You must specify a value for this item when you specify a value for speed.
                            type: integer
                            minimum: 0
                            maximum: 359
                          floor:
                            description: The building where the measurements were taken
                            type: object
                            required:
                            - id
                            - name
                            - level
                            properties:
                              level:
                                description: The floor in the building in integer format
                                type: number
                                minimum: -999
                                maximum: 999
                              id:
                                description: The building id
                                type: string
                                minimum: 1
                                maximum: 100
                              name:
                                description: The building name
                                type: string
                                minimum: 1
                                maximum: 255
                          lat:
                            description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                            type: number
                            minimum: -90
                            maximum: 90
                          lng:
                            description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                            type: number
                            minimum: -180
                            maximum: 180
                          satellitecount:
                            description: Number of GPS/GNSS satellites used for the calculation of the position fix. ('gnss' position type only)
                            type: integer
                            minimum: 1
                            maximum: 50
                          speed:
                            description: GPS/GNSS speed of the device (m/s). One must specify a value for this item when one specifies a value for heading.
                            type: integer
                            minimum: 0
                          type:
                            description: Position type, 'gnss' (satellite based), 'cell' or 'wlan' (network based)
                            type: string
                          wlancount:
                            description: The total number of observed WLAN APs in the scan used for producing the position. ('wlan' position type only)
                            type: integer
                            minimum: 1
                            maximum: 254
                          timestamp:
                            description: Timestamp of the position
                            type: integer
                            minimum: 2
                            maximum: 4102448400000
                        required:
                        - lat
                        - lng
                        - accuracy
                      system:
                        allOf:
                        - type: object
                          properties:
                            phoneNumber:
                              type: string
                              pattern: ^\+[1-9]\d{1,14}$
                              description: 'The phone number of the device''s SIM card in the international E.164 format. All the country codes should be prefixed a with "+" instead of "00".

                                '
                              example: '+491234567890'
                            imsi:
                              type: string
                              pattern: ^[0-9]{1,15}$
                              description: 'The IMSI of the device''s SIM card.

                                '
                              example: '123456789012345'
                            iccid:
                              type: string
                              minLength: 18
                              maxLength: 22
                              description: SIM card integrated circuit card identifier (ICCID)
                            client:
                              description: 'Information about the client device.

                                '
                              type: object
                              properties:
                                manufacturer:
                                  description: Manufacturer of the device (hardware)
                                  type: string
                                  minLength: 2
                                  maxLength: 50
                                model:
                                  description: Model of the device (hardware)
                                  type: string
                                  minLength: 1
                                  maxLength: 50
                                firmware:
                                  description: Device firmware version information
                                  type: string
                                  minLength: 1
                                  maxLength: 150
                                name:
                                  description: Name of the client software accessing the HERE API
                                  type: string
                                  minLength: 3
                                  maxLength: 50
                                version:
                                  description: Version of the client software in format X.Y.Z, where X [0..255] is a major, Y [0..255] is a minor, and Z [0..65535] is a build version number. Increase the version/build number for each release of the client.
                                  type: string
                                  minLength: 3
                                  maxLength: 60
                                platform:
                                  description: Software platform information of the device, for example operating system name and version.
                                  type: string
                                  minLength: 3
                                  maxLength: 50
                                modules:
                                  description: Software information of all updateable chips.
                                  type: array
                                  maxItems: 10
                                  items:
                                    description: Software information of an updateable chip.
                                    type: object
                                    properties:
                                      manufacturer:
                                        type: string
                                        description: Manufacturer name
                                        minLength: 2
                                        maxLength: 50
                                      model:
                                        type: string
                                        description: Model or chip name
                                        minLength: 1
                                        maxLength: 50
                                      firmwareVersion:
                                        type: string
                                        description: Installed firmware version
                                        minLength: 3
                                        maxLength: 60
                                diskquota:
