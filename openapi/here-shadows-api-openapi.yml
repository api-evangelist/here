                        description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.


                          The timestamp of the newest telemetry sent by the device. Note that this is not necessarily

                          the timestamp of all the reported values in the reported shadow since the shadow retains

                          values from previous ingestions if the latest telemetry did not conatain them.

