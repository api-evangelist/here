      operationId: getShadowsV2ByTrackingIdByState
      x-operation-id-source: derived
  /shadows/v2/{trackingId}/{state}/{selector}:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - name: trackingId
      in: path
      schema:
        type: string
        minLength: 1
        maxLength: 50
        description: This is a unique ID associated with the device data in HERE Tracking. The `trackingId` gets assigned to a device when the device is claimed by a user. Alternatively, a valid `shipmentId` may be used.
      required: true
    - name: appId
      description: Application identifier. Used together with an external ID to identify a virtual device.
      schema:
        type: string
        minLength: 8
      in: query
      required: false
    - name: state
      in: path
      required: true
      description: Desired or reported state object of a device to query.
      schema:
        type: string
        enum:
        - desired
        - reported
    - name: selector
      in: path
      required: true
      description: A JSON selector that specifies the property.
      schema:
        type: string
    get:
      summary: Gets a value of a shadow property
