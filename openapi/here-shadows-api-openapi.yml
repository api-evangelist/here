                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
                code: 400
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request object is in an incorrect format or has values that are invalid or out of range.
                details:
                  hereErrorCode: 400306
          description: 'Bad request


            The request object is in an incorrect format or has values that are invalid or out of range.


            If available, further error details are provided in the response body.

            '
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Unauthorized
                code: 401
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The provided credentials are not valid.
                details:
                  hereErrorCode: 401306
          description: 'Unauthorized


            The request did not provide correct authentication details

            '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Forbidden
                code: 403
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The account does not have the correct privileges.
                details:
                  hereErrorCode: 403306
          description: 'Forbidden


            The account does not have the correct privileges

            '
        '404':
          description: Not found. Shadow doesn't exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
                example:
                - error: Unauthorized
                  code: 401
                  id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee
                  message: Invalid Authorization, the request lacks valid authentication credentials for the target resource.
                  details:
                    hereErrorCode: 401306
        '422':
          description: The specified property doesn't exist in the shadow for the device.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
                example:
                - error: Unauthorized
                  code: 401
                  id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee
                  message: Invalid Authorization, the request lacks valid authentication credentials for the target resource.
                  details:
                    hereErrorCode: 401306
      operationId: getShadowsV2ByTrackingIdByStateBySelector
      x-operation-id-source: derived
  /shadows/v4:
    get:
      summary: Gets all shadows
      description: Gets all device shadows of a project.
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      - name: projectId
        schema:
          type: string
          minLength: 1
          maxLength: 50
          description: 'Project ID.

            Any HERE Tracking user must be a member of a Tracking project.

            The project ID can be implicitly resolved if the user calling the API is a member of a single project.

            If the user is a member of multiple projects, the `projectId` query parameter needs to be specified explicitly.

            '
        in: query
        required: false
      - name: pageToken
        description: A token from the previously returned response to retrieve the specified page.
        schema:
          type: string
        in: query
        required: false
      - name: limit
        in: query
        description: The number of items to return per page
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        required: false
      - name: after
        in: query
        required: false
        description: If provided returns the shadows for which `reported.timestamp` is greater than given `after` parameter.
        schema:
          type: string
          format: date-time
      - in: query
        schema:
          type: string
          pattern: ^(trackingId|reported.timestamp|desired.timestamp):(asc|desc)$
        name: sort
        description: 'Defines how the items are sorted.

          The default sort is `sort=trackingId:asc`

          '
        example: reported.timestamp:desc
        required: false
      - in: query
        schema:
          type: array
          maxItems: 4
          minItems: 4
          items:
            type: number
            minimum: -180
            maximum: 180
            description: Latitude and longitude of Northwest and Southeast corners.
        name: bbox
        description: 'Limit search to shadows, whose position intersects the given bounding box.

          The `bbox` array consist of latitude and longitude of Northwest and Southeast corners.

          '
        style: form
        example: 61.494750,23.775189,61.494611,23.774758
      tags:
      - Shadows
      responses:
        '200':
          description: 'Response body contains an array of shadows along with tracking ID, count indicating the number of returned items,

            and next page token if available. For virtual devices, a combination of app ID and external ID is provided instead of tracking ID.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    description: Maximum number of items as specified in request
                    type: integer
                    minimum: 1
                    maximum: 1000
                  count:
                    description: Number of items returned in the response
                    type: integer
                    minimum: 0
                    maximum: 1000
                  nextPageToken:
                    description: Token to fetch the next page (if exists)
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        shadow:
                          type: object
                          properties:
                            desired:
                              description: 'The desired shadow of the device.

                                '
                              type: object
                              properties:
                                payload:
                                  type: object
                                  description: 'A free format JSON object.

                                    The maximum size is 1000B.

                                    '
                                system:
                                  type: object
                                  description: 'Contains device configuration settings.

                                    '
                                  properties:
                                    powerSave:
                                      description: Power save mode parameters.
                                      type: object
                                      properties:
                                        sendMs:
                                          description: The rate at which to send sample results in milliseconds in power save mode. A missing or zero value means power save mode is disabled. If present must be bigger than the value of `system.rate.sendMs`.
                                          type: number
                                          minimum: 0
                                    rate:
                                      description: This can be used to specify the rates at which the device performs certain tasks.
                                      type: object
                                      properties:
                                        sampleMs:
                                          description: The rate at which to sample signals in milliseconds. Must be smaller than the value of `system.rate.sendMs`.
                                          type: number
                                          minimum: 0
                                        sendMs:
                                          description: The rate at which to send sample results in milliseconds
                                          type: number
                                          minimum: 0
                                        distanceM:
                                          description: Send an update if the device has moved farther than the specified distance in meters
                                          type: number
                                          minimum: 0
                                    syncGeofences:
                                      description: A boolean value that sets efficient geofencing on or off
                                      type: boolean
                                    detectOutliers:
                                      description: A boolean value that sets outlier detection on or off
                                      type: boolean
                                    disableTracking:
                                      type: object
                                      description: 'Tracking can be disabled and enabled by defining disableTracking object.

                                        In order to disable tracking, one must at least provide the begin time of the disabling

                                        period and define either position or sensor properties one wants to disable. One can also

                                        disable both position and sensors at the same time. By default tracking is enabled.

                                        '
                                      properties:
                                        periods:
                                          description: 'Define begin and end of the disabling period. All trace points with timestamp that falls between begin and end times will be disabled according to the settings defined in the position and sensors properties.

                                            '
                                          type: array
                                          minItems: 0
                                          maxItems: 1
                                          title: Array of periods
                                          items:
                                            type: object
                                            properties:
                                              begin:
                                                description: 'Begin time of the tracking disabling period.


                                                  Begin must be smaller than end. Begin must be greater or equal to current time.

                                                  Begin can be set without end. If there exists already end time which is earlier

                                                  than given new begin time, the existing end time will be deleted.

                                                  '
                                                type: string
                                                format: date-time
                                              end:
                                                description: 'End time of the tracking disabling period.


                                                  End must be greater than begin. End must be greater or equal to current time.

                                                  End can be set without begin if begin is already set.

                                                  '
                                                type: string
                                                format: date-time
                                        position:
                                          description: Define position methods to be disabled
                                          oneOf:
                                          - type: string
                                            title: all positioning
                                            enum:
                                            - all
                                            description: 'All positioning data the device sends will be removed before further processing. No geofence and location events will be generated

                                              '
                                          - type: array
                                            minItems: 1
                                            title: specified positioning methods
                                            items:
                                              type: string
                                              enum:
                                              - bt
                                              - country
                                              - gsm
                                              - wcdma
                                              - tdscdma
                                              - lte
                                              - cdma
                                              - wlan
                                              - gps
                                              description: 'The items specified in the position array will be removed from the ingestion scan object before further processing. Position may be resolved by the remaining scan properties. Some geofence and location events may be generated.

                                                '
                                          - type: string
                                            title: re-enable
                                            enum:
                                            - ''
                                            description: 'By setting the position property empty string, all positioning data will be re-enabled during the disabling period.

                                              '
                                        sensors:
                                          description: Define sensors to be disabled
                                          oneOf:
                                          - type: string
                                            enum:
                                            - all
                                            title: all sensors
                                            description: 'All sensor data the device sends will be removed before further processing. No sensor events will be generated.

                                              '
                                          - type: array
                                            minItems: 1
                                            title: specified sensors
                                            items:
                                              type: string
                                              enum:
                                              - accelerationG
                                              - deviceIsAttached
                                              - deviceIsStationary
                                              - batteryIsCharging
                                              - batteryLevel
                                              - pressureHpa
                                              - relativeHumidity
                                              - deviceIsTampered
                                              - temperatureC
                                              - tiltDegree
                                              description: 'The items specified in the sensors array will be removed from the ingestion system.reportedSensorData object before further processing. Sensor events will not be generated for the disabled sensors.

                                                '
                                          - type: string
                                            title: re-enable
                                            enum:
                                            - ''
                                            description: 'By setting the sensors property empty string, all sensors data will be re-enabled during the disabling period.

                                              '
                                    stateVersion:
                                      description: 'The version of the state of a device. This should be incremented only by HERE Tracking.

                                        '
                                      type: integer
                                      minimum: 0
                                    lastModifiedGeofenceTimestamp:
                                      description: 'The time of the last update to geofences that device is associated

                                        with. This value is zero when device hasn''t yet been associated with

                                        any geofence. This is set by HERE Tracking when any geofences

                                        associated with the device is modified or removed. Also adding and

                                        removing geofence associations update this value.

                                        '
                                      type: string
                                      format: date-time
                                    sensorAlarmConfig:
                                      description: 'The device sensors alarm configuration.

                                        '
                                      type: object
                                      properties:
                                        alertTemperatureCMin:
                                          type: number
                                          description: A lower threshold value for temperature in degrees Celsius.
                                        alertTemperatureCMax:
                                          type: number
                                          description: An upper threshold value for temperature in degrees Celsius.
                                        alertRelativeHumidityMin:
                                          type: number
                                          description: A lower threshold value for relative humidity percentage.
                                        alertRelativeHumidityMax:
                                          type: number
                                          description: An upper threshold value for relative humidity percentage.
                                        alertAccelerationGMin:
                                          type: number
                                          description: A lower threshold value for acceleration in g-forces.
                                        alertAccelerationGMax:
                                          type: number
                                          description: An upper threshold value for acceleration in g-forces.
                                        alertTiltDegreeMin:
                                          type: number
                                          description: A lower threshold value for tilt in degrees.
                                        alertTiltDegreeMax:
                                          type: number
                                          description: An upper threshold value for tilt in degrees.
                                        alertPressureHpaMin:
                                          type: number
                                          description: A lower threshold value for pressure in hectopascals.
                                        alertPressureHpaMax:
                                          type: number
                                          description: An upper threshold value for pressure in hectopascals.
                                        alertBatteryLevelPMin:
                                          type: number
                                          description: A lower threshold value for battery level percentage.
                                        alertBatteryLevelPMax:
                                          type: number
                                          description: An upper threshold value for battery level percentage.
                                        isAttachAlertEnabled:
                                          type: boolean
                                          default: false
                                          description: True if attach sensor alert in device is enabled.
                                        isTamperAlertEnabled:
                                          type: boolean
                                          default: false
                                          description: True if tamper sensor alert in device is enabled.
                                    wlanConnectivityEnabled:
                                      description: A boolean value that sets wlan connectivity on or off
                                      type: boolean
                                    wlanConfigurations:
                                      description: An array of objects that holds wlan configurations
                                      type: array
                                      minItems: 0
                                      maxItems: 10
                                      items:
                                        type: object
                                        properties:
                                          securityMode:
                                            description: Selected security mode
                                            type: string
                                            enum:
                                            - none
                                            - wpa2psk
                                          ssid:
                                            description: Name given to a WLAN that is used by the client to access a WLAN network. Please note that the SSID is stored to the device unencrypted. Do not use secure private networks, such as Intranet, for tracker WLAN connectivity.
                                            type: string
                                            minLength: 1
                                            maxLength: 32
                                          password:
                                            description: WLAN password. Please note that the password is stored to the device unencrypted. Do not use secure private networks, such as Intranet, for tracker WLAN connectivity. Password is required if security mode is other then 'none'.
                                            type: string
                                            minLength: 8
                                            maxLength: 63
                                          ssidIsHidden:
                                            description: Flag that informs if SSID is hidden
                                            type: boolean
                                        additionalProperties: false
                                        required:
                                        - securityMode
                                        - ssid
                                    sensorLoggingEnabled:
                                      description: Flag that sets sensor logging on or off
                                      type: boolean
                                    sensorLoggingConfigurations:
                                      description: An array of objects that holds sensor logging configurations
                                      type: array
                                      minItems: 0
                                      maxItems: 5
                                      items:
                                        type: object
                                        properties:
                                          type:
                                            description: Type of single sensor logging configuration
                                            type: string
                                            enum:
                                            - acceleration
                                            - pressure
                                            - temperature
                                            - humidity
                                            - gnss
                                          samplingFrequency:
                                            description: Sampling frequrency of single sensor loggin configuration (in milliseconds)
                                            type: number
                                            minimum: 1
                                        additionalProperties: false
                                        required:
                                        - type
                                    sensorLoggingTag:
                                      description: Tag for the logged sensor data.
                                      type: string
                                      minLength: 1
                                      maxLength: 50
                                  required:
                                  - stateVersion
                                  - lastModifiedGeofenceTimestamp
                                timestamp:
                                  description: 'The time of the last update to the desired shadow.

                                    '
                                  type: string
                                  format: date-time
                            reported:
                              description: 'The `reported` shadow contains the most recent position, sensor readings and settings that the

                                device has sent. The reported shadow may also contain additional properties generated by HERE

                                Tracking based on the device-ingested telemetry.

                                Such properties are stored in `system.computed` property of the shadow.


                                In case the most recent telemetry did not contain all the possible

                                fields, the last known information will remain in the shadow. This means that one can

                                see, for example, the last reported temperature or tracker firmware information in the reported shadow,

                                even if the device did not send that information in the latest telemetry.

                                '
                              type: object
                              properties:
                                payload:
                                  type: object
                                  description: 'A free format JSON object.

                                    The maximum size is 1000B.

                                    '
                                position:
                                  type: object
                                  description: The device location
                                  properties:
                                    accuracy:
                                      description: Uncertainty circle radius in meters (degree of confidence according to the 'confidence' parameter).
                                      type: number
                                      minimum: 0
                                    alt:
                                      description: Altitude in meters (referenced to the WGS-84 ellipsoid) negative or positive.
                                      type: number
                                    altaccuracy:
                                      description: Uncertainty of the altitude estimate in meters (degree of confidence according to the 'confidence' parameter).
                                      type: number
                                      minimum: 0
                                    confidence:
                                      description: Confidence level in percent for the accuracy/uncertainty. If not specified, the default is 68 (this corresponds to a 68% probability that the true position is within the accuracy/uncertainty radius of the position; the higher the number, the greater the confidence level).
                                      type: integer
                                      minimum: 50
                                      maximum: 95
                                    heading:
                                      description: GPS/GNSS heading in degrees, clockwise from true north. You must specify a value for this item when you specify a value for speed.
                                      type: integer
                                      minimum: 0
                                      maximum: 359
                                    floor:
                                      description: The building where the measurements were taken
                                      type: object
                                      required:
                                      - id
                                      - name
                                      - level
                                      properties:
                                        level:
                                          description: The floor in the building in integer format
                                          type: number
                                          minimum: -999
                                          maximum: 999
                                        id:
                                          description: The building id
                                          type: string
                                          minimum: 1
                                          maximum: 100
                                        name:
                                          description: The building name
                                          type: string
                                          minimum: 1
                                          maximum: 255
                                    lat:
                                      description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                                      type: number
                                      minimum: -90
                                      maximum: 90
                                    lng:
                                      description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                                      type: number
                                      minimum: -180
                                      maximum: 180
                                    satellitecount:
                                      description: Number of GPS/GNSS satellites used for the calculation of the position fix. ('gnss' position type only)
                                      type: integer
                                      minimum: 1
                                      maximum: 50
                                    speed:
                                      description: GPS/GNSS speed of the device (m/s). One must specify a value for this item when one specifies a value for heading.
                                      type: integer
                                      minimum: 0
                                    type:
                                      description: Position type, 'gnss' (satellite based), 'cell' or 'wlan' (network based)
                                      type: string
                                    wlancount:
                                      description: The total number of observed WLAN APs in the scan used for producing the position. ('wlan' position type only)
                                      type: integer
                                      minimum: 1
                                      maximum: 254
                                    timestamp:
                                      type: string
                                      format: date-time
                                      description: Timestamp of the position
                                  required:
                                  - lat
                                  - lng
                                  - accuracy
                                system:
                                  allOf:
                                  - type: object
                                    properties:
                                      phoneNumber:
                                        type: string
                                        pattern: ^\+[1-9]\d{1,14}$
                                        description: 'The phone number of the device''s SIM card in the international E.164 format. All the country codes should be prefixed a with "+" instead of "00".

                                          '
