openapi: 3.2.0
info:
  version: 2.6.11
  title: HERE Tracking Associations API
  description: 'HERE Tracking is a cloud product designed to address location tracking problems for a wide range of Location IoT industry verticals.


    HERE Tracking also includes end-user mobile and web applications that can be used to demonstrate the product.'
  license:
    name: HERE Documentation License
    url: https://legal.here.com/en-gb/terms/documentation-license
servers:
- url: https://tracking.hereapi.com/
- url: https://tracking.api.here.com/
tags:
- description: 'An association is a link between a device and a geofence, a sensor rule or a rule.

    Device events get generated for existing associations only.'
  name: Associations
paths:
  /associations/v3/health:
    get:
      summary: Gets service health
      security: []
      responses:
        '200':
          description: 'OK


            The service is performing as expected

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Health status
                example:
                  message: healthy
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Associations
      operationId: getAssociationsV3Health
      x-operation-id-source: derived
  /associations/v3/version:
    get:
      summary: Gets service version
      security: []
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                description: "OK\nService returns its current version number\nschema:\n    type: object\n    properties:\n        \"service-name\":\n            type: string\n            description: Version of service\n    example:\n        servicename: \"1.0.0\"\n"
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Associations
      operationId: getAssociationsV3Version
      x-operation-id-source: derived
  /associations/v3/sensors/{sensorRuleId}:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - in: path
      schema:
        type: string
        format: uuid
        description: 'Must be a valid UUIDv4.

          '
      name: sensorRuleId
      description: ID of the sensor rule
      required: true
    get:
      deprecated: true
      summary: Gets all devices associated with a sensor rule
      description: Gets all devices associated with the sensor rule `sensorRuleId`.
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - name: pageToken
        description: A token from the previously returned response to retrieve the specified page.
        schema:
          type: string
        in: query
        required: false
      - name: count
        description: The number of items to return per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        in: query
        required: false
      tags:
      - Associations
      responses:
        '200':
          description: 'Response body contains an array of device objects, count indicating the number of returned devices,

            and pageToken if available.


            If no associations are found, an object with empty data array is returned.

            '
          content:
            application/json:
              example:
                data:
                - trackingId: HERE-6da0f871-b4eb-4800-90e6-4bae86a788d6
                  externalId: TestDevice1
                  appId: c2639c686251407a9052aaea824a1fb5
                - trackingId: HERE-b0146d7b-2e46-4cee-bc71-6da03ba2da85
                  externalId: TestDevice2
                  appId: c2639c686251407a9052aaea824a1fc9
                pageToken: 024ggjjea253d79fc
                count: 2
              schema:
                type: object
                description: 'Response body contains an array of device objects, count indicating the number of returned devices,

                  and pageToken if available. If no devices are found, an object with empty data array is returned.

                  '
                allOf:
                - type: object
                  properties:
                    pageToken:
                      type: string
                      description: A token that can be used to retrieve the next page of the response.
                    count:
                      type: integer
                      minimum: 0
                      maximum: 100
                      default: 100
                      description: The number of items in the response.
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        description: 'Response body contains a single device object.

                          '
                        type: object
                        properties:
                          trackingId:
                            type: string
                            minLength: 1
                            maxLength: 50
                            description: This is a unique ID associated with the device data in HERE Tracking. The `trackingId` gets assigned to a device when the device is claimed by a user.
                          externalId:
                            type: string
                            minLength: 1
                            maxLength: 50
                            description: Virtual device external ID, only present when the device is virtual
                          appId:
                            type: string
                            minLength: 8
                            description: Virtual device application ID, only present when the device is virtual
                        required:
                        - trackingId
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
