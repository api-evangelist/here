  /associations/v3/{trackingId}/sensors/{sensorRuleId}:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - in: path
      schema:
        type: string
        format: uuid
        description: 'Must be a valid UUIDv4.

          '
      name: sensorRuleId
      description: ID of the sensor rule
      required: true
    - name: trackingId
      in: path
      schema:
        type: string
        minLength: 1
        maxLength: 50
        description: This is a unique ID associated with the device data in HERE Tracking. The `trackingId` gets assigned to a device when the device is claimed by a user.
      required: true
    - name: appId
      description: Application identifier. Used together with an external ID to identify a virtual device.
      schema:
        type: string
        minLength: 8
      in: query
      required: false
    put:
      summary: Associates a device with a sensor rule
      description: 'Associates the device with `trackingId` to the sensor rule with `sensorRuleId`.


        A single device can only have one sensor rule per sensor type associated.


        The associated sensor rule settings will be automatically synchronised to the `system.sensorAlarmConfig` section of the device

        `desired shadow`.


        Every time the associated sensor rule gets triggered by the device ingestion, an event will be generated.'
      security:
      - UserToken: []
      - ClientToken: []
      tags:
      - Associations
      responses:
        '200':
          description: 'Successful


            Device already associated with the sensor rule

            '
        '201':
          description: 'Successful


            The device has been associated with the sensor rule

            '
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
