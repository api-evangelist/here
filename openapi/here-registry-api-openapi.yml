        required: false
      - description: ID for an application from the user's project
        name: appId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
      - in: query
        name: autoclaim
        description: If set to `true`, the device license is created and the device is immediately claimed by the same user.
        required: false
        schema:
          type: boolean
          default: false
      tags:
      - Registry
      responses:
        '201':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                description: A JSON object containing the newly created device credentials
                properties:
                  deviceId:
                    type: string
                    description: A newly created device ID.
                  deviceSecret:
                    type: string
                    description: A newly created device secret. A physical device license is a `deviceId` and `deviceSecret` credential pair.
                  trackingId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: This is a unique ID associated with the device data in HERE Tracking. The `trackingId` gets assigned to a device when the device is claimed by a user.
                required:
                - deviceId
                additionalProperties: false
                example:
                  deviceId: 4cdafa38-fdf9-474c-8eb3-72ea276a163a
                  deviceSecret: AGIhZGmU1jJS-H1ZfAZuh5U9cswyqquWVrbOKGwKN9s
