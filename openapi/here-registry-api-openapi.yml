    patch:
      summary: Updates the project features
      description: 'Updates features for a project identified by `projectId`.

        When configurations are updated, those configuration properties provided in the request will override existing

        properties while properties not provided in the request are left unchanged.


        Supported project features are:

        * `data.shipments.autoStartLimitBefore` and `data.shipments.autoStartLimitAfter`: Defines time range in minutes

        before and after of shipment''s `providedEtd` when shipment is allowed to be auto-started. With the time range

        not defined, or both values set to `-1` the time window is disabled and auto-start is allowed at any time.

        * `data.shipments.enableStateChangeEvents`: If set to true, publishing shipment state change events to cold storage and output stream is enabled for all shipments in the project.

        * `data.shipments.ongoingRetentionPeriod`: In case a shipment does not complete within this period of time,

        it will be cancelled automatically. If this setting is not set, a default of 2 weeks is used as a shipment''s

        ongoing retention period. The retention period is set in hours.


        Example:


        ```

        "data": {

        "shipments": {

        "autoStartLimitAfter": 60,

        "autoStartLimitBefore": 60,

        "ongoingRetentionPeriod": 168

        },

        }

        ```'
      security:
      - UserToken: []
      - ClientToken: []
      tags:
      - Registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Object describing project features
                  properties:
                    shipments:
                      type: object
                      description: Object describing shipments features
                      properties:
                        autoStartLimitAfter:
                          type: integer
                          description: Defines time in minutes after the moment of `providedEtd` when shipment is still allowed to auto-start, use `-1` to disable. Default -1.
                          minimum: -1
                        autoStartLimitBefore:
                          type: integer
                          description: Defines time in minutes before the moment of `providedEtd` when shipment is already allowed to auto-start, use `-1` to disable. Default -1.
                          minimum: -1
                        enableStateChangeEvents:
                          type: boolean
                          description: If true, the shipment state change events are published to cold storage and output stream for all shipments in the project.
                        ongoingRetentionPeriod:
                          type: integer
                          description: Defines time in hours after a shipment is auto-cancelled if still ongoing. Default 336 (2 weeks).
                          minimum: 0
                      additionalProperties: false
                  additionalProperties: false
              additionalProperties: false
