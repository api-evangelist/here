    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - description: 'Device ID of a provisioned physical device

        or for virtual devices an application specific external ID

        provided together with `appId` query parameter.


        NOTE that physical devices are deprecated and they should no longer be created.

        '
      name: deviceOrExternalId
      in: path
      schema:
        description: Device ID of a provisioned device
        type: string
        minLength: 1
        maxLength: 50
      required: true
    - name: appId
      description: Application identifier. Used together with an external ID to identify a virtual device.
      schema:
        type: string
        minLength: 8
      in: query
      required: false
    put:
      summary: Claims a device
      description: 'Claims a device, associating a device to a user account.

        The user who claimed a device is the device owner,

        which is different from the device vendor.


        Unclaimed devices cannot login or send any data to HERE Tracking.

        A claimed device data is stored in HERE Tracking and is available to the

        device owner''s project, which the device has been claimed to.


        When a device is claimed, it gets assigned a `trackingId`.

        This is a unique ID associated with the device data in HERE Tracking.


        `trackingId` is different from the `deviceId`.

        The `deviceId` is permanently associated with the hardware, while the `trackingId`

        is associated with the device data.

        If the device is later sold or transferred, the `deviceId` remains the same but the

        `trackingId` changes in case the device is reclaimed.

        This way the new owner cannot access the old data.


        If the user is a member of multiple projects, the target project ID needs to be

        specified in the `projectId` query parameter (note that this is different from the `appId`).


        Only users with a valid HERE Tracking license are authorized to claim

        new devices. Claimed devices are associated with the owner

        application ID, and the total device count is kept up-to-date for billing purposes.'
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - name: projectId
        schema:
          type: string
          minLength: 1
          maxLength: 50
          description: 'Project ID.

            Any HERE Tracking user must be a member of a Tracking project.

            The project ID can be implicitly resolved if the user calling the API is a member of a single project.

            If the user is a member of multiple projects, the `projectId` query parameter needs to be specified explicitly.

            '
        in: query
        required: false
      tags:
      - Registry
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerAppId:
                  description: (Deprecated) Application identifier which specifies device owner's application to which the device is associated with.
                  type: string
                  minLength: 8
