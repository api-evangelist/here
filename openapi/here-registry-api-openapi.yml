openapi: 3.2.0
info:
  version: 2.6.11
  title: HERE Tracking Registry API
  description: 'HERE Tracking is a cloud product designed to address location tracking problems for a wide range of Location IoT industry verticals.


    HERE Tracking also includes end-user mobile and web applications that can be used to demonstrate the product.'
  license:
    name: HERE Documentation License
    url: https://legal.here.com/en-gb/terms/documentation-license
servers:
- url: https://tracking.hereapi.com/
- url: https://tracking.api.here.com/
tags:
- description: The Registry service is used for provisioning and claiming devices.
  name: Registry
paths:
  /registry/v2/health:
    get:
      summary: Gets service health
      security: []
      responses:
        '200':
          description: 'OK


            The service is performing as expected

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Health status
                example:
                  message: healthy
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Registry
      operationId: getRegistryV2Health
      x-operation-id-source: derived
  /registry/v2/version:
    get:
      summary: Gets service version
      security: []
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                description: "OK\nService returns its current version number\nschema:\n    type: object\n    properties:\n        \"service-name\":\n            type: string\n            description: Version of service\n    example:\n        servicename: \"1.0.0\"\n"
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Registry
      operationId: getRegistryV2Version
      x-operation-id-source: derived
  /registry/v2/{appId}/devices:
    get:
      summary: Lists all the devices provisioned by a user
      description: Lists all the devices provisioned by a user project identified by the `appId`.
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - description: ID for an application from the user's project
        name: appId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
      - name: pageToken
        description: A token from the previously returned response to retrieve the specified page.
        schema:
          type: string
        in: query
        required: false
      - name: count
        description: The number of items to return per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        in: query
        required: false
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      tags:
      - Registry
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    pageToken:
                      type: string
                      description: A token that can be used to retrieve the next page of the response.
                    count:
                      type: integer
                      minimum: 0
                      maximum: 100
                      default: 100
                      description: The number of items in the response.
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          deviceId:
                            type: string
                            description: The provisioned device ID
                          timestamp:
                            type: integer
                            description: Provisioning time in milliseconds elapsed since 1 January 1970 00:00:00 UTC.
                          externalId:
                            type: string
                            description: Virtual device external ID, only present when the device is virtual
                          appId:
                            type: string
                            description: Virtual device application ID, only present when the device is virtual
                        additionalProperties: false
                        required:
                        - deviceId
                        - timestamp
                  required:
                  - data
                example:
                  data:
                  - deviceId: d34d8c7f-6bd5-496a-adef-7bf2395aa456
                    timestamp: 1548143359339
                  - deviceId: VRDE-40e87f34-59b9-4bd9-827f-f8ff5a8210e8
                    externalId: my-device-1
                    appId: jJHUjhytyGJHJFtftgHG
                    timestamp: 1548143359340
                  count: 2
                  pageToken: 027ffffea253d79fc
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
                code: 400
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request object is in an incorrect format or has values that are invalid or out of range.
                details:
                  hereErrorCode: 400306
          description: 'Bad request


            The request object is in an incorrect format or has values that are invalid or out of range.


            If available, further error details are provided in the response body.

            '
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Unauthorized
                code: 401
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The provided credentials are not valid.
                details:
                  hereErrorCode: 401306
          description: 'Unauthorized


            The request did not provide correct authentication details

            '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Forbidden
                code: 403
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The account does not have the correct privileges.
                details:
                  hereErrorCode: 403306
          description: 'Forbidden


            The account does not have the correct privileges

            '
      operationId: getRegistryV2ByAppIdDevices
      x-operation-id-source: derived
    post:
      summary: Creates licenses for multiple devices
      description: 'Starts a batch job to create licenses for either physical devices or

        virtual devices.


        A physical device license is a `deviceId` and `deviceSecret` credential pair. The batch

        job creates a number of physical device licenses specified by the `count`

        parameter in the request body.

        The response contains an array of `deviceId` and `deviceSecret` pairs.


        Virtual devices are identified with an external device ID and the requestor''s

        project `appId`. The virtual device external ID is application-specific

        and the user is free to allocate it as user finds suitable.

        The external IDs for the virtual devices to be created are specified

        in the `devices` array in request body. For virtual devices

        the response contains only an array of `deviceId`s, but no `deviceSecret`s.


        The `autoclaim` parameter can only be used when creating virtual devices.

        If `autoclaim`=`true`, the created virtual devices are immediately claimed

        by the requesting user account. In this case the response contains also

        tracking IDs for the claimed devices.


        NOTE: Physical devices are deprecated and they should no longer be created.'
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      - description: ID for an application from the user's project
        name: appId
        in: path
        required: true
        schema:
          type: string
          minLength: 8
      - in: query
        name: autoclaim
        description: If set to `true`, the licenses are created and devices are immediately claimed by the same user. Supported only with `deviceId` array in body, and not with the `count` parameter.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  count:
                    type: integer
                    description: Number of device credentials requested
                    minimum: 1
                    maximum: 1000
                required:
                - count
                example:
                  count: 10
              - type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 50
                          description: The external ID for the device
                    minItems: 1
                    maxItems: 100
                required:
                - devices
                example:
                  devices:
                  - id: my-first-device
                  - id: my-second-device
      tags:
      - Registry
      responses:
        '202':
          description: 'Accepted


            The batch job started successfully. Use the `/registry/v2/{jobId}/status` endpoint to

            check the job progess. After the job completes, use the `/registry/v2/{jobId}/results`

            endpoint to get the device licenses.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: The batch job ID, needed for subsequent requests. Valid for 24 hours.
                required:
                - jobId
                additionalProperties: false
                example:
                  jobId: 344a17a4-1b19-4420-bb6f-8400b87071fd
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
                code: 400
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request object is in an incorrect format or has values that are invalid or out of range.
                details:
                  hereErrorCode: 400306
          description: 'Bad request


            The request object is in an incorrect format or has values that are invalid or out of range.


            If available, further error details are provided in the response body.

            '
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Unauthorized
                code: 401
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The provided credentials are not valid.
                details:
                  hereErrorCode: 401306
          description: 'Unauthorized


            The request did not provide correct authentication details

            '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Forbidden
                code: 403
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The account does not have the correct privileges.
                details:
                  hereErrorCode: 403306
          description: 'Forbidden


            The account does not have the correct privileges

            '
        '404':
          description: No app ID found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
                example:
                - error: Unauthorized
                  code: 401
                  id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee
                  message: Invalid Authorization, the request lacks valid authentication credentials for the target resource.
                  details:
                    hereErrorCode: 401306
      operationId: postRegistryV2ByAppIdDevices
      x-operation-id-source: derived
  /registry/v2/{appId}/one-device:
    post:
      summary: Creates a license for a single physical device
      description: 'Device license is a `deviceId` and `deviceSecret` credential pair.

        The created credentials will be returned in the response body.


        If `autoclaim` query parameter is set to `true`, the created device will also be claimed by the same user account.


        NOTE: Physical devices are deprecated and they should no longer be created.'
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

