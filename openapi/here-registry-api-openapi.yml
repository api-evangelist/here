  /registry/v2/{jobId}/status:
    get:
      summary: Gets the multiple device license request job status
      description: Checks the progress of a previously created multiple device license request batch job.
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      - description: An asynchronous job ID. UUID v.4.0.
        name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Registry
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the batch job. When the job status is `complete`, use the `/registry/v2/{jobId}/results` endpoint to get the device licenses
                    enum:
                    - started
                    - complete
                  percent:
                    type: number
                    description: The percentage of the job that was completed at the time of the request.
                    minimum: 0
                    maximum: 100
                example:
                  status: started
                  percent: 10
                additionalProperties: false
                required:
                - status
                - percent
        '400':
          content:
