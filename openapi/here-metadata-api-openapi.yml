        timestamp:
          type: integer
          description: A `timestamp` that indicates when the version was created. The `timestamp` is in milliseconds since UNIX Epoch time.
          format: int64
          example: 1516397474657
        version:
          type: integer
          description: The version of the catalog metadata. It is incremented every time a catalog metadata is changed e.g. by publishing new partitions to durable layers.
          format: int64
          example: 1
