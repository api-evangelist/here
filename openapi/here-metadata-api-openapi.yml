      description: Describes the list of version information for a catalog.
    AdditionalFieldsEnum:
      type: string
      enum:
      - dataSize
      - checksum
      - compressedDataSize
      - crc
    Partition:
      required:
      - partition
      - version
      type: object
      properties:
        layer:
          type: string
          description: Id of the layer this partition belongs to.
          example: test-layer
        checksum:
          type: string
          description: The checksum field is optional. The response includes the checksum only if `checksum` is specified in the `additionalFields` query parameter, and if a checksum was specified in the partition metadata when it was published. The algorithm used to calculate the checksum is user-specific. Algorithms that can be used are, for example, MD5 or SHA1. The algorithm is defined in the layer configuration. And if it is not defined in the catalog configuration, consumers cannot make any assumptions on the algorithm that was used to calculate the checksum. The checksum of the data content can be used if data comparison needs to be working for this catalog. The maximum length of the checksum field is 128 characters. In the case of the compressed data, the checksum is calculated for the uncompressed data.
          example: 291f66029c232400e3403cd6e9cfd36e
        compressedDataSize:
          type: integer
          description: Optional value for the size of the compressed partition data in bytes. The response only includes the compressed data size if `compressedDataSize` is specified in the `additionalFields` query parameter, and if compression is enabled, and if `compressedDataSize` was specified in the partition metadata when it was published.
          format: int64
          example: 1024
        dataHandle:
          type: string
          description: The data handle is used when retrieving the data that relates to this partition. The data handle identifies a specific blob so that the blob's contents can be requested with the Blob API. When requesting data from the Blob API, the catalog ID, layer ID and the dataHandle must be specified. An empty data handle indicates the removal of this partition.
          example: 1b2ca68f-d4a0-4379-8120-cd025640510c
        dataSize:
          type: integer
          description: Optional value for the size of the partition data in bytes. The response only includes the data size if `dataSize` specified in the `additionalFields` query parameter, and if `dataSize` was specified in the partition metadata when it was published.
          format: int64
          example: 1024
        crc:
          type: string
          description: Optional value for the CRC of the partition data in bytes. The response only includes the data size if `crc` is specified in the `additionalFields` query parameter, and if `crc` was specified in the partition metadata when it was published.
          example: c3f276d7
        partition:
          type: string
          pattern: '[a-zA-Z0-9_\-\.:]'
          description: The partition key. This is a unique key for a partition within a layer. If the layer's partitioning scheme is set to `heretile`, the partition key is equivalent to the tile key. The partition key cannot be empty. The maximum length of the partition key is 500 characters.
          example: '314010583'
        version:
          type: integer
          description: For active versioned partitions, the version of the catalog when this partition was last changed. For volatile partitions this will always be -1
          format: int64
          example: 1
      description: Describes the partition object which is unique within a layer.
