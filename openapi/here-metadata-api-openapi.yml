        hrn:
          type: string
          example: hrn:here:data:::my-catalog
          description: The HERE Resource Name (HRN) of a catalog.
        version:
          type: integer
          format: int64
          example: 24
          description: The version of the catalog metadata.
    PartsResponse:
      type: object
      properties:
        parts:
          type: array
          example:
          - eyJwYXJ0SW5kZXgiOjEsIm1heFBhcnRzIjo1LCJzY29wZSI6InBwIn0
          - eyJwYXJ0SW5kZXgiOjMsIm1heFBhcnRzIjo1LCJzY29wZSI6InBwIn0
