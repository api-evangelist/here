                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          description: 'Missing Authorization header.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403':
          description: 'An error has occurred.

            * E110000 - Subject does not have the required *"manageIdentityProviders"* access to the *realm*.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          description: 'An error has occurred.

            * E110000 - The requested Identity Provider and/or Identity Provider Issuer Attachment does not exist.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
      security:
      - Bearer: []
components:
  schemas:
    IdentityProviderList:
      type: object
      required:
      - count
      - total
      - items
      properties:
        count:
          type: integer
          description: The number of IdentityProviders in this page of the List.
        total:
          type: integer
          description: The total number of IdentityProviders in the List.
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProvider'
          description: List of IdentityProviders.
        pageToken:
          type: string
          description: "A pointer to the next page of results, if any.  \nNot present if there are no more results after the current page.\n"
    ErrorMessage:
      type: object
      required:
      - title
      - status
      - code
      - cause
      - action
      - correlationId
      example:
        title: Input data failed validation
        status: 400
        code: E110000
        cause: The input data in question does not meet validation rules
        action: Actionable instructions for the user.
        correlationId: 6c1bce6d-d31f-4275-9d9f-6832d8ba2377
      properties:
        title:
          type: string
          description: Title of the error.
        status:
          type: integer
          minimum: 0
          maximum: 999
          description: HTTP status code of error message.
        code:
          type: string
          description: Identifier for the detailed error code for programmatic error handling.
        cause:
          type: string
          description: The cause of the error.
        action:
          type: string
          description: Actionable instructions for the user.
        correlationId:
          type: string
          description: The Correlation ID for the request for tracking purposes.
    AddIdentityProviderRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Unique identifier the Identity Provider within a Realm
          example: widgets-op
        name:
          type: string
          description: User-friendly name for the Identity Provider
          example: Widgets Provider
        description:
          type: string
          description: Detailed text description of the Identity Provider
          example: The Widgets Provider is used with vehicles shipped in the Whatzit market.
        issuers:
          type: array
          minLength: 1
          maxLength: 2
          items:
            type: object
            required:
            - issuer
            properties:
              issuer:
                type: string
                description: OpenID Connect Provider Issuer URL.
                example: https://op.example.com
        accountType:
          type: string
          description: Always "device" for now.  Reserved for future use, new account types may be added in the future.
          enum:
          - device
          default: device
          example: device
        enabled:
          type: boolean
          description: Defines if the Identity Provider is enabled
          example: true
    UpdateIdentityProviderIssuerAttachmentRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: indicates whether the configured OpenID Connect Provider is enabled for use in the Realm
          default: true
          example: true
    UpdateIdentityProviderRequest:
      type: object
      properties:
        name:
          type: string
          description: User-friendly name for the Identity Provider
          example: Widgets Provider
        description:
          type: string
          description: Detailed text description of the Identity Provider
          example: The Widgets Provider is used with vehicles shipped in the Whatzit market.
    IdentityProvider:
      type: object
      required:
      - id
      - accountType
      - realm
      properties:
        id:
          type: string
          description: Unique identifier the OpenID Connect Provider within the Realm.
          example: example-op
        hrn:
          type: string
          description: HRN for the Realm Provider
          example: hrn:here:account::org123456789:identityProviders/example-op
        name:
          type: string
          description: User-friendly name for the OpenID Connect Provider
          example: Example OP
        description:
          type: string
          description: Detailed text description of the Identity Provider
          example: The Widgets Provider is used with vehicles shipped in the Whatzit market.
        accountType:
          type: string
          description: Always "device" for now.  Reserved for future use, new account types may be added in the future.
          enum:
          - device
          default: device
          example: device
        realm:
          type: string
          description: HRN of the Realm within which the OpenID Connect Provider is trusted.
        created:
          type: string
          format: date-time
          example: '2023-01-21T17:32:28Z'
        issuers:
          type: array
          maxLength: 2
          items:
            type: object
            required:
            - issuer
            properties:
              issuer:
                type: string
                description: OpenID Connect Provider Issuer URL.
                example: https://op.example.com
              enabled:
                type: boolean
                description: true to enable an individual issuer URL.
                default: true
    IdentityProviderIssuerAttachmentList:
      type: object
      required:
      - count
      - total
      - items
      properties:
        count:
          type: integer
          description: The number of IdentityProviderIssuerAttachments in this page of the List.
        total:
          type: integer
          description: The total number of IdentityProviderIssuerAttachments in the List.
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProviderIssuerAttachment'
          description: List of IdentityProvider Issuer Attachments.
          maxItems: 2
        pageToken:
          type: string
          description: 'A pointer to the next page of results, if any.

            Not present if there are no more results after the current page.

            '
    IdentityProviderIssuerAttachment:
      type: object
      required:
      - identityProvider
      - issuer
      - enabled
      properties:
        identityProvider:
          type: string
          description: IdentityProvider HRN
          example: hrn:here:account::org123456789:identityProviders/example-op
        issuer:
          type: string
          description: OIDC Issuer URL
          example: https://op.example.com
        enabled:
          type: boolean
          description: indicates whether the configured OpenID Connect Provider is enabled for use in the Realm
          default: true
          example: true
    CreateIdentityProviderIssuerAttachment:
      type: object
      properties:
        enabled:
          type: boolean
          description: indicates whether the configured OpenID Connect Provider is enabled for use in the Realm
          default: true
          example: true
  parameters:
    Realm:
      in: path
      required: true
      name: realm
      schema:
        type: string
      description: "HRN identifying the Realm.  You can also use the shorthand \"me\" to refer to the Realm HRN indicated by your \naccess token context.\n"
      example: hrn:here:account::org123456789:realm/org123456789
    Limit:
      in: query
      name: limit
      required: false
      description: Number of records to return. Default is 100 records. Maximum is 100 records.
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 100
    XCorrelationId:
      in: header
      name: X-Correlation-ID
      schema:
        type: string
      required: false
      description: 'Correlates HTTP requests between a client and server. If not present in the incoming request, it will be generated. This header and value will be included in all loglines including access logs. It will also be propagated to downstream services and returned in the response.

        '
    XRequestId:
      in: header
      name: X-Request-ID
      schema:
        type: string
      required: false
      description: 'The unique for the request, used to track this request within the service. X-Request-ID value is NOT propagated to the downstream services.

        '
    PageToken:
      name: pageToken
      in: query
      required: false
      description: 'If there are more records than ''limit'' (between 1 and 100), and there are multiple pages of records, ''pageToken'' allows for retrieval of individual pages. In order to retrieve subsequent pages, the client should provide the pageToken returned in the result from the previous API call as input to the following API call.


        Example: If the result for a call to GET /items returns *{..., "pageToken": "abcdefg"}*, in order  to retrieve the next page of ''items'' the client should call GET /items?pageToken=abcdefg

        '
      schema:
        type: string
    IdentityProvider:
      in: path
      required: true
      name: identityProvider
      schema:
        type: string
      description: 'HRN identifying the IdentityProvider.

        '
      example: hrn:here:account::org123456789:identityProvider/example-op
    Issuer:
      in: path
      required: true
      name: issuer
      schema:
        type: string
      description: 'OIDC Issuer URL.

        '
      example: https://op.example.com
  headers:
    XCorrelationId:
      schema:
        type: string
      required: false
      description: The X-Correlation-ID for the request, used to track this request in the platform. X-Correlation-ID value is propagated throughout the platform.
    XRequestId:
      schema:
        type: string
      required: false
      description: The unique id for the request, used to track this request within the service. X-Request-ID value is NOT propagated to the downstream services.
  securitySchemes:
    UserOrClientBearerToken:
      type: http
      scheme: bearer
      description: Bearer Token issued to either User or Client.
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A HERE access token obtained from one of the supported OAuth 2.0 authorization flows.

        For more information on how to get a bearer token, see the

        [https://www.here.com/docs/bundle/identity-and-access-management-developer-guide/page/README.html](Identity & Access Management Guide).

        '
externalDocs:
  description: The developer guide and related API references are available here.
  url: https://www.here.com/docs/category/identity-and-access-management
