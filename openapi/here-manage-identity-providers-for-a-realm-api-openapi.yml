openapi: 3.2.0
info:
  title: Authentication API v1.1 Manage Identity Providers for a…
  version: 1.1.x
  description: 'This specification describes the Authentication v1.1 APIs.

    NOTE: Swagger UI automatically URL encodes parameters when required.

    If/when the APIs are called elsewhere make sure to URL encode the parameters when required.'
servers:
- url: Use API Lookup for a base URL
tags:
- name: Manage Identity Providers for a Realm
  description: APIs to manage Identity Providers trusted in a Realm.
paths:
  /realms/{realm}/identityProviders:
    parameters:
    - $ref: '#/components/parameters/Realm'
    - $ref: '#/components/parameters/XRequestId'
    - $ref: '#/components/parameters/XCorrelationId'
    post:
      tags:
      - Manage Identity Providers for a Realm
      summary: Add a new trusted OpenID Connect Identity Provider to a Realm
      operationId: addIdentityProvider
      description: 'Add a new trusted Identity Provider to a Realm.

        Currently, only OAuth 2.0/OpenID Connect Providers can be used.


        **NOTE:** You can create a maximum of 5 Identity Providers in a Realm.


        Access Control:

        * The calling principal must have either **"manageIdentityProviders"** action permission for the resource **"{realm}"** in the **"account"** service.

        * The calling principal MUST NOT include a project scope.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIdentityProviderRequest'
            example:
              id: example-op
              name: Example OP
              issuers:
              - issuer: https://op.example.com
              accountType: device
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
              example:
                id: example-op
                name: Example OP
                hrn: hrn:here:account::org123456789:identityProviders/example-op
                issuers:
                - issuer: https://op.example.com
                  enabled: true
                accountType: device
                realm: hrn:here:account::org123456789:realm/org123456789
                created: '2023-01-21T17:32:28Z'
        '400':
          description: 'Bad Request.

            * E110000 - Missing required field, etc.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          description: 'Missing or invalid Authorization header.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403':
          description: 'An error has occurred.

            * E110000 - Subject does not have the required "manageIdentityProviders" access to the Realm.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422':
          description: 'An error has occurred.

            * E110000 - Maximum number of Identity Providers exceeded for the Realm.  The maximum is 10.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
      security:
      - Bearer: []
    get:
      tags:
      - Manage Identity Providers for a Realm
      summary: List trusted OpenID Connect Identity Providers for a Realm
      operationId: listIdentityProviders
      description: 'List trusted OpenID Connect Providers for a Realm.


        Access Control:

        * The calling principal must have either **"readIdentityProviders"** action permission for the resource **"{realm}"** in the **"account"** service.

        * The calling principal MUST NOT include a project scope.'
      parameters:
      - $ref: '#/components/parameters/PageToken'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderList'
              example:
                count: 1
                total: 1
                items:
                - id: example-op
                  hrn: hrn:here:account::org123456789:identityProviders/example-op
                  name: Example OP
                  description: Use the Example OP when integrating new cars.
                  accountType: device
                  realm: hrn:here:account::org123456789:realm/org123456789
                  created: '2023-01-21T17:32:28Z'
                  issuers:
                  - issuer: https://op.example.com
                    enabled: true
        '400':
          description: 'Bad Request.

            * E110000 - Missing required field, etc.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          description: 'Missing or invalid Authorization header.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403':
          description: 'An error has occurred.

            * E110000 - Subject does not have the required "readIdentityProviders" access to the Realm.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
      security:
      - Bearer: []
