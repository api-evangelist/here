              $ref: '#/components/examples/504errorResponseExample_2'
    Error400TileResponse_2:
      description: Invalid parameters were provided.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
