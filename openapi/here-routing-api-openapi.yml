      properties:
        ref:
          $ref: '#/components/schemas/RoutingZoneReference'
        type:
          description: "Extensible enum: `environmental` `vignette` `...`  \nThe type of the routing zone. A routing zone is defined based on an underlying feature/resource.\nThe standard representation of a routing zone reference is `{catalogHrn}:{catalogVersion}:({layerId})?:{tileId}:{zoneId}` (refer to `RoutingZoneReference` description in this document for details).\n`{zoneId}` represents the identifier of the underlying feature/resource within the catalog, in the `\"domain:system:type:id\"` format.\nThis attribute corresponds to the `\"domain:system:type\"` portion of the identifier.\nE.g. `type=environmental` corresponds to the `\"here:cm:envzone\"` portion of the identifiers of all environmental zones within a catalog.\n\nTo further distinguish between the sub-categories of the `type` (if applicable) use the `category` attribute.\n\nNOTE: To maintain legacy support `type=vignette` is not renamed but corresponds to the `\"here:cm:tollsystem\"` portion of the identifier for all toll cost features.\n"
          type: string
          x-extensible-enum:
          - environmental
          - vignette
        name:
          description: The routing zone's name.
          type: string
        category:
          description: "Extensible enum: `environmental` `vignette` `congestionPricing` `...`  \nThe category of the routing zone. Corresponds to the sub-category (if applicable) of the feature/resource defining a routing zone, e.g. `vignette` and `congestionPricing` sub-categories of the toll cost features.\n"
          type: string
          x-extensible-enum:
          - environmental
          - vignette
          - congestionPricing
    EVPhysicalModel:
      description: Specifies parameters required for calculation of energy consumption for electric vehicles using physical model.
      type: object
      properties:
        auxiliaryPowerCurve:
          description: 'Function curve specifying power consumed by the vehicle''s auxiliary systems as a function of time.

            Use this instead of the single-valued `auxiliaryPowerConsumption` or `auxiliaryConsumption` when auxiliary consumption is not constant.

            Empirical model uses `auxiliaryConsumption` parameter, while physical model has `auxiliaryPowerConsumption` parameter.

            Only one of these three different parameters can be set.


            When using this with the empirical model, please note unit difference with `auxiliaryConsumption`.


            The format of the string is a pipe separated list of number pairs, as follows:


            ```

            <TIME_0>,<POWER_0>|<TIME_1>,<POWER_1>|...|<TIME_N>,<POWER_N>

            ```


            where time values are strictly increasing non-negative integer values in seconds, representing elapsed driving time since the start of the route, and power values are strictly decreasing non-negative floating point values in watts.

            The function is piecewise constant, e.g., for any elapsed time in the range `[TIME_0, TIME_1]` the value of the function is `POWER_0`.

            For time greater than `TIME_N`, the value of the function is `POWER_N`. TIME_0 must be explicitly set to zero.

            The time in the last pair, `TIME_N`, can be at most 1800 (30 minutes).


            Auxiliary consumption applies during stops, including charging stops.

            At charging stops, power used for charging is reduced by the amount used for auxiliary consumption.


            The list can have a maximum of six `TIME`,`POWER` pairs.


            **Note**: When using this feature `departureTime` cannot be set to `any`.


            **Note:** This is a **beta** release of this feature and may contain bugs or exhibit unexpected behaviour. Related APIs are subject to change without a deprecation process.

            '
          type: string
        driveEfficiency:
          description: 'The proportion of the energy drawn from the battery that is used to move the vehicle. (This is to factor in energy losses through heat in the motors, for example.)

            **Note:** This attribute is required when using the physical model `consumptionModel=physical` for EV consumption.

            '
          type: number
          minimum: 0.1
          maximum: 1
        recuperationEfficiency:
          description: 'The proportion of the energy gained when braking or going downhill that can be recuperated and restored as battery charge.

            **Note:** This attribute is required when using the physical model `consumptionModel=physical` for EV consumption.

            '
          type: number
          minimum: 0
          maximum: 1
        auxiliaryPowerConsumption:
          description: 'Power (in W) consumed by the vehicle''s auxiliary systems (for example, air conditioning, lights).


            Auxiliary power consumption applies during stops, including charging stops.

            At charging stops, power used for charging is reduced by the amount used for auxiliary consumption.

            '
          type: number
          minimum: 0
        airDensity:
          description: 'The density of air (in kg/m³) used for calculating aerodynamic drag.

            '
          type: number
          minimum: 0.5
          maximum: 2
          default: 1.225
        initialCharge:
          description: 'Charge level of the vehicle''s battery at the start of the route (in kWh).

            Value must be less than or equal to the value of `maxCharge`.

            '
          type: number
          minimum: 0
          maximum: 1000
        maxCharge:
          description: 'Total capacity of the vehicle''s battery (in kWh).

            '
          type: number
          minimum: 0
          maximum: 1200
        chargingCurve:
          description: 'Function curve describing the maximum battery charging rate (in kW) at a given charge level (in kWh).


            The format of the string is a comma-separated list of numbers, as follows:


            ```

            <CHARGE_0>,<RATE_0>,<CHARGE_1>,<RATE_1>,...,<RATE_N>,<CHARGE_N>

            ```


            where charge values are strictly increasing, non-negative floating-point values in units

            of (kWh), and rate values are positive floating point values in units of (kW).


            Charge values must cover the entire range of `[0, maxChargeAfterChargingStation`]. The

            charging curve is piecewise constant, e.g., for any charge in the range `[CHARGE_0,

            CHARGE_1)`, the value of the function is `RATE_0`.


            Maximum value of rate must not be greater than 2000 kW. The values of charge in the curve are only validated up to the value of `maxChargeAfterChargingStation` since values outside this range are not used.

            Minimum value of rate must not be less than 7kW. The values of charge in the curve are only validated up to the value of `maxChargeAfterChargingStation` since values outside this range are not used.


            The algorithm calculates a route as the best possible combination of driving and charging

            parts and uses the charging curve to evaluate the most efficent range of

            charging. For example, if the rate of charging is high at lower levels of battery, but slows down significantly after charging a little, stopping

            often and charging less, but quicker, at each station might be better for the overall route.

            Because batteries lose charging speed with use, providing a charging curve for the

            exact battery would give more accurate charging time estimate than providing a

            generic curve for all batteries of one type.

            '
          type: string
          example: 0,207,28.761,207,29.011,173,43.493,173,43.743,145,51.209,145,51.459,113,56.120,113,56.370,87,80.0,10
        maxChargingVoltage:
          description: 'Maximum charging voltage supported by the vehicle''s battery (in Volt).

            '
          type: number
          minimum: 0
          maximum: 2000
        maxChargingCurrent:
          description: 'Maximum charging current supported by the vehicle''s battery (in Ampere).

            '
          type: number
          minimum: 0
          maximum: 2000
        maxChargeAfterChargingStation:
          description: 'Maximum charge to which the battery should be charged at a charging station (in kWh).

            Value must be less than or equal to the value of `maxCharge`.


            The algorithm calculates a route as the best possible combination of driving and charging

            parts so charging at a charging station does not happen strictly to the value of

            this parameter. Instead, the algorithm attempts to leave every station with

            different charge levels, and only the best possible combination of charging stations

            and target charge will form the final route.


            For example, if there is a fast but not reachable charging station on the route,

            the algorithm prefers first to charge at a slower station, but only to a level that enables it

            to reach the fast station. This way it calculates the best possible combination of driving

            and charging parts.

            '
          type: number
          minimum: 0
        minChargeAtChargingStation:
          description: 'Minimum charge when arriving at a charging station (in kWh).

            Value must be less than the value of `maxChargeAfterChargingStation`.


            The algorithm calculates a route as the best possible combination of driving and charging

            parts so visiting a charging station is planned not when the remaining charge is close

            to the value of this parameter but when it is part of the best possible charging

            plan for the given route.


            For example, it might prefer charging a still half-full battery at the fast charging station because

            there are only slower stations later on the route and the remaining charge is not

            enough to reach the destination without charging at all.

            '
          type: number
          minimum: 0
        minChargeAtFirstChargingStation:
          description: 'Minimum charge when arriving at first charging station (in kWh).

            Value must be less than the value of `maxChargeAfterChargingStation`.


            This overrides `minChargeAtChargingStation` for the first charging station. If not specified, `minChargeAtChargingStation`

            will be used for all charging stations, including the first one.


            This is usually used when the current charge is too low to reach a charging station within `minChargeAtChargingStation` limits.

            '
          type: number
          minimum: 0
        minChargeAtDestination:
          description: 'Minimum charge at the final route destination (in kWh).

            Value must be less than the value of `maxChargeAfterChargingStation`.


            The algorithm calculates a route as the best possible combination of driving and charging

            parts while making sure that the actual value of the charge at the destination would be close to the

            value of this parameter. I.e., the resulting value is expected to be bigger

            than this parameter''s value by no more than 10% of the battery capacity.

            '
          type: number
          minimum: 0
        chargingSetupDuration:
          description: 'Time spent (in seconds) after arriving at a charging station but before actually charging

            (for example, time spent for payment processing).

            '
          type: integer
          format: int32
          minimum: 0
          maximum: 1800
        maxChargingDuration:
          description: 'Maximum time spent (in seconds) at a charging station unless otherwise specified in a user-introduced charging waypoint. Charging waypoint may

            specify max or min duration, both of which can be higher. (see documentation for the `via` parameter)

            '
          type: integer
          format: int32
          minimum: 1800
        connectorTypes:
          description: "Comma-separated list of connector types that are compatible with the vehicle. If `makeReachable` is set to `true`,\nthen only stations with any of these connector types will be evaluated as a potential charging stop.\nFor stations with multiple compatible connectors, the charging time is based on the connector type with the highest power rating among them.\n\nCurrently supported connector types are:\n  * `iec62196Type1Combo`:  Type 1 Combo connector, commonly called \"CCS1\"\n  * `iec62196Type2Combo`:  Type 2 Combo connector, commonly called \"CCS2\"\n  * `chademo`: CHAdeMO connector\n  * `tesla`: Deprecated alias for `saeJ3400`. Use `saeJ3400` instead. Cannot be used in combination with `saeJ3400`\n  * `saeJ3400`: North American Charging Standard (NACS) connector.\n  * `gbtDc`: Guobiao GB/T 20234.3 DC connector\n"
          type: string
          example: iec62196Type1Combo,chademo
        maxPowerAtLowVoltage:
          description: 'The maximum power (in kW) at which a vehicle can charge given these conditions:

            * The charging station connector''s maximum supply voltage < 800 V.

            * The vehicle''s `maxChargingVoltage` >= 800 V.


            The `consumablePower` at a station is then taken to be the lower of `maxPowerAtLowVoltage` and the charging station''s available power.

            '
          type: number
          minimum: 0
          default: 45
        maxDrivingTimeBeforeCharge:
          description: 'The maximum driving time before the first charging stop. This attribute can be used in conjunction with `minTimeAtFirstChargingStation`

            to delay the charging stop and extend it, if required, up to the mandated rest period for the drivers. When this attribute is provided, `minTimeAtFirstChargingStation`

            is also required.

            '
          type: number
          maximum: 18000
        minTimeAtFirstChargingStation:
          description: 'The minimum duration at the first charging stop, including the charging time and subsequent waiting time.

            This attribute can be used as standalone or in conjunction with `maxDrivingTimeBeforeCharge`.

            '
          type: number
          minimum: 1
          maximum: 1800
      required:
      - driveEfficiency
      - recuperationEfficiency
    MatchTracePoint:
      type: object
      description: GPS probe point with parameters relevant to path or route matching
      properties:
        lat:
          description: Latitude in degrees
          type: number
          format: double
        lng:
          description: Longitude in degrees
          type: number
          format: double
      required:
      - lat
      - lng
    CalculateRoutesPostParameters:
      description: Parameters of the POST body for route calculation
      type: object
      properties:
        avoid:
          $ref: '#/components/schemas/AvoidPost'
        exclude:
          $ref: '#/components/schemas/ExcludePost'
        ev:
          $ref: '#/components/schemas/EVPost'
        maxSpeedOnSegment:
          $ref: '#/components/schemas/MaxSpeedOnSegmentPost'
        networkRestrictedTruck:
          $ref: '#/components/schemas/NetworkRestrictedTruckPost'
    StreetAttributes:
      description: "Extensible enum: `rightDrivingSide` `dirtRoad` `tunnel` `bridge` `ramp` `motorway` `roundabout` `underConstruction` `dividedRoad` `privateRoad` `controlledAccessHighway` `builtUpArea` `...`  \n`StreetAttributes` is applied to a span of a route section and describes attribute flags of a street. The following flags can be assigned:\n* `rightDrivingSide`: Vehicles must drive on the right-hand side of the road in this part of the route.\n* `dirtRoad`: This part of the route has an unpaved surface, such as a gravel or dirt road.\n* `tunnel`: This part of the route passes through a tunnel.\n* `bridge`: This part of the route crosses a bridge.\n* `ramp`: This part of the route is a ramp, typically connecting to or from highways.\n* `motorway`: This part of the route is a controlled access road, typically a highway with motorway signage.\n* `roundabout`: This part of the route includes a roundabout.\n* `underConstruction`: This part of the route is currently under construction.\n* `dividedRoad`: This part of the route uses a road with a physical or legal divider in the middle, separating opposing traffic flows.\n* `privateRoad`: This part of the route uses a privately owned road.\n* `controlledAccessHighway`: This part of the route is either a controlled access road, limited access road, or both.\n* `builtUpArea`: This part of the route most likely passes through a built-up area.\n\nIt is possible that new street attributes may be supported in the future. When encountering unknown street attributes, e.g., in the software parser, it is recommended to ignore them.\n"
      type: string
      x-extensible-enum:
      - rightDrivingSide
      - dirtRoad
      - tunnel
      - bridge
      - ramp
      - motorway
      - roundabout
      - underConstruction
      - dividedRoad
      - privateRoad
      - controlledAccessHighway
      - builtUpArea
    ChargePointOperator:
      type: object
      description: Information about the charging station charge-point-operator
      properties:
        id:
          description: 'Charging station charge-point-operator ID.

            '
          type: string
        name:
          description: Charge-point-operator name
          type: string
    TransitTransport_2:
      type: object
      description: Transit transport information.
      properties:
        mode:
          $ref: '#/components/schemas/TransitMode_2'
        name:
          type: string
          description: Transit line name
          example: U2
        headsign:
          description: Transit line headsign
          type: string
        category:
          description: Human readable transport category (such as Bus, Gondola, Tram, Train, ...)
          type: string
          example: Train
        color:
          description: Color of the transport polyline and background for the transport name.
          allOf:
          - $ref: '#/components/schemas/Color'
        textColor:
          description: Color of the transport name.
          allOf:
          - $ref: '#/components/schemas/Color'
        shortName:
          description: Short name of a transit line.
          type: string
          example: U2
        longName:
          description: Long name of a transit line.
          type: string
          example: Pankow - Ruhleben
      required:
      - mode
    FarePassValidityPeriod:
      type: object
      description: Specifies a temporal validity period for a pass
      properties:
        period:
          description: "Extensible enum: `annual` `extendedAnnual` `minutes` `days` `months` `...`  \nSpecifies one of the following validity periods:\n  - `annual`: pass is valid from Jan 1 to Dec 31\n  - `extendedAnnual`: pass is valid from Jan 1 to Jan 31 of the following year\n  - `minutes`: pass is valid for a specified number of minutes See `unit`.\n  - `days`: pass is valid for a specified number of days. See `unit`.\n  - `months`: pass is valid for a specified number of months. See `unit`.\n"
          type: string
          x-extensible-enum:
          - annual
          - extendedAnnual
          - minutes
          - days
          - months
        count:
          description: Required if period is `minutes`, days` or `months`, it specifies how many of these units are covered by the pass.
          type: integer
      required:
      - period
    DynamicSpeedInfo:
      type: object
      description: 'Describes dynamic speed information, such as traffic speed, estimated speed without traffic, and turn time.

        '
      properties:
        trafficSpeed:
          description: 'Estimated speed (in meters per second) of a vehicle on the road-segment, taking into account traffic-related constraints.

            **Note:** Will be the same as `baseSpeed` if `traffic[mode]=disabled` is specified.

            '
          allOf:
          - $ref: '#/components/schemas/Speed'
        baseSpeed:
          description: Estimated speed (in meters per second) without considering any traffic-related constraints.
          allOf:
          - $ref: '#/components/schemas/Speed'
        turnTime:
          description: 'Estimate of the time (in seconds) it takes to turn from this span into the next. It takes into account both traffic conditions and the specific transport-mode.

            '
          allOf:
          - $ref: '#/components/schemas/Duration'
      required:
      - trafficSpeed
      - baseSpeed
      - turnTime
    TransitSection_2:
      type: object
      description: A section of the route. It contains departure, arrival, and route information.
      properties:
        id:
          description: Unique identifier of the section
          type: string
        type:
          description: Section type used by the client to identify what extension to the BaseSection are available.
          type: string
          enum:
          - transit
        preActions:
          description: Actions that must be done prior to `departure`.
          type: array
          items:
            $ref: '#/components/schemas/TransitPreAction'
        actions:
          description: 'Actions that must be done during the travel portion of the section.


            Action offsets represent the coordinate index in the polyline.


            *NOTE:* currentRoad and nextRoad are not populated for actions.

            '
          type: array
          items:
            $ref: '#/components/schemas/TransitAction'
        language:
          description: Language of the localized strings in the section, if any, in BCP47 format.
          type: string
        postActions:
          description: Actions that must be done after `arrival`.
          type: array
          items:
            $ref: '#/components/schemas/TransitPostAction'
        turnByTurnActions:
          description: Actions for turn by turn guidance during the travel portion of the section, i.e., between `departure` and `arrival`.
          type: array
          items:
            $ref: '#/components/schemas/TransitTurnByTurnAction'
        departure:
          $ref: '#/components/schemas/TransitDeparture_2'
        arrival:
          $ref: '#/components/schemas/TransitDeparture_2'
        passthrough:
          description: 'List of via waypoints this section is passing through.


            Each via waypoint of the request that is a `passThrough=true` waypoint, appears as a

            `Passthrough` in the response. It appears in the section that starts with the closest

            non-passthrough via specified before it or origin.


            The passthrough vias appear in this list in the order they are traversed. They are

            traversed in the order they are specified in the request.

            '
          type: array
          items:
            $ref: '#/components/schemas/Passthrough'
        summary:
          description: 'Total value of key attributes (e.g., duration, length) summed up for the entire section, including `preActions`, `postActions`,

            and the travel portion of the section.

            '
          allOf:
          - $ref: '#/components/schemas/BaseSummary'
        travelSummary:
          description: 'Total value of key attributes (e.g., duration, length) summed up for just the travel portion of the section,

            between `departure` and `arrival`. `preActions` and `postActions` are excluded.

            '
          allOf:
          - $ref: '#/components/schemas/BaseSummary'
        polyline:
          $ref: '#/components/schemas/Polyline'
        notices:
          description: 'Contains a list of issues related to this section of the route.

            '
          type: array
          items:
            $ref: '#/components/schemas/TransitNotice_2'
        bookingLinks:
          description: Links to external ticket booking services
          type: array
          items:
            $ref: '#/components/schemas/WebLinkWithDeviceType_2'
        transport:
          $ref: '#/components/schemas/TransitTransport_2'
        intermediateStops:
          description: 'Intermediate stops between departure and destination of the transit line. It can be missing if this information is not available or not requested.

            '
          type: array
          items:
            $ref: '#/components/schemas/TransitStop_2'
        agency:
          $ref: '#/components/schemas/Agency'
        attributions:
          description: List of required attributions to display.
          type: array
          items:
            $ref: '#/components/schemas/Attribution'
        fares:
          description: '"List of tickets to pay for this section of the route"


            **NOTE**: Fares information support will be available soon.

            '
          type: array
          items:
            $ref: '#/components/schemas/Fare_2'
        booking:
          description: '**NOTE:** Attribute booking is deprecated. Please, use bookingLinks instead of it.

            '
          deprecated: true
          allOf:
          - $ref: '#/components/schemas/WebLink'
        spans:
          type: array
          description: 'Span attached to a `Section` describing transit content.

            '
          items:
            $ref: '#/components/schemas/TransitSpan'
        refReplacements:
          $ref: '#/components/schemas/RefReplacements'
        incidents:
          description: A list of all incidents that apply to the section.
          type: array
          items:
            $ref: '#/components/schemas/TransitIncident'
      required:
      - id
      - type
      - departure
      - arrival
    WebLinkWithDeviceType_2:
      type: object
      description: The URL address to an external resource.
      properties:
        id:
          description: Unique identifier for the web link. It is used to deduplicate links defined in multiple sections.
          type: string
        href:
          $ref: '#/components/schemas/Uri'
        text:
          description: Text describing the url address (e.g. The example website).
          type: string
        hrefText:
          description: 'The interactive (or clickable) portion of the text. If not present (default), the entire content of the text attribute will be considered.

            '
          type: string
        deviceType:
          description: "Extensible enum: `web` `ios` `android` `...`  \nDevice type for which the link is intended\n"
          type: string
          x-extensible-enum:
          - web
          - ios
          - android
      required:
      - id
      - text
      example:
        id: 88-7568-21.07.2023
        text: Information for public transit provided by ThePublicTransit GmbH
    VehiclePostAction:
      description: Action attached to a vehicle section that must be done after `arrival`.
      discriminator:
        propertyName: action
        mapping:
