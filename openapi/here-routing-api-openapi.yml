    PolygonAreaWithExceptions:
      description: 'A polygon defined as a list of coordinates.

        Self-intersecting polygons are not supported.

        Can be expanded to include excepted areas that are excluded from the current polygon area.

        '
      type: object
      required:
      - type
      - outer
      properties:
        type:
          type: string
          example: polygon
        outer:
          type: array
          description: List of coordinates defining the outline of the polygon.
          items:
            $ref: '#/components/schemas/Coordinate'
          minItems: 3
          maxItems: 100
        exceptions:
          type: array
          description: Optional list of areas to exclude from avoidance.
          items:
            $ref: '#/components/schemas/Area'
          minItems: 0
    TransitNotice_2:
      type: object
      description: A notice contains important notifications.
      properties:
        title:
          type: string
          description: Human-readable notice description.
          example: No schedule
        code:
          type: string
          description: "Extensible enum: `noSchedule` `noIntermediate` `unwantedMode` `scheduledTimes` `simplePolyline` `violatedAvoidFerry` `violatedAvoidRailFerry` `violatedBlockedRoad` `violatedVehicleRestriction` `seasonalClosure` `currentWeightNegative` `currentWeightExceedsLimit` `travelTimeExceedsDriverWorkHours` `vehicleRestriction` `...`  \nCurrently known codes (non-exhaustive: this list could be extended for new situations):\n\n| Code      | Description  | Severity |\n| --------- | ------- | ------- |\n| noSchedule | A timetable schedule is not available for the transit line in this section, and only the run frequency is available. As a result, departure/arrival times are approximated | info |\n| noIntermediate | Information about intermediate stops is not available for this transit line | info |\n| unwantedMode | This section contains a transport mode that was explicitly disabled. Mode filtering is not available in this area | info |\n| scheduledTimes | The times returned on this section are the scheduled times even though delay information are available | info |\n| simplePolyline | An accurate polyline is not available for this section. The returned polyline has been generated from departure and arrival places | info |\n| violatedAvoidFerry | Route did not manage to avoid user preference | critical |\n| violatedAvoidRailFerry | Route did not manage to avoid user preference | critical |\n| violatedBlockedRoad | Route uses form of transit that are blocked due to `avoid[areas]` or `avoid[segments]` | critical |\n| violatedVehicleRestriction | Route uses form of transit which is forbidden for the given vehicle profile | critical |\n| seasonalClosure | Route goes through seasonal closure | info |\n| currentWeightNegative | `vehicle[currentWeight]` is negative after applying `currentWeightChange` at a via waypoint. | critical |\n| currentWeightExceedsLimit | `vehicle[currentWeight]` exceeds limit for given `transportMode` | critical |\n| travelTimeExceedsDriverWorkHours | The route travelTime exceeds drive time sequence provided in `driver[schedule]` parameter | critical |\n\n\nThe codes listed below can appear as info notices when the request contains `return=potentialTimeDependentViolations`.\nThe resulting info notices are not violations on the current route but could be violations if the arrival time\nat these restrictions differs from the calculated time.\nFor example, an info notice for a `vehicleRestriction` could indicate that your vehicle is not currently violating any restriction but,\nIf the journey is delayed by an hour, the vehicle would not be allowed on part of the route because there is a time-dependent restriction active at that time.\n\nCodes for potential time-dependent restriction violations are (non-exhaustive: can be extended for new situations):\n\n| Code      | Description  | Severity |\n| --------- | ------- | ------- |\n| vehicleRestriction | Route potentially uses form of transit which is forbidden for the given vehicle profile | info |\n"
          example: noSchedule
          x-extensible-enum:
          - noSchedule
          - noIntermediate
          - unwantedMode
          - scheduledTimes
          - simplePolyline
          - violatedAvoidFerry
          - violatedAvoidRailFerry
          - violatedBlockedRoad
          - violatedVehicleRestriction
          - seasonalClosure
          - currentWeightNegative
          - currentWeightExceedsLimit
          - travelTimeExceedsDriverWorkHours
          - vehicleRestriction
        severity:
          $ref: '#/components/schemas/NoticeSeverity'
        details:
          type: array
          description: Additional details about the notice
          items:
            $ref: '#/components/schemas/TransitNoticeDetail'
      required:
      - code
    Consumption:
      type: number
      description: 'Energy or fuel consumption.

        For EV energy consumption is in kilowatt hours (kWh). For fuel-based vehicles fuel consumption is in Liters (L) for diesel, petrol and LPG vehicles, and Kilograms (kg) for CNG vehicles.

        '
    ArriveAction_2:
      description: 'An arrival maneuver to be performed at or during a specific portion of a section.

        '
      type: object
      properties:
        action:
          description: 'The type of the action.


            **NOTE:** The list of possible actions may be extended in the future. The client application should handle such a case gracefully.

            '
          type: string
          enum:
          - arrive
        duration:
          description: Estimated duration of this action (in seconds). Actions last until the next action, or the end of the route in case of the last one.
          allOf:
          - $ref: '#/components/schemas/Duration'
        instruction:
          description: Description of the action (e.g. Turn left onto Minna St.).
          type: string
        offset:
          description: Offset of a coordinate in the section's polyline.
          type: integer
          example: 0
        length:
          description: Estimated length of this action (in meters). Actions extend until the next action, or the end of the route in case of the last one.
          allOf:
          - $ref: '#/components/schemas/Distance'
        currentRoad:
          description: Attributes of the current road
          allOf:
          - $ref: '#/components/schemas/RoadInfo'
        nextRoad:
          description: Attributes of the next road
          allOf:
          - $ref: '#/components/schemas/RoadInfo'
        exitSign:
          description: Attributes of the road exit
          allOf:
          - $ref: '#/components/schemas/ExitInfo'
        signpost:
          description: Signpost information of the action, provided for turn by turn actions only
          allOf:
          - $ref: '#/components/schemas/SignpostInfo'
      required:
      - action
      - duration
    VehicleNotice:
      example:
        $ref: '#/components/examples/noticeWithRestrictionsExample'
      type: object
      description: A notice contains important notifications.
      properties:
        title:
          type: string
          description: Human-readable notice description.
          example: Violated avoid toll road
        code:
          type: string
          description: "Extensible enum: `violatedAvoidControlledAccessHighway` `violatedAvoidTollRoad` `violatedAvoidTunnel` `violatedAvoidDirtRoad` `violatedBlockedRoad` `violatedStartDirection` `violatedCarpool` `violatedTurnRestriction` `violatedVehicleRestriction` `violatedZoneRestriction` `violatedAvoidDifficultTurns` `violatedAvoidUTurns` `violatedEmergencyGate` `violatedAvoidSeasonalClosure` `violatedAvoidTollTransponder` `violatedAvoidTruckRoadType` `seasonalClosure` `tollTransponder` `simplePolyline` `tollsDataUnavailable` `tollsDataTemporarilyUnavailable` `currencyUnsupported` `chargingStopNotNeeded` `violatedChargingStationOpeningHours` `violatedMinChargeAtDestination` `violatedMinChargeAtFirstChargingStation` `violatedMinChargeAtChargingStation` `outOfCharge` `currentWeightNegative` `currentWeightExceedsLimit` `travelTimeExceedsDriverWorkHours` `carpool` `turnRestriction` `vehicleRestriction` `zoneRestriction` `avoidTollRoad` `targetChargeNotAchievable` `violatedChargingStationTransportMode` `violatedChargingStationVehicleRestrictions` `maxDrivingTimeExceeded` `...`  \nCurrently known codes (non-exhaustive: this list could be extended for new situations):\n\n| Code      | Description  | Severity |\n| --------- | ------- | ------- |\n| violatedAvoidControlledAccessHighway | Route did not manage to avoid user preference. | critical |\n| violatedAvoidTollRoad | Route did not manage to avoid user preference. | critical |\n| violatedAvoidTunnel | Route did not manage to avoid user preference. | critical |\n| violatedAvoidDirtRoad | Route did not manage to avoid user preference. | critical |\n| violatedBlockedRoad | Route uses roads that are blocked, due to traffic incidents, `avoid[areas]`, or `avoid[segments]`. | critical |\n| violatedStartDirection | The starting direction of the route differs from the value set in the `course` parameter of the waypoint. | critical |\n| violatedCarpool | Route did not manage to avoid user preference. | critical |\n| violatedTurnRestriction | Route requires performing a time-restricted maneuver at a time when it's prohibited. | critical |\n| violatedVehicleRestriction | Route uses a road which is forbidden for the given vehicle profile. | critical |\n| violatedZoneRestriction | Route uses a road in a user-specified avoidance zone, such as the London Low Emission Zone. | critical |\n| violatedAvoidDifficultTurns | Route did not manage to avoid user preference.| critical |\n| violatedAvoidUTurns | Route did not manage to avoid user preference. | critical |\n| violatedEmergencyGate | Route goes through an emergency gate. | critical |\n| violatedAvoidSeasonalClosure | Route did not manage to avoid a seasonal closure.| critical |\n| violatedAvoidTollTransponder | Route did not manage to avoid a toll booth that requires a transponder. | critical |\n| violatedAvoidTruckRoadType | Route did not manage to avoid truck road type. | critical |\n| seasonalClosure | Route goes through a seasonal closure. | info |\n| tollTransponder | Route goes through a toll booth that requires a transponder. | info |\n| simplePolyline | An accurate polyline is not available for this section. The returned polyline has been generated from departure and arrival places. | info |\n| tollsDataUnavailable | Tolls data was requested but could not be calculated for this section. | info |\n| tollsDataTemporarilyUnavailable | Tolls data was requested but is temporarily unavailable. | info |\n| currencyUnsupported | Provided currency is unsupported. | info |\n| chargingStopNotNeeded | A charging stop was planned at the destination of this section, but it is no longer needed (getRoutesByHandle requests only). | info |\n| violatedChargingStationOpeningHours | A charging stop was planned at the destination of this section, but the `postActions` would not be completed within the opening hours. | critical |\n| violatedMinChargeAtDestination | The `arrival.charge` at the destination is lower than the `minChargeAtDestination`. | info |\n| violatedMinChargeAtFirstChargingStation | The `arrival.charge` on the first charging stop is lower than the `minChargeAtFirstChargingStation`. | info |\n| violatedMinChargeAtChargingStation | The `arrival.charge` on a charging station stop is lower than the `minChargeAtChargingStation`. This can be on the first charging stop if `minChargeAtFirstChargingStation` is not specified. | info |\n| outOfCharge | The charge of the EV drops below 0 along the section. | info |\n| currentWeightNegative | `vehicle[currentWeight]` is negative after applying `currentWeightChange` at a via waypoint. | critical |\n| currentWeightExceedsLimit | `vehicle[currentWeight]` exceeds limit for given `transportMode`. | critical |\n| travelTimeExceedsDriverWorkHours | The route travelTime exceeds drive time sequence provided in `driver[schedule]` parameter. | critical |\n| targetChargeNotAchievable | `ev[MaxChargingDuration]` too short to achieve required charging level. | info |\n| violatedChargingStationTransportMode | Provided `transportMode` is not permitted at the charging station | critical |\n| violatedChargingStationVehicleRestrictions | One or more vehicle attributes exceed the permitted vehicle limits of the charging station | critical |\n| maxDrivingTimeExceeded | Desired maximum driving time before first charge exceeded | info |\n\n\nThe codes listed below can appear as info notices when the request contains `return=potentialTimeDependentViolations`.\nThe resulting info notices are not violations on the current route but could be violations if the arrival time\nat these restrictions differs from the calculated time.\nFor example, an info notice for a `vehicleRestriction` could indicate that while your vehicle is not currently violating any restriction.\nHowever, if the journey is delayed by an hour the vehicle would not be allowed on part of the route because there is a time-dependent restriction active at that time.\n\nCodes for potential time dependent restriction violations are (non-exhaustive: can be extended for new situations):\n\n| Code      | Description  | Severity |\n| --------- | ------- | ------- |\n| carpool | Route potentially uses a carpool only road when not allowed. | info |\n| turnRestriction | Route potentially uses a time-restricted turn when not allowed. | info |\n| vehicleRestriction | Route potentially uses a road that is forbidden for the given vehicle profile. | info |\n| zoneRestriction | Route uses a road that is potentially part of restricted routing zones. | info |\n| avoidTollRoad | Route uses a road that potentially is a toll road. **Note:** This is not currently supported and will not be returned, but the enum value is retained for backwards-compatibility purposes. | info |\n"
          example: violatedAvoidTollRoad
          x-extensible-enum:
          - violatedAvoidControlledAccessHighway
          - violatedAvoidTollRoad
          - violatedAvoidTunnel
          - violatedAvoidDirtRoad
          - violatedBlockedRoad
          - violatedStartDirection
          - violatedCarpool
          - violatedTurnRestriction
          - violatedVehicleRestriction
          - violatedZoneRestriction
          - violatedAvoidDifficultTurns
          - violatedAvoidUTurns
          - violatedEmergencyGate
          - violatedAvoidSeasonalClosure
          - violatedAvoidTollTransponder
          - violatedAvoidTruckRoadType
          - seasonalClosure
          - tollTransponder
          - simplePolyline
          - tollsDataUnavailable
          - tollsDataTemporarilyUnavailable
          - currencyUnsupported
          - chargingStopNotNeeded
          - violatedChargingStationOpeningHours
          - violatedMinChargeAtDestination
          - violatedMinChargeAtFirstChargingStation
          - violatedMinChargeAtChargingStation
          - outOfCharge
          - currentWeightNegative
          - currentWeightExceedsLimit
          - travelTimeExceedsDriverWorkHours
          - carpool
          - turnRestriction
          - vehicleRestriction
          - zoneRestriction
          - avoidTollRoad
          - targetChargeNotAchievable
          - violatedChargingStationTransportMode
          - violatedChargingStationVehicleRestrictions
          - maxDrivingTimeExceeded
        severity:
          $ref: '#/components/schemas/NoticeSeverity'
        details:
          type: array
          description: Additional details about the notice
          items:
            $ref: '#/components/schemas/VehicleNoticeDetail'
      required:
      - code
    ChargingSetupAction:
