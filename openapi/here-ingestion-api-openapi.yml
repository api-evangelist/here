                      scan:
                        type: object
                        description: 'Radio measurements used for positioning or radio map contribution.

                          '
                        properties:
                          bt:
                            description: Bluetooth access points
                            type: array
                            maxItems: 128
                            items:
                              description: Bluetooth measurement. In addition to rss, one of mac, eddystoneId, or iBeaconId is required.
                              type: object
                              required:
