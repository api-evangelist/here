                          reportedSensorData:
                            description: 'The last known device sensor data reported by the device.

                              '
                            type: object
                            properties:
                              accelerationG:
                                type: number
                                description: A g-force value of acceleration.
                                minimum: -100
                                maximum: 100
                              deviceIsAttached:
                                type: boolean
                                description: True if device is attached to an object.
                              deviceIsStationary:
                                type: boolean
                                description: True if device hasn't detected movement.
                              batteryIsCharging:
                                type: boolean
                                description: True if device battery is charging.
                              batteryLevel:
                                type: integer
                                description: A value of percentage battery level.
                                minimum: 0
                                maximum: 100
                              pressureHpa:
                                type: number
                                description: A value of pressure in hectopascal.
                                minimum: 300
                                maximum: 1500
                              relativeHumidity:
                                type: number
                                description: A value of relative humidity in percent.
                                minimum: 0
                                maximum: 100
                              deviceIsTampered:
                                type: boolean
                                description: True if device is tampered.
                              temperatureC:
                                type: number
                                description: A value of temperature in celcius.
                                minimum: -70
                                maximum: 100
                              tiltDegree:
                                type: number
                                description: A value of tilt in degrees.
                          mode:
                            description: 'Tracker mode status of the device.

                              When a tracker is in normal mode, it can send telemetry and, for

                              example, use its GNSS receiver if it has one.

                              A tracker switches into flight mode once it detects that it''s in an

                              airplane, and leaves that mode once the airplane lands.

                              Transport mode has to be triggered by the user, and it''s used,

                              for example, during shipping from continent to another.

                              Sleep mode is used when a tracker is stored in a warehouse, and

                              it''s triggered by entering or leaving some defined geofence.

                              Power save mode can be enabled with `system.powerSave.sendMs`

                              property in the desired shadow and when enabled the device enters

                              power save mode when the device is not moving.

                              '
                            type: string
                            enum:
                            - unknown
                            - normal
                            - flight
                            - transport
                            - sleep
                            - powerSave
                        description: 'Contains device-reported sensor data and device configuration settings.

                          `stateVersion` property contains the version of the last

