                                    description: Received Signal power (dBm) (Optional). Power less than -110dBm should be mapped to -110. Power greater than -25dBm should be mapped to -25.
                                    type: integer
                                    minimum: -110
                                    maximum: -25
                                  lac:
                                    description: Location Area Code (Optional)
                                    type: integer
                                    minimum: 1
