                                timestamp:
                                  description: Time of the cell measurement (UTC) (Optional)
                                  type: string
                                  format: date-time
                                nmr:
                                  description: Network measurements (Optional)
                                  type: array
                                  maxItems: 16
                                  items:
                                    description: GSM Network measurement
                                    type: object
