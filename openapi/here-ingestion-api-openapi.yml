    PublishPartition:
      required:
      - partition
      type: object
      properties:
        partition:
          type: string
          description: A key that specifies the partition that the content is related to. It is required. If the layer's partitioning scheme is set to `heretile`, the partition key is the tile key. The maximum length of the partition key is 500 characters. Partition field is used as a `key` field within Kafka message.
          example: '314010583'
        checksum:
          type: string
          description: The checksum of the content when published to Blob API. The algorithm used to calculate the checksum is user specific which is defined in catalog configuration for the layer. Algorithms that you can use are, for example, MD5 or SHA1. This is not a secure hash, so you should only use it to detect changes in content. Checksum is passed as `dsChecksum` kafka record header.
          format: '[0-9a-fA-F]+'
          example: ff7494d6f17da702862e550c907c0a91
        compressedDataSize:
          type: integer
          description: The compressed size in bytes of the content published to Blob API. Applicable when Content-Encoding is set to gzip when uploading and downloading data in the Blob API. CompressedDataSize is passed as `dsCompressedDataSize` kafka record header.
          format: int64
          example: 152417
        dataSize:
          type: integer
          description: The nominal size in bytes of the content published to Blob API. When compression is enabled, this is the size of the uncompressed content. DataSize is passed as `dsDataSize` kafka record header.
          format: int64
          example: 250110
        data:
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
          description: The content published directly in the metadata and encoded in base64. The size of the content is limited to 1MB before base64 encryption. Either `data` or `dataHandle` must be present. Data is passed as `value` field kafka record.
          format: byte
          example: c3RyZWFtIGxheWVyIHBheWxvYWQ=
        dataHandle:
          type: string
          description: The handle created when uploading the content to the Blob API, that is used to retrieve the content at a later stage. Either `data` or `dataHandle` must be present. DataHandle is passed as `dsDataHandle` kafka record header.
          example: 1b2ca68f-d4a0-4379-8120-cd025640510c
        timestamp:
          type: integer
          description: The timestamp of the content, in milliseconds since the Unix epoch. The format of the timestamp is user specific. If the content contains multiple elements each having its own timestamp, we recommend setting the metadata timestamp to the earliest of them. This field if present is used as kafka record timestamp.
          format: int64
          example: 1648139982000
        crc:
          type: string
          description: User provided CRC of the partition data in bytes. Should be lowercase. Crc is passed as `dsCrc` kafka record header.
          example: c3f276d7
      description: Metadata describing the partition being published.
