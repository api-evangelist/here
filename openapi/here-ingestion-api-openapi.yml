  /v3/batch:
    post:
      summary: Ingests data for multiple devices
      description: 'Device owner use this endpoint to ingest data to HERE Tracking on behalf of multiple devices.


        A single request can contain data for multiple devices.

        The devices can be either real or virtual.

        A real device is identified by a `trackingId` assigned to it when the device was claimed.

        A virtual device is identified by an external device ID and the owner''s project `appId`.


        Prior to making the request, the device owner should first authenticate himself with

        HERE Tracking and obtain a user access token.

        The user access token will then be used in this API call.


        For more information on the device position resolution, and the device shadow and trace updates,

        see the `/v3` endpoint description.'
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      - name: authorization
        in: header
        required: true
        example: Bearer h1.yxPIksZ0ViLq77f1Nh-9cg.NVgGBZVlCU8G7kjV_...
        schema:
          type: string
      requestBody:
        description: See GSM and WLAN telemetry examples in the `/v3` endpoint description.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                appId:
                  description: The user's project appId. Used together with an external ID to identify the virtual devices.
                  type: string
                data:
                  type: array
                  items:
                    allOf:
                    - type: object
                      properties:
                        timestamp:
                          description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.


                            Specifies the time the device telemetry measurements were taken.

                            '
                          type: integer
                          minimum: 2
                          maximum: 4102448400000
                        payload:
                          type: object
                          description: 'A free format JSON object.

                            The maximum size is 1000B.

                            '
                        system:
                          type: object
                          properties:
                            phoneNumber:
                              type: string
                              pattern: ^\+[1-9]\d{1,14}$
                              description: 'The phone number of the device''s SIM card in the international E.164 format. All the country codes should be prefixed a with "+" instead of "00".

                                '
                              example: '+491234567890'
                            imsi:
                              type: string
                              pattern: ^[0-9]{1,15}$
                              description: 'The IMSI of the device''s SIM card.

                                '
                              example: '123456789012345'
                            iccid:
                              type: string
                              minLength: 18
                              maxLength: 22
                              description: SIM card integrated circuit card identifier (ICCID)
                            client:
                              description: 'Information about the client device.

                                '
                              type: object
                              properties:
                                manufacturer:
                                  description: Manufacturer of the device (hardware)
                                  type: string
                                  minLength: 2
                                  maxLength: 50
                                model:
                                  description: Model of the device (hardware)
                                  type: string
                                  minLength: 1
                                  maxLength: 50
                                firmware:
