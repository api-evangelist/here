                - code
                - id
              example:
                error: Too Many Requests
                code: 429
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: Too Many Requests
          description: 'Too Many Requests


            User has sent too many requests in a given amount of time.

            '
      operationId: postV2Token
      x-operation-id-source: derived
    servers:
    - url: https://tracking.hereapi.com/
    - url: https://tracking.api.here.com/
  /v2/:
    post:
      summary: Ingests data and receives a shadow
      description: 'Devices can use this end point to ingest data into HERE Tracking,

        in the same way as via the `/v3` endpoint.


        A device uses its access token obtained via the the `/v2/token` endpoint

        to send telemetry – GPS position, sensor readings, WLAN or Bluetooth scans - to HERE Tracking.


        By default the request is synchronous and the response will be

        the device `desired` shadow. If the request is set

        to be asynchronous, the response will be empty.


        The device position gets resolved based on the `position` and `scan` objects

        provided in the request body (see the objects definitions for details).

        If only `position` is provided, it will be used as the device position.

        If only `scan` is provided, the position will be resolved asynchronously

        via the HERE Positioning API after returning a response.

        If both are provided, `scan` is resolved to a position via the HERE Positioning API,

        and the better of the two positions (provided vs. resolved) will be selected.

        If neither `position` nor `scan` is provided, or if the HERE Positioning API is not able to

        resolve the position, the device position will be left empty.


        The `reported` shadow will be updated with the device latest position information,

        sensor readings and settings ingested by the device.

        The reported shadow may also contain additional properties generated by HERE

        Tracking based on the device-ingested telemetry.

        Such properties are stored in the `system.computed` property of the shadow.

        The device shadow can be queried via the `shadows/v2/{trackingId}` endpoint.


        The data ingested by the device will be available as a device trace via the `traces/v2/{trackingId}` endpoint.'
      security:
      - DeviceToken: []
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      - name: authorization
        in: header
        required: true
        example: Bearer h1.yxPIksZ0ViLq77f1Nh-9cg.NVgGBZVlCU8G7kjV_...
        schema:
          type: string
      - name: async
        in: query
        description: If set to `true`, ingests the device data and responds immediately with an empty response body.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: "A device telemetry data.\n\nThe timestamp specifies the time in milliseconds at which the device telemetry measurements were taken.\nThis must be within 10 seconds of the timestamp returned by the `/v2/timestamp` endpoint.\n\nExample of a GSM telemetry\n---\n\n```\n[{\n    \"scan\": {\n        \"gsm\": [{\n            \"mcc\": 262,\n            \"mnc\": 1,\n            \"lac\": 5126,\n            \"cid\": 16504,\n            \"nmr\": [\n                { \"bsic\": 6, \"bcch\": 82 },\n                { \"bsic\": 7, \"bcch\": 85 },\n                { \"bsic\": 12, \"bcch\": 93 },\n                { \"bsic\": 13, \"bcch\": 88 },\n                { \"bsic\": 19, \"bcch\": 88 }\n            ]\n        }]\n    },\n    \"payload\": {\n        \"sensor\": \"data\"\n    },\n    \"timestamp\": 1515169948976\n}]\n```\n\nExample of a WLAN telemetry\n---\n\n```\n[{\n    \"scan\": {\n        \"wlan\": [\n            { \"mac\": \"1c:1d:86:07:01:0f\", \"powrx\": -45 },\n            { \"mac\": \"e4:f4:c6:d9:85:59\", \"powrx\": -39 },\n            { \"mac\": \"1c:1d:86:07:01:0d\", \"powrx\": -43 },\n            { \"mac\": \"1c:1d:86:07:01:0b\", \"powrx\": -44 },\n            { \"mac\": \"1c:1d:86:07:01:04\", \"powrx\": -58 },\n            { \"mac\": \"1c:1d:86:07:01:03\", \"powrx\": -59 }\n        ]\n    },\n    \"payload\": {\n        \"sensor\": \"data\"\n    },\n    \"timestamp\": 1515169948976\n}]\n```\n"
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  timestamp:
                    description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.


                      Specifies the time the device telemetry measurements were taken.

                      '
                    type: integer
                    minimum: 2
                    maximum: 4102448400000
                  payload:
                    type: object
                    description: 'A free format JSON object.

                      The maximum size is 1000B.

                      '
                  system:
                    type: object
                    properties:
                      phoneNumber:
                        type: string
                        pattern: ^\+[1-9]\d{1,14}$
                        description: 'The phone number of the device''s SIM card in the international E.164 format. All the country codes should be prefixed a with "+" instead of "00".

                          '
                        example: '+491234567890'
                      imsi:
                        type: string
                        pattern: ^[0-9]{1,15}$
                        description: 'The IMSI of the device''s SIM card.

                          '
                        example: '123456789012345'
                      iccid:
                        type: string
                        minLength: 18
                        maxLength: 22
                        description: SIM card integrated circuit card identifier (ICCID)
                      client:
                        description: 'Information about the client device.

                          '
                        type: object
                        properties:
                          manufacturer:
                            description: Manufacturer of the device (hardware)
                            type: string
                            minLength: 2
                            maxLength: 50
                          model:
                            description: Model of the device (hardware)
                            type: string
                            minLength: 1
                            maxLength: 50
                          firmware:
                            description: Device firmware version information
                            type: string
                            minLength: 1
                            maxLength: 150
                          name:
                            description: Name of the client software accessing the HERE API
                            type: string
                            minLength: 3
                            maxLength: 50
                          version:
                            description: Version of the client software in format X.Y.Z, where X [0..255] is a major, Y [0..255] is a minor, and Z [0..65535] is a build version number. Increase the version/build number for each release of the client.
                            type: string
                            minLength: 3
                            maxLength: 60
                          platform:
                            description: Software platform information of the device, for example operating system name and version.
                            type: string
                            minLength: 3
                            maxLength: 50
                          modules:
                            description: Software information of all updateable chips.
                            type: array
                            maxItems: 10
                            items:
                              description: Software information of an updateable chip.
                              type: object
                              properties:
                                manufacturer:
                                  type: string
                                  description: Manufacturer name
                                  minLength: 2
                                  maxLength: 50
                                model:
                                  type: string
                                  description: Model or chip name
                                  minLength: 1
                                  maxLength: 50
                                firmwareVersion:
                                  type: string
                                  description: Installed firmware version
                                  minLength: 3
                                  maxLength: 60
                          diskquota:
                            description: Available disk quota in kilobytes.
                            type: number
                            minimum: 0
                          diagnosticscode:
                            description: Device diagnostics code.
                            type: number
                          homenetwork:
                            description: Information about subscriber home network - 3GPP MCC+MNC or 3GPP2 SID+NID. Dual-SIM devices can provide information on both subscriptions.
                            type: array
                            maxItems: 2
                            items:
                              description: Network information. Either MCC + MNC or SID + NID attribute pair is required.
                              type: object
                              properties:
                                mcc:
                                  description: Mobile Country Code
                                  type: integer
                                  minimum: 200
                                  maximum: 999
                                mnc:
                                  description: Mobile Network Code
                                  type: integer
                                  minimum: 0
                                  maximum: 999
                                sid:
                                  description: System Id, SID
                                  type: integer
                                  minimum: 1
                                  maximum: 32767
                                nid:
                                  description: Network Id, NID
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                          hasAttachSensor:
                            type: boolean
                            description: True if a device has a sensor to detect if the device is attached to or detached from an object.
                          hasNoBattery:
                            type: boolean
                            description: False if a device has a battery.
                          hasHumiditySensor:
                            type: boolean
                            description: True if a device has a sensor to measure humidity.
                          hasPressureSensor:
                            type: boolean
                            description: True if a device has a sensor to measure pressure.
                          hasTamperSensor:
                            type: boolean
                            description: True if a device has a sensor to detect if device is disassembled.
                          hasTemperatureSensor:
                            type: boolean
                            description: True if a device has a sensor to measure temperature.
                          hasAccelerometerSensor:
                            type: boolean
                            description: True if a device has a sensor to measure acceleration.
                          accelerometerSensorRange:
                            description: 'Specifies the range of measurable acceleration, representation

                              unit g (9.8 m/s^2). If more than one accelerometer is available,

                              each element in the list will represent individual accelerometer.

                              Each value represents a single "+/-" range.

                              For example, value 2 means that sensor is capable to measure

                              acceleration within the range of [-2 g, +2 g].

                              '
                            type: array
                            maxItems: 5
                            items:
                              type: integer
                              minimum: -1000
                              maximum: 1000
                        example:
                          manufacturer: Samsung
                          model: SM-G930F
                          firmware: heroltexx...
                          name: HERE Tracker
                          version: 1.6.1
                          platform: Android
                          diskquota: 256
                          diagnosticscode: 0
                          homenetwork: []
                          hasAttachSensor: true
                          hasNoBattery: false
                          hasHumiditySensor: true
                          hasPressureSensor: true
                          hasTamperSensor: true
                          hasTemperatureSensor: true
                          hasAccelerometerSensor: true
                          accelerometerSensorRange:
                          - 2
                      stateVersion:
                        description: 'The version of the state of a device. This should be incremented only by HERE Tracking.

                          '
                        type: integer
                        minimum: 0
                      reportedSensorData:
                        description: 'The last known device sensor data reported by the device.

                          '
                        type: object
                        properties:
                          accelerationG:
                            type: number
                            description: A g-force value of acceleration.
                            minimum: -100
                            maximum: 100
                          deviceIsAttached:
                            type: boolean
                            description: True if device is attached to an object.
                          deviceIsStationary:
                            type: boolean
                            description: True if device hasn't detected movement.
                          batteryIsCharging:
                            type: boolean
                            description: True if device battery is charging.
                          batteryLevel:
                            type: integer
                            description: A value of percentage battery level.
                            minimum: 0
                            maximum: 100
                          pressureHpa:
                            type: number
                            description: A value of pressure in hectopascal.
                            minimum: 300
                            maximum: 1500
                          relativeHumidity:
                            type: number
                            description: A value of relative humidity in percent.
                            minimum: 0
                            maximum: 100
                          deviceIsTampered:
                            type: boolean
                            description: True if device is tampered.
                          temperatureC:
                            type: number
                            description: A value of temperature in celcius.
                            minimum: -70
                            maximum: 100
                          tiltDegree:
                            type: number
                            description: A value of tilt in degrees.
                      mode:
                        description: 'Tracker mode status of the device.

                          When a tracker is in normal mode, it can send telemetry and, for

                          example, use its GNSS receiver if it has one.

                          A tracker switches into flight mode once it detects that it''s in an

                          airplane, and leaves that mode once the airplane lands.

                          Transport mode has to be triggered by the user, and it''s used,

                          for example, during shipping from continent to another.

                          Sleep mode is used when a tracker is stored in a warehouse, and

                          it''s triggered by entering or leaving some defined geofence.

                          Power save mode can be enabled with `system.powerSave.sendMs`

                          property in the desired shadow and when enabled the device enters

                          power save mode when the device is not moving.

                          '
                        type: string
                        enum:
                        - unknown
                        - normal
                        - flight
                        - transport
                        - sleep
                        - powerSave
                    description: 'Contains device-reported sensor data and device configuration settings.

                      `stateVersion` property contains the version of the last

                      known `desired` state seen by the device.

                      '
                  position:
                    type: object
                    description: The device location
                    properties:
                      accuracy:
                        description: Uncertainty circle radius in meters (degree of confidence according to the 'confidence' parameter).
                        type: number
                        minimum: 0
                      alt:
                        description: Altitude in meters (referenced to the WGS-84 ellipsoid) negative or positive.
                        type: number
                      altaccuracy:
                        description: Uncertainty of the altitude estimate in meters (degree of confidence according to the 'confidence' parameter).
                        type: number
                        minimum: 0
                      confidence:
                        description: Confidence level in percent for the accuracy/uncertainty. If not specified, the default is 68 (this corresponds to a 68% probability that the true position is within the accuracy/uncertainty radius of the position; the higher the number, the greater the confidence level).
                        type: integer
                        minimum: 50
                        maximum: 95
                      heading:
                        description: GPS/GNSS heading in degrees, clockwise from true north. You must specify a value for this item when you specify a value for speed.
                        type: integer
                        minimum: 0
                        maximum: 359
                      floor:
                        description: The building where the measurements were taken
                        type: object
                        required:
                        - id
                        - name
                        - level
                        properties:
                          level:
                            description: The floor in the building in integer format
                            type: number
                            minimum: -999
                            maximum: 999
                          id:
                            description: The building id
                            type: string
                            minimum: 1
                            maximum: 100
                          name:
                            description: The building name
                            type: string
                            minimum: 1
                            maximum: 255
                      lat:
                        description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                        type: number
                        minimum: -90
                        maximum: 90
                      lng:
                        description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                        type: number
                        minimum: -180
                        maximum: 180
                      satellitecount:
                        description: Number of GPS/GNSS satellites used for the calculation of the position fix. ('gnss' position type only)
                        type: integer
                        minimum: 1
                        maximum: 50
                      speed:
                        description: GPS/GNSS speed of the device (m/s). One must specify a value for this item when one specifies a value for heading.
                        type: integer
                        minimum: 0
                      type:
                        description: Position type, 'gnss' (satellite based), 'cell' or 'wlan' (network based)
                        type: string
                      wlancount:
                        description: The total number of observed WLAN APs in the scan used for producing the position. ('wlan' position type only)
                        type: integer
                        minimum: 1
                        maximum: 254
                      timestamp:
                        description: Timestamp of the position
                        type: integer
                        minimum: 2
                        maximum: 4102448400000
                    required:
                    - lat
                    - lng
                    - accuracy
                  scan:
                    type: object
                    description: 'Radio measurements used for positioning or radio map contribution.

                      '
                    properties:
                      bt:
                        description: Bluetooth access points
                        type: array
                        maxItems: 128
                        items:
                          description: Bluetooth measurement. In addition to rss, one of mac, eddystoneId, or iBeaconId is required.
                          type: object
                          required:
                          - rss
                          properties:
                            timestamp:
                              description: Time of the measurement (UTC)
                              type: string
                              format: date-time
                            rss:
                              description: Received signal strength (dBm) at the terminal
                              type: integer
                              minimum: -128
                              maximum: 0
                            mac:
                              description: The MAC address of the Bluetooth access point. MAC-48 address with colon (:) or hyphen (-) separators, upper or lower case hex digits. For privacy reasons positioning based on a single Bluetooth AP is not possible. There must be at least one other matching WLAN or Bluetooth access point. Either MAC, EddystoneId, or iBeaconId is required.
                              type: string
                              pattern: ^(([a-fA-F0-9]{2}:){5}[a-fA-F0-9]{2})|(([a-fA-F0-9]{2}-){5}[a-fA-F0-9]{2})$
                            eddystoneId:
                              description: Full Identifier as Base64 string. A combination of 10-byte Namespace component and a 6-byte Instance component
                              type: string
                              minLength: 24
                              maxLength: 24
                            iBeaconId:
                              description: Full Identifier as Base64 string. A combination of 16-byte UUID + 2-byte major + 2-byte minor
                              type: string
                              minLength: 28
                              maxLength: 28
                      country:
                        description: Indicates in which country the WLAN APs are located (in case cell data is not present in radio_observations)
                        type: object
                        required:
                        - mcc
                        properties:
