      operationId: getV2Health
      x-operation-id-source: derived
    servers:
    - url: https://tracking.hereapi.com/
    - url: https://tracking.api.here.com/
  /v2/version:
    get:
      summary: Gets service version
      security: []
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                description: "OK\nService returns its current version number\nschema:\n    type: object\n    properties:\n        \"service-name\":\n            type: string\n            description: Version of service\n    example:\n        servicename: \"1.0.0\"\n"
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Ingestion
      operationId: getV2Version
      x-operation-id-source: derived
    servers:
    - url: https://tracking.hereapi.com/
    - url: https://tracking.api.here.com/
  /v2/timestamp:
    get:
      summary: Gets the current timestamp
      tags:
      - Ingestion
      description: 'Returns the current server time in seconds since the UNIX epoch.

        The server time is used to check the validity of the OAuth 1.0 header of a device data ingestion request.

        Devices must synchronise with the server time to avoid a clock skew.


        > Note that in the data ingestion request the timestamp is specified in milliseconds.'
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      responses:
        '200':
          description: 'OK


            The server timestamp was successfully returned

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: integer
                    description: Seconds elapsed since 1 January 1970 00:00:00 UTC.
                    minimum: 2
                    maximum: 4102448400
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
                code: 400
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request object is in an incorrect format or has values that are invalid or out of range.
                details:
                  hereErrorCode: 400306
          description: 'Bad request


            The request object is in an incorrect format or has values that are invalid or out of range.


            If available, further error details are provided in the response body.

            '
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Unauthorized
                code: 401
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The provided credentials are not valid.
                details:
                  hereErrorCode: 401306
          description: 'Unauthorized


            The request did not provide correct authentication details

            '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Forbidden
                code: 403
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The account does not have the correct privileges.
                details:
                  hereErrorCode: 403306
          description: 'Forbidden


            The account does not have the correct privileges

            '
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Too Many Requests
                code: 429
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: Too Many Requests
          description: 'Too Many Requests


            User has sent too many requests in a given amount of time.

            '
      operationId: getV2Timestamp
      x-operation-id-source: derived
    servers:
    - url: https://tracking.hereapi.com/
    - url: https://tracking.api.here.com/
  /v2/token:
    post:
      summary: Requests a token for a registered device
      security:
      - signedRequest: []
      description: 'Authenticates a device to HERE Tracking and requests a device access token.


        A device must provide a valid device access token when it sends telemetry to HERE Tracking.

        Tokens can be obtained upon a successful device authentication.


        The device token requests must be signed. The signature method uses the OAuth 1.0 standard.

        For more information on this standard, see the OAuth Core 1.0 specification.


        Tokens can be requested only by claimed devices.

        A claimed device license, that is ```deviceId``` and ```deviceSecret``` credential pair, is used for creating a signed token request.


        > See the Authentication section for details on how to generate a signed token request.

        > A new signature must be created for each device access token request.

        > Signatures can only be used once.'
      parameters:
      - in: header
        name: X-Request-Id
        schema:
          type: string
          format: uuid
        description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


          Must be a valid UUIDv4.

          '
        required: false
      - name: authorization
        description: Signed OAuth 1.0 header
        in: header
        required: true
        example: OAuth oauth_consumer_key='{deviceId}',oauth_signature_method='HMAC_SHA256',oauth_timestamp='{nowS}',oauth_nonce='{nonce}',oauth_signature='{signature}'
        schema:
          type: string
      tags:
      - Ingestion
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                example:
                  accessToken: h1.ySDEpBjW2fXM0Nk1IyBohA.6YOv1MfQUd1K7MCg9elZrrVTT5fKfqYECYUrD7Y77d-p9KqIZrVfjpIrkMqVC9MmfUILOm7xk7VuhCH59o0oLJCl6M8Q8cGHTKVrPcpqiEzUQKs7pSZXxVbIui0O5caUgJ3GHrS1X4aZQuB1KSsngvWMcIz0M0a4g4x8bICUHNRbISbQOWNTc7CcxRIJegIlj24dUawrhtnuQh50JUUY2pHYpSh_t8R0AVkm8JO-WEtWW3SZiLa30IR0gz2121vlRjdNolnJYsuJzHoaEKEkrMj9ffybtcBVWo9dkY1qmDQ-DRg_loVenJK45kjHJijkQ902r_vhH8jtoXTrZ1RBFHuZtwLW8xXBw70BCWPu4OYGgthjaq61mpE8iP1s7MG7gbAiW_S249aaoWMUxQN6djw8cNoTP6YPM-ivSieRMxwPl56mhRQ5GRjQa8AYkuOvoCFg-LCMIxTYhrDZM4HFWQ.duHFPjvWUQbdArCL5CU7bTowK5fD07ro83r6CRWjuB_1TK2VyO1lvfNFZIZePWLyTlN0y9uqD7Uro6t87h_a0zfpeU8_529KrB9vgpcBARF5LGBo8Rh7y2islYxCGJ2pAxHADtxkfiZ8TCoEatg0F3jkeggOl8YUFkeaI2g7WtnhZwrXBwW9QizQH3EM_Djnu66-kv_aM-uddpzZJJ7CmrJiwhucaEJeYRDSpuzzZWT6_NwBg6_xLjyseCv5AGs8EmsuStCFP0Ey7UDIqo9V2RA9uDP64Q0mvEw3EUTHmJGHF_8E2s4iIpjKJCvUGsGYAy8XrjeW10EBAMkfrn6cwA
                  expiresIn: 86399
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
                code: 400
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request object is in an incorrect format or has values that are invalid or out of range.
                details:
                  hereErrorCode: 400306
          description: 'Bad request


            The request object is in an incorrect format or has values that are invalid or out of range.


            If available, further error details are provided in the response body.

            '
        '401':
          headers: {}
          description: '*Timestamp wrong*


            When the request timestamp is skewed by more than 10 second from the

            server time, the `x-here-timestamp` header with the current server

            timestamp is added to the response.


            *Incorrect Signature*


            If the OAuth signature is incorrect, the response code will be 401,

            and *no* `x-here-timestamp` header will be added.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
                example:
                - error: Unauthorized
                  code: 401
                  id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee
                  message: Invalid Authorization, the request lacks valid authentication credentials for the target resource.
                  details:
                    hereErrorCode: 401306
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Forbidden
                code: 403
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The account does not have the correct privileges.
                details:
                  hereErrorCode: 403306
          description: 'Forbidden


            The account does not have the correct privileges

            '
        '404':
          description: Invalid license
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
                example:
                - error: Unauthorized
                  code: 401
                  id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee
                  message: Invalid Authorization, the request lacks valid authentication credentials for the target resource.
                  details:
                    hereErrorCode: 401306
              examples:
                response:
                  value:
                    code: 404
                    error: No license found for the given deviceId.
                    id: e69ce7d3-82f2-43cd-95b4-4402f98c9a61
        '412':
          description: 'Unclaimed Device


            If the device ID is valid but the device has not yet been claimed by an owner, an error response will be returned.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
                example:
                - error: Unauthorized
                  code: 401
                  id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee
                  message: Invalid Authorization, the request lacks valid authentication credentials for the target resource.
                  details:
                    hereErrorCode: 401306
              examples:
                response:
                  value:
                    code: 412
                    error: Device has not been claimed.
                    id: e69ce7d3-82f2-43cd-95b4-4402f98c9a61
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
