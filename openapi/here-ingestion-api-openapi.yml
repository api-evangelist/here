                              type: integer
                              minimum: -120
                              maximum: -25
                            pathloss:
                              description: UTRAN path loss (dB) (Optional, you must specify a value for this item when you specify a value for rscp).
                              type: integer
                              minimum: 46
                              maximum: 158
                            timestamp:
                              description: Time of the cell measurement (UTC) (Optional)
                              type: string
