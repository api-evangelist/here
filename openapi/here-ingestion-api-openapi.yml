components:
  schemas:
    Response400:
      type: object
      properties:
        title:
          type: string
          description: 'The reason why validation failed. The possible reasons are: Input data failed validation, Message processing error, No handler found'
          example: Input data failed validation
        status:
          type: string
          description: An HTTP status code.
          example: '400'
        code:
          type: string
          description: 'Ingestion code E221 + XXX where XXX is an ingestion-specific error number or 000 for general errors. Possible values include: E221000 - Generic error; E221001 - Layer for provided App ID is not found.'
          example: E221000
        cause:
          type: string
          description: A description of the cause of the error.
          example: Missing request header Authorization-Claims for method parameter of type AuthClaims
        action:
          type: string
          description: An action that could possibly solve the issue.
          example: Check request for correctness
        correlationId:
          type: string
          description: A unique ID for the request. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response.  You can use this ID to track your request.
          example: a739c6e7-cbb6-43d8-bb94-377a2db6439e
        traceId:
          type: string
          description: A unique ID for the message. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.
          example: c0d3ebd4-8768-4191-95d6-e5a5dda88f14
    Response413:
