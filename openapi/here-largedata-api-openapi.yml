  /largedata/v4/{dataId}/data:
    parameters:
    - name: dataId
      in: path
      schema:
        type: string
        description: Large data object identifier
        pattern: ^DATA-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      required: true
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    get:
      summary: Gets large data object
      description: 'Downloads a part of large data.


        The data to be downloaded is identified with `dataId`.

        `offset` query paremeter specifies the first byte of the data,

        and `count` indicates how many bytes of the data is to be downloaded

        starting from and including the `offset`. The default value for `offset`

        is zero and the for `count` it is the total size of the data.


        The size of one downloaded data part must be between 1 byte and 10 MB.'
      security:
      - UserToken: []
      - ClientToken: []
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          description: Byte offset to the data to be downloaded (inclusive, starts at zero)
          minimum: 0
      - name: count
        in: query
        schema:
          type: integer
          description: Number of bytes of the data to download
          minimum: 1
          maximum: 10485760
      tags:
      - Largedata
      responses:
        '200':
          description: 'Success

            '
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
