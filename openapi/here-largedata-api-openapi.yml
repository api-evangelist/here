      operationId: postLargedataV4
      x-operation-id-source: derived
  /largedata/v4/{dataId}/parts/{partNumber}:
    parameters:
    - name: dataId
      in: path
      schema:
        type: string
        description: Large data object identifier
        pattern: ^DATA-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      required: true
    - name: partNumber
      in: path
      schema:
        type: integer
        description: Part number for a large data object
        minimum: 1
        maximum: 10000
      required: true
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    put:
      summary: Uploads a part of a large data
      description: 'Uploads a part of large data. The part is identified with `dataId` and a part number.


        Part upload has the following limits:

        * The part numbers must start from 1, be no greater than 10000 and be consecutive.

        * The size of one uploaded data part must be between 1 byte and 1 MB.

        * Parts re-uploaded with the same `partNumber` are overridden.

        * Only `application/octet-stream` Content-Type is supported.


        Parts can be uploaded in any order, the `partNumber` determines their

        position in the total data.


        The optional `md5` query parameter can be used to provide the MD5

        digest for the uploaded data part. If it is specified and does not match

        to the received data, HERE Tracking returns HTTP status 400.


        If the data upload is still in ***preparing*** state, HERE Tracking

        returns HTTP status 409.'
      security:
      - DeviceToken: []
      parameters:
      - name: md5
        in: query
        schema:
          type: string
          description: MD5 digest of the data (hexadecimal representation)
          minLength: 32
          maxLength: 32
      tags:
      - Largedata
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Successful (no content)
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
                code: 400
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request object is in an incorrect format or has values that are invalid or out of range.
                details:
                  hereErrorCode: 400306
          description: 'Bad request


            The request object is in an incorrect format or has values that are invalid or out of range.


            If available, further error details are provided in the response body.

            '
        '401':
          content:
            application/json:
              schema:
