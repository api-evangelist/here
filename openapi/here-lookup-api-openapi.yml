            - **BETA, RESTRICTED** `octane_98`:  fuel that consists of an octane / gasoline blend with 98% octane / 2% gasoline

            - **BETA, RESTRICTED** `premium`: premium octane rating

            - **BETA, RESTRICTED** `premium_with_additives`: premium octane rating with additives

