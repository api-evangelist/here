openapi: 3.2.0
info:
  title: Geocoding and Search API v7 Lookup API
  version: '7.155'
  description: This document describes the Geocoding and Search API.
security:
- Bearer: []
- ApiKey: []
tags:
- name: Lookup
paths:
  /lookup:
    servers:
    - url: https://lookup.search.hereapi.com/v1
    get:
      summary: Lookup By ID
      description: This endpoint looks up a known place using the HERE ID included in the request.
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/addressNamesVariantLookupRevgeocode'
      - $ref: '#/components/parameters/langAutosuggestBrowseDiscoverGeocodeLookupRevgeocode'
      - $ref: '#/components/parameters/politicalView'
      - $ref: '#/components/parameters/showLookup'
      - $ref: '#/components/parameters/showMapReferencesGeocodeLookupRevgeocode'
      - $ref: '#/components/parameters/showNavAttributes'
      - $ref: '#/components/parameters/showRelatedLookup'
      - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: The search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '400':
          description: 'Client error: request failed validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Requested id could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 'Client error: http method not supported.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Client error: Rate limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporary server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Lookup
      operationId: getLookup
      x-operation-id-source: derived
components:
  schemas:
    Segment:
      type: object
      properties:
        ref:
          type: string
          description: 'The segment reference follows the format `{segmentId}(#{offset})?`,

            representing its relative position from the result location to a segment.'
        side:
          type: string
          description: "The side of the link the attribute is applicable to\n\n- for `resultType=houseNumber` and `resultType=place`: side of the entity to the link\n- for `resultType=street`:\n  - on endpoints *Geocode* and *Lookup*: side of the entity to the link, it is always \"both\"\n  - on endpoints *Reverse Geocode* and *Multi-Reverse Geocode*: relative side from input to the link\n"
    EvNameId:
      type: object
      properties:
        name:
          type: string
          description: Any string value
        id:
          type: string
          description: Unique ID
    RatingMediaCollection:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Rating'
          description: 'An array containing the ratings objects of the current place result.

            If the place has no ratings, the parent element `ratings` is not present.'
    ExtendedAccessPoint:
      type: object
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          format: double
          description: 'Latitude of the access position. For example: `"52.19404"`'
        lng:
          type: number
          format: double
          description: 'Longitude of the access position. For example: `"8.80135"`'
        primary:
          type: boolean
          description: 'Only applies to response items of type `"place"`. Set to true for the primary access position when the place

            result has more than one `access` position.

            Only the first element in the access array can have a primary field set to `true`.

            '
        type:
          type: string
          enum:
          - delivery
          - emergency
          - entrance
          - loading
          - other
          - parking
          - taxi
          description: "Only applies to response items of type `\"place\"`\n\nDescription of supported values:\n\n- `delivery`: A designated access position for receiving goods and services, typically used by delivery personnel.\n- `emergency`: A position specifically designated for emergency access or services,\n  such as ambulance or fire vehicle entry points.\n- `entrance`: A designated access position for larger or complex places, such as shopping malls or sports centers,\n  where multiple entrances are located around the perimeter. Each entrance provides a specific\n  point of entry for visitors.\n- `loading`: An access position to a designated area for the loading and unloading of goods, typically used by delivery and service vehicles.\n- `other`: An access type that does not fit into predefined categories, used for unique or less common situations.\n- `parking`: An access position to a designated private area for vehicle parking, associated with the place.\n- `taxi`: A position specifically designated for taxi/ride-share pick-up and drop-off services."
        label:
          type: string
          description: 'Only applies to response items of type `"place"`. The value is a short textual description of the access point. Example: "North Entrance"'
    ExtendedAttribute:
      type: object
      properties:
        evStation:
          allOf:
          - $ref: '#/components/schemas/EvChargingAttributes'
          description: 'EV charging pool information.

            This element and its children are only rendered when `show=ev` is provided.'
        evAvailability:
          allOf:
          - $ref: '#/components/schemas/EvAvailabilityAttributes'
          description: 'EV charging pool detailed availability

            Detailed information about the pool stations, EVSE and connectors.

            This element and its children are only rendered when `show=ev` is provided.'
        fuelStation:
          allOf:
          - $ref: '#/components/schemas/FuelStationAttributes'
          description: '**BETA, RESTRICTED**


            An object contain a listing of additional attributes specific to

            place results for businesses that sell fuel for vehicles:

            `700-7600-0000`, `700-7600-0116`, `700-7600-0444`, `700-7900-0132`


            See the related [Appendix](https://www.here.com/docs/bundle/geocoding-and-search-api-developer-guide/page/topics-places/places-category-system-full.html#700-business-and-services)

            for details about those place category IDs.

            '
        truckAmenities:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/TruckAmenityGeneric'
            - $ref: '#/components/schemas/TruckAmenityShowers'
          description: '**BETA, RESTRICTED**


            This field contains a listing of acceptable key-value pairs for amenities at places useful for truck drivers.'
    StreetInfo:
      type: object
      properties:
        baseName:
          type: string
          description: Base name part of the street name.
        streetType:
          type: string
          description: Street type part of the street name.
        streetTypePrecedes:
          type: boolean
          description: Defines if the street type is before or after the base name.
        streetTypeAttached:
          type: boolean
          description: Defines if the street type is attached or unattached to the base name.
        prefix:
          type: string
          description: A prefix is a directional identifier that precedes, but is not included in, the base name of a road.
        suffix:
          type: string
          description: A suffix is a directional identifier that follows, but is not included in, the base name of a road.
        direction:
          type: string
          description: Indicates the official directional identifiers assigned to highways, typically either "North/South" or "East/West"
        language:
          type: string
          description: BCP 47 compliant language code
    CategoryRef:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: 'Identifier number for an associated category. For example: `"600-6600-0082"`'
    Contact:
      type: object
      required:
      - value
      properties:
        label:
          type: string
          description: Optional label for the contact string, such as "Customer Service" or "Pharmacy Fax".
        value:
          type: string
          description: Contact information, as specified by the contact type.
        categories:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/CategoryRef'
          description: The list of place categories this contact refers to.
    EditorialMediaCollection:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Editorial'
          description: 'An array containing the editorial objects of the current place result.

            If the place has no editorials, the parent element `editorials` is not present.'
    PostalCodeDetails_JapanPost:
      type: object
      required:
      - postalCode
      properties:
        postalCode:
          type: string
          description: '**ALPHA**


            7-digit business postal code in `XXX-XXXX` format (separated by dash)'
        postalEntity:
          type: string
          enum:
          - Japan Post
          description: '**ALPHA**


            The postal entity. This could be a governmental authority, a regulatory authority, or a designated postal operator.


            Description of supported values:


            - **ALPHA** `Japan Post`: Field indicating the data source (fixed as `Japan Post` for Japan)'
        postalCodeType:
          type: string
          enum:
          - ZIP
          description: '**ALPHA**


            The postal code type.


            Description of supported values:


            - **ALPHA** `ZIP`: Field describing the postal code type (fixed as `ZIP` for Japan)'
        businessName:
          type: string
          description: '**ALPHA**


            Detailed information specifies company name, building name, floor number, etc. mapped to the corresponding business postal code'
    EvChargingAttributes:
      type: object
      properties:
        connectors:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EvConnector'
          description: List of EV pool groups of connectors. Each group is defined by a common charging connector type and max power level. The numberOfConnectors field contains the number of connectors in the group.
        totalNumberOfConnectors:
          type: integer
          format: int32
          description: Total number of charging connectors in the EV charging pool
        access:
          type: string
          enum:
          - private
          - public
          - restricted
          description: Information about accessibility
        eMobilityServiceProviders:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EMobilityServiceProvider'
          description: 'The list of eMSP (e-Mobility Service Provider) for which the EV station operator has EV roaming agreements.

            Each element contains both the name and the partner ID of the eMSP.'
        paymentMethods:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EvPaymentSupport'
          description: List of payment methods supported at the EV station
    SupplierReference:
      type: object
      required:
      - supplier
      - id
      properties:
        supplier:
          allOf:
          - $ref: '#/components/schemas/ReferenceSupplier'
          description: Information about the supplier of this reference.
        id:
          type: string
          description: Identifier of the place as provided by the supplier.
        categories:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/CategoryRef'
          description: The list of place category identifiers this supplier reference relates to.
    EvAvailabilityAttributes:
      type: object
      properties:
        stations:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EvAvailabilityStation'
          description: List of EV stations at the place (Currently only one is expected)
    PostalCodeDetails_Usps_Zip:
      type: object
      required:
      - postalCode
      properties:
        postalCode:
          type: string
          description: The postal code.
        postalEntity:
          type: string
          enum:
          - USPS
          description: 'The postal entity. This could be a governmental authority, a regulatory authority, or a designated postal operator.


            Description of supported values:


            - `USPS`: The USPS postal code system.'
        postalCodeType:
          type: string
          enum:
          - ZIP
          description: 'The postal code type. Currently supported values: `ZIP` and `ZIP+4`


            Description of supported values:


            - `ZIP`: A 5-digit code that identifies a specific geographic delivery area. ZIP codes can represent an area within a state, or a single building or company that has a very high mail volume.'
        zipClassificationCode:
          type: string
          enum:
          - M
          - P
          - U
          description: 'The ZIP Classification Code.


            Description of supported values:


            - `M`: Military ZIP code.

            - `P`: ZIP code having only Post Office boxes.

            - `U`: Unique ZIP code: A ZIP assigned to a company, agency, or entity with sufficient mail volume, based on average daily volume of letter-size pieces.'
    Category:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: 'Identifier number for an associated category. For example: `"600-6600-0082"`'
        name:
          type: string
          description: Name of the place category in the result item language.
        primary:
          type: boolean
          description: Whether or not it is a primary category. This field is visible only when the value is `true`.
    AccessRestrictionAttributes:
      type: object
      properties:
        categories:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/CategoryRef'
          description: The list of place categories, this set of access restrictions refers to.
        restricted:
          type: boolean
          description: 'When set to `true`, the place response item has a known access restriction.

            When the place has no known access restriction, the `accessRestrictions` element is omitted, so `restricted` value is never set to `false`.'
    AdminIdSection:
      type: object
      required:
      - hmcId
      properties:
        hmcId:
          type: string
          description: Admin ID in HERE Map Content
        partitionId:
          type: string
          description: '**ALPHA**


            Unique identifier that references a specific subset of geo-location related layers

            (e.g., address, location, street, or place) in the HERE Map Content'
    RelatedResultAddress:
      type: object
      properties:
        label:
          type: string
          description: 'Assembled address value built out of the address components according to the regional postal rules.

            These are the same rules for all endpoints. It may not include all the input terms.'
        countryCode:
          type: string
          description: 'A three-letter country code. For example: "DEU"'
        countryName:
          type: string
          description: 'The localised country name. For example: "Deutschland"'
        stateCode:
          type: string
          description: 'A state code or state name abbreviation – country specific. For example, in the United States it is the two letter state abbreviation: "CA" for California.'
        state:
          type: string
          description: 'The state division of a country. For example: "North Rhine-Westphalia"'
        countyCode:
          type: string
          description: 'A county code or county name abbreviation – country specific. For example, for Italy it is the province abbreviation: "RM" for Rome.'
        county:
          type: string
          description: A division of a state; typically, a secondary-level administrative division of a country or equivalent.
        city:
          type: string
          description: 'The name of the primary locality of the place. For example: "Bad Oyenhausen"'
        district:
          type: string
          description: 'A division of city; typically an administrative unit within a larger city or a customary name of a city''s neighborhood. For example: "Bad Oyenhausen"'
        subdistrict:
          type: string
          description: 'A subdivision of a district. For example: "Minden-Lübbecke"'
        street:
          type: string
          description: 'Name of street. For example: "Schulstrasse"'
        streets:
          type: array
          items:
            type: string
          description: 'Names of streets in case of intersection result. For example: ["Friedrichstraße","Unter den Linden"]'
        block:
          type: string
          description: Name of block.
        subblock:
          type: string
          description: Name of sub-block.
        postalCode:
          type: string
          description: 'An alphanumeric string included in a postal address to facilitate mail sorting, such as post code, postcode, or ZIP code. For example: "32547"'
        houseNumber:
          type: string
          description: 'House number. For example: "4"'
        building:
          type: string
          description: Name of building.
        unit:
          type: string
          description: 'defining a Micro Point Address. Combines unit name (suite, flat, etc.), level name (floor) and

            building unit name for a Micro Point Address'
    Phoneme:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          description: The actual phonetic transcription in the NT-SAMPA format.
        language:
          type: string
          description: The [BCP 47](https://en.wikipedia.org/wiki/IETF_language_tag) language code.
        preferred:
          type: boolean
          description: Whether or not it is the preferred phoneme.
    NavigationAttributes:
      type: object
      properties:
        speedLimits:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/SpeedLimit'
          description: 'Speed limit for the navigable road following the direction of traffic on the street. If traffic is allowed in both directions

            two value sets will be returned. If the request contained a bearing parameter, then the first entry will match the returned

            direction.'
        functionalClass:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/FunctionalClass'
          description: 'The value represents one of the five levels:'
        access:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Access'
          description: 'The following boolean values are available for access attributes:'
        physical:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Physical'
          description: 'The following boolean values are available for physical attributes:'
    Media:
      type: object
      properties:
        images:
          allOf:
          - $ref: '#/components/schemas/ImageMediaCollection'
          description: 'This object enables access to images linked to the place result and is returned when the query

            specifies either `show=tripadvisor` or `show=tripadvisorImageVariants` as a parameter.'
        editorials:
          allOf:
          - $ref: '#/components/schemas/EditorialMediaCollection'
          description: 'An object containing editorial content that describes the place result.

            Returned when the query includes the parameter `show=tripadvisor`.'
        ratings:
          allOf:
          - $ref: '#/components/schemas/RatingMediaCollection'
          description: 'An object that provides 3rd party supplier ratings about the place result.

            Currently only Tripadvisor (TM) ratings are provided.

            This object is returned when the query includes the parameter `show=tripadvisor`.'
    MapView:
      type: object
      required:
      - west
      - south
      - east
      - north
      properties:
        west:
          type: number
          format: double
          description: 'Longitude of the western-side of the box. For example: "8.80068"'
        south:
          type: number
          format: double
          description: 'Latitude of the southern-side of the box. For example: "52.19333"'
        east:
          type: number
          format: double
          description: 'Longitude of the eastern-side of the box. For example: "8.8167"'
        north:
          type: number
          format: double
          description: 'Latitude of the northern-side of the box. For example: "52.19555"'
    TripadvisorImage:
      type: object
      required:
      - href
      - supplier
      properties:
        href:
          type: string
          description: 'The URL points to the default image provided by Tripadvisor (TM). These default images are typically sized for the *medium* format used by Tripadvisor.

            In rare cases, the image may be larger than expected. To ensure consistent rendering across all scenarios, we recommend enforcing maximum dimensions when displaying the image.'
        supplier:
          allOf:
          - $ref: '#/components/schemas/TripadvisorMediaSupplier'
          description: Information about the supplier of this image.
        variants:
          allOf:
          - $ref: '#/components/schemas/TripadvisorImageVariants'
          description: 'An object containing key-value pairs, where each key represents a specific image size

            (e.g., `thumbnail`, `small`, `medium`, `large`, `original`) and the corresponding value is

            an object containing the URL of that image variant.

            This object is returned when the query includes the parameter `show=tripadvisorImageVariants`.

            '
    FuelStationAttributes:
      type: object
      properties:
        fuelTypes:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/CarFuel'
            - $ref: '#/components/schemas/TruckFuel'
          description: '**BETA, RESTRICTED**


            List of fuel types available or not available at this place'
        payAtThePump:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that payment can be made at fuel pumps via credit card or other method at this place

            - `false` indicates that payment can not be made at fuel pumps via credit card or other method at this place

            '
        highVolumePumps:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that high volume pumps for commercial vehicles are available at this place

            - `false` indicates that high volume pumps for commercial vehicles are not available at this place

            '
    EvAvailabilityEvse:
      type: object
      properties:
        id:
          type: string
          description: HERE ID of the EVSE
        cpoId:
          type: string
          description: "The unique ID of an EVSE in the system of the CPO.\n This ID is unique in the system of the CPO but not necessarily globally unique.\n The format will differ between different CPOs. This ID is always provided."
        cpoEvseEMI3Id:
          type: string
          description: 'Identifier in eMI3 format of the EVSE within the Charge Point Operator (CPO) platform.

            This ID is not always present. Example of ID format: "`DE*ICT*E0001897`". '
        state:
          type: string
          enum:
          - AVAILABLE
          - OCCUPIED
          - OFFLINE
          - OTHER
          - OUT_OF_SERVICE
          - RESERVED
          - UNAVAILABLE
          description: 'EVSE status


            Description of supported values:


            - `AVAILABLE`: The EVSE is able to start a new charging session.

            - `OCCUPIED`: The EVSE is in use

            - `OFFLINE`: No status information available. (Also used when offline)

            - `OTHER`: No status information available. (Also used when offline)

            - `OUT_OF_SERVICE`: The EVSE is currently out of order.

            - `RESERVED`: The EVSE has been reserved for a particular EV driver and is unavailable for other drivers

            - `UNAVAILABLE`: The EVSE is not available because of a physical barrier, for example a car'
        last_updated:
          type: string
          description: 'Last update of the dynamic connector availability information reflected in the connectorStatus elements,

            in ISO 8601 format. If the time is UTC, a Z is added.

            An example of this kind of timestamp value is "`2013-12-31T12:00:00.000Z`". If the time is not UTC ,

            then the offset is added as a ±[hh][mm] value (for example, "`2014-01-14T10:00:00.000+0100`").'
        connectors:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EvAvailabilityConnector'
          description: List of connectors of this EVSE.
    TruckAmenityGeneric:
      type: object
      required:
      - type
      - available
      properties:
        type:
          type: string
          enum:
          - carWash
          - chemicalToiletDisposal
          - convenienceStore
          - highCanopy
          - idleReduction
          - nightParkingOnly
          - paidParking
          - parking
          - powerSupply
          - reservableParking
          - secureParking
          - truckScales
          - truckService
          - truckStop
          - truckWash
          - wifi
          description: '**BETA, RESTRICTED**


            The kind of amenity


            Description of supported values:


            - **BETA, RESTRICTED** `carWash`: car washing and/or detailing services

            - **BETA, RESTRICTED** `chemicalToiletDisposal`: a waste disposal station, for use in emptying and cleaning chemical toilets

            - **BETA, RESTRICTED** `convenienceStore`: a convenience store can be found at the location

            - **BETA, RESTRICTED** `highCanopy`: High canopy at fueling station/truck stop. This references the canopy height over the pumps being at a height for most trucks to enter.

            - **BETA, RESTRICTED** `idleReduction`: idle reduction system onsite

            - **BETA, RESTRICTED** `nightParkingOnly`: parking is restricted to night hours only

            - **BETA, RESTRICTED** `paidParking`: A fee is required to use the truck parking space.

            - **BETA, RESTRICTED** `parking`: truck parking onsite or nearby

            - **BETA, RESTRICTED** `powerSupply`: power supply, for use in maintaining the temperature of refrigerated trucks

            - **BETA, RESTRICTED** `reservableParking`: The truck parking space requires advance booking for a defined time interval.

            - **BETA, RESTRICTED** `secureParking`: secure parking location

            - **BETA, RESTRICTED** `truckScales`: truck scales onsite or nearby

            - **BETA, RESTRICTED** `truckService`: truck service onsite or nearby

            - **BETA, RESTRICTED** `truckStop`: a truck stop

            - **BETA, RESTRICTED** `truckWash`: truck wash onsite or nearby

            - **BETA, RESTRICTED** `wifi`: Wi-Fi access'
        available:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that this amenity is available at this place

            - `false` indicates that this amenity is not available at this place

            '
    EvAvailabilityStation:
      type: object
      properties:
        id:
          type: string
          description: HERE ID of the station
        cpoId:
          type: string
          description: The unique ID of the location in the system of the CPO.
        evses:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EvAvailabilityEvse'
          description: List of EVSE (electric vehicle supply equipment) in the EV station
    TripadvisorMediaSupplier:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          enum:
          - tripadvisor
          description: An identifier for the supplier.
    FuelAdditive:
      type: object
      required:
      - type
      - available
      properties:
        type:
          type: string
          enum:
          - aus32
          description: '**BETA, RESTRICTED**


            Indicates the type or brand of Diesel Emission Fluid (DEF) available.'
        available:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that Diesel Emission Fluid (DEF) is available at this place

            - `false` indicates that Diesel Emission Fluid (DEF) is not available at this place

            '
        inCans:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that Diesel Emission Fluid (DEF) is available in cans.

            - `false` indicates that Diesel Emission Fluid (DEF) is not available in cans.

            '
        atThePump:
          type: boolean
          description: '**BETA, RESTRICTED**


            When set to:

            - `true` indicates that Diesel Emission Fluid (DEF) is available at the pump.

