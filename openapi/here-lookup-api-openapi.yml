            including routes to pedestrian only islands, tourist areas, commuter ferry routes open to only pedestrians, etc.


            - `true`: The road is a boat ferry.

            - `false`: The road isn''t a boat ferry.'
        bridge:
          type: boolean
          description: 'Identifies a structure that allows a road, railway, or walkway to pass over another road,

            railway, waterway, or valley serving map display and route guidance functionalities.


            - `true`: The road is a bridge.

            - `false`: The road isn''t a bridge.'
        deliveryRoad:
          type: boolean
          description: 'Indication of a delivery road.


            - `true`: The physical characteristic of the road is that it functions as a delivery road.

            - `false`: The physical characteristic of the road is that it doesn''t function as a delivery road.'
        movableBridge:
          type: boolean
          description: 'Movable Bridge indicates a bridge that moves to allow passage (usually) for boats or barges.


            - `true`: The road is a movable bridge.

            - `false`: The road isn''t a movable bridge.

            '
        multiplyDigitized:
          type: boolean
          description: 'Multiply Digitised identifies separately digitised roads, i.e., roads that are digitised with one line per

            direction of traffic instead of one line per road.


            - `true`: The physical characteristic of the road is that it functions as multiplyDigitized.

            - `false`: The physical characteristic of the road is that it doesn''t function as multiplyDigitized.'
        paved:
          type: boolean
          description: 'Indicates whether the navigable segment is paved.


            - `true`: The physical characteristic of the road is paved.

            - `false`: The physical characteristic of the road isn''t paved.'
        private:
          type: boolean
          description: 'Private identifies roads that are not maintained by an organisation responsible for maintenance of

            public roads.


            - `true`: The road is private..

            - `false`: The road isn''t private.'
        railFerry:
          type: boolean
          description: 'The segment represents a generalised route of a ferry for passengers or vehicles via rail.


            - `true`: The road is a rail flerry.

            - `false`: The road isn''t a rail flerry.

            '
        tunnel:
          type: boolean
          description: 'Identifies an enclosed (on all sides) passageway through or under an obstruction.


            - `true`: The road is a tunnel.

            - `false`: The road isn''t a tunnel.

            '
    RelatedAddress:
      type: object
      required:
      - relationship
      - id
      properties:
        relationship:
          type: string
          enum:
          - MPA
          - intersection
          - nearbyAddress
          - parentPA
          description: "\n\nDescription of supported values:\n\n- **RESTRICTED** `MPA`: Micro Point Addresses related to a result items with\n  `resultType` = `houseNumber` and `houseNumberType` = `PA`;\n  for example, buildings, floors (levels) or suites (units)\n  associated to this address. This type of relationship is\n  only returned by the Lookup endpoint and the Geocode endpoint\n  when the `showRelated=MPA` parameter is provided.\n- `intersection`: The Intersections nearest to the address. This type of relationship is\n  only returned by Reverse Geocode, Geocode or Multi-Reverse Geocode\n  endpoints when `showRelated=intersections` parameter is provided.\n- `nearbyAddress`: Nearby address on the same street of main result. This type of\n  relationship is only returned by Reverse Geocode endpoint or\n  Multi-Reverse Geocode endpoint when `showRelated=nearbyAddress`\n  parameter is provided.\n- **RESTRICTED** `parentPA`: The Point Address to which the Micro Point Address\n  belongs; for example the house number to which this\n  suite is associated. This type of relationship is only\n  returned by the Lookup, the Geocode and the (Multi) Reverse Geocode endpoints when\n  the `showRelated=parentPA` parameter is provided."
        title:
          type: string
          description: The localized display name of this related entity.
        id:
          type: string
          description: The ID of the related entity.
        resultType:
          type: string
          enum:
          - addressBlock
          - administrativeArea
          - houseNumber
          - intersection
          - locality
          - place
          - postalCodePoint
          - street
          description: The resultType of the related entity.
        houseNumberType:
          type: string
          enum:
          - MPA
          - PA
          - interpolated
          description: "The houseNumberType of the related entity.\n\nDescription of supported values:\n\n- **RESTRICTED** `MPA`: A Micro Point Address represents a secondary address for a Point\n  Address; for example, building, floor (level) and suite (unit).\n  Micro Point Addresses can be used to enhance Point Address with\n  greater address detail and higher coordinate accuracy. This result\n  type is only returned by Lookup, Geocode, Autocomplete or (Multi) Reverse Geocode endpoints when\n  `with=MPA` parameter is provided.\n- `PA`: A Point Address represents an individual address as a point object.\n  Point Addresses are coming from trusted sources. There is a\n  high certainty that the address exists at that position. A\n  Point Address result contains two types of coordinates. One is the\n  access point (or navigation coordinates), which is the point to\n  start or end a drive. The other point is the position or display\n  point. This point varies per source and country. The point can be\n  the rooftop point, a point close to the building entry, or a point\n  close to the building, driveway or parking lot that belongs to the\n  building.\n- `interpolated`: An interpolated address. These are approximate positions as a\n  result of a linear interpolation based on address ranges. Address\n  ranges, especially in the USA, are typical per block. For\n  interpolated addresses, we cannot say with confidence that the\n  address exists in reality. But the interpolation provides a good\n  location approximation that brings people in most use cases close\n  to the target location. The access point of an interpolated address\n  result is calculated based on the address range and the road\n  geometry. The position (display) point is pre-configured offset\n  from the street geometry. Compared to Point Addresses, interpolated\n  addresses are less accurate."
        address:
          allOf:
          - $ref: '#/components/schemas/RelatedResultAddress'
          description: The address of the related entity. The fields are only rendered, if they differ from the main result item.
        position:
          allOf:
          - $ref: '#/components/schemas/DisplayResponseCoordinate'
          description: The coordinates (latitude, longitude) of a pin on a map corresponding to the searched place.
        access:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/BasicAccessPoint'
          description: Coordinates of the response item on a HERE map navigable link (for example, for driving or walking).
        distance:
          type: integer
          format: int64
          description: 'The distance "as the crow flies" from the search center to this related address'' position in meters.

            It is only returned by Reverse Geocode endpoint or Multi-Reverse Geocode endpoint.'
        routeDistance:
          type: integer
          format: int64
          description: 'The distance from routing position of the nearby address to the street result, the distance is

            calculated based on the underlying road geometry. It is only returned by Reverse Geocode endpoint or

            Multi-Reverse Geocode endpoint.'
        bearing:
          type: integer
          format: int32
          description: 'Bearing (measured clockwise from true north) from the projected coordinate on the street to the

            display position of the related location. True clockwise degree, 0 is north. It is only returned by

            Reverse Geocode endpoint or Multi-Reverse Geocode endpoint.'
        mapView:
          allOf:
          - $ref: '#/components/schemas/MapView'
          description: "The bounding box enclosing the geometric shape (area or line) that the related address covers. It is\n only returned by Reverse Geocode endpoint or Multi-Reverse Geocode endpoint."
        mapReferences:
          allOf:
          - $ref: '#/components/schemas/MapReferenceSection'
          description: 'Return the map references of the location objects. It is only returned by Reverse Geocode endpoint

            or Multi-Reverse Geocode endpoint.'
