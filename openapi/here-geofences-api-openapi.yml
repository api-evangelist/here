  /geofences/v2/{geofenceId}/poiTraining:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - in: path
      schema:
        type: string
        format: uuid
      name: geofenceId
      description: ID of the geofence
      required: true
    post:
      summary: Trains a POI geofence
      description: 'Trains the POI geofence `geofenceId` using a device telemetry.

        The POI geofence boundary is defined using radio measurements.

        The geofence is trained using a telemetry that the device with `trackingId` has ingested

        during the specified time range, while being at this point of interest.

        Only telemetries that have been ingested during the last 24 hours can be used in the training.


        Optionally, a WLAN scan be used for the training.'
      security:
      - UserToken: []
      - ClientToken: []
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: This is a unique ID associated with the device data in HERE Tracking. The `trackingId` gets assigned to a device when the device is claimed by a user.
                  after:
                    type: integer
                    description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.


                      The value must be within the past 24 hours from the current timestamp

                      '
                  before:
                    type: integer
                    description: 'Milliseconds elapsed since 1 January 1970 00:00:00 UTC.


                      The value must not be greater than current timestamp

                      '
                required:
                - id
                - after
                - before
                additionalProperties: false
              - type: object
                properties:
                  wlan:
                    description: WLAN access points
                    type: array
                    maxItems: 128
                    minItems: 2
                    items:
                      description: WLAN measurement
                      type: object
                      required:
                      - mac
                      - powrx
                      properties:
                        mac:
                          description: The MAC address of the WLAN access point. MAC-48 address with colon (:) or hyphen (-) separators, upper or lower case hex digits. Note that if the SSID contains postfix '_nomap', the AP should not be used for positioning. For privacy reasons positioning based on a single WLAN AP is not possible; there has to be at least one other matching wlan or cell.
                          type: string
                          pattern: ^(([a-fA-F0-9]{2}:){5}[a-fA-F0-9]{2})|(([a-fA-F0-9]{2}-){5}[a-fA-F0-9]{2})$
                        powrx:
                          description: Received signal level (dBm) at the terminal (Optional)
                          type: integer
                          minimum: -128
                          maximum: 0
                        band:
                          description: Frequency range (GHz). Allowed values are 2.4, 3.65, and 5. (Possible future values include 4.9, 5.9, 60, and 900.)
                          type: number
                          enum:
                          - 2.4
                          - 3.65
                          - 5
                        timestamp:
                          description: Time of the wlan measurement (UTC) (Optional)
                          type: string
                          format: date-time
                      additionalProperties: false
                required:
                - wlan
                additionalProperties: false
      tags:
      - Geofences
      responses:
        '200':
          description: 'The POI geofence was trained successfully

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  trainingStatus:
                    type: object
                    properties:
                      trained:
                        description: True if the POI geofence is trained
                        type: boolean
                      metadata:
                        type: object
                        properties:
                          usedWlanApCount:
                            description: The number of WLAN access point used in training
                            type: number
                          trackingId:
                            type: string
