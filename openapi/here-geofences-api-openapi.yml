openapi: 3.2.0
info:
  version: 2.6.11
  title: HERE Tracking Geofences API
  description: 'HERE Tracking is a cloud product designed to address location tracking problems for a wide range of Location IoT industry verticals.


    HERE Tracking also includes end-user mobile and web applications that can be used to demonstrate the product.'
  license:
    name: HERE Documentation License
    url: https://legal.here.com/en-gb/terms/documentation-license
servers:
- url: https://tracking.hereapi.com/
- url: https://tracking.api.here.com/
tags:
- description: The Geofences service creates and manages geofences.
  name: Geofences
paths:
  /geofences/v2/health:
    get:
      summary: Gets service health
      security: []
      responses:
        '200':
          description: 'OK


            The service is performing as expected

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Health status
                example:
                  message: healthy
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Geofences
      operationId: getGeofencesV2Health
      x-operation-id-source: derived
  /geofences/v2/version:
    get:
      summary: Gets service version
      security: []
      responses:
        '200':
          description: 'Success

            '
          content:
            application/json:
              schema:
                description: "OK\nService returns its current version number\nschema:\n    type: object\n    properties:\n        \"service-name\":\n            type: string\n            description: Version of service\n    example:\n        servicename: \"1.0.0\"\n"
        '500':
          description: 'Service unavailable


            The service is not performing as expected

            '
      tags:
      - Geofences
      operationId: getGeofencesV2Version
      x-operation-id-source: derived
  /geofences/v2:
    parameters:
    - in: header
      name: X-Request-Id
      schema:
        type: string
        format: uuid
      description: 'ID used for correlating requests within HERE Tracking. Used for logging and error reporting.


        Must be a valid UUIDv4.

        '
      required: false
    - name: projectId
      schema:
        type: string
        minLength: 1
        maxLength: 50
        description: 'Project ID.

          Any HERE Tracking user must be a member of a Tracking project.

          The project ID can be implicitly resolved if the user calling the API is a member of a single project.

          If the user is a member of multiple projects, the `projectId` query parameter needs to be specified explicitly.

          '
      in: query
      required: false
    post:
      summary: Creates a geofence
      description: 'One can specify a geofence as a circle, as a polygon or as POI (Point of Interest). One can also

        assign a name and a description to each geofence to help identify them.


        Circle

        ---


        Specify coordinates of the center point of the circle and a radius in

        meters.


        ```json

        {

        "name": "Home",

        "type": "circle",

        "definition": {

        "center": {

        "lat": 52.5308398,

        "lng": 13.38490035

        },

        "radius": 100

        },

        "description": "Small area around my house."

        }

        ```


        Polygon

        ---


        Specify an array of points. A minimum of three points is required.


        *NOTE: If the array of points does not describe a closed polygon, the polygon is

        automatically closed between the last and first points.*


        ```json

        {

        "name": "Work",

        "type": "polygon",

        "definition": {

        "points": [{

        "lat": 52.5308398,

        "lng": 13.38490035

        }, {

        "lat": 52.530443,

        "lng": 13.38482003

        }, {

        "lat": 52.5308298,

        "lng": 13.38492235

        }]

        },

        "description": "The area around work."

        }

        ```


        Indoor geofence

        ---


        Circular and polygonal geofences can be both outdoors and indoors.

        To create a `circular` `indoor` geofence, add the `floor` property to the request body.


        ```json

        {

        "name": "Office indoor",

        "type": "circle",

        "definition": {

        "center": {

        "lat": 52.5308398,

        "lng": 13.38490035

        },

        "radius": 20,

        "floor": {

        "level": 2,

        "id": "DM_1234",

        "name": "Office floor 2"

        }

        },

        "description": "Floor 2 of the office."

        }


        ```


        POI geofence

        ---


        Specify location details of a POI geofence for its initial creation.


        After the POI geofence has been created, it will need to be trained.

        The POI geofence boundary is defined using radio measurements.

        The POI geofence is trained using a telemetry

        that a device has ingested while being at this desired point of interest.


        For a trained POI geofence, an associated device is considered to be inside the

        geofence when the radio measurements of the device-ingested telemetry and

        the training data match.


        ```json

        {

        "name": "POI room in the office",

        "type": "poi",

        "definition": {

        "location": {

        "room": ROOM_201,

        "address": Invalidenstrasse 116,

        "country": Germany,

        "position": {

        "lat": 52.5308398,

        "lng": 13.38490035

        }

        },

        "floor": {

        "level": 2,

        "id": "DM_1234",

        "name": "Office floor 2"

        }

        },

        "description": "A room where goods should be delivered."

        }

        ```


        Successful requests have the HTTP status 201 and the response body provides

        the ID of the created geofence.'
      security:
      - UserToken: []
      - ClientToken: []
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: Circle
                type: object
                properties:
                  type:
                    type: string
                    description: The geofence type.
                    enum:
                    - circle
                  definition:
                    type: object
                    description: An object that defines the area of a circular geofence
                    properties:
                      center:
                        description: The coordinates of the center point of the circle.
                        type: object
                        properties:
                          lat:
                            description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                            type: number
                            minimum: -90
                            maximum: 90
                          lng:
                            description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                            type: number
                            minimum: -180
                            maximum: 180
                        required:
                        - lat
                        - lng
                      radius:
                        type: number
                        description: The radius of the circle in meters.
                        minimum: 0
                      floor:
                        description: The building associated with the geofence
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          level:
                            description: The floor of the geofence in integer format
                            type: number
                            minimum: -999
                            maximum: 999
                          id:
                            description: The building ID
                            type: string
                            minLength: 1
                            maxLength: 100
                          name:
                            description: The building name
                            type: string
                            minLength: 1
                            maxLength: 255
                    required:
                    - center
                    - radius
                  metadata:
                    description: 'Metadata JSON object may contain additional customer specific information

                      '
                    type: object
                  name:
                    type: string
                    maxLength: 50
                    description: A human-readable name of the geofence.
                  description:
                    type: string
                    maxLength: 1000
                    description: A description of the area that the geofence encloses and the purpose of the geofence.
                required:
                - type
                - definition
              - title: Polygon
                type: object
                properties:
                  type:
                    type: string
                    description: The geofence type.
                    enum:
                    - polygon
                  definition:
                    type: object
                    description: An object that defines the area of a polygonal geofence.
                    properties:
                      points:
                        type: array
                        description: An array of points that define the polygon. A minimum of three and a maximum of five hundred points is required.
                        minItems: 3
                        maxItems: 500
                        items:
                          type: object
                          properties:
                            lat:
                              description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                              type: number
                              minimum: -90
                              maximum: 90
                            lng:
                              description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                              type: number
                              minimum: -180
                              maximum: 180
                          required:
                          - lat
                          - lng
                      floor:
                        description: The building associated with the geofence
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          level:
                            description: The floor of the geofence in integer format
                            type: number
                            minimum: -999
                            maximum: 999
                          id:
                            description: The building ID
                            type: string
                            minLength: 1
                            maxLength: 100
                          name:
                            description: The building name
                            type: string
                            minLength: 1
                            maxLength: 255
                    required:
                    - points
                  metadata:
                    description: 'Metadata JSON object may contain additional customer specific information

                      '
                    type: object
                  name:
                    type: string
                    maxLength: 50
                    description: A human-readable name of the geofence.
                  description:
                    type: string
                    maxLength: 1000
                    description: A description of the area that the geofence encloses and the purpose of the geofence.
                required:
                - type
                - definition
              - title: POI
                type: object
                properties:
                  type:
                    type: string
                    description: The geofence type.
                    enum:
                    - poi
                  definition:
                    type: object
                    description: An object that defines the area of a POI geofence.
                    properties:
                      location:
                        type: object
                        description: Details of the geofence location
                        properties:
                          room:
                            description: The room ID
                            type: string
                            minLength: 1
                            maxLength: 100
                          address:
                            description: Address
                            type: string
                            minLength: 1
                            maxLength: 255
                          country:
                            description: Country
                            type: string
                            minLength: 1
                            maxLength: 255
                          position:
                            type: object
                            properties:
                              lat:
                                description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                                type: number
                                minimum: -90
                                maximum: 90
                              lng:
                                description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                                type: number
                                minimum: -180
                                maximum: 180
                            required:
                            - lat
                            - lng
                            description: Coordinates for visualization purposes
                      floor:
                        description: The building associated with the geofence
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          level:
                            description: The floor of the geofence in integer format
                            type: number
                            minimum: -999
                            maximum: 999
                          id:
                            description: The building ID
                            type: string
                            minLength: 1
                            maxLength: 100
                          name:
                            description: The building name
                            type: string
                            minLength: 1
                            maxLength: 255
                  metadata:
                    description: 'Metadata JSON object may contain additional customer specific information

                      '
                    type: object
                  name:
                    type: string
                    maxLength: 50
                    description: A human-readable name of the geofence.
                  description:
                    type: string
                    maxLength: 1000
                    description: A description of the area that the geofence encloses and the purpose of the geofence.
                required:
                - type
      tags:
      - Geofences
      responses:
        '201':
          description: 'Created


            The geofence was successfully created.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    description: Geofence ID
                    type: string
                    format: uuid
                required:
                - id
              example:
                id: 0d994f31-ceea-42e4-96a5-4484585c3802
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Bad request
                code: 400
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request object is in an incorrect format or has values that are invalid or out of range.
                details:
                  hereErrorCode: 400306
          description: 'Bad request


            The request object is in an incorrect format or has values that are invalid or out of range.


            If available, further error details are provided in the response body.

            '
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Unauthorized
                code: 401
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The provided credentials are not valid.
                details:
                  hereErrorCode: 401306
          description: 'Unauthorized


            The request did not provide correct authentication details

            '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Forbidden
                code: 403
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The account does not have the correct privileges.
                details:
                  hereErrorCode: 403306
          description: 'Forbidden


            The account does not have the correct privileges

            '
        '413':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: An HTTP error description
                  code:
                    type: integer
                    description: An HTTP status code
                  message:
                    type: string
                    description: Descriptive text that explains the error
                  id:
                    type: string
                    format: uuid
                    description: An error ID that allows you to trace the error details
                  details:
                    description: An optional object containing more information about the error
                required:
                - error
                - code
                - id
              example:
                error: Payload Too Large
                code: 413
                id: 5771b3d4-95ae-4959-ac63-fbaa3d5d06ee-lds2
                message: The request size exceeds the maximum size limit for payloads.
                details:
                  hereErrorCode: 413306
          description: 'Payload Too Large


            The request size exceeds the maximum size limit for payloads.

            '
      operationId: postGeofencesV2
      x-operation-id-source: derived
    get:
      summary: Gets all geofences
      description: 'Gets all geofences of a project.

        Results can be filtered by using the query parameters.

        Indoor geofences with the `floor` properties

        may be filtered by `floor[id]`, which specifies the ID of the venue associated with the geofence.'
      security:
      - UserToken: []
      - ClientToken: []
      - DeviceToken: []
      parameters:
      - name: pageToken
        description: A token from the previously returned response to retrieve the specified page.
        schema:
          type: string
        in: query
        required: false
      - name: count
        description: The number of items to return per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        in: query
        required: false
      - in: query
        schema:
          anyOf:
          - type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 100
                description: ID of the venue, which is associated with the geofence
            title: Floor ID
          - type: string
            enum:
            - 'null'
            description: Null option can be used to query for geofences without a floor property
            title: No `floor` property
        name: floor
        description: The floor of the indoor geofence
        example:
          id: DM_1234
        style: deepObject
        explode: true
      - name: type
        description: Type of a geofence
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - circle
            - polygon
            - poi
      - in: query
        schema:
          type: array
          maxItems: 4
          minItems: 4
          items:
            type: number
            minimum: -180
            maximum: 180
            description: Latitude and longitude of Northwest and Southeast corners.
        name: bbox
        description: Limit search to geofences intersecting the given bounding box.
        style: form
      - name: fields
        description: 'Field names to filter a result object.

          '
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      tags:
      - Geofences
      responses:
        '200':
          description: 'Response body contains an array of geofence objects, `count` specifies the number of returned geofences,

            and `pageToken` indicates the next available page in the matching result set.


            If no geofences are found, an object with empty data array is returned.

            Response content type can be either JSON or protobuf depending on the ''Content-Type'' request header.

            '
          content:
            application/json:
              example:
                data:
                - id: d0c29690-5d26-4cf1-a37e-b7816e72cb99
                  geofence:
                    definition:
                      points:
                      - lng: 13.38490035
                        lat: 52.5308398
                      - lng: 14.38490035
                        lat: 52.5408398
                      - lng: 13.39490035
                        lat: 53.5308398
                    type: polygon
                - id: ff92eda0-3114-4640-b7e6-4ba641ae1124
                  geofence:
                    name: 16fbc82c-88d1-4219-bfad-6e5de52688a2
                    description: This is a circular geofence
                    type: circle
                    definition:
                      center:
                        lat: 52.5308398
                        lng: 13.38490035
                      radius: 100
                      floor:
                        id: DM_82228
                        name: House 3
                pageToken: 027ffffea253d79fc
                count: 2
              schema:
                type: object
                description: Response body contains an array of geofence objects. `count` indicates the number of returned geofences, and `pageToken` indicates the next available page in the matching result set. If no geofences are found, an object with empty data array is returned.
                allOf:
                - type: object
                  properties:
                    pageToken:
                      type: string
                      description: A token that can be used to retrieve the next page of the response.
                    count:
                      type: integer
                      minimum: 0
                      maximum: 100
                      default: 100
                      description: The number of items in the response.
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        description: Single geofence object
                        type: object
                        properties:
                          id:
                            description: Geofence ID
                            type: string
                            format: uuid
                          version:
                            description: Geofence version
                            type: integer
                          createdAt:
                            description: Timestamp indicating when the geofence has been created
                            type: string
                            format: date-time
                          updatedAt:
                            description: Timestamp indicating when the geofence has been updated
                            type: string
                            format: date-time
                          geofence:
                            oneOf:
                            - title: Circle
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: The geofence type.
                                  enum:
                                  - circle
                                definition:
                                  type: object
                                  description: An object that defines the area of a circular geofence
                                  properties:
                                    center:
                                      description: The coordinates of the center point of the circle.
                                      type: object
                                      properties:
                                        lat:
                                          description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                                          type: number
                                          minimum: -90
                                          maximum: 90
                                        lng:
                                          description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                                          type: number
                                          minimum: -180
                                          maximum: 180
                                      required:
                                      - lat
                                      - lng
                                    radius:
                                      type: number
                                      description: The radius of the circle in meters.
                                      minimum: 0
                                    floor:
                                      description: The building associated with the geofence
                                      type: object
                                      required:
                                      - id
                                      - name
                                      properties:
                                        level:
                                          description: The floor of the geofence in integer format
                                          type: number
                                          minimum: -999
                                          maximum: 999
                                        id:
                                          description: The building ID
                                          type: string
                                          minLength: 1
                                          maxLength: 100
                                        name:
                                          description: The building name
                                          type: string
                                          minLength: 1
                                          maxLength: 255
                                  required:
                                  - center
                                  - radius
                                metadata:
                                  description: 'Metadata JSON object may contain additional customer specific information

                                    '
                                  type: object
                                name:
                                  type: string
                                  maxLength: 50
                                  description: A human-readable name of the geofence.
                                description:
                                  type: string
                                  maxLength: 1000
                                  description: A description of the area that the geofence encloses and the purpose of the geofence.
                              required:
                              - type
                              - definition
                            - title: Polygon
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: The geofence type.
                                  enum:
                                  - polygon
                                definition:
                                  type: object
                                  description: An object that defines the area of a polygonal geofence.
                                  properties:
                                    points:
                                      type: array
                                      description: An array of points that define the polygon. A minimum of three and a maximum of five hundred points is required.
                                      minItems: 3
                                      maxItems: 500
                                      items:
                                        type: object
                                        properties:
                                          lat:
                                            description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                                            type: number
                                            minimum: -90
                                            maximum: 90
                                          lng:
                                            description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                                            type: number
                                            minimum: -180
                                            maximum: 180
                                        required:
                                        - lat
                                        - lng
                                    floor:
                                      description: The building associated with the geofence
                                      type: object
                                      required:
                                      - id
                                      - name
                                      properties:
                                        level:
                                          description: The floor of the geofence in integer format
                                          type: number
                                          minimum: -999
                                          maximum: 999
                                        id:
                                          description: The building ID
                                          type: string
                                          minLength: 1
                                          maxLength: 100
                                        name:
                                          description: The building name
                                          type: string
                                          minLength: 1
                                          maxLength: 255
                                  required:
                                  - points
                                metadata:
                                  description: 'Metadata JSON object may contain additional customer specific information

                                    '
                                  type: object
                                name:
                                  type: string
                                  maxLength: 50
                                  description: A human-readable name of the geofence.
                                description:
                                  type: string
                                  maxLength: 1000
                                  description: A description of the area that the geofence encloses and the purpose of the geofence.
                              required:
                              - type
                              - definition
                            - title: POI
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: The geofence type.
                                  enum:
                                  - poi
                                definition:
                                  type: object
                                  description: An object that defines the area of a POI geofence.
                                  properties:
                                    location:
                                      type: object
                                      description: Details of the geofence location
                                      properties:
                                        room:
                                          description: The room ID
                                          type: string
                                          minLength: 1
                                          maxLength: 100
                                        address:
                                          description: Address
                                          type: string
                                          minLength: 1
                                          maxLength: 255
                                        country:
                                          description: Country
                                          type: string
                                          minLength: 1
                                          maxLength: 255
                                        position:
                                          type: object
                                          properties:
                                            lat:
                                              description: Latitude in WGS-84 format, decimal representation ranging from -90 to 90.
                                              type: number
                                              minimum: -90
                                              maximum: 90
                                            lng:
                                              description: Longitude in WGS-84 format, decimal representation ranging from -180 to 180.
                                              type: number
                                              minimum: -180
                                              maximum: 180
                                          required:
                                          - lat
                                          - lng
                                          description: Coordinates for visualization purposes
                                    floor:
                                      description: The building associated with the geofence
                                      type: object
                                      required:
                                      - id
                                      - name
                                      properties:
                                        level:
                                          description: The floor of the geofence in integer format
                                          type: number
                                          minimum: -999
                                          maximum: 999
                                        id:
                                          description: The building ID
                                          type: string
                                          minLength: 1
                                          maxLength: 100
                                        name:
