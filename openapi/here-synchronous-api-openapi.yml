      - type
      type: object
    MixingRestrictionSet:
      description: A set of restrictions on mixing jobs based on their categories
      properties:
        compartments:
          description: '**ALPHA** An optional list of compartments,

            * if set, restrictions apply to listed compartments, separately for each one,

            * if not set, restrictions apply to the whole vehicle


            This currently works only for Tour level restrictions'
          items:
