      x-maturity: alpha
    ParkingPlace:
      description: '**ALPHA** Specifies parking place data.'
      example:
        duration: 120
        location:
          lat: 52.53088
          lng: 13.38471
        vehicleTypeIds:
        - truck1
      properties:
        duration:
          $ref: '#/components/schemas/Duration'
        location:
