s have to be set for the job with multiple tasks   |\n| `E613432` | Truck gross weight is outside allowed range                                  |\n| `E613433` | Truck weight per axle is outside allowed range                               |\n| `E613434` | Locations' distribution radius is too big for fleet profile type 'scooter'   |\n| `E613435` | Locations' distribution radius is too big for profile option 'avoid'         |\n| `E613436` | Time and distance costs cannot be both zero. If only one is provided it cannot be zero |\n| `E613437` | Locations' distribution radius is too big for using 'options' in fleet profile type 'truck' |\n| `E613438` | Time, used within vehicle, pudo or job, cannot be before Unix epoch          |\n| `E613439` | Break should have non-empty time windows                                     |\n| `E613440` | Invalid country code in exclude[countries]                                   |\n| `E613441` | Region radius is too big for profile option 'exclude'                        |\n| `E613442` | More than one vehicle has the same id                                        |\n| `E613443` | Invalid combination of `vehicleIds` and `amount` properties in vehicle type  |\n| `E613444` | Jobs and pudos from one group cannot be mixed with another group in the relation |\n| `E613445` | Pudos and jobs in the relation should be added in correct order              |\n| `E613446` | Pudos in the relation are duplicated                                         |\n| `E613500` | Unsupported experimental feature flag                                        |\n| `E613501` | Experimental feature is used without specifying the experimental flag.       |\n| `E613600` | Vehicles' shifts overlap                                                     |\n| `E613601` | Relation has job with multiple places or time windows                        |\n| `E613604` | Redundant 'optimizeTaskOrder' objective                                      |\n| `E613606` | Duplicate territory specified for the same vehicle                           |\n| `E613609` | Invalid 'shiftIndex' in relation                                             |\n| `E613611` | Avoided polygon specified in vehicle profile has self intersection           |\n| `E613612` | Same location with different 'sideOfStreetHint' attribute present in the problem  |\n| `E613613` | Overlapping vehicle break time windows                                       |\n| `E613614` | Same location with different 'nameHint' attribute present in the problem     |\n| `E613615` | Missing 'minimizeUnassigned' objective                                       |\n| `E613616` | Missing 'minimizeCost' objective                                             |\n| `E613617` | Invalid combination of avoid feature `difficultTurns` or `uTurns` and transport mode. |\n| `E613618` | More breaks referenced in relations for a particular vehicle than defined in that vehicle's corresponding shift  |\n| `E613619` | Min stops limit greater than max stops limit                                 |\n| `E613620` | Locations' distribution radius is too big for fleet profile type 'bus'       |\n| `E613621` | Locations' distribution radius is too big for fleet profile type 'privateBus' |\n| `E613622` | Locations' distribution radius is too big for using 'options' in fleet profile type 'car' |\n| `E613623` | Both break and rest time features are being used                             |\n| `E613624` | Different types of stop config used                                          |\n| `E613625` | Only one vehicle profile can be used with custom matrix                      |\n| `E613626` | Custom matrix validation error                                               |\n| `E613627` | Custom matrix does not contain all of specified in problem locations         |\n| `E613628` | Invalid combination of `matrix` and other vehicle profile properties         |\n| `E613629` | Missing 'optimizeTaskPosition' objective                                     |\n| `E613630` | Location is incorrect                                                        |\n| `E613631` | Location types are mixed                                                     |\n| `E613632` | Custom matrix not provided with custom locations                             |\n| `E613633` | Same location 'id' with different coordinates present in the problem         |\n| `E613634` | Visually appealing tours feature cannot be used with custom locations        |\n| `E613635` | Minimize tour overlap feature cannot be used with custom locations           |\n| `E613636` | Profiles array with matrixId is outside allowed range                        |\n| `E613637` | Profile property `matrixId` cannot be provided for sync endpoint             |\n| `E613638` | Duplicate matrixId specified for other vehicle profile                       |\n| `E613639` | Incorrect matrixId used in the vehicle                                       |\n| `E613640` | Custom matrix cannot be provided for async endpoint                          |\n| `E613649` | `weightPerAxle` and `weightPerAxleGroup` are mutually exclusive              |\n| `E613650` | Locations' distribution radius is too big for profile type 'taxi'            |\n| `E613651` | `fuel` cannot be used with `pedestrian` or `bicycle` profile                 |\n| `E613652` | Invalid configuration for rest times property                                |\n| `E613653` | `traffic` route violation can be ignored only for car and truck profiles     |\n| `E613654` | Too many locations are placed on the same road section                       |\n| `E613655` | Unknown vehicle profile names in stopConfig definitions                      |\n| `E613656` | More than one parking has the same id                                        |\n| `E613657` | Vehicle type id is defined for multiple parking places at the same location  |\n| `E613658` | Multiple parking places with default vehicle type ids at the same location   |\n| `E613659` | `violationM