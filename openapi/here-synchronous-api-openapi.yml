    VehicleLimits:
      description: Contains constraints applied to a vehicle type.
      properties:
        maxDistance:
          description: Max distance in meters per shift.
          example: 20000
          format: double
          maximum: 3000000
          minimum: 1
          type: number
        maxDrivingTime:
          description: Max driving time in seconds per shift.
          example: 21600
          format: int64
          maximum: 604800
          minimum: 1
          type: integer
        maxIntraStopDistance:
          description: '**ALPHA** Max intra-stop distance in meters per shift, accumulated over all stops.'
          example: 20000
          format: double
          maximum: 3000000
          minimum: 1
          type: number
          x-maturity: alpha
        shiftTime:
          description: 'The property shiftTime defines the maximum allowed working time of a vehicle type. In case a break is defined

            for this particular vehicle type, the duration of the break should be added to the shiftTime. For instance,

            if a vehicle type has a shift of 8 hours and a 30 minutes break, the total shiftTime should be defined as 8

            hours 30 minutes. The properties `start.time` and `end.time` on the VehicleShift define the lower and upper

            bounds of the time interval in which the vehicle''s shift must lie. Under no circumstances may a vehicle start

            working before `start.time` or finish working after `end.time`. The `start.time` and `end.time` can be imagined

            as the opening and closing times of a depot where the vehicle starts and ends its tour. `start.time` and

            `end.time` can override the defined `shiftTime`. That means, in case the time defined by the `shiftTime`

            property is longer than the time interval between `start.time` and `end.time` the maximum working time of

            the vehicle will be reduced and will not exceed that time interval.'
          example: 21600
          format: double
          maximum: 604800
          minimum: 1
          type: number
        stops:
