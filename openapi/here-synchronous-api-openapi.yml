      - type
      type: object
      x-maturity: beta
    TunnelCategory:
      description: 'Specifies the tunnel category to restrict certain route streets.

        The route will pass only through tunnels of a less strict category.'
      enum:
      - B
      - C
      - D
      - E
      type: string
    SpeedCap:
      description: 'Specifies the maximum speed, in m/s, which the vehicle should not exceed. This parameter affects route duration.

        Notes:

        * Car and Truck profile updates route ETA.

        * Scooter profile updates route optimization and ETA.'
      example: 20
      format: double
      maximum: 70
      minimum: 1
      type: number
    AvoidZone:
      description: 'A routing zone identifier that routes will avoid going through.

        For example the identifier here:cm:envzone:2 references the Berlin Umweltzone environmental zone. For more information about the environmental zones, please have a look at [Here Content Map](https://developer.here.com/documentation/here-map-content/dev_guide/topics-attributes/environmental-zones.html)'
      example: here:cm:envzone:2
      pattern: ^[A-Za-z0-9-]+:[A-Za-z0-9-]+:envzone:[0-9]+$
      type: string
    Shared:
      description: '**ALPHA** Represents a set of shared resources, such as parking places and charging stations, that can be utilized by multiple vehicles during their tours.'
      properties:
        chargingStations:
          description: 'A list of charging stations with id that vehicles can use during their tours.

            If no stations are provided Tour Planning pulls in compatible stations defined in HERE content.'
          items:
            $ref: '#/components/schemas/ChargingStation'
          maxItems: 20
          minItems: 1
          type: array
        parking:
          description: A list of parking places with id that vehicles can use during their tours.
          items:
            $ref: '#/components/schemas/Parking'
          minItems: 1
          type: array
      type: object
      x-maturity: alpha
    BusProfile:
      description: Route calculation for buses that are allowed to drive through the bus-only roads.
      properties:
        avoid:
          $ref: '#/components/schemas/AvoidRoutes'
        departureTime:
          $ref: '#/components/schemas/DateAndTime'
        exclude:
          $ref: '#/components/schemas/Exclude'
        ignoreRouteViolations:
          $ref: '#/components/schemas/IgnoreRouteViolations'
        matrix:
          $ref: '#/components/schemas/Matrix'
        matrixId:
          $ref: '#/components/schemas/MatrixId'
        name:
          $ref: '#/components/schemas/ProfileName'
        options:
          $ref: '#/components/schemas/BusOptions'
        traffic:
          $ref: '#/components/schemas/Traffic'
        type:
          enum:
          - bus
          example: bus
          type: string
        violationMapping:
          $ref: '#/components/schemas/ViolationMapping'
      required:
      - name
      - type
      type: object
    VehicleDrivingRestTime:
      description: '**BETA** Defines driving rest time'
      discriminator:
        mapping:
          fixedDuration: '#/components/schemas/VehicleFixedDurationRestTime'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/VehicleFixedDurationRestTime'
      x-maturity: beta
    BusOptions:
      description: 'Specifies bus profile options. Supported only if the locations'' distribution radius is less than 490 km.

        If not added, only generic bus restrictions are applied and the fastest speed category is considered.'
      properties:
        axleCount:
          description: 'Specifies the total number of axles the vehicle has, i.e., axles on the base

            vehicle and any attached trailers.'
          example: 3
          format: int32
          maximum: 255
          minimum: 2
          type: integer
        grossWeight:
          description: Total vehicle weight, including trailers and shipped goods, in kilograms.
          example: 1000
          minimum: 0
          type: integer
        height:
          description: Vehicle height, in centimeters.
          example: 3000
          maximum: 5000
          minimum: 0
          type: integer
        length:
          description: Vehicle length, in centimeters.
          example: 6000
          maximum: 30000
          minimum: 0
          type: integer
        shippedHazardousGoods:
          items:
            $ref: '#/components/schemas/ShippedHazardousGoods'
          type: array
        speedCap:
          $ref: '#/components/schemas/SpeedCap'
        trailerCount:
          description: The number of trailers attached to the vehicle.
          example: 0
          format: int32
          maximum: 255
          minimum: 0
          type: integer
        tunnelCategory:
          $ref: '#/components/schemas/TunnelCategory'
        weightPerAxle:
          description: 'Vehicle weight per axle, in kilograms.


            **Note:** `weightPerAxle` and `weightPerAxleGroup` are incompatible.'
          example: 500
          minimum: 0
          type: integer
        weightPerAxleGroup:
          $ref: '#/components/schemas/WeightPerAxleGroup'
        width:
          description: Vehicle width, in centimeters.
          example: 2000
          maximum: 5000
          minimum: 0
          type: integer
      type: object
    ViolationMappingItem:
      description: 'Generic base type for violation mappings. Violation mappings belong to either of two categories.

        Mappings belonging to the same category are evaluated together and if they apply, it is reflected

        in the errorCodes of the resulting matrix.

        Two types of mappings are supported: violated restrictions or traffic blockages. These cannot

        be combined into a single violation mapping item; each item must belong to one specific type.'
      discriminator:
        mapping:
          avoidAreasAndSegments: '#/components/schemas/ViolationMappingItemAvoidAreasAndSegments'
          restriction: '#/components/schemas/ViolationMappingItemRestriction'
          traffic: '#/components/schemas/ViolationMappingItemTraffic'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/ViolationMappingItemRestriction'
      - $ref: '#/components/schemas/ViolationMappingItemTraffic'
      - $ref: '#/components/schemas/ViolationMappingItemAvoidAreasAndSegments'
    MaximizePriorityJobs:
      description: '**ALPHA** An objective to maximize assignment of prioritized jobs.'
      properties:
        type:
          enum:
          - maximizePriorityJobs
          example: maximizePriorityJobs
          type: string
      required:
      - type
      type: object
      x-maturity: alpha
    ExcessCosts:
      description: '**BETA** Specifies limits on distance, stops count etc.

        Penalties have to be paid in case those limits are violated.'
      properties:
        distance:
          $ref: '#/components/schemas/ExcessCostsField'
        duration:
          $ref: '#/components/schemas/ExcessCostsField'
        stops:
          $ref: '#/components/schemas/ExcessCostsField'
        waitingTime:
          $ref: '#/components/schemas/ExcessCostsField'
      type: object
      x-maturity: beta
    VehicleBreakPolicy:
      description: "Specifies the policy for vehicle break.\n  * `allowAtTheEnd`: The vehicle break will be scheduled even if the vehicle arrives at the depot before the break's time window ends.\n\nThe break will be inserted prior to the arrival activity. By default, if a vehicle completes a tour before the end of the break, it is not added to the tour."
      enum:
      - allowAtTheEnd
      type: string
    Schedule:
      description: Specifies the expected `arrival` and `departure` times at a particular stop.
      properties:
        arrival:
          $ref: '#/components/schemas/DateAndTime'
        departure:
          $ref: '#/components/schemas/DateAndTime'
      required:
      - arrival
      - departure
      type: object
    HouseKeysConfig:
      description: '**ALPHA** Configures the house keys feature which controls how service time is calculated

        when multiple jobs with the same `houseKeyId` are served at the same stop.'
      properties:
        defaultStrategy:
          $ref: '#/components/schemas/HouseKeysStrategy'
          description: The default strategy applied to all house key groups.
      required:
      - defaultStrategy
      type: object
      x-maturity: alpha
    BalanceActivities:
      description: '**ALPHA** An objective to balance activities across all tours.'
      properties:
        options:
          $ref: '#/components/schemas/BalanceOptions'
        type:
          enum:
          - balanceActivities
          example: balanceActivities
          type: string
      required:
      - options
      - type
      type: object
      x-maturity: alpha
    Plan:
      description: '[Set of jobs](https://docs.here.com/tour-planning/docs/problem#plan) that need to be completed as part of a tour. This includes details such as job locations for

        pickups and deliveries, time windows for when these tasks should be performed, and any specific requirements

        or constraints related to completing each job according to specific business requirements.'
      properties:
        clustering:
          description: "This feature groups similar jobs into one or more clusters to ensure they are assigned to the same\nstop whenever possible, allowing them to be served together. Jobs are considered similar if they\nshare the same:\n\n  * Job type (only `pickup` or `delivery` are supported)\n  * Locations\n  * Time windows\n  * Skills\n  * Demand dimensions\n\n**Note**: If a cluster violates any constraints, it is divided into smaller clusters.\nJobs with priority are excluded from clustering."
          properties:
            serviceTimeStrategy:
              $ref: '#/components/schemas/ServiceTimeStrategy'
          required:
          - serviceTimeStrategy
          type: object
        groups:
          description: '**BETA** [Job groups](https://docs.here.com/tour-planning/docs/group-jobs) help organize jobs based on specific criteria, ensuring that jobs within the same group are completed sequentially by the same vehicle.

            Grouping jobs also allows for designating Pick-Up and Drop-Off (PUDO) points, which are locations for storing or collecting goods for a specific job group.'
          items:
            $ref: '#/components/schemas/Group'
          minItems: 1
          type: array
          x-maturity: beta
        houseKeys:
          allOf:
          - $ref: '#/components/schemas/HouseKeysConfig'
          description: '**ALPHA** Configures the house keys feature which controls how service time is calculated

            when multiple jobs with the same `houseKeyId` are served at the same stop.'
          x-maturity: alpha
        jobs:
          description: 'A list of jobs to be completed during the tour. Jobs consist of pickup tasks, delivery tasks, or a combination of both, assigned to vehicles.

            Each job may include a location, service duration, and demand (for example, volume, mass). Optional attributes include houseKeyId for

            multi-delivery or pickup, time windows, required skills, tags, territory IDs, group IDs, priority, and customer ID.


            The job limit is calculated by summing all pickup and delivery task locations.

            This total cannot exceed 500 tasks for the synchronous endpoint and 7000 tasks for the asynchronous endpoint.'
          items:
            $ref: '#/components/schemas/Job'
          minItems: 1
          type: array
        relations:
          description: "Allows defining rules and order for completing jobs by specific vehicles during the [tour re-planning process](https://docs.here.com/tour-planning/docs/relations).\n\n**Note**:\n  * The optimization algorithm does not check jobs within a relation for constraint violations.\n  * Relations cannot be used with jobs having multiple pickups or deliveries."
          items:
            $ref: '#/components/schemas/Relation'
          maxItems: 1000
          minItems: 1
          type: array
        shared:
          allOf:
          - $ref: '#/components/schemas/Shared'
          x-maturity: alpha
      required:
      - jobs
      type: object
    JobPositionFirst:
      description: Puts the job task at the beginning of the tour, executed immediately after departure.
      properties:
        type:
          enum:
          - first
          example: first
          type: string
      required:
      - type
      type: object
    PrivateBusProfile:
      description: Route calculation for buses that are not allowed to drive through the bus-only roads.
      properties:
        avoid:
          $ref: '#/components/schemas/AvoidRoutes'
        departureTime:
          $ref: '#/components/schemas/DateAndTime'
        exclude:
          $ref: '#/components/schemas/Exclude'
        ignoreRouteViolations:
          $ref: '#/components/schemas/IgnoreRouteViolations'
        matrix:
          $ref: '#/components/schemas/Matrix'
        matrixId:
          $ref: '#/components/schemas/MatrixId'
        name:
          $ref: '#/components/schemas/ProfileName'
        options:
          $ref: '#/components/schemas/BusOptions'
        traffic:
          $ref: '#/components/schemas/Traffic'
        type:
          enum:
          - privateBus
          example: privateBus
          type: string
        violationMapping:
          $ref: '#/components/schemas/ViolationMapping'
      required:
      - name
      - type
      type: object
    WeightPerAxleGroup:
      description: 'Specifies the weights of different axle groups, like single and tandem axles.


        This allows specification of axle weights in a more fine-grained way than `weightPerAxle`. This

        is relevant in countries with signs and regulations that specify different limits for different

        axle groups, like the USA and Sweden.


        Weights are specified in kilograms (kg) and are the total weight of the axle group.


        **Note:** `weightPerAxleGroup` and `weightPerAxle` are incompatible.'
      example:
        single: 11000
        tandem: 18000
      properties:
        quad:
          description: quad axle group
          format: int32
          minimum: 0
          type: integer
        quint:
          description: quint axle group
          format: int32
          minimum: 0
          type: integer
        single:
          description: single axle group
          format: int32
          minimum: 0
          type: integer
        tandem:
          description: tandem axle group
          format: int32
          minimum: 0
          type: integer
        triple:
          description: triple axle group
          format: int32
          minimum: 0
          type: integer
      type: object
    JobPositionAny:
      description: 'Puts the job task at any place in the tour (also between ordered jobs) but not before the `first`

        position and not after the `last` position. This designation permits the API to position assignments

        within the tour anywhere between first and last assignments, optimizing the route for cost and time efficiency.'
      properties:
        type:
          enum:
          - any
          example: any
          type: string
      required:
      - type
      type: object
    HouseKeysMaxDurationStrategy:
      description: Takes max time duration from all activities and applies it once.
      example:
        type: maxDuration
      properties:
        type:
          enum:
          - maxDuration
          example: maxDuration
          type: string
      required:
      - type
      type: object
      x-maturity: alpha
    MaximizeTours:
      description: '**ALPHA** Maximizes the number of used vehicles.'
      properties:
        type:
          enum:
          - maximizeTours
          example: maximizeTours
          type: string
      required:
      - type
      type: object
      x-maturity: alpha
    RelationType:
      description: "Defines how jobs are related to each other and how they should be completed by a specific vehicle.\nThe following relation types are supported:\n  * `sequence`: Jobs must be served by the vehicle in the specified order without changes or without\n    inserting other jobs between them.\n  * `flexible`: Jobs must be served in the provided order, but other jobs unspecified in the relation\n    can be inserted between them.\n  * `tour`: Jobs must be completed by the specified vehicle, but the order can be changed."
      enum:
      - sequence
      - tour
      - flexible
      example: sequence
      type: string
    VehicleWorkingRestTime:
      description: '**BETA** Defines working rest time'
      discriminator:
        mapping:
          fixedDuration: '#/components/schemas/VehicleFixedDurationRestTime'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/VehicleFixedDurationRestTime'
      x-maturity: beta
    JobTask:
      description: 'Refers to a specific action within a job, such as picking up or delivering items at designated

        locations. Each job can include up to three pickup tasks and up to three delivery tasks,

        with each task having specific requirements and properties, such as demand (capacity requirements)

        and places (locations where the task is performed).'
      properties:
        demand:
          $ref: '#/components/schemas/Unit'
        order:
          deprecated: true
          description: 'Deprecated, use `position` instead.


            Job tasks with lower values of `order` are scheduled earlier in the route than job tasks

            with higher values of `order`.'
          example: 1
          minimum: 1
          type: integer
        places:
          items:
            $ref: '#/components/schemas/JobPlace'
          maxItems: 3
          minItems: 1
          type: array
        position:
          $ref: '#/components/schemas/JobPositionInTour'
      required:
      - places
      - demand
      type: object
    RoutingLocation:
      description: 'Represents a geographic location with coordinates and optional routing hints. Used to specify

        vehicle depot locations, job sites, break locations, charging stations, and other geographic

        points in tour planning. Includes latitude, longitude, optional location ID, optional side of

        street hint for preferred stopping side, and optional name hint to improve routing accuracy.'
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Id'
          description: 'Specifies the location ID. Avoid referencing any sensitive or personal information, such

            as names, addresses, or information about a delivery or service. If specified and custom

            matrix provided, there is no need to pass latitude and longitude.'
        lat:
          description: Specifies the latitude coordinate in WGS-84 degrees.
          example: 52.53088
          format: double
          maximum: 90
          minimum: -90
          type: number
        lng:
          description: Specifies the longitude coordinate in WGS-84 degrees.
          example: 13.38471
          format: double
          maximum: 180
          minimum: -180
          type: number
        nameHint:
          description: 'Directs the route calculation to search for a location with a matching or similar name,

            improving routing accuracy when location names are known.'
          example: Friedrich-List-Straße
          type: string
        sideOfStreetHint:
          $ref: '#/components/schemas/SideOfStreetHint'
      type: object
    SoftTimeWindow:
      description: '**ALPHA** Represents a single soft constraint time window that allows flexibility when minor delays are acceptable.

        Consists of a hard constraint boundary (absolute time limits that cannot be exceeded) and a preferred

        time window (soft constraint), placed within the hard constrain boundary, for example:


        Example:


        ```markdown

        Absolute:   09:00 |---------------------------| 13:00

        Preferred:          10:00 |-----------| 12:00

        ```


        Violations of the preferred time window are penalized but allowed, while violations of the hard

        boundary result in unassigned jobs. To enable this experimental feature, add the `softTimeWindows`

        flag to `experimentalFeatures` configuration in the problem.


        For more information, see [Set soft time windows](https://docs.here.com/tour-planning/docs/soft-time-windows).'
      properties:
        from:
          $ref: '#/components/schemas/SoftTime'
        to:
          $ref: '#/components/schemas/SoftTime'
      required:
      - from
      - to
      type: object
      x-maturity: alpha
    PolygonArea:
      description: 'A polygon defined as a list of coordinates.


        The polygon is automatically closed, so repeating the first vertex is not required.'
      properties:
        outer:
          description: List of coordinates defining the outline of the polygon.
          items:
            $ref: '#/components/schemas/Coordinate'
          maxItems: 100
          minItems: 3
          type: array
        type:
          enum:
          - polygon
          example: polygon
          type: string
      required:
      - outer
      - type
      type: object
    Tour:
      description: 'Represents a [pre-optimized route](https://docs.here.com/tour-planning/docs/solution#list-of-tours)

        that has been completed by a single vehicle, encompassing all assigned activities, such as pickups,

        deliveries, breaks, and so on.'
      properties:
        shiftIndex:
          $ref: '#/components/schemas/ShiftIndex'
        statistic:
          $ref: '#/components/schemas/Statistic'
        stops:
          description: 'The list of specific locations where a vehicle is scheduled to halt for various activities,

            such as pickups, deliveries, or breaks.'
          items:
            $ref: '#/components/schemas/Stop'
          type: array
        typeId:
          $ref: '#/components/schemas/Id'
        vehicleId:
          $ref: '#/components/schemas/Id'
      required:
      - vehicleId
      - typeId
      - stops
      - statistic
      - shiftIndex
      type: object
    UnassignedJobReason:
      description: 'Explains the circumstances under which a job was not assigned.

        For example, no vehicles with the required skill were available to complete the job.'
      properties:
        code:
          description: Specifies the reason code for a job that remains unassigned.
          example: SKILL_CONSTRAINT
          type: string
        description:
          description: Provides supplementary information to aid in identifying and resolving the underlying issue that caused the job to remain unassigned.
          example: cannot serve required skill
          type: string
        details:
          description: Provides more details about unassignment.
          items:
            $ref: '#/components/schemas/UnassignedJobDetail'
          minItems: 1
          type: array
      required:
      - code
      - description
      type: object
    AvoidArea:
      description: 'Defines an explicit area to avoid/exclude when calculating the routes.

        Areas to be avoided/excluded can be specified by boundingBoxes or polygons (as encoded polyline or as list of geopts ).


        Notes:

        * Maximum count of polygons is 20. The combined total of boundingBoxes and polygons has a maximum limit of 250.

        * Minimum count of coordinates in any single polygon is 3. If less the corresponding error will be returned.

        * Maximum count of coordinates in any single polygon is 16. If more the corresponding error will be returned.

        * Self-intersecting polygons are not supported. If they are present in the request, the corresponding error will be returned.'
      discriminator:
        mapping:
          boundingBox: '#/components/schemas/BoundingBoxArea'
          encodedPolygon: '#/components/schemas/EncodedPolygonArea'
          polygon: '#/components/schemas/PolygonArea'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/BoundingBoxArea'
