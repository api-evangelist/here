    JobPositionInTour:
      description: 'Specifies the position of the job task in the tour. Use the `position` property to control the

        serving order of tasks within a tour. Job tasks with a `position` property are scheduled earlier

        in the route than job tasks without one, except for tasks with `position` set to `last`,

        which are always assigned last.


        The following position types are supported:


        - `first`: Schedules the task immediately after departure, before all other tasks.

        - `last`: Schedules the task at the end of the tour, after all other tasks.

        - `any`: Schedules the task anywhere in the tour between `first` and `last` tasks.

        - `ordered`: Schedules the task after `first` and before `last` tasks, according to a numeric `value`, where lower values are served earlier.


