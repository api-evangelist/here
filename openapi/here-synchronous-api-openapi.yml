    LinearPenalty:
      description: '**ALPHA** Linear penalty function that increases at a constant rate for each unit of time deviation from the preferred time window. This penalty type imposes costs immediately and consistently for any deviation, maintaining strict adherence to the schedule. Suitable for scenarios where minor delays are acceptable but should be minimized, such as grocery delivery or passenger pickup.'
      properties:
        type:
          enum:
          - linear
          example: linear
          type: string
      required:
      - type
      type: object
      x-maturity: alpha
    VehicleFixedDurationRestTime:
      description: '**BETA** Defines type of rest time configuration with fixed duration'
      properties:
        breakDuration:
          allOf:
          - $ref: '#/components/schemas/Duration'
          maximum: 172800
          minimum: 60
        interval:
          description: Determines after how long (in seconds) the break should occur
          example: 16200
          format: int64
          maximum: 604800
          minimum: 1800
          type: integer
        type:
          enum:
          - fixedDuration
          example: fixedDuration
          type: string
      required:
      - interval
