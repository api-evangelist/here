          maxItems: 10
          minItems: 1
          type: array
          x-maturity: alpha
        conflictingCategories:
          description: Represents a set of conflicting job categories.
          example:
          - food
          - non-food
          items:
            $ref: '#/components/schemas/Category'
          maxItems: 100
          minItems: 2
          type: array
          uniqueItems: true
      type: object
    VehicleFixedDutyRestTime:
      description: '**ALPHA** Defines type of duty rest time configuration with fixed duration


        Disclaimer: This is an experimental feature under development

        To enable it, add `restTimes` flag to `experimentalFeatures` configuration in the problem.'
      properties:
        canStartEarly:
          default: false
          description: 'Determines whether the break can start earlier than required.

            This allows for more optimal breaks allocation in order to minimize wait time.'
          example: true
