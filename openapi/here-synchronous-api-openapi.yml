          type: string
      required:
      - error
      - error_description
      type: object
    SideOfStreetHint:
      description: 'Provides a hint indicating the preferred side of the street for a job location. This ensures

        vehicles stop on the most convenient or safest side of the road to perform the delivery or pickup.

        The hint is a geographic point next to the street where the vehicle should stop.


        All locations with the same coordinates must have the same side of street attribute.


        For more information, see [Optimize routes with side-of-street preferences](https://docs.here.com/tour-planning/docs/side-of-street).'
      properties:
        lat:
          description: Specifies the latitude coordinate in WGS-84 degrees of the preferred stopping point.
          example: 52.53088
          format: double
          maximum: 90
          minimum: -90
          type: number
        lng:
          description: Specifies the longitude coordinate in WGS-84 degrees of the preferred stopping point.
          example: 13.38471
          format: double
          maximum: 180
          minimum: -180
          type: number
        matchSideOfStreet:
          default: onlyIfDivided
          description: 'Determines how strictly the side of street hint should be applied during route calculation.


            * `always`: Always use the side of street hint for this location

            * `onlyIfDivided`: Only use the side of street hint when the road is divided (default)


            For more information, see [Optimize routes with side-of-street preferences](https://docs.here.com/tour-planning/docs/side-of-street).'
          enum:
          - always
          - onlyIfDivided
          example: onlyIfDivided
          type: string
      required:
      - lat
      - lng
      type: object
    ProfileName:
      description: 'Specifies the name of the profile. Avoid assigning real-life identifiers, such as a

        vehicle license plate Id or personal name as the `profileName` of the routing profile.'
      example: normal_car
      maxLength: 128
      minLength: 1
      pattern: ^[a-zA-Z0-9_-]+$
      type: string
    VehicleMinStopsCountLimit:
      description: '**ALPHA** Hard limit on the minimum number of stops in a shift.

        Please consult the developer guide for more information before using this feature.

        To enable it, add `minStops` flag to `experimentalFeatures` configuration in the problem.'
      properties:
        value:
          description: The minimum number of stops allowed in a vehicle shift.
          example: 1
          minimum: 0
          type: integer
      required:
      - value
      type: object
      x-maturity: alpha
    TimeWindows:
      description: 'Represents multiple hard constraint time windows. Each time window specifies a time period during which

        an activity (such as a delivery or pickup) must start. No violations are allowed - if a job cannot be

        served within any of the specified time windows, it might remain unassigned.


        For more information, see [Limit the start time of activities through time windows](https://docs.here.com/tour-planning/docs/time-windows).'
      example:
      - - '2020-07-04T08:00:00Z'
        - '2020-07-04T10:00:00Z'
      - - '2020-07-04T16:00:00Z'
        - '2020-07-04T18:00:00Z'
      items:
        $ref: '#/components/schemas/TimeWindow'
      maxItems: 4
      minItems: 0
      type: array
    TimeWindow:
      description: 'Represents a single hard constraint time window. The first element is the lower bound

        (earliest start time) and the second element is the upper bound (latest start time) in RFC3339 format.

        The job task must begin within this time window or the job may remain unassigned.'
      example:
      - '2020-07-04T08:00:00Z'
      - '2020-07-04T10:00:00Z'
      items:
        $ref: '#/components/schemas/DateAndTime'
      maxItems: 2
      minItems: 2
      type: array
    QuadraticPenalty:
      description: '**ALPHA** Quadratic penalty function that increases exponentially with larger deviations from the preferred time window. Provides flexibility for small delays but strongly discourages large deviations. Suitable for time-sensitive scenarios where lateness has serious consequences, such as medical deliveries, perishable goods transport, or executive transport.'
      properties:
        type:
          enum:
          - quadratic
          example: quadratic
          type: string
      required:
      - type
      type: object
      x-maturity: alpha
    Termination:
      description: Defines the conditions under which the optimization algorithm stops running.
      properties:
        maxTime:
          description: 'Sets the maximum duration (in seconds) the algorithm runs to solve a problem. If the algorithm doesn''t find

            a solution within this time, it stops and returns the best solution found so far.



            | Endpoint Type     | Maximum Value (seconds)  | Default Value (seconds) |

            |-------------------|--------------------------|-------------------------|

            | Synchronous       | 300                      | 240                     |

            | Asynchronous      | 18000                    | 3600                    |'
          example: 30
          format: int64
          minimum: 1
          type: integer
        searchEffort:
          default: balanced
          description: '**ALPHA** Controls how aggressively the solver terminates when progress slows down.

            Defaults to "balanced" if omitted.'
          enum:
          - quick
          - balanced
          - thorough
          example: balanced
          type: string
          x-maturity: alpha
        stagnationTime:
          description: 'Specifies the duration (in seconds) the algorithm waits for an improved solution before stopping.

            If no better solution is found within this time, the algorithm terminates, which prevents wasting resources on minimal improvements.


            | Endpoint Type     | Maximum Value (seconds)  | Default Value (seconds) |

            |-------------------|--------------------------|-------------------------|

            | Synchronous       | 240                      | 10                      |

            | Asynchronous      | 18000                    | 600                     |'
          example: 5
          format: int64
          minimum: 1
          type: integer
      required:
      - maxTime
      - stagnationTime
      type: object
    ViolationMapping:
      description: 'List of items for mapping certain violated restrictions to specific error codes in the matrix.

        This mapping can classify restrictions or blockages while still providing

        the resulting times and distances in the calculated matrix.

        Items are grouped into categories and evaluated collectively. Error codes are associated

        with the `category`, rather than being tied to individual restrictions or blockages.


        There are three distinct types of mappings:

        * violated restrictions

        * traffic-related blockages

        * violations when avoiding areas or individual segments


        These mappings must be maintained as separate violation mapping items, although they can belong to

        the same category.


        A violation mapping type can support additional parameters defining how a particular violation should be

        managed. There are three settings for these parameters:


        `include`: the violated restriction is added to a mapped

        category instead of causing a hard error code 3.


        `exclude`: the violated restriction is not added to a mapped

        category and still causes an error code 3. This is the default for

        height and grossWeight.


        `ignore`: the algorithm is not taking the restriction or

        property / attribute of the road into consideration.

        This is the default attribute for restrictions on bridge or time-dependent

        restrictions.


        The parameters for each mapping type are listed in the respective schema.


        Examples for mappings of different types as `category` 1:


        -  map violations with violated height and violated grossWeight:<br/>

        `{ "category": "category1", "type": "restriction", "grossWeight": "include", "height": "include" }`

        - map violations with violated height and NOT violated grossWeight:<br/>

        `{ "category": "category1", "type": "restriction", "height": "include", "grossWeight": "exclude" }`

        - map violations with violated height, violation or non-violation of grossWeight doesn''t

        matter:<br/>

        `{ "category": "category1", "type": "restriction", "height": "include", "grossWeight": "ignore" }`

        - map violations with violated height and violated currentWeight:<br/>

        `{ "category": "category1", "type": "restriction", "height": "include", "currentWeight": "include" }`

        - map violations with violated height and NOT violated currentWeight:<br/>

        `{ "category": "category1", "type": "restriction", "height": "include", "currentWeight": "exclude" }`

        - map violations with violated height, violation or non-violation of currentWeight doesn''t

        matter:<br/>

        `{ "category": "category1", "type": "restriction","height": "include", "currentWeight": "ignore" }`

        - map violations of avoiding an area or a segment:<br/>

        `{ "category": "category1", "type": "avoidAreasAndSegments" }`

        - map violations of traffic-related blockages outside of bridges:<br/>

        `{ "category": "category1", "type": "traffic", "bridge": "exclude" }`


        Unless include or exclude is stated, grossWeight or height can be

        mapped regardless, if it is timeDependent or on a bridge.

        Please see `matrix` description in the response section for more

        information about error codes.


        If additional types of restrictions are supported for mapping in the

        future, they will default to "ignore" to ensure consistent results.


        A violation mapping item belongs to either of two categories.


        Mappings of type `traffic` or `avoidAreasAndSegments` are only supported for

        transport modes `car` and `truck`.'
      items:
        $ref: '#/components/schemas/ViolationMappingItem'
      maxItems: 10
      minItems: 1
      type: array
      uniqueItems: true
    JobPositionOrdered:
      description: 'In order of priority, puts the job task lower than `first` but higher than unordered and `last` tasks.


        Assignments labeled as `ordered` must also include an associated `position` value, represented

        by an integer equal to or greater than `1`. When multiple ordered assignments share the same

        `position` value, the API optimizes the route among them before proceeding.'
      properties:
        type:
          enum:
          - ordered
          example: ordered
          type: string
        value:
          example: 1
          minimum: 1
          type: integer
      required:
      - value
      - type
      type: object
    ExcessCostStatistics:
      description: 'Excess costs broken down by metric. Fields are only present when the corresponding

        limit is configured and the excess cost is non-zero.'
      properties:
        distance:
          description: Cost incurred for distance exceeding the configured limit.
          example: 50
          format: double
          minimum: 0
          type: number
        duration:
          description: Cost incurred for duration exceeding the configured limit.
          example: 30
          format: double
          minimum: 0
          type: number
        stops:
          description: Cost incurred for stop count exceeding the configured limit.
          example: 25
          format: double
          minimum: 0
          type: number
        waitingTime:
          description: Cost incurred for waiting time exceeding the configured limit.
          example: 15
          format: double
          minimum: 0
          type: number
      type: object
      x-maturity: alpha
    BalanceOptions:
      description: '**ALPHA** Specifies balance objective options. At the moment, it uses coefficient of variation as balancing measure.'
      properties:
        threshold:
          description: A balancing threshold specifies desired balancing level. Lower values can be ignored in favor of another objective.
          example: 0.5
          format: double
          maximum: 1
          minimum: 0
          type: number
      required:
      - threshold
      type: object
      x-maturity: alpha
    MinimizeDistance:
      description: An objective to minimize total distance.
      properties:
        type:
          enum:
          - minimizeDistance
          example: minimizeDistance
          type: string
      required:
      - type
      type: object
    Skills:
      description: 'A list of skills required by a job or provided by a vehicle type. Only vehicles with all the

        skills required by a job can serve that job. Use skills to match specific vehicle capabilities

        to job requirements, such as `fridge` for refrigerated transport, `plumber` for service jobs,

        or `heavy_duty` for large loads. If no vehicle with matching skills has sufficient capacity or

        time, jobs requiring those skills will remain unassigned.


        For more information, see [Assign jobs based on skills](https://docs.here.com/tour-planning/docs/skills).'
      example:
      - fridge
      items:
        maxLength: 64
        minLength: 1
        pattern: ^[a-zA-Z0-9_-]+$
        type: string
      maxItems: 100
      minItems: 1
      type: array
    MatrixOrigin:
      description: An ordered list of origins used in the routing matrix
      discriminator:
        mapping:
          id: '#/components/schemas/MatrixOriginId'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/MatrixOriginId'
    TruckProfile:
      description: 'Route calculation for trucks. This mode considers truck limitations on links

        and uses different speed assumptions when calculating the route. The `departureTime`

        property allows to specify a custom date-time for which `traffic optimization` in routing

        calculations shall be performed. See `fleet.traffic` for details.'
      example:
        name: normal_truck
        type: truck
      properties:
        avoid:
          $ref: '#/components/schemas/AvoidRoutes'
        departureTime:
          $ref: '#/components/schemas/DateAndTime'
        exclude:
          $ref: '#/components/schemas/Exclude'
        ignoreRouteViolations:
          $ref: '#/components/schemas/IgnoreRouteViolations'
        matrix:
          $ref: '#/components/schemas/Matrix'
        matrixId:
          $ref: '#/components/schemas/MatrixId'
        name:
          $ref: '#/components/schemas/ProfileName'
        options:
          $ref: '#/components/schemas/TruckOptions'
        traffic:
          $ref: '#/components/schemas/Traffic'
        type:
          enum:
          - truck
          example: truck
          type: string
        violationMapping:
          $ref: '#/components/schemas/ViolationMapping'
      required:
      - name
      - type
      type: object
    CarOptions:
      description: Specifies car profile options.
      properties:
        axleCount:
          description: Specifies the total number of axles the vehicle has, i.e., axles on the base vehicle and any attached trailers.
          example: 2
          format: int32
          maximum: 255
          minimum: 2
          type: integer
        speedCap:
          $ref: '#/components/schemas/SpeedCap'
        trailerCount:
          description: 'The number of trailers attached to the vehicle.


            **Limitations:** Considered for route calculation for restrictions, but not for speed limits.'
          example: 0
          format: int32
          maximum: 1
          minimum: 0
          type: integer
      type: object
    Configuration:
      description: 'Provides a way to define various additional settings and constraints for solving vehicle routing problems

        or permit the use of experimental features.


        For more information, see [Configuration](https://docs.here.com/tour-planning/docs/configuration).'
      properties:
        experimentalFeatures:
          $ref: '#/components/schemas/ExperimentalFeatures'
        routeDetails:
          $ref: '#/components/schemas/RouteDetailsConfiguration'
        termination:
          $ref: '#/components/schemas/Termination'
      type: object
  responses:
    ForbiddenErrorResponse:
      description: The API key or authentication credentials do not allow you to access the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            errorResponseExample:
              $ref: '#/components/examples/ForbiddenErrorResponse'
    TooManyRequestsResponse:
      description: The number of API requests has exceeded the allowed limit within a specified time frame.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsResponse'
          examples:
            errorResponseExample:
              $ref: '#/components/examples/TooManyRequestsResponse'
      headers:
        Retry-After:
          description: The value (in seconds) that indicates how long you must wait before making additional requests.
          schema:
            type: integer
            example: 5
        X-RateLimit-Limit:
          description: "Indicates the maximum number of requests you can make within the specified time window (in seconds), \nformatted as \"number, number; w=window\".\n"
          schema:
            type: string
            example: 50, 50;w=10
        X-RateLimit-Reset:
          description: Indicates (in seconds) how long you must wait before sending more requests.
          schema:
            type: integer
            example: 5
    UnauthenticatedErrorResponse:
      description: The API key or authentication credentials are invalid or missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            errorResponseExample:
              $ref: '#/components/examples/UnauthenticatedErrorResponse'
    ServerErrorResponse:
      description: An internal server error has occurred that prevents the API from processing the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerErrorResponse'
          examples:
            errorResponseExample:
              $ref: '#/components/examples/ServerErrorResponse'
  examples:
    ServerErrorResponse:
      value:
        title: Server error
        status: 500
        code: E613000
        cause: Internal server error.
        action: ''
        correlationId: ff93d908-aecf-4df8-b9f6-3d33f85d638a
    UnauthenticatedErrorResponse:
      value:
        error: Unauthorized
        error_description: No credentials found
    TooManyRequestsResponse:
      value:
        error: Too Many Requests
        error_description: Rate limit for this service has been reached
    ForbiddenErrorResponse:
      value:
        error: Forbidden
        error_description: These credentials do not authorize access.
  headers:
    X-Request-Id:
      description: User-provided token that can be used to trace a request or a group of requests sent to the service.
      style: simple
      explode: false
      schema:
        type: string
      example: 8230d7ad-3f1c-4191-a8dd-f3c42026da89
    X-Correlation-Id:
      description: An auto-generated identifier that uniquely distinguishes each request.
      style: simple
      explode: false
      schema:
        type: string
      example: 4199533b-6290-41db-8d79-edf4f4019a74
  securitySchemes:
    ApiKey:
      type: apiKey
      name: apikey
      in: query
      description: "The API authentication key. For more information on how to get an API key, \nsee [Identity and Access Management - Developer Guide](https://docs.here.com/identity-and-access-management/docs/plat-using-apikeys).\n"
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'This token is obtained from a separate endpoint using client credentials and an OAuth 1.0a HMAC-SHA256 signed request.

        For more information on how to get a bearer token, see [OAuth 2.0 tokens](https://docs.here.com/identity-and-access-management/docs/how-to-authorize-with-oauth-20).

        '
externalDocs:
  description: The Developer guide and Release notes are available here.
  url: https://docs.here.com/tour-planning/docs/introduction-tour-planning
