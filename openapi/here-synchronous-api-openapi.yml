            thereby altering the driving duration. For instance, when utilizing a speedFactor of 0.1,

            the speed is reduced to 10% of the normal, resulting in the vehicle taking 10 times longer to travel

            the same distance. Consider using realistic values for the speedFactor.

            This multiplier does not take into account actual speed limits imposed by the roads or any legal regulations.'
          example: 1
          format: double
          maximum: 10
          minimum: 0.1
          type: number
        territories:
