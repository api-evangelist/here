tags:
- name: API Information
paths:
  /health:
    get:
      summary: Tests basic health of the service
      operationId: Cost Management Usage API v2 getHealth
      tags:
      - API Information
      parameters:
      - $ref: '#/components/parameters/xRequestId'
      security:
      - token: []
      responses:
        '200':
          description: Health status of the service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHealthStatus'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
    servers:
    - url: https://usage.bam.api.here.com/v2
      description: Production server.
  /version:
    get:
      summary: Retrieves API version information
      operationId: Cost Management Usage API v2 getApiVersion
      tags:
      - API Information
      parameters:
      - $ref: '#/components/parameters/xRequestId'
      security:
      - token: []
      responses:
        '200':
          description: Version of the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersion'
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
    servers:
    - url: https://usage.bam.api.here.com/v2
      description: Production server.
  /isalive:
    get:
      tags:
      - API Information
      summary: Weather service is alive check
      description: Weather service is working properly.
      operationId: Weather API v1 weatherIsAlive
      responses:
        '200':
          description: Service is live, all components works.
        '500':
          description: Internal server error.
        '503':
          description: Service is not working.
      security:
      - Bearer: []
    servers:
    - url: https://weather.cc.api.here.com
      description: Production environment URL.
  /openapi:
    get:
      summary: This API specification
      description: Returns this API specification in YAML format.
      operationId: Weather API v3 getOpenapi
      tags:
      - API Information
      parameters:
      - $ref: '#/components/parameters/X-Request-Id'
      responses:
        '200':
          description: 'Open API specification of this service.

            If Accept header is specified as `application/x-yaml` or `text/x-yaml`, then the API is returned in YAML format.

            By default (or if not Accept header is specified) the return format is JSON.

            '
          content:
            application/json:
              schema:
                type: object
            application/x-yaml:
              schema:
                type: string
            text/x-yaml:
              schema:
                type: string
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Error401Response'
        '403':
          $ref: '#/components/responses/Error403Response'
        '500':
          $ref: '#/components/responses/Error500Response_2'
        '502':
          $ref: '#/components/responses/Error502Response'
        '503':
          $ref: '#/components/responses/Error503Response_2'
        '504':
          $ref: '#/components/responses/Error504Response'
      security:
      - Bearer: []
      - ApiKey: []
    servers:
    - url: https://weather.hereapi.com/v3
      description: Production environment URL
  /fuel/isalive:
    get:
      parameters:
      - $ref: '#/components/parameters/X-Request-Id'
      tags:
      - API Information
      summary: Fuel service is alive check
      description: Fuel service is working properly
      operationId: Fuel Prices API v2 fuelIsAlive
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiIsAliveStatus'
          description: Service is live, all components works
        '500':
          $ref: '#/components/responses/Error500Response_3'
        '503':
          $ref: '#/components/responses/Error503Response_3'
      security:
      - Bearer: []
    servers:
    - url: https://fuel-v2.cc.api.here.com
      description: Production environment URL
    - url: https://fuel-v2.cit.cc.api.here.com
      description: Staging environment URL
  /fuel/version:
    get:
      parameters:
      - $ref: '#/components/parameters/X-Request-Id'
      tags:
      - API Information
      summary: Fuel service version
      operationId: Fuel Prices API v2 fuelVersion
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: Service version
        '500':
          $ref: '#/components/responses/Error500Response_3'
        '503':
          $ref: '#/components/responses/Error503Response_3'
      security:
      - Bearer: []
    servers:
    - url: https://fuel-v2.cc.api.here.com
      description: Production environment URL
    - url: https://fuel-v2.cit.cc.api.here.com
      description: Staging environment URL
