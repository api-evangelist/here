  x-refined-note:
  - x-comment differs across the merged source definitions and was not carried
  - x-document-meta-data differs across the merged source definitions and was not carried
  - x-olp-service differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged API Information across 18 of this provider''s published API definitions: here-cost-management-usage-v2-openapi.yml, here-destination-weather-v1-openapi.yml, here-destination-weather-v3-openapi.yml, here-ev-charge-points-v3-openapi.yml, here-fuel-prices-v2-openapi.yml, here-fuel-prices-v3-openapi.yml, here-geocoding-batch-v7-openapi.yml, here-gnss-data-v2-openapi.yml, here-isoline-routing-v8-openapi.yml, here-map-image-v3-openapi.yml, here-matrix-routing-v8-openapi.yml…'
