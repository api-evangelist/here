  schemas:
    ApiVersion:
      type: object
      required:
      - apiVersion
      properties:
        apiVersion:
          description: Version of the API.
          type: string
    ApiHealthStatus:
      type: object
      properties:
        status:
          description: Health status of the API.
          type: string
    Error:
      type: object
      properties:
        Type:
          type: string
          example: Invalid Request
        Message:
          type: array
          items:
            type: string
            example: Request parameter 'product' does not conform with expected data type. Please check the documentation.
    AuthError:
      description: Error object reported in case of authentication or authorization errors.
      type: object
      properties:
        error:
          type: string
          description: Error message.
        error_description:
          type: string
          description: Detailed information about the error.
      example:
        Type: Unauthorized
        Message: ApiKey invalid. ApiKey not found.
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP status code.
        title:
          type: string
          description: Human-readable error description.
        code:
          type: string
          description: Error code
        cause:
          type: string
          description: Human-readable explanation for the error.
        action:
          type: string
          description: Human-readable action for the user.
        correlationId:
          type: string
          description: Auto-generated ID univocally identifying this request.
      required:
      - status
      - title
      - code
      - cause
      - action
      - correlationId
    HealthResponse:
      type: object
      description: Returns the health of the service.
      properties:
        status:
          description: 'Health status of the service:

            * `ok` - the service is operating normally

            * `fail` - the service is currently encountering a failure

            '
          type: string
    VersionResponse:
      type: object
      description: Returns the version of the service.
      properties:
        apiVersion:
          type: string
          example: X.Y.Z
          description: The current version of the service.
      required:
      - apiVersion
    HealthResponse_2:
      description: Returns the health of the service
      type: object
      properties:
        status:
          description: 'Health status of the service:


            * `ok` - the service is operating normally

            * `fail` - the service is currently encountering a failure

            '
          type: string
          enum:
          - ok
          - fail
        message:
          description: Human-readable error message
          type: string
    OpenapiResponse:
      description: API response for the openapi endpoint
      type: object
      additionalProperties: true
    GenericErrorResponse:
      description: Generic error response
      type: object
      properties:
        error:
          type: string
          description: Human-readable error
        error_description:
          type: string
          description: Human-readable error description
        status:
          type: integer
          description: HTTP status code
          example: 403
