openapi: 3.2.0
info:
  title: Geocoding and Search API v7 Geocode API
  version: '7.155'
  description: This document describes the Geocoding and Search API.
security:
- Bearer: []
- ApiKey: []
tags:
- name: Geocode
paths:
  /geocode:
    servers:
    - url: https://geocode.search.hereapi.com/v1
    get:
      summary: Geocode
      description: 'This endpoint allows you to find the geo-coordinates of a known address, place, locality or

        administrative area, even if the query is incomplete or partly incorrect. It also returns a

        complete postal address string and address details. It supports structured, unstructured and

        hybrid queries - combinations of structured and unstructured query elements.'
      parameters:
      - $ref: '#/components/parameters/addressNamesMode'
      - $ref: '#/components/parameters/addressNamesVariantGeocode'
      - $ref: '#/components/parameters/atAutocompleteGeocode'
      - $ref: '#/components/parameters/inGeocode'
      - $ref: '#/components/parameters/postalCodeMode'
      - $ref: '#/components/parameters/qGeocode'
      - $ref: '#/components/parameters/qq'
      - $ref: '#/components/parameters/typesGeocode'
      - $ref: '#/components/parameters/withGeocode'
      - $ref: '#/components/parameters/langAutosuggestBrowseDiscoverGeocodeLookupRevgeocode'
      - $ref: '#/components/parameters/limitGeocode'
      - $ref: '#/components/parameters/politicalView'
      - $ref: '#/components/parameters/showGeocode'
      - $ref: '#/components/parameters/showMapReferencesGeocodeLookupRevgeocode'
      - $ref: '#/components/parameters/showNavAttributes'
      - $ref: '#/components/parameters/showRelatedGeocode'
      - $ref: '#/components/parameters/showTranslations'
      - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          description: The search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSearchGeocodeResponse'
        '400':
          description: 'Client error: request failed validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 'Client error: http method not supported.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Client error: Rate limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporary server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Geocode
      operationId: getGeocode
      x-operation-id-source: derived
components:
  schemas:
    Segment:
      type: object
      properties:
        ref:
          type: string
          description: 'The segment reference follows the format `{segmentId}(#{offset})?`,

            representing its relative position from the result location to a segment.'
        side:
          type: string
          description: "The side of the link the attribute is applicable to\n\n- for `resultType=houseNumber` and `resultType=place`: side of the entity to the link\n- for `resultType=street`:\n  - on endpoints *Geocode* and *Lookup*: side of the entity to the link, it is always \"both\"\n  - on endpoints *Reverse Geocode* and *Multi-Reverse Geocode*: relative side from input to the link\n"
    Parsing:
      type: object
      properties:
        placeName:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Place name matches
        country:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Country matches
        state:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: State matches
        county:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: County matches
        city:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: City matches
        district:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: District matches
        subdistrict:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Subdistrict matches
        street:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Street matches
        block:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Block matches
        subblock:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Subblock matches
        houseNumber:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: HouseNumber matches
        postalCode:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: PostalCode matches
        building:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Building matches
        secondaryUnits:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: secondaryUnits matches
        additionalInfo:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MatchInfo'
          description: Additional information extracted from the query that do not correspond to any recognized address components in the map data.
    Address:
      type: object
      properties:
        label:
          type: string
          description: 'Assembled address value built out of the address components according to the regional postal rules.

            These are the same rules for all endpoints. It may not include all the input terms. For example:

            "Schulstraße 4, 32547 Bad Oeynhausen, Germany"'
        countryCode:
          type: string
          description: 'A three-letter country code. For example: "DEU"'
        countryName:
          type: string
          description: 'The localised country name. For example: "Deutschland"'
        stateCode:
          type: string
          description: 'A state code or state name abbreviation – country specific. For example, in the United States it is the two letter state abbreviation: "CA" for California.'
        state:
          type: string
          description: 'The state division of a country. For example: "North Rhine-Westphalia"'
        countyCode:
          type: string
          description: 'A county code or county name abbreviation – country specific. For example, for Italy it is the province abbreviation: "RM" for Rome.'
        county:
          type: string
          description: A division of a state; typically, a secondary-level administrative division of a country or equivalent.
        city:
          type: string
          description: 'The name of the primary locality of the place. For example: "Bad Oyenhausen"'
        district:
          type: string
          description: 'A division of city; typically an administrative unit within a larger city or a customary name of a city''s neighborhood. For example: "Bad Oyenhausen"'
        subdistrict:
          type: string
          description: 'A subdivision of a district. For example: "Minden-Lübbecke"'
        street:
          type: string
          description: 'Name of street. For example: "Schulstrasse"'
        streets:
          type: array
          items:
            type: string
          description: 'Names of streets in case of intersection result. For example: ["Friedrichstraße","Unter den Linden"]'
        block:
          type: string
          description: Name of block.
        subblock:
          type: string
          description: Name of sub-block.
        postalCode:
          type: string
          description: 'An alphanumeric string included in a postal address to facilitate mail sorting, such as post code, postcode, or ZIP code. For example: "32547"'
        houseNumber:
          type: string
          description: 'House number. For example: "4"'
        building:
          type: string
          description: Name of building.
        unit:
          type: string
          description: Secondary unit information. It may include building, floor (level), and suite (unit) details. This field is returned by Geocode, Autocomplete, (Multi) Reverse Geocode and Lookup endpoints only.
    PointAddressSection:
      type: object
      required:
      - hmcId
      properties:
        hmcId:
          type: string
          description: The point address ID in HERE Map Content
        partitionId:
          type: string
          description: '**ALPHA**


            Unique identifier that references a specific subset of geo-location related layers

            (e.g., address, location, street, or place) in the HERE Map Content'
    AddressUsage:
      type: object
      required:
      - usageType
      properties:
        usageType:
          type: string
          enum:
          - nonResidential
          - residential
          description: A flag specifying whether the address is residential. (only rendered if `show=addressUsage` is provided.)
    ErrorResponse:
      type: object
      required:
      - status
      - title
      - correlationId
      - requestId
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP status code
        title:
          type: string
          description: Human-readable error description
        code:
          type: string
          description: Error code
        cause:
          type: string
          description: Human-readable explanation for the error
        action:
          type: string
          description: Human-readable action for the user
        correlationId:
          type: string
          description: Auto-generated ID univocally identifying this request
        requestId:
          type: string
          description: Request identifier provided by the user
    Scoring:
      type: object
      properties:
        queryScore:
          type: number
          format: double
          description: Indicates how good the input matches the returned address. It is equal to 1 if all input tokens are recognized and matched.
        fieldScore:
          allOf:
          - $ref: '#/components/schemas/FieldScore'
          description: 'Indicates how good the individual result fields match to the corresponding part of the query. Is

            included only for the result fields that are actually matched to the query.'
    GeocodeResultItem:
      type: object
      required:
      - title
      - id
      - address
      properties:
        title:
          type: string
          description: The localized display name of this result item.
        id:
          type: string
          description: The unique identifier for the result item. This ID can be used for a Look Up by ID search as well.
        politicalView:
          type: string
          description: ISO3 country code of the item political view (default for international). This response element is populated when the politicalView parameter is set in the query
        resultType:
          type: string
          enum:
          - addressBlock
          - administrativeArea
          - houseNumber
          - intersection
          - locality
          - place
          - postalCodePoint
          - street
          description: '

            Type of the result item.


            Note: `addressBlock` result item is either a block or subblock.


            `resultType` values can get added to the list without further notice.

            '
        houseNumberType:
          type: string
          enum:
          - MPA
          - PA
          - interpolated
          description: "Indicates the address type which affects the precision of the address and the coordinate accuracy.\n\nDescription of supported values:\n\n- **RESTRICTED** `MPA`: A Micro Point Address represents a secondary address for a Point\n  Address; for example, building, floor (level) and suite (unit).\n  Micro Point Addresses can be used to enhance Point Address with\n  greater address detail and higher coordinate accuracy. This result\n  type is only returned by Lookup, Geocode, Autocomplete or (Multi) Reverse Geocode endpoints when\n  `with=MPA` parameter is provided.\n- `PA`: A Point Address represents an individual address as a point object.\n  Point Addresses are coming from trusted sources. There is a\n  high certainty that the address exists at that position. A\n  Point Address result contains two types of coordinates. One is the\n  access point (or navigation coordinates), which is the point to\n  start or end a drive. The other point is the position or display\n  point. This point varies per source and country. The point can be\n  the rooftop point, a point close to the building entry, or a point\n  close to the building, driveway or parking lot that belongs to the\n  building.\n- `interpolated`: An interpolated address. These are approximate positions as a\n  result of a linear interpolation based on address ranges. Address\n  ranges, especially in the USA, are typical per block. For\n  interpolated addresses, we cannot say with confidence that the\n  address exists in reality. But the interpolation provides a good\n  location approximation that brings people in most use cases close\n  to the target location. The access point of an interpolated address\n  result is calculated based on the address range and the road\n  geometry. The position (display) point is pre-configured offset\n  from the street geometry. Compared to Point Addresses, interpolated\n  addresses are less accurate."
        addressUsage:
          allOf:
          - $ref: '#/components/schemas/AddressUsage'
          description: '**ALPHA, RESTRICTED**'
        addressBlockType:
          type: string
          enum:
          - block
          - subblock
          description: '

            Type of the address block result if the `resultType` field is set to `addressBlock`.


            `addressBlockType` values can get added to the list without further notice.

            '
        localityType:
          type: string
          enum:
          - city
          - district
          - postalCode
          - subdistrict
          description: '

            Type of the locality result if the `resultType` field is set to `locality`.


            `localityType` values can get added to the list without further notice.

            '
        administrativeAreaType:
          type: string
          enum:
          - country
          - county
          - state
          description: '

            Type of the administrative area result if the `resultType` field is set to `administrativeArea`.


            `administrativeAreaType` values can get added to the list without further notice.

            '
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Postal address of the result item.
        postalCodeDetails:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PostalCodeDetails_JapanPost'
            - $ref: '#/components/schemas/PostalCodeDetails_Usps_Zip'
            - $ref: '#/components/schemas/PostalCodeDetails_Usps_ZipPlus4'
          description: 'Additional information for `postalCodePoint` results (only rendered if `show=postalCodeDetails` is

            provided and only in the countries which are using ZIP codes - USA, PRI, VIR, GUM, MNP, ASM and JPN)'
        position:
          allOf:
          - $ref: '#/components/schemas/DisplayResponseCoordinate'
          description: The coordinates (latitude, longitude) of a pin on a map corresponding to the searched place.
        access:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/BasicAccessPoint'
          description: Coordinates of the response item on a HERE map navigable link (for example, for driving or walking).
        distance:
          type: integer
          format: int64
          description: 'The distance "as the crow flies" from the search center to this result item in meters.

            For example: "172039"'
          example: 172039
        mapView:
          allOf:
          - $ref: '#/components/schemas/MapView'
          description: The bounding box enclosing the geometric shape (area or line) that an individual result covers. `place` typed results have no `mapView`.
        categories:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Category'
          description: The list of categories assigned to this place.
        foodTypes:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Category'
          description: The list of food types assigned to this place.
        houseNumberFallback:
          type: boolean
          description: If true, indicates that the requested house number was corrected to match the nearest known house number. This field is visible only when the value is true.
        estimatedPointAddress:
          type: boolean
          description: 'If true, indicates that the coordinates of `position` and `access` points of the Point Address are

            estimated.

            This field is visible only for result items with resultType `houseNumber` and houseNumberType `PA` and

            only when the value is `true`'
        timeZone:
          allOf:
          - $ref: '#/components/schemas/TimeZoneInfo'
          description: Provides time zone information for this place. (rendered only if `show=tz` is provided.)
        scoring:
          allOf:
          - $ref: '#/components/schemas/Scoring'
          description: 'Indicates for each result how good the result matches to the original query. This can be used by the

            customer application to accept or reject the results depending on how "expensive" is the mistake for

            their use case'
        parsing:
          allOf:
          - $ref: '#/components/schemas/Parsing'
          description: Parsed terms and their positions in the input query (only rendered if `show=parsing` is provided.)
        streetInfo:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/StreetInfo'
          description: Street Details (only rendered if `show=streetInfo` is provided.)
        countryInfo:
          allOf:
          - $ref: '#/components/schemas/CountryInfo'
          description: Country Details (only rendered if `show=countryInfo` is provided.)
        translations:
          allOf:
          - $ref: '#/components/schemas/TranslationsGeocode'
          description: Features all name translations and alternative names for requested address fields.
        mapReferences:
          allOf:
          - $ref: '#/components/schemas/MapReferenceSection'
          description: Return the map references of the location objects.
        related:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/RelatedAddress'
          description: List of related objects
        navigationAttributes:
          allOf:
          - $ref: '#/components/schemas/NavigationAttributes'
          description: 'Return requested additional attributes for segments in a road network if `showNavAttributes` parameter

            is specified with valid value and relevant data is available. The value is a comma-separated list

            of the sections to be enabled.'
        secondaryUnitInfo:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/SecondaryUnitInfo'
          description: Secondary unit designator and unit value for each secondary unit recognized in the query in normalized country specific form (only returned if `show=secondaryUnitInfo` is provided.)
    StreetInfo:
      type: object
      properties:
        baseName:
          type: string
          description: Base name part of the street name.
        streetType:
          type: string
          description: Street type part of the street name.
        streetTypePrecedes:
          type: boolean
          description: Defines if the street type is before or after the base name.
        streetTypeAttached:
          type: boolean
          description: Defines if the street type is attached or unattached to the base name.
        prefix:
          type: string
          description: A prefix is a directional identifier that precedes, but is not included in, the base name of a road.
        suffix:
          type: string
          description: A suffix is a directional identifier that follows, but is not included in, the base name of a road.
        direction:
          type: string
          description: Indicates the official directional identifiers assigned to highways, typically either "North/South" or "East/West"
        language:
          type: string
          description: BCP 47 compliant language code
    OpenSearchGeocodeResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/GeocodeResultItem'
          description: The results are presented as a JSON list of candidates in ranked order (most-likely to least-likely) based on the matched location criteria.
    FunctionalClass:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          description: '


            Description of supported values:


            - `1`: allowing for high volume, maximum speed traffic movement

            - `2`: allowing for high volume, high speed traffic movement

            - `3`: providing a high volume of traffic movement

            - `4`: providing for a high volume of traffic movement at moderate speeds between neighbourhoods

            - `5`: roads whose volume and traffic movement are below the level of any functional class'
    MapReferenceSection:
      type: object
      properties:
        links:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/LinkInfoSection'
          description: An identifier for link and the side of link the attribute is applicable to
        pointAddress:
          allOf:
          - $ref: '#/components/schemas/PointAddressSection'
          description: The section containing the point address reference
        microPointAddress:
          allOf:
          - $ref: '#/components/schemas/MicroPointAddressSection'
          description: '**RESTRICTED**


            The section containing the micro point address reference. This type of reference is only returned by Lookup endpoint or Geocode endpoint when showMapReference=''microPointAddress'' parameter is provided.'
        segments:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Segment'
          description: The section containing the segment references
        country:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: country ID in HERE Map Content
        state:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: state ID in HERE Map Content
        county:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: county ID in HERE Map Content
        city:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: city ID in HERE Map Content
        district:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: district ID in HERE Map Content
        subdistrict:
          allOf:
          - $ref: '#/components/schemas/AdminIdSection'
          description: subdistrict ID in HERE Map Content
        cmVersion:
          allOf:
          - $ref: '#/components/schemas/CmVersionSection'
          description: cmVerison info in HERE Map Content
    Name:
      type: object
      required:
      - value
      - type
      properties:
        value:
          type: string
          description: The text value of this name.
        language:
          type: string
          description: The [BCP 47](https://en.wikipedia.org/wiki/IETF_language_tag) language code.
        type:
          type: string
          enum:
          - abbreviation
          - areaCode
          - baseName
          - exonym
          - shortened
          - synonym
          description: 'The type of this name.


            Description of supported values:


            - `abbreviation`: Abbreviation is a shortened form of the official name.  For example, "CA" for "California". Abbreviation may also be an area code.

            - `areaCode`: Area code is a code representation of an admin. For example for countries this can be an ISO-3 or ISO-2 Code: "USA", "US" for "United States".

            - `baseName`: Base name represents the official name in one of the country official languages. For example, "Frankfurt am Main".

            - `exonym`: Exonym is a translation of the official name to a language that is not one of the country official languages. For example "Francfort-sur-le-Main" for "Frankfurt am Main".

            - `shortened`: A shortened variant of a long name where optional parts are omitted. For example, "Bad Soden" for "Bad Soden am Taunus".

            - `synonym`: A synonym is an additional commonly used name that is different than the official name, in the same language as the official name. For example, "Frankfurt" for "Frankfurt am Main".'
        primary:
          type: boolean
          description: Flag indicating whether it is a primary name. This is the name which is exposed in the result by default. This field is visible only when the value is `true`.
        transliterated:
          type: boolean
          description: Flag indicating whether the name is transliterated. Additional transliterated form of the name is included for all non-Latin-1 names. This field is visible only when the value is `true`.
    PostalCodeDetails_JapanPost:
      type: object
      required:
      - postalCode
      properties:
        postalCode:
          type: string
          description: '**ALPHA**


            7-digit business postal code in `XXX-XXXX` format (separated by dash)'
        postalEntity:
          type: string
          enum:
          - Japan Post
          description: '**ALPHA**


            The postal entity. This could be a governmental authority, a regulatory authority, or a designated postal operator.


            Description of supported values:


            - **ALPHA** `Japan Post`: Field indicating the data source (fixed as `Japan Post` for Japan)'
        postalCodeType:
          type: string
          enum:
          - ZIP
          description: '**ALPHA**


            The postal code type.


            Description of supported values:


            - **ALPHA** `ZIP`: Field describing the postal code type (fixed as `ZIP` for Japan)'
        businessName:
          type: string
          description: '**ALPHA**


            Detailed information specifies company name, building name, floor number, etc. mapped to the corresponding business postal code'
    PostalCodeDetails_Usps_ZipPlus4:
      type: object
      required:
      - postalCode
      properties:
        postalCode:
          type: string
          description: The postal code.
        postalEntity:
          type: string
          enum:
          - USPS
          description: 'The postal entity. This could be a governmental authority, a regulatory authority, or a designated postal operator.


            Description of supported values:


            - `USPS`: The USPS postal code system.'
        postalCodeType:
          type: string
          enum:
          - ZIP+4
          description: 'The postal code type. Currently supported values: `ZIP` and `ZIP+4`


            Description of supported values:


            - `ZIP+4`: Nine-digit code that identifies a small geographic delivery area that is serviceable by a single carrier; appears in the last line of the address on a mail piece.'
        recordTypeCode:
          type: string
          enum:
          - F
          - G
          - H
          - P
          - R
          - S
          description: 'The USPS ZIP+4 Record Type Code.


            Description of supported values:


            - `F`: Firm

            - `G`: General delivery

            - `H`: High-rise

            - `P`: PO Box

            - `R`: Rural route/contract

            - `S`: Street'
    CmVersionSection:
      type: object
      required:
      - region
      - dvn
      properties:
        region:
          type: string
          description: Region ID
        dvn:
          type: string
          description: "Map version details (DVN) containing the base line for the map schema and an identifier for the weekly or quarterly update.\n\n- Format: YYQ<weekly/quaterly update>\n  - Example: 23150 (map schema: Q1/2023, weekly update 50)\n"
    SpeedLimit:
      type: object
      required:
      - maxSpeed
      - speedUnit
      properties:
        maxSpeed:
          type: integer
          format: int32
          description: Used in combination with speed limit unit to indicate allowable speed limit at a location, for unlimited speed, the value is "999"
        direction:
          type: string
          enum:
          - E
          - N
          - NE
          - NW
          - S
          - SE
          - SW
          - W
          description: Rendered in compass value, which is N, S, E, W, NE, SE, NW, SW
        speedUnit:
          type: string
          enum:
          - kph
          - mph
          description: Country defined speed unit
        source:
          type: string
          enum:
          - derived
          - posted
          description: 'A generalised identification of the source of `Speed Limit` information.


            Description of supported values:


            - `derived`: Based on administrative regulations, for example: highway exit/entry ramps that do not have posted speed limits.

            - `posted`: Based on a posted speed limit sign, speed limit information painted on the road, or data obtained from official sources.'
    FieldScore:
      type: object
      properties:
        country:
          type: number
          format: double
          description: Indicates how good the result country name or [ISO 3166-1 alpha-3] country code matches to the freeform or qualified input.
        countryCode:
          type: number
          format: double
          description: Indicates how good the result [ISO 3166-1 alpha-3] country code matches to the freeform or qualified input.
        state:
          type: number
          format: double
          description: Indicates how good the result state name matches to the freeform or qualified input.
        stateCode:
          type: number
          format: double
          description: Indicates how good the result state code matches to the freeform or qualified input.
        county:
          type: number
          format: double
          description: Indicates how good the result county name matches to the freeform or qualified input.
        countyCode:
          type: number
          format: double
          description: Indicates how good the result county code matches to the freeform or qualified input.
        city:
          type: number
          format: double
          description: Indicates how good the result city name matches to the freeform or qualified input.
        district:
          type: number
          format: double
          description: Indicates how good the result district name matches to the freeform or qualified input.
        subdistrict:
          type: number
          format: double
          description: Indicates how good the result sub-district name matches to the freeform or qualified input.
        streets:
          type: array
          items:
            type: number
            format: double
          description: 'Indicates how good the result street names match to the freeform or qualified input. If the input

            contains multiple street names, the field score is calculated and returned for each of them

            individually.'
        block:
          type: number
          format: double
          description: Indicates how good the result block name matches to the freeform or qualified input.
        subblock:
          type: number
          format: double
          description: Indicates how good the result sub-block name matches to the freeform or qualified input.
        houseNumber:
          type: number
          format: double
          description: 'Indicates how good the result house number matches to the freeform or qualified input. It may

            happen, that the house number, which one is looking for, is not yet in the map data. For such cases,

            the Geocode endpoint returns the nearest known house number on the same street. This represents the

            numeric difference between the requested and the returned house numbers.'
        postalCode:
          type: number
          format: double
          description: Indicates how good the result postal code matches to the freeform or qualified input.
        building:
          type: number
          format: double
          description: Indicates how good the result building name matches to the freeform or qualified input.
        unit:
          type: number
          format: double
          description: Indicates whether a secondary unit (such as building, floor or suite) has been recognized in the freeform or qualified input.
        placeName:
          type: number
          format: double
          description: Indicates how good the result place name matches to the freeform or qualified input.
        ontologyName:
          type: number
          format: double
          description: Indicates how good the result ontology name matches to the freeform or qualified input.
    AdminNames:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Name'
          description: The list of all values for a name. Those might be for different languages or different name types.
        preference:
          type: string
          enum:
          - alternative
          - primary
          description: 'The preference of the view on an address field expressed by this group of names.


            Description of supported values:


            - `alternative`: Alternative view on this address field. Names of this group are exposed in the result only if matching to the query so that the end-user can better recognize the result.

            - `primary`: The default or only view on this address filed. These are the names which are exposed in the result by default.'
    CountryInfo:
      type: object
