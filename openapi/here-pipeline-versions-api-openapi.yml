openapi: 3.2.0
info:
  title: Pipeline Management API v2 Pipeline Versions API
  description: 'The Pipelines API enables programmatic access and control over

    data processing pipelines.'
  version: 2.17.10
servers:
- url: Use API Lookup for a base URL
security:
- Bearer: []
tags:
- name: Pipeline Versions
paths:
  /v2/pipelines/{pipelineId}/versions:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
    - $ref: '#/components/parameters/CorrelationIdHeaderParam'
    get:
      tags:
      - Pipeline Versions
      summary: Get the list of PipelineVersions for a Pipeline
      description: This endpoint returns a list of all PipelinesVersions currently defined for a given Pipeline.
      operationId: listPipelineVersions
      parameters:
      - $ref: '#/components/parameters/PipelineVersionVerboseQueryParam'
      responses:
        '200':
          description: List retrieved successfully.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineVersion'
        '500':
          description: Internal error while retrieving the list of PipelineVersions.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    post:
      tags:
      - Pipeline Versions
      summary: Create a new PipelineVersion
      description: Defines a new version for the given Pipeline. This includes all the information to run actual processing, including the Pipeline Template, actual input & output catalogs and configurations. This endpoint instantiates the PipelineVersion and returns its metadata, that includes the id assigned to it.
      operationId: createPipelineVersion
      requestBody:
        description: PipelineVersion to be created, with PipelineTemplate id and HRNs of input and output catalogs.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineVersion'
        required: true
      responses:
        '201':
          description: PipelineVersion successfully created.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineVersion'
        '400':
          description: Required parameters are missing or invalid values were provided.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Pipeline with provided id not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while instantiating the PipelineVersion.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      x-codegen-request-body-name: body
  /v2/pipelines/{pipelineId}/versions/{versionId}:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/PipelineVersionIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
    - $ref: '#/components/parameters/CorrelationIdHeaderParam'
    get:
      tags:
      - Pipeline Versions
      summary: Get a PipelineVersion
      description: This endpoint returns the details about the PipelineVersion identified by the versionId path parameter.
      operationId: getPipelineVersion
      parameters:
      - $ref: '#/components/parameters/PipelineVersionVerboseQueryParam'
      responses:
        '200':
          description: PipelineVersion retrieved successfully.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineVersion'
        '404':
          description: Pipeline or PipelineVersion with provided id not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while retrieving the PipelineVersion.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    delete:
      tags:
      - Pipeline Versions
      summary: Delete a PipelineVersion
      description: This endpoint deletes a PipelineVersion. The API will throw an error if the Pipeline Version is in any state other than Ready, or if there are any pending operations.
      operationId: deletePipelineVersion
      responses:
        '204':
          description: PipelineVersion deleted successfully.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content: {}
        '404':
          description: Pipeline or PipelineVersion with provided id not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '412':
          description: Can't delete a PipelineVersion that is not in READY state or has active operations.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while deleting the PipelineVersion.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /v2/pipelines/{pipelineId}/versions/{versionId}/jobs:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/PipelineVersionIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
    - $ref: '#/components/parameters/CorrelationIdHeaderParam'
    get:
      tags:
      - Pipeline Versions
      summary: List Jobs of a PipelineVersion
      description: This endpoint returns a list of the Jobs a PipelineVersion ran or is currently running.
      operationId: listPipelineVersionJobs
      responses:
        '200':
          description: List retrieved successfully.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '404':
          description: Pipeline or PipelineVersion with provided id not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while retrieving the list of Jobs.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorMessage'
  /v2/pipelines/{pipelineId}/versions/{versionId}/logging-configuration:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/PipelineVersionIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
    - $ref: '#/components/parameters/CorrelationIdHeaderParam'
    get:
      tags:
      - Pipeline Versions
      summary: The logging configuration
      description: This endpoint returns the current logging configuration that is set for the PipelineVersion.
      operationId: getLoggingConfiguration
      responses:
        '200':
          description: Logging configuration retrieved successfully.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingConfiguration'
        '404':
          description: Logging configuration was not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while retrieving the logging configuration.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    put:
      tags:
      - Pipeline Versions
      summary: Update logging configuration for pipeline version
      description: Updates the logging configuration for the pipeline version. If there is a job currently running, the logging configuration will be applied to that job, and will be applied to the future jobs.
      operationId: updateLoggingConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoggingConfiguration'
        required: false
      responses:
        '200':
          description: Logging configuration updated successfully.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingConfiguration'
        '307':
          description: To update Logging configuration, please follow the redirect or use URL in the Location header.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            Location:
              description: To proceed with the operation please follow the URL.
              example: https://xxx.yyy.zzz/operation
              schema:
                type: string
        '400':
          description: Cannot update logging configuration from current region.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Pipeline or PipelineVersion with provided id not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while updating the pipeline.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      x-codegen-request-body-name: body
  /v2/pipelines/{pipelineId}/versions/{versionId}/operations:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/PipelineVersionIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
    - $ref: '#/components/parameters/CorrelationIdHeaderParam'
    get:
      tags:
      - Pipeline Versions
      summary: List Operations of a PipelineVersion
      description: This endpoint returns a list of all Operations completed or pending on a PipelineVersion.
      operationId: listOperations
      responses:
        '200':
          description: List retrieved successfully.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operation'
        '404':
          description: Combination of Pipeline and PipelineVersion ids not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while retrieving the list of Operations.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorMessage'
  /v2/pipelines/{pipelineId}/versions/{versionId}/operations/activate:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/PipelineVersionIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
    - $ref: '#/components/parameters/CorrelationIdHeaderParam'
    post:
      tags:
      - Pipeline Versions
      summary: Schedules a PipelineVersion
      description: This endpoint updates the state of a PipelineVersion to Scheduled.
      operationId: schedulePipelineVersion
      requestBody:
        description: Optional CatalogVersions to use when running the pipeline;  when CatalogVersions is passed the Version Resolver library will not be used. This becomes a one-time, 'run-now' scenario. If the ScheduledConfiguration of this Pipeline Version was 'version_resolver', this is automatically reset (to empty) to indicate the one-time, 'run-now' scenario and match the fact that CatalogVersions was passed in. The Pipeline Version will be automatically deactivated after this run attempt (whether the run is successful or not) so that this Pipeline Version will not be run automatically again in the future. The JobCatalogVersions (whether passed, or calculated by the Version Resolver) will be stored in the resulting Job record, which will be available via the 'List Jobs' API - after the job starts running on the Spark / Flink cluster.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCatalogVersions'
        required: false
      responses:
        '202':
          description: The PipelineVersion has been scheduled.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '307':
          description: To activate the PipelineVersion, please follow the redirect or use URL in the Location header.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            Location:
              description: To proceed with the operation please follow the URL.
              example: https://xxx.yyy.zzz/operation
              schema:
                type: string
        '400':
          description: 'Cannot schedule a PipelineVersion given its current state, or the state of related data. Pre-requisites to scheduling a PipelineVersion include:

            a) the parent Template must have reached a state of ''created''

            b) there can be no other sibling PipelineVersion that is already ''active'' (has any State other than ''ready'').'
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Pipeline id or PipelineVersion id provided was not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while scheduling the PipelineVersion.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
      x-codegen-request-body-name: body
  /v2/pipelines/{pipelineId}/versions/{versionId}/operations/cancel:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/PipelineVersionIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
    - $ref: '#/components/parameters/CorrelationIdHeaderParam'
    post:
      tags:
      - Pipeline Versions
      summary: Cancel a PipelineVersion
      description: This endpoint cancels a running or paused PipelineVersion. The cancel operation does not save the state of the pipeline version.
      operationId: cancelPipelineVersion
      responses:
        '202':
          description: Request to cancel the PipelineVersion is created and returned with its id.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '307':
          description: To cancel the PipelineVersion, please follow the redirect or use URL in the Location header.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            Location:
              description: To proceed with the operation please follow the URL.
              example: https://xxx.yyy.zzz/operation
              schema:
                type: string
        '400':
          description: Cannot cancel a PipelineVersion given its current state.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Pipeline or PipelineVersion with provided id not found.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal error while submitting the request to cancel the PipelineVersion.
          headers:
            X-Request-ID:
              description: value of the request header or generated value.
              schema:
                type: string
            X-Correlation-ID:
              description: value of the request header or generated value.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /v2/pipelines/{pipelineId}/versions/{versionId}/operations/deactivate:
    parameters:
    - $ref: '#/components/parameters/PipelineIdPathParam'
    - $ref: '#/components/parameters/PipelineVersionIdPathParam'
    - $ref: '#/components/parameters/RequestIdHeaderParam'
