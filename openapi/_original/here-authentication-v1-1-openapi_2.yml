ing denied by an mTLS Authenticator in the platform is not defined by this specification.\n\n**NOTE:** A maximum of 10 mTLS Identity Providers can be created per realm.\n\n</br>Access Control:\n  * The calling principal must have **\"manageMtlsIdentityProviders\"** action permission for the resource **\"{realm}\"** in the **\"account\"** service.\n  * The calling principal MUST NOT include a project scope.\n","operationId":"createMtlsIdentityProvider","parameters":[{"$ref":"#/components/parameters/Realm"},{"$ref":"#/components/parameters/XCorrelationId"},{"$ref":"#/components/parameters/XRequestId"}],"security":[{"Bearer":[]}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MtlsCARequest"}}},"required":true},"responses":{"201":{"description":"Created","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"},"X-Request-ID":{"$ref":"#/components/headers/XRequestId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MtlsCAResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"description":"Unable to create, Certificate Authority already bound to another realm.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorMessage"}}},"headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"},"X-Request-ID":{"$ref":"#/components/headers/XRequestId"}}}}},"get":{"tags":["Manage mTLS Identity Providers"],"summary":"Get the list of mTLS Identity Providers","description":"Get the list of mTLS Identity Providers configured for the realm.\n\n</br>Access Control:\n  * The calling principal must have **\"readMtlsIdentityProviders\"** action permission for the resource **\"{realm}\"** in the **\"account\"** service.\n  * The calling principal MUST NOT include a project scope.\n","operationId":"getMtlsIdent