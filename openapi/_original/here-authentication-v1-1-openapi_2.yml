ted when its mTLS Identity Provider is deleted\n\n</br>Access Control:\n  * The calling principal must have **\"readMtlsIdentityProviders\"** action permission for the resource **\"{realm}\"** in the **\"account\"** service.\n  * The calling principal MUST NOT include a project scope.\n","operationId":"listMtlsAuthenticatorsForIdp","parameters":[{"$ref":"#/components/parameters/Realm"},{"$ref":"#/components/parameters/MtlsIdentityProviderHrn"},{"$ref":"#/components/parameters/XCorrelationId"},{"$ref":"#/components/parameters/XRequestId"}],"security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/XCorrelationId"},"X-Request-ID":{"$ref":"#/components/headers/XRequestId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MtlsAuthenticatorPageWithToken"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/realms/{realm}/mtlsIdentityProviders/{mtlsIdentityProvider}/authenticators/{mtlsAuthenticator}":{"get":{"tags":["Manage mTLS Identity Providers"],"summary":"Get an mTLS Authenticator","description":"Get an mTLS Authenticator configured to authenticate certificates for the specified mTLS Identity Provider.\n\n</br>Access Control:\n  * The calling principal must have **\"readMtlsIdentityProviders\"** action permission for the resource **\"{realm}\"** in the **\"account\"** service.\n  * The calling principal MUST NOT include a project scope.\n","operationId":"getMtlsAuthenticatorForIdp","parameters":[{"$ref":"#/components/parameters/Realm"},{"$ref":"#/components/parameters/MtlsIdentityProviderHrn"},{"$ref":"#/components/parameters/MtlsAuthenticatorHrn"},{"$ref":"#/components/parameters/XCorrelationId"},{"$ref":"#/components/parameters/XRequestId"}],"security":[{"Bearer":[]}],"responses":{"200":{"description":"OK","headers":{"X-