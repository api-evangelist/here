e connector type is CHAdeMO, DC\n* `CHAOJI`: The ChaoJi connector. The new generation charging connector,\nharmonized between CHAdeMO and GB/T. DC.\n* `DOMESTIC_A`: Standard/Domestic household, type \"A\", NEMA 1-15, 2 pins\n* `DOMESTIC_B`: Standard/Domestic household, type \"B\", NEMA 5-15, 3 pins\n* `DOMESTIC_C`: Standard/Domestic household, type \"C\", CEE 7/17, 2 pins\n* `DOMESTIC_D`: Standard/Domestic household, type \"D\", 3 pin\n* `DOMESTIC_E`: Standard/Domestic household, type \"E\", CEE 7/5 3 pins\n* `DOMESTIC_F`: Standard/Domestic household, type \"F\", CEE 7/4, Schuko, 3\npins\n* `DOMESTIC_G`: Standard/Domestic household, type \"G\", BS 1363,\nCommonwealth, 3 pins\n* `DOMESTIC_H`: Standard/Domestic household, type \"H\", SI-32, 3 pins\n* `DOMESTIC_I`: Standard/Domestic household, type \"I\", AS 3112, 3 pins\n* `DOMESTIC_J`: Standard/Domestic household, type \"J\", SEV 1011, 3 pins\n* `DOMESTIC_K`: Standard/Domestic household, type \"K\", DS 60884-2-D1, 3\npins\n* `DOMESTIC_L`: Standard/Domestic household, type \"L\", CEI 23-16-VII, 3\npins\n* `DOMESTIC_M`: Standard/Domestic household, type \"M\", BS 546, 3 pins\n* `DOMESTIC_N`: Standard/Domestic household, type \"N\", NBR 14136, 3 pins\n* `DOMESTIC_O`: Standard/Domestic household, type \"O\", TIS 166-2549, 3\npins\n* `GBT_AC`: Guobiao GB/T 20234.2 AC socket/connector\n* `GBT_DC`: Guobiao GB/T 20234.3 DC connector\n* `IEC_60309_2_SINGLE_16`: IEC 60309-2 Industrial connector single phase\n16 amperes (usually blue)\n* `IEC_60309_2_THREE_16`: IEC 60309-2 Industrial connector three phase 16\namperes (usually red)\n* `IEC_60309_2_THREE_32`: IEC 60309-2 Industrial connector three phase 32\namperes (usually red)\n* `IEC_60309_2_THREE_64`: IEC 60309-2 Industrial connector three phase 64\namperes (usually red)\n* `IEC_62196_T1`: IEC 62196 Type 1 \"SAE J1772\"\n* `IEC_62196_T1_COMBO`: Combo Type 1 based, DC\n* `IEC_62196_T2`: IEC 62196 Type 2 \"Mennekes\"\n* `IEC_62196_T2_COMBO`: Combo Type 2 based, DC\n* `IEC_62196_T3A`: IEC 62196 Type 3A\n* `IEC_62196_T3C`: IEC 62196 Type 3C \"Scame\"\n* `NEMA_5_20`: NEMA 5-20, 3 pins\n* `NEMA_6_30`: NEMA 6-30, 3 pins\n* `NEMA_6_50`: NEMA 6-50, 3 pins\n* `NEMA_10_30`: NEMA 10-30, 3 pins\n* `NEMA_10_50`: NEMA 10-50, 3 pins\n* `NEMA_14_30`: NEMA 14-30, 4 pins\n* `NEMA_14_50`: NEMA 14-50, 4 pins\n* `PANTOGRAPH_BOTTOM_UP`: On-board Bottom-up-Pantograph typically for bus\ncharging\n* `PANTOGRAPH_TOP_DOWN`: Top-down-Pantograph typically for bus charging\n* `TESLA_R`: Tesla connector \"Roadster\"-type (round, 4 pin)\n* `TESLA_S`: Tesla connector \"Model-S\"-type (oval, 5 pin)\n* `SAE_J3400`: Tesla connector \"Model-S\"-type (oval, 5 pin), standardized\nas NACS SAE J3400\n* `MCS`: Megawatt Charging System (MCS) connector\n\nAs it is possible that new connector types are supported in the future,\nunknown connector types should be ignored.\n","x-extensible-enum":["CHADEMO","CHAOJI","DOMESTIC_A","DOMESTIC_B","DOMESTIC_C","DOMESTIC_D","DOMESTIC_E","DOMESTIC_F","DOMESTIC_G","DOMESTIC_H","DOMESTIC_I","DOMESTIC_J","DOMESTIC_K","DOMESTIC_L","DOMESTIC_M","DOMESTIC_N","DOMESTIC_O","GBT_AC","GBT_DC","IEC_60309_2_SINGLE_16","IEC_60309_2_THREE_16","IEC_60309_2_THREE_32","IEC_60309_2_THREE_64","IEC_62196_T1","IEC_62196_T1_COMBO","IEC_62196_T2","IEC_62196_T2_COMBO","IEC_62196_T3A","IEC_62196_T3C","NEMA_5_20","NEMA_6_30","NEMA_6_50","NEMA_10_30","NEMA_10_50","NEMA_14_30","NEMA_14_50","PANTOGRAPH_BOTTOM_UP","PANTOGRAPH_TOP_DOWN","TESLA_R","TESLA_S","SAE_J3400","MCS"],"type":"string"},"CountryCode":{"description":"3 letter country code according to ISO 3166-1 alpha 3.","example":"DEU","type":"string","pattern":"^[A-Za-z]{3}$"},"DayOfWeek":{"description":"Enumeration of the days of the week.","type":"string","enum":["mo","tu","we","th","fr","sa","su"]},"EMobilityId":{"description":"E-Mobility identifiers for CPO and eMSP. It is the part one of so called\nema_id, issued by IDRO.\n\nConsists of ISO-3166 alpha-2 country code of the entity, and 3-character\ncode for the CPO or eMSP (following the ISO-15118 standard), separated\nwith a dash '-'.\n\nSee for example\nhttps://benelux-idro.eu/sites/default/files/2021-06/IDACS%20-%20ID%20Format%20and%20syntax.pdf\n","type":"string","pattern":"^[A-Z]{2}[-]{1}[A-Z0-9]{3}$","example":"DE-EV1"},"EnergyMix":{"description":"This type is used to specify the energy mix and environmental impact of\nthe supplied energy at a location or in a tariff.\n","type":"object","properties":{"isGreenEnergy":{"description":"True if 100% from regenerative sources. (CO2 and nuclear waste is zero.)","type":"boolean"},"energySources":{"description":"Key-value pairs (enum + percentage) of energy sources of this\nlocation’s tariff.\nThe sum of the percentages over the collection should be 100%.\n","type":"array","items":{"$ref":"#/components/schemas/EnergySource"},"uniqueItems":true},"supplier":{"description":"Name of the energy supplier, delivering the energy for this location or tariff, if available.","type":"string"},"energyProduct":{"description":"Name of the energy suppliers product or tariff plan used at this location, if available.","type":"string"},"environmentalImpacts":{"description":"Key-value pairs (enum + g/kWh) of nuclear waste and CO2 exhaust of this location's tariff.","type":"array","items":{"$ref":"#/components/schemas/EnvironmentalImpact"},"uniqueItems":true}},"required":["isGreenEnergy"]},"EnergySource":{"description":"Key-value pair (enum + percentage) of energy source.","type":"object","properties":{"source":{"description":"The type of energy source.\n\n* `nuclear`: Nuclear power sources.\n* `generalFossil`: All kinds of fossil power sources.\n* `coal`: Fossil power from coal.\n* `gas`: Fossil power from gas.\n* `generalGreen`: All kinds of regenerative power sources.\n* `solar`: Regenerative power from sunlight.\n* `wind`: Regenerative power from wind.\n* `water`: Regenerative power from water.\n","allOf":[{"$ref":"#/components/schemas/EnergySourceCategory"}]},"percentage":{"description":"Percentage of this source (0-100) in the mix, possibly a non-integer value such as 32.3.","type":"number","maximum":100}},"required":["source","percentage"]},"EnergySourceCategory":{"description":"* `nuclear`: Nuclear power sources.\n* `generalFossil`: All kinds of fossil power sources.\n* `coal`: Fossil power from coal.\n* `gas`: Fossil power from gas.\n* `generalGreen`: All kinds of regenerative power sources.\n* `solar`: Regenerative power from sunlight.\n* `wind`: Regenerative power from wind.\n* `water`: Regenerative power from water.\n","enum":["nuclear","generalFossil","coal","gas","generalGreen","solar","wind","water"],"type":"string"},"EnvironmentalImpact":{"description":"Amount of waste produced or emitted per kWh.","type":"object","properties":{"category":{"description":"The environmental impact category of this value.\n\n* `nuclearWaste`: Produced nuclear waste in grams per kilowatt-hour.\n* `carbonDioxide`: Exhausted carbon dioxide in grams per kilowatt-hour.\n","allOf":[{"$ref":"#/components/schemas/EnvironmentalImpactCategory"}]},"amount":{"description":"Amount of waste in g/kWh for this category.","type":"number","minimum":0}},"required":["category","amount"]},"EnvironmentalImpactCategory":{"description":"* `nuclearWaste`: Produced nuclear waste in grams per kilowatt-hour.\n* `carbonDioxide`: Exhausted carbon dioxide in grams per kilowatt-hour.\n","enum":["nuclearWaste","carbonDioxide"],"type":"string"},"ErrorResponse":{"description":"Response in case of error, common definition for most error responses.","type":"object","properties":{"title":{"type":"string","description":"Human-readable error description","example":"Input data failed validation"},"status":{"type":"integer","description":"HTTP status code","example":400},"code":{"type":"string","description":"Error code.","example":"E629000"},"cause":{"type":"string","description":"Human-readable explanation for the error","example":"The input data in question does not comply with validation rules"},"action":{"type":"string","description":"Human-readable description of the action that can be taken to correct the error","example":"Request a valid id"},"correlationId":{"type":"string","description":"Auto-generated id that uniquely identifies the request","example":"4199533b-6290-41db-8d79-edf4f4019a74"}},"required":["title","status","code","cause","action","correlationId"]},"EvAccessRestrictionReason":{"description":"Extensible enum: `customersOnly` `brandOnly` `carSharingOnly` `taxisOnly` `other` `...`  \n\n* `customersOnly`: Charging for customers of a hotel, restaurant, store\netc\n* `brandOnly`: Vehicle brand-restriction, for example Tesla, BMW\n* `carSharingOnly`: Charging for car sharing\n* `taxisOnly`: Charging for taxis\n* `other`: Charging is restricted due to other reasons\n\nAs it is possible that new restriction reasons are supported\nin the future, unknown reasons should be ignored.\n","x-extensible-enum":["customersOnly","brandOnly","carSharingOnly","taxisOnly","other"],"type":"string"},"EvConnector":{"description":"A connector is the socket or cable and plug available for the EV to use.\n\nA single EVSE may provide multiple connectors but only one of them can\nbe in use at the same time.\n\nA connector always belongs to an EVSE object.\n","type":"object","properties":{"id":{"description":"Identifier of the connector within the EVSE. Two connectors may have\nthe same id as long as they do not belong to the same EVSE object.\n","type":"string"},"standard":{"description":"The standard (type) of the installed connector.\n\nExtensible enum: `CHADEMO` `CHAOJI` `DOMESTIC_A` `DOMESTIC_B` `DOMESTIC_C` `DOMESTIC_D` `DOMESTIC_E` `DOMESTIC_F` `DOMESTIC_G` `DOMESTIC_H` `DOMESTIC_I` `DOMESTIC_J` `DOMESTIC_K` `DOMESTIC_L` `DOMESTIC_M` `DOMESTIC_N` `DOMESTIC_O` `GBT_AC` `GBT_DC` `IEC_60309_2_SINGLE_16` `IEC_60309_2_THREE_16` `IEC_60309_2_THREE_32` `IEC_60309_2_THREE_64` `IEC_62196_T1` `IEC_62196_T1_COMBO` `IEC_62196_T2` `IEC_62196_T2_COMBO` `IEC_62196_T3A` `IEC_62196_T3C` `NEMA_5_20` `NEMA_6_30` `NEMA_6_50` `NEMA_10_30` `NEMA_10_50` `NEMA_14_30` `NEMA_14_50` `PANTOGRAPH_BOTTOM_UP` `PANTOGRAPH_TOP_DOWN` `TESLA_R` `TESLA_S` `SAE_J3400` `MCS` `...`  \n\n* `CHADEMO`: The connector type is CHAdeMO, DC\n* `CHAOJI`: The ChaoJi connector. The new generation charging connector,\nharmonized between CHAdeMO and GB/T. DC.\n* `DOMESTIC_A`: Standard/Domestic household, type \"A\", NEMA 1-15, 2 pins\n* `DOMESTIC_B`: Standard/Domestic household, type \"B\", NEMA 5-15, 3 pins\n* `DOMESTIC_C`: Standard/Domestic household, type \"C\", CEE 7/17, 2 pins\n* `DOMESTIC_D`: Standard/Domestic household, type \"D\", 3 pin\n* `DOMESTIC_E`: Standard/Domestic household, type \"E\", CEE 7/5 3 pins\n* `DOMESTIC_F`: Standard/Domestic household, type \"F\", CEE 7/4, Schuko, 3\npins\n* `DOMESTIC_G`: Standard/Domestic household, type \"G\", BS 1363,\nCommonwealth, 3 pins\n* `DOMESTIC_H`: Standard/Domestic household, type \"H\", SI-32, 3 pins\n* `DOMESTIC_I`: Standard/Domestic household, type \"I\", AS 3112, 3 pins\n* `DOMESTIC_J`: Standard/Domestic household, type \"J\", SEV 1011, 3 pins\n* `DOMESTIC_K`: Standard/Domestic household, type \"K\", DS 60884-2-D1, 3\npins\n* `DOMESTIC_L`: Standard/Domestic household, type \"L\", CEI 23-16-VII, 3\npins\n* `DOMESTIC_M`: Standard/Domestic household, type \"M\", BS 546, 3 pins\n* `DOMESTIC_N`: Standard/Domestic household, type \"N\", NBR 14136, 3 pins\n* `DOMESTIC_O`: Standard/Domestic household, type \"O\", TIS 166-2549, 3\npins\n* `GBT_AC`: Guobiao GB/T 20234.2 AC socket/connector\n* `GBT_DC`: Guobiao GB/T 20234.3 DC connector\n* `IEC_60309_2_SINGLE_16`: IEC 60309-2 Industrial connector single phase\n16 amperes (usually blue)\n* `IEC_60309_2_THREE_16`: IEC 60309-2 Industrial connector three phase 16\namperes (usually red)\n* `IEC_60309_2_THREE_32`: IEC 60309-2 Industrial connector three phase 32\namperes (usually red)\n* `IEC_60309_2_THREE_64`: IEC 60309-2 Industrial connector three phase 64\namperes (usually red)\n* `IEC_62196_T1`: IEC 62196 Type 1 \"SAE J1772\"\n* `IEC_62196_T1_COMBO`: Combo Type 1 based, DC\n* `IEC_62196_T2`: IEC 62196 Type 2 \"Mennekes\"\n* `IEC_62196_T2_COMBO`: Combo Type 2 based, DC\n* `IEC_62196_T3A`: IEC 62196 Type 3A\n* `IEC_62196_T3C`: IEC 62196 Type 3C \"Scame\"\n* `NEMA_5_20`: NEMA 5-20, 3 pins\n* `NEMA_6_30`: NEMA 6-30, 3 pins\n* `NEMA_6_50`: NEMA 6-50, 3 pins\n* `NEMA_10_30`: NEMA 10-30, 3 pins\n* `NEMA_10_50`: NEMA 10-50, 3 pins\n* `NEMA_14_30`: NEMA 14-30, 4 pins\n* `NEMA_14_50`: NEMA 14-50, 4 pins\n* `PANTOGRAPH_BOTTOM_UP`: On-board Bottom-up-Pantograph typically for bus\ncharging\n* `PANTOGRAPH_TOP_DOWN`: Top-down-Pantograph typically for bus charging\n* `TESLA_R`: Tesla connector \"Roadster\"-type (round, 4 pin)\n* `TESLA_S`: Tesla connector \"Model-S\"-type (oval, 5 pin)\n* `SAE_J3400`: Tesla connector \"Model-S\"-type (oval, 5 pin), standardized\nas NACS SAE J3400\n* `MCS`: Megawatt Charging System (MCS) connector\n\nAs it is possible that new connector types are supported in the future,\nunknown connector types should be ignored.\n","allOf":[{"$ref":"#/components/schemas/ConnectorType"}]},"format":{"description":"The format of the connector, whether it is a socket or a cable.\n\n* `socket`: The connector is a socket; the EV user needs to bring a\n  fitting plug.\n* `cable`: The connector is an attached cable; the EV car needs to have a\n  fitting inlet.\n","allOf":[{"$ref":"#/components/schemas/ConnectorFormat"}]},"powerType":{"description":"Type of electrical power used by the connector.\n\n* `ac1Phase`: Alternating current, single phase.\n* `ac2Phase`: Alternating current, two phases, only two of the three\navailable phases connected.\n* `ac2PhaseSplit`: Alternating current, two phases using split phase\nsystem.\n* `ac3Phase`: Alternating current, three phases.\n* `dc`: Direct current.\n","allOf":[{"$ref":"#/components/schemas/PowerType"}]},"maxVoltage":{"description":"Maximum voltage of the connector (line to neutral for 3-phase AC),\nin volt [V].\n\nFor example: DC Chargers might vary the voltage during charging when\nbattery is almost full.\n","type":"integer","minimum":1},"maxCurrent":{"description":"Maximum current of the connector, in amperes [A].","type":"integer","minimum":1},"maxPower":{"description":"Maximum power that can be delivered by this connector, in watts (W).\nWhen the maximum electric power is lower than the calculated value\nfrom voltage and amperage, this value should be set.\n","type":"integer","minimum":1},"termsAndConditionsUrl":{"description":"URL to the operator’s terms and conditions, if available.","type":"string"},"tariffIndexes":{"description":"Tariffs for the connector, presented by indexes to the charging station's tariffs-list.\n","type":"array","items":{"type":"integer"}}},"required":["id","standard","format","powerType","maxVoltage","maxCurrent"]},"EvFacilityType":{"description":"Extensible enum: `hotel` `restaurant` `cafe` `mall` `supermarket` `sport` `recreationArea` `nature` `museum` `bikeSharing` `busStop` `taxiStand` `tramStop` `metroStation` `trainStation` `airport` `parkingLot` `carpoolParking` `fuelStation` `wifi` `business` `education` `finance` `health` `service` `store` `fastFood` `bakery` `truckStop` `playground` `toilets` `...`  \n\n* `hotel`: A place to stay overnight.\n* `restaurant`: A place to eat.\n* `cafe`: A place to have a coffee or other drinks.\n* `mall`: A shopping mall.\n* `supermarket`: A place to buy groceries.\n* `sport`: Sport facilities: gym, field etc.\n* `recreationArea`: A place for recreation, like a park, beach etc.\n* `nature`: Located in, or close to, a park, nature reserve etc.\n* `museum`: A museum or other cultural facility.\n* `bikeSharing`: A bike/e-bike/e-scooter sharing location.\n* `busStop`: A bus stop.\n* `taxiStand`: A taxi stand.\n* `tramStop`: A tram stop.\n* `metroStation`: A metro station.\n* `trainStation`: A train station.\n* `airport`: An airport.\n* `parkingLot`: A parking lot.\n* `carpoolParking`: A parking lot for carpooling.\n* `fuelStation`: A fuel station.\n* `wifi`: Wifi or other type of internet available.\n* `business`: Business facilities.\n* `education`: Educational facilities.\n* `finance`: Financial facilities.\n* `health`: Health facilities.\n* `service`: Service facilities.\n* `store`: A store.\n* `fastFood`: A fast food restaurant.\n* `bakery`: A bakery.\n* `truckStop`: A truck stop, rest area or similar.\n* `playground`: A playground or other place for children to play.\n* `toilets`: Toilets available for public use.\n\nAs it is possible that new facility types are supported in the future,\nunknown types should be ignored.\n","x-extensible-enum":["hotel","restaurant","cafe","mall","supermarket","sport","recreationArea","nature","museum","bikeSharing","busStop","taxiStand","tramStop","metroStation","trainStation","airport","parkingLot","carpoolParking","fuelStation","wifi","business","education","finance","health","service","store","fastFood","bakery","truckStop","playground","toilets"],"type":"string"},"EvParkingType":{"description":"Extensible enum: `alongMotorway` `parkingGarage` `parkingLot` `onDriveway` `onStreet` `undergroundGarage` `...`  \n\n* `alongMotorway`: A parking facility/rest area along a motorway, freeway,\ninterstate, highway etc.\n* `parkingGarage`: Multi-story car park, mainly above ground.\n* `parkingLot`: A cleared area that is intended for parking vehicles, for example\nat super markets or bars.\n* `onDriveway`: The driveway of a house or building.\n* `onStreet`: A public parking space along a street.\n* `undergroundGarage`: Multi-story car park, mainly underground.\n\nAs it is possible that new types are supported in the future,\nunknown types should be ignored.\n","x-extensible-enum":["alongMotorway","parkingGarage","parkingLot","onDriveway","onStreet","undergroundGarage"],"type":"string"},"EvTruckAccessCategory":{"description":"Access categories for trucks and light commercial vehicles that the EV\ncharging location is designed to serve.\n\nWhile the classifications used as basis for the categories are solely based\non vehicle mass, in EV charging context they can be interpreted to give an\nidea of the dimensional class too, as well as possible other restrictions set\nby the operator. If there are true dimensional or weight limits at the EV\ncharging location, they are specified separately in `vehicleLimitations`.\n\nThe classification is available only to a subset of EV charging locations,\ndepending on the information available from the operators. Hence, at least\nvehicles belonging to the `light` category can be charged also in many EV\ncharging locations not having explicit signaling for the `light` category.\n\nFurthermore, although the classification is based on mass/weight ranges in\ngrowing order, an upper class does not automatically mean that also all lower\nclass vehicles are welcome to charge. For example, a location marked only\nwith category `heavy` is reserved for long-haul trucks only.\n\nIn EU the categorization used as basis can be found in:\nhttps://wiki.unece.org/download/attachments/27459612/VIAQ-02-06%20-%20Vehicle%20Categories.pdf?api=v2.\nFor US market, the categories are specified in\nhttps://afdc.energy.gov/data/10380\n\n* `light`: Light commercial vehicles, for example vans.\nThis category is used only when `supportedVehicles` includes `car`.\nThe vehicles in this category require a bit more space for parking while charging\nthan passenger cars, but many EV charging locations for passenger cars can also\nbe used to charge vehicles of this size.\nIn EU this refers to vehicles from category N1, having a maximum mass not\nexceeding 4.25 tonnes.\nIn USA this refers to classes 1 and 2, with somewhat different weight limits.\n\n* `medium`: Medium-size trucks often used in short-haul transportation, known as\ndelivery or box trucks. Corresponds to `semiTractor` in `EvVehicleTypes`.\nAlso, `rigid` in `EvVehicleTypes` is mapped by default to `medium`, unless\nparking space dimensions or weight limit indicate support for `heavy` category.\nThis category is used only when `supportedVehicles` includes `truck`.\nTrucks like these require clearly more space at the charger than passenger cars.\nIn EU this refers to vehicles from category N2, having a maximum mass exceeding\n3.5 tonnes but not exceeding 12 tonnes. In USA this refers to classes 3 to 6.\n\n* `heavy`: Large-size / heavy-duty trucks, typically used in long-haul\ntransportation.\nCorresponds to `truckWithTrailer` or `rigid` in `EvVehicleTypes`.\nThis category is used only when `supportedVehicles` includes `truck`.\nTrucks of this category require significantly more space at the charger than\npassenger cars.\nEV charging locations are typically located near highways or industrial areas.\nSometimes a location may be prioritized for long-haul trucks only, although\ntechnically smaller ones could charge there too.\nIn EU this refers to vehicles from category N3, having a maximum mass exceeding\n12 tonnes. In USA this refers to classes 7 and 8.\n","enum":["light","medium","heavy"],"type":"string"},"EvTruckAmenity":{"description":"Extensible enum: `truckParking` `truckWash` `truckRepair` `truckDealership` `secureTruckParking` `foodDelivery` `toilet` `washingMachine` `shower` `eateryRestaurant` `vendingMachine` `driverLounge` `outdoorGym` `powerSupply` `atm` `accessControlledArea` `licensePlateRecognition` `perimeterFence` `pedestrianTurnstiles` `cameraSurveillance` `guard` `floodLighting` `entryGate` `exitGate` `...`  \n\n* `truckParking`: There is a truck parking at the location.\n* `truckWash`: There is a truck wash service available at the location.\n* `truckRepair`: There is a truck repair service available at the location.\n* `truckDealership`: There is a truck dealership available at the location.\n* `secureTruckParking`: The location provides secure truck parking.\n* `foodDelivery`: There is a food delivery available to the location.\n* `toilet`: There is a toilet available at the location.\n* `washingMachine`: There is a washing/laundry machine available at the location.\n* `shower`: There is a shower available at the location for drivers.\n* `eateryRestaurant`: There is a restaurant or eatery available at the location.\n* `vendingMachine`: There is a vending machine available at the location.\n* `driverLounge`: There is a driver lounge available at the location.\n* `outdoorGym`: There is an outdoor gym available at the location.\n* `powerSupply`: There is a power supply available at the location, for example for truck's refrigerator.\n* `atm`: There is an ATM available at the location.\n* `accessControlledArea`: Access to the EV charging location / parking area is controlled.\n* `licensePlateRecognition`: There is a license plate recognition at the gate when entering the EV charging location / parking area.\n* `perimeterFence`: There is a perimeter fence surrounding the location.\n* `pedestrianTurnstiles`: There are turnstiles for pedestrians to access the location.\n* `cameraSurveillance`: There is a camera surveillance at the location.\n* `guard`: The location is guarded.\n* `floodLighting`: The location has flood lighting.\n* `entryGate`: There is an entry gate to access the location.\n* `exitGate`: There is an exit gate.\n\nAs it is possible that new amenities are supported in the future, unknown\namenities should be ignored.\n","x-extensible-enum":["truckParking","truckWash","truckRepair","truckDealership","secureTruckParking","foodDelivery","toilet","washingMachine","shower","eateryRestaurant","vendingMachine","driverLounge","outdoorGym","powerSupply","atm","accessControlledArea","licensePlateRecognition","perimeterFence","pedestrianTurnstiles","cameraSurveillance","guard","floodLighting","entryGate","exitGate"],"type":"string"},"EvVehicleCategory":{"description":"Extensible enum: `car` `twoWheeler` `truck` `...`  \n\n* `car`: The charging location is suitable for regular passenger cars, and\noptionally also for light commercial vehicles, such as vans, pickups and the\nlike, if signaled by `truckAccess` property.\nThis is the default category, used when there is no explicit information about\nsupport for other vehicle types.\n\n* `twoWheeler`: The charging location is suitable for motor bikes,\ne-scooters, and the like.\n\n* `truck`: The charging location is suitable for heavy vehicle charging,\nincluding, for example, rigid trucks and semi-trailer trucks, requiring more\nphysical space for parking and maneuvering than passenger cars.\n\nAs it is possible that new categories are supported in the future,\nunknown categories should be ignored.\n","x-extensible-enum":["car","twoWheeler","truck"],"type":"string"},"EvVehicleTypes":{"description":"Extensible enum: `van` `semiTractor` `rigid` `truckWithTrailer` `...`  \n\nList of vehicle types that can park at the EVSE. The list is not always\nexhaustive, but smaller vehicles are expected to be able to use the EVSE as well.\nFor example, if the list includes only `truckWithTrailer`, then `rigid` and\n`semiTractor` vehicles also fit in the parking space and can charge.\nCurrently the list includes only `van` and a few truck types, but in the future\nit may include other vehicle types as well.\n\n* `van`: Light commercial vehicles, for example vans, pickups and the like.\n* `semiTractor`: Semi-trailer trucks, also known as tractor-trailers\n* `rigid`: Rigid trucks, also known as box trucks or delivery trucks.\n* `truckWithTrailer`: Rigid or semi-tractor trucks with trailer.\n","x-extensible-enum":["van","semiTractor","rigid","truckWithTrailer"],"type":"string"},"Evse":{"type":"object","properties":{"uid":{"description":"Uniquely identifies the EVSE within the CPOs platform (and\nsuboperator platforms).\nFor example a database ID or the actual \"EVSE ID\". This field can\nnever be changed, modified or renamed.\nThis is the 'technical' identification of the EVSE, not to be\nused as 'human readable' identification, use the field `id` for\nthat.\n","type":"string"},"evseId":{"description":"Compliant with the EVSE ID from \"eMI3 standard version V1.0\".\n","type":"string"},"connectors":{"description":"List of available connectors on the EVSE. An operational EVSE should have at least one connector.","type":"array","items":{"$ref":"#/components/schemas/EvConnector"},"uniqueItems":true},"status":{"description":"Indicates the current short-term status of the EVSE at the\ntime given in the `modified` property.\n\nThere are no separate statuses available for individual connectors. A\nsingle EVSE can only be used by a single car, so some statuses apply to\nother connectors as well. So, if one connector is in use, the whole EVSE has status\n`charging`, and other connectors cannot be used at the same time, hence they\nshould be considered in-use as well. If an EVSE can allow multiple connectors\nto be used at the same time, it is basically multiple EVSEs merged into\na single physical box or device.\n\n* `available`: The EVSE/connector is able to start a new charging session.\n* `blocked`: The EVSE/connector is not accessible because of a physical\n  barrier, for example a car.\n* `charging`: The EVSE/connector is in use.\n* `inoperative`: The EVSE/connector is temporarily not available for use,\n  but not broken or defect.\n* `outOfOrder`: The EVSE/connector is currently out of order.\n* `reserved`: The EVSE/connector is reserved for a particular EV driver\n  and is unavailable for other drivers.\n* `unknown`: No status information available or the EVSE/connector is\n  offline.\n* `operational`: The EVSE/connector was operational when checked the last time,\n  but the actual latest status is not available at the moment.\n","allOf":[{"$ref":"#/components/schemas/EvseStatus"}]},"capabilities":{"description":"List of administrative functionalities that the EVSE is capable of.\n\nExtensible enum: `chargingProfile` `chargingPreferences` `remoteStartStop` `reservable` `tokenGroup` `unlock` `...`  \n\n* `chargingProfile`: The EVSE supports charging profiles.\n* `chargingPreferences`: The EVSE supports charging preferences.\n* `remoteStartStop`: The EVSE can remotely be started/stopped.\n* `reservable`: The EVSE can be reserved.\n* `tokenGroup`: This EVSE supports token groups, two or more tokens work\n  as one, so that a session can be started with one token and stopped with\n  another (handy when a card and key-fob are given to the EV-driver).\n* `unlock`: Connectors have mechanical lock that can be requested by the\n  eMSP to be unlocked.\n\nAs it is possible that new capabilities are supported in the future,\nunknown capabilities should be ignored.\n","type":"array","items":{"$ref":"#/components/schemas/EvseCapability"},"uniqueItems":true},"floorLevel":{"description":"Level on which the EVSE is located (in garage buildings) in\nthe locally displayed numbering scheme.\nIrrelevant for other parking types (hence optional).\n","type":"string"},"physicalReference":{"description":"A number or string printed on the outside of the EVSE for visual identification.","type":"string"},"id":{"description":"The globally unique identifier of the EVSE.","type":"string"},"location":{"description":"A point representation of the EVSE's location.","allOf":[{"$ref":"#/components/schemas/Location"}]},"paymentSupports":{"description":"List of payment support functionalities on EVSE for ad-hoc customers\n(without pre-registration).\n\nExtensible enum: `chipCard` `contactlessCard` `creditCard` `debitCard` `pedTerminal` `rfidReader` `authByCarPlugAndCharge` `authByCarAutocharge` `onlineApplePay` `onlinePaypal` `onlineCreditCard` `onlineGooglePay` `onlineBankPayment` `terminalQrCode` `terminalSms` `operatorApp` `mobilePayment` `...`  \n\n* `chipCard`: EVSE has a payment terminal that supports chip cards.\n* `contactlessCard`: EVSE has a payment terminal that supports contactless\n  cards.\n* `creditCard`: EVSE has a payment terminal that makes it possible to pay\n  for charging using a credit card.\n* `debitCard`: EVSE has a payment terminal that makes it possible to pay\n  for charging using a debit card.\n* `pedTerminal`: EVSE has a payment terminal with a pin-code entry device.\n* `rfidReader`: Charging at this EVSE can be authorized with an RFID\n  token.\n* `authByCarPlugAndCharge`: ISO 15118 Plug&Charge enables drivers to plug\n  in and charge up instantly using automatic EV-to-charging station\n  authentication technology.\n* `authByCarAutocharge`: Autocharge enables drivers to plug in and charge\n  up instantly using automatic EV-to-charging station authentication\n  technology.\n* `onlineApplePay`: Authenticate & pay with Apple Pay.\n* `onlinePaypal`: Authenticate & pay with PayPal.\n* `onlineCreditCard`: Authenticate & pay with credit card online.\n* `onlineGooglePay`: Authenticate & pay with Google Pay.\n* `onlineBankPayment`: Authenticate & pay with online bank payment.\n* `terminalQrCode`: Initiate authentication & payment with QR code on the\n  terminal.\n* `terminalSms`: Authenticate & pay with SMS on the terminal.\n* `operatorApp`: Authenticate & pay with charge point operator application\n  on mobile phone.\n* `mobilePayment`: Used with `operatorApp`, all `online-` items,\n  `terminalSms`, `terminalQrCode` and `contactlessCard`. Whenever one\n  or more of those payment types is specified, `mobilePayment` is also\n  be specified.\n\nAs it is possible that new capabilities are supported in the future,\nunknown capabilities should be ignored.\n","type":"array","items":{"$ref":"#/components/schemas/EvsePaymentSupport"},"uniqueItems":true},"modified":{"description":"Timestamp when the status of this EVSE was last updated.","type":"string","format":"date-time"},"reliability":{"x-maturity":"alpha","description":"**ALPHA** **RESTRICTED** Reliability indicators for the EVSE.\n\nOnly present if the `reliability` field is requested and there is reliability\ndata available for the EVSE.\n","allOf":[{"$ref":"#/components/schemas/Reliability"}]},"parking":{"x-maturity":"alpha","description":"**ALPHA** Parking conditions and capabilities for this EVSE.\n","allOf":[{"$ref":"#/components/schemas/EvseParking"}]}},"required":["uid","status","modified","connectors"]},"EvseCapability":{"description":"Extensible enum: `chargingProfile` `chargingPreferences` `remoteStartStop` `reservable` `tokenGroup` `unlock` `...`  \n\n* `chargingProfile`: The EVSE supports charging profiles.\n* `chargingPreferences`: The EVSE supports charging preferences.\n* `remoteStartStop`: The EVSE can remotely be started/stopped.\n* `reservable`: The EVSE can be reserved.\n* `tokenGroup`: This EVSE supports token groups, two or more tokens work\n  as one, so that a session can be started with one token and stopped with\n  another (handy when a card and key-fob are given to the EV-driver).\n* `unlock`: Connectors have mechanical lock that can be requested by the\n  eMSP to be unlocked.\n\nAs it is possible that new capabilities are supported in the future,\nunknown capabilities should be ignored.\n","x-extensible-enum":["chargingProfile","chargingPreferences","remoteStartStop","reservable","tokenGroup","unlock"],"type":"string"},"EvseParking":{"x-maturity":"alpha","description":"**ALPHA** Parking conditions and capabilities for an EVSE.\n\nThis is used to specify parking conditions and capabilities for the EVSE,\nwhich may be different from the general parking conditions of the location.\n","type":"object","properties":{"conditions":{"description":"List of parking conditions for this EVSE.\n\nExtensible enum: `disabled` `customers` `taxis` `...`  \n\n* `disabled`: The parking space is designed to be accessible by drivers with\ndisabilities. It may be also reserved for drivers with disabilities.\n* `customers`: The parking space is reserved for customers of a hotel,\nrestaurant, store etc. Note: this is set only if the whole location is not set\nas `customersOnly` in `accessRestrictions`.\n* `taxis`: The parking space is reserved for taxis.\n\nAs it is possible that new types are supported in the future, unknown types\nshould be ignored.\n","type":"array","items":{"$ref":"#/components/schemas/EvseParkingConditions"},"uniqueItems":true},"vehicleTypes":{"description":"**RESTRICTED**\nList of vehicle types that are known to be allowed to park and charge at this\nEVSE. If the `supportedVehicles` field includes `car` or `twoWheeler`, they\ncan park and use the EVSE as well without explicit listing here.\n\nExtensible enum: `van` `semiTractor` `rigid` `truckWithTrailer` `...`  \n\nList of vehicle types that can park at the EVSE. The list is not always\nexhaustive, but smaller vehicles are expected to be able to use the EVSE as well.\nFor example, if the list includes only `truckWithTrailer`, then `rigid` and\n`semiTractor` vehicles also fit in the parking space and can charge.\nCurrently the list includes only `van` and a few truck types, but in the future\nit may include other vehicle types as well.\n\n* `van`: Light commercial vehicles, for example vans, pickups and the like.\n* `semiTractor`: Semi-trailer trucks, also known as tractor-trailers\n* `rigid`: Rigid trucks, also known as box trucks or delivery trucks.\n* `truckWithTrailer`: Rigid or semi-tractor trucks with trailer.\n","type":"array","items":{"$ref":"#/components/schemas/EvVehicleTypes"},"uniqueItems":true},"vehicleLimitations":{"$ref":"#/components/schemas/VehicleLimitations"},"noClearanceHeight":{"description":"Explicitly indicates absence or presence of a clearance height limit for the\nEVSE.\n\nSince the absence of the `height` field in `vehicleLimitations` can be\ninterpreted as either no restriction or unknown restriction, this is an\nexplicit indication whether a clearance height restriction is present.\n\n* True: there is no clearance height restriction for the EVSE.\n* False: there is a clearance height restriction for the EVSE.\n* Absent: the clearance height restriction is unknown.\n","type":"boolean"},"evsePosition":{"description":"The position of the EVSE in relation to the parking space, when known.\n\n* `left`: The EVSE is located on the left side of the parking space.\n* `right`: The EVSE is located on the right side of the parking space.\n* `center`: The EVSE is at the center of the impassable narrow end of a\nparking space.\n","enum":["left","right","center"],"type":"string"},"parkingDirection":{"description":"The direction in which the vehicle should be parked at this EVSE.\n\n* `parallel`: Parking happens parallel to the roadway on which vehicles\n  approach the EVSE.\n* `perpendicular`: Parking happens perpendicular to the roadway on which\n  vehicles approach the EVSE.\n* `angle`: Parking happens at an angle to the roadway on which vehicles\n  approach the EVSE.\n* `pullThrough`: A vehicle can stop, charge, and proceed without reversing\n  out of a parking bay.\n","enum":["parallel","perpendicular","angle","pullThrough"],"type":"string"},"reservationRequired":{"description":"Whether a reservation is required for parking at this EVSE. This is separate\nfrom the `reservable` capability, which indicates whether the EVSE can be\nreserved at all, but does not indicate whether it is required to be reserved.\n","type":"boolean"}},"example":{"conditions":["customers"],"vehicleTypes":["van","semiTractor"],"vehicleLimitations":{"height":3.5,"width":2.5,"length":12},"noClearanceHeight":false,"evsePosition":"left","parkingDirection":"perpendicular","reservationRequired":true}},"EvseParkingConditions":{"x-maturity":"alpha","description":"Extensible enum: `disabled` `customers` `taxis` `...`  \n\n* `disabled`: The parking space is designed to be accessible by drivers with\ndisabilities. It may be also reserved for drivers with disabilities.\n* `customers`: The parking space is reserved for customers of a hotel,\nrestaurant, store etc. Note: this is set only if the whole location is not set\nas `customersOnly` in `accessRestrictions`.\n* `taxis`: The parking space is reserved for taxis.\n\nAs it is possible that new types are supported in the future, unknown types\nshould be ignored.\n","x-extensible-enum":["disabled","customers","taxis"],"type":"string"},"EvsePaymentSupport":{"description":"Extensible enum: `chipCard` `contactlessCard` `creditCard` `debitCard` `pedTerminal` `rfidReader` `authByCarPlugAndCharge` `authByCarAutocharge` `onlineApplePay` `onlinePaypal` `onlineCreditCard` `onlineGooglePay` `onlineBankPayment` `terminalQrCode` `terminalSms` `operatorApp` `mobilePayment` `...`  \n\n* `chipCard`: EVSE has a payment terminal that supports chip cards.\n* `contactlessCard`: EVSE has a payment terminal that supports contactless\n  cards.\n* `creditCard`: EVSE has a payment terminal that makes it possible to pay\n  for charging using a credit card.\n* `debitCard`: EVSE has a payment terminal that makes it possible to pay\n  for charging using a debit card.\n* `pedTerminal`: EVSE has a payment terminal with a pin-code entry device.\n* `rfidReader`: Charging at this EVSE can be authorized with an RFID\n  token.\n* `authByCarPlugAndCharge`: ISO 15118 Plug&Charge enables drivers to plug\n  in and charge up instantly using automatic EV-to-charging station\n  authentication technology.\n* `authByCarAutocharge`: Autocharge enables drivers to plug in and charge\n  up instantly using automatic EV-to-charging station authentication\n  technology.\n* `onlineApplePay`: Authenticate & pay with Apple Pay.\n* `onlinePaypal`: Authenticate & pay with PayPal.\n* `onlineCreditCard`: Authenticate & pay with credit card online.\n* `onlineGooglePay`: Authenticate & pay with Google Pay.\n* `onlineBankPayment`: Authenticate & pay with online bank payment.\n* `terminalQrCode`: Initiate authentication & payment with QR code on the\n  terminal.\n* `terminalSms`: Authenticate & pay with SMS on the terminal.\n* `operatorApp`: Authenticate & pay with charge point operator application\n  on mobile phone.\n* `mobilePayment`: Used with `operatorApp`, all `online-` items,\n  `terminalSms`, `terminalQrCode` and `contactlessCard`. Whenever one\n  or more of those payment types is specified, `mobilePayment` is also\n  be specified.\n\nAs it is possible that new capabilities are supported in the future,\nunknown capabilities should be ignored.\n","x-extensible-enum":["chipCard","contactlessCard","creditCard","debitCard","pedTerminal","rfidReader","authByCarPlugAndCharge","authByCarAutocharge","onlineApplePay","onlinePaypal","onlineCreditCard","onlineGooglePay","onlineBankPayment","terminalQrCode","terminalSms","operatorApp","mobilePayment"],"type":"string"},"EvseStatus":{"description":"* `available`: The EVSE/connector is able to start a new charging session.\n* `blocked`: The EVSE/connector is not accessible because of a physical\n  barrier, for example a car.\n* `charging`: The EVSE/connector is in use.\n* `inoperative`: The EVSE/connector is temporarily not available for use,\n  but not broken or defect.\n* `outOfOrder`: The EVSE/connector is currently out of order.\n* `reserved`: The EVSE/connector is reserved for a particular EV driver\n  and is unavailable for other drivers.\n* `unknown`: No status information available or the EVSE/connector is\n  offline.\n* `operational`: The EVSE/connector was operational when checked the last time,\n  but the actual latest status is not available at the moment.\n","enum":["available","blocked","charging","inoperative","outOfOrder","reserved","unknown","operational"],"type":"string"},"GenericErrorResponse":{"description":"Generic error response","type":"object","properties":{"error":{"type":"string","description":"Human-readable error"},"error_description":{"type":"string","description":"Human-readable error description"},"status":{"type":"integer","description":"HTTP status code","example":403}},"required":["error"]},"HealthResponse":{"description":"Returns the health of the service","type":"object","properties":{"status":{"description":"Health status of the service:\n\n* `ok` - the service is operating normally\n* `fail` - the service is currently encountering a failure\n","type":"string","enum":["ok","fail"]},"message":{"description":"Human-readable error message","type":"string"}}},"Id":{"description":"Charging location identifier with prefix components. The prefix here:evcp is fixed, followed by the feature type and the content ID. Globally unique.","example":"here:evcp:charginglocation:246udbvs5xwtg-aGVyZS1ldjplY29tb3ZlbWVudDoyMTEzODY4NzI3","type":"string","pattern":"here:evcp:[^:]+:.*"},"IdParameter":{"description":"Charging location identifier with optional prefix components separated by colon. Only the last component is relevant for data retrieval.","example":"here:evcp:charginglocation:246udbvs5xwtg-aGVyZS1ldjplY29tb3ZlbWVudDoyMTEzODY4NzI3","type":"string","pattern":"(([^:]*:)*)(.*)"},"Image":{"description":"Contains image link and attributes.","type":"object","properties":{"url":{"description":"URL from where the image data can be fetched.","type":"string"},"thumbnailUrl":{"description":"URL from where a thumbnail of the image can be fetched, if there is a thumbnail available from our provider.","type":"string"}},"required":["url"]},"Location":{"description":"A point representation of a location.","type":"object","properties":{"lat":{"description":"Latitude in degrees","type":"number","format":"double","example":52.531},"lng":{"description":"Longitude in degrees","type":"number","format":"double","example":13.384}},"required":["lat","lng"]},"MetadataByCountry":{"type":"object","description":"List of metadata entries per country.","properties":{"countries":{"type":"array","uniqueItems":true,"items":{"type":"object","description":"Metadata for a single country.","properties":{"countryCode":{"allOf":[{"$ref":"#/components/schemas/CountryCode"}]},"eMobilityServiceProviders":{"description":"Metadata on e-Mobility service providers in locations of country.","type":"array","maxItems":500,"uniqueItems":true,"items":{"$ref":"#/components/schemas/MetadataDetails"}},"operators":{"description":"Metadata on operators and suboperators in locations of country.","type":"array","maxItems":500,"uniqueItems":true,"items":{"$ref":"#/components/schemas/MetadataDetails"}},"connectorTypes":{"description":"Metadata on connector types available in locations of country.","type":"array","uniqueItems":true,"items":{"$ref":"#/components/schemas/ConnectorTypeMetadata"}}},"required":["countryCode"]}},"missingCountries":{"description":"List of country codes from the query parameter for which there is no data to return. Either the country is not covered by the data, or the country code is not matching the data.","type":"array","items":{"$ref":"#/components/schemas/CountryCode"}}},"example":{"countries":[{"countryCode":"DEU","eMobilityServiceProviders":[{"name":"ChargePoint","partnerId":"1f90fdf0-cca5-11ed-be23-42010aa40002"},{"name":"Last Mile Solutions","partnerId":"1f098f1e-cca5-11ed-b774-42010aa40002"}],"operators":[{"name":"ChargePoint","partnerId":"1f90fdf0-cca5-11ed-be23-42010aa40002"},{"name":"Last Mile Solutions","partnerId":"1f098f1e-cca5-11ed-b774-42010aa40002"}],"connectorTypes":[{"standard":"IEC_62196_T2","commonName":"Type 2 (Mennekes)","maxPower":22000,"legacyId":31},{"standard":"IEC_62196_T2_COMBO","commonName":"CCS2","maxPower":350000,"legacyId":34}]},{"countryCode":"GBR","eMobilityServiceProviders":[{"name":"ChargePoint","partnerId":"1f90fdf0-cca5-11ed-be23-42010aa40002"}],"operators":[{"name":"ChargePoint","partnerId":"1f90fdf0-cca5-11ed-be23-42010aa40002"}],"connectorTypes":[{"standard":"IEC_62196_T2","commonName":"Type 2 (Mennekes)","maxPower":22000,"legacyId":31}]}],"missingCountries":["ZZZ"]}},"MetadataDetails":{"description":"Metadata of operator or e-Mobility service provider.","type":"object","properties":{"name":{"description":"Name of the company.","type":"string"},"partnerId":{"description":"A unique ID for the company. It can be used to assure correct mapping when the name changes.","type":"string"},"tariffs":{"description":"Metadata for all tariffs (subscriptions / charging cards) the company provides.\n","type":"array","items":{"type":"object","properties":{"name":{"description":"Name of the tariff, corresponding to the `name` field in the `Tariff`\nobject.\n","type":"string"}},"required":["name"]}}},"required":["name","partnerId"],"example":{"name":"ChargePoint","partnerId":"1f90fdf0-cca5-11ed-be23-42010aa40002"}},"ConnectorTypeMetadata":{"description":"Metadata for connector types including OCPI connector type, common name, max power and legacyId.","type":"object","properties":{"standard":{"description":"The connector type (standard) following OCPI connector type definitions.\n\nExtensible enum: `CHADEMO` `CHAOJI` `DOMESTIC_A` `DOMESTIC_B` `DOMESTIC_C` `DOMESTIC_D` `DOMESTIC_E` `DOMESTIC_F` `DOMESTIC_G` `DOMESTIC_H` `DOMESTIC_I` `DOMESTIC_J` `DOMESTIC_K` `DOMESTIC_L` `DOMESTIC_M` `DOMESTIC_N` `DOMESTIC_O` `GBT_AC` `GBT_DC` `IEC_60309_2_SINGLE_16` `IEC_60309_2_THREE_16` `IEC_60309_2_THREE_32` `IEC_60309_2_THREE_64` `IEC_62196_T1` `IEC_62196_T1_COMBO` `IEC_62196_T2` `IEC_62196_T2_COMBO` `IEC_62196_T3A` `IEC_62196_T3C` `NEMA_5_20` `NEMA_6_30` `NEMA_6_50` `NEMA_10_30` `NEMA_10_50` `NEMA_14_30` `NEMA_14_50` `PANTOGRAPH_BOTTOM_UP` `PANTOGRAPH_TOP_DOWN` `TESLA_R` `TESLA_S` `SAE_J3400` `MCS` `...`  \n\n* `CHADEMO`: The connector type is CHAdeMO, DC\n* `CHAOJI`: The ChaoJi connector. The new generation charging connector,\nharmonized between CHAdeMO and GB/T. DC.\n* `DOMESTIC_A`: Standard/Domestic household, type \"A\", NEMA 1-15, 2 pins\n* `DOMESTIC_B`: Standard/Domestic household, type \"B\", NEMA 5-15, 3 pins\n* `DOMESTIC_C`: Standard/Domestic household, type \"C\", CEE 7/17, 2 pins\n* `DOMESTIC_D`: Standard/Domestic household, type \"D\", 3 pin\n* `DOMESTIC_E`: Standard/Domestic household, type \"E\", CEE 7/5 3 pins\n* `DOMESTIC_F`: Standard/Domestic household, type \"F\", CEE 7/4, Schuko, 3\npins\n* `DOMESTIC_G`: Standard/Domestic household, type \"G\", BS 1363,\nCommonwealth, 3 pins\n* `DOMESTIC_H`: Standard/Domestic household, type \"H\", SI-32, 3 pins\n* `DOMESTIC_I`: Standard/Domestic household, type \"I\", AS 3112, 3 pins\n* `DOMESTIC_J`: Standard/Domestic household, type \"J\", SEV 1011, 3 pins\n* `DOMESTIC_K`: Standard/Domestic household, type \"K\", DS 60884-2-D1, 3\npins\n* `DOMESTIC_L`: Standard/Domestic household, type \"L\", CEI 23-16-VII, 3\npins\n* `DOMESTIC_M`: Standard/Domestic household, type \"M\", BS 546, 3 pins\n* `DOMESTIC_N`: Standard/Domestic household, type \"N\", NBR 14136, 3 pins\n* `DOMESTIC_O`: Standard/Domestic household, type \"O\", TIS 166-2549, 3\npins\n* `GBT_AC`: Guobiao GB/T 20234.2 AC socket/connector\n* `GBT_DC`: Guobiao GB/T 20234.3 DC connector\n* `IEC_60309_2_SINGLE_16`: IEC 60309-2 Industrial connector single phase\n16 amperes (usually blue)\n* `IEC_60309_2_THREE_16`: IEC 60309-2 Industrial connector three phase 16\namperes (usually red)\n* `IEC_60309_2_THREE_32`: IEC 60309-2 Industrial connector three phase 32\namperes (usually red)\n* `IEC_60309_2_THREE_64`: IEC 60309-2 Industrial connector three phase 64\namperes (usually red)\n* `IEC_62196_T1`: IEC 62196 Type 1 \"SAE J1772\"\n* `IEC_62196_T1_COMBO`: Combo Type 1 based, DC\n* `IEC_62196_T2`: IEC 62196 Type 2 \"Mennekes\"\n* `IEC_62196_T2_COMBO`: Combo Type 2 based, DC\n* `IEC_62196_T3A`: IEC 62196 Type 3A\n* `IEC_62196_T3C`: IEC 62196 Type 3C \"Scame\"\n* `NEMA_5_20`: NEMA 5-20, 3 pins\n* `NEMA_6_30`: NEMA 6-30, 3 pins\n* `NEMA_6_50`: NEMA 6-50, 3 pins\n* `NEMA_10_30`: NEMA 10-30, 3 pins\n* `NEMA_10_50`: NEMA 10-50, 3 pins\n* `NEMA_14_30`: NEMA 14-30, 4 pins\n* `NEMA_14_50`: NEMA 14-50, 4 pins\n* `PANTOGRAPH_BOTTOM_UP`: On-board Bottom-up-Pantograph typically for bus\ncharging\n* `PANTOGRAPH_TOP_DOWN`: Top-down-Pantograph typically for bus charging\n* `TESLA_R`: Tesla connector \"Roadster\"-type (round, 4 pin)\n* `TESLA_S`: Tesla connector \"Model-S\"-type (oval, 5 pin)\n* `SAE_J3400`: Tesla connector \"Model-S\"-type (oval, 5 pin), standardized\nas NACS SAE J3400\n* `MCS`: Megawatt Charging System (MCS) connector\n\nAs it is possible that new connector types are supported in the future,\nunknown connector types should be ignored.\n","allOf":[{"$ref":"#/components/schemas/ConnectorType"}]},"commonName":{"description":"Human-readable connector name for display in user interfaces.","type":"string"},"maxPower":{"description":"Maximum power available via this connector type in the country, in watts (W).\n\nNote: Typically the maximum power for DC connectors indicates a dynamically\nshared maximum power between a set of EVSEs, hence the actual maximum power\nfor a single connector can depend on load of other EVSEs in the location.\n","type":"integer","minimum":1},"legacyId":{"description":"The id of the connector type in our EV API v2, used for backward compatibility\nand mapping to the new OCPI-based connector types.\nThis id can be used to filter locations via HERE Search API.\n","type":"integer"}},"required":["standard","commonName","maxPower"],"example":{"standard":"IEC_62196_T2","commonName":"Type 2 (Mennekes)","maxPower":22000,"legacyId":31}},"NearbyPlace":{"x-maturity":"alpha","description":"**ALPHA** A HERE Place near to the charging location, providing conveniences for the driver and/or passengers while the vehicle is charging.\n","type":"object","properties":{"placeId":{"description":"Globally unique identifier of the HERE Place, enabling the client to fetch\nmore information about the Place using the Lookup endpoint of the HERE\nGeocoding and Search API.\n","type":"string"},"categories":{"description":"The subset of the place's categories that are considered relevant as\nconveniences for drivers during EV charging. The set can include for example\nrest areas, cafes, and fast food restaurants. The set may be used for example\nto show icons associated with the EV charging location in a user interface.\nThe categories are represented by ids defined in https://www.here.com/docs/bundle/geocoding-and-search-api-developer-guide/page/topics-places/places-category-system-full.html\n","type":"array","items":{"type":"string"},"minItems":1},"distance":{"description":"Approximate distance from the charging location to the place, in meters.\n","type":"number","format":"integer"},"walkingDistance":{"description":"Walking distance from the EV charging location to the nearby place,\nin meters, calculated along pedestrian-accessible paths. Unlike the\n`distance` field, which represents straight-line (Haversine)\ndistance, this value accounts for physical barriers such as\nmulti-lane roads, rivers, and restricted areas.\n\nA value of 0 means the EV charger and the place are typically within\nthe same facility.\n\nIf this field is not present, pedestrian path was not verified.\n","type":"integer","minimum":0}},"required":["placeId","categories"],"example":{"placeId":"528u17bv-e77e5c27819d5cff9fad6b4616f71f6d","categories":["600-6000-0061","100-1100-0010"],"distance":41,"walkingDistance":125}},"NotFoundResponse":{"type":"object","properties":{"title":{"type":"string","description":"Human-readable error description","example":"No content found with provided ID"},"status":{"type":"integer","description":"HTTP status code","example":404},"code":{"type":"string","description":"Error code.","example":"E629000"},"cause":{"type":"string","description":"Human-readable explanation for the error","example":"No location exists with the given identifier"},"action":{"type":"string","description":"Human-readable description of the action that can be taken to correct the error","example":"Request a valid id"},"correlationId":{"type":"string","description":"Auto-generated id that uniquely identifies the request","example":"4199533b-6290-41db-8d79-edf4f4019a74"}},"required":["title","status","code","cause","action","correlationId"]},"OpenapiResponse":{"description":"API response for the openapi endpoint","type":"object","additionalProperties":true},"OpeningHoursDetailsType":{"description":"Opening hours defined as a list of days during which location is open in the given time periods.","type":"object","properties":{"days":{"type":"array","items":{"$ref":"#/components/schemas/DayOfWeek"},"minItems":1,"maxItems":7},"periods":{"type":"array","items":{"$ref":"#/components/schemas/TimePeriodType"}}}},"OpeningHoursType":{"description":"Opening hours for the location, provided either as 24/7 flag or weekly operating\nschedule, optionally supplemented with a list of exceptional opening and closing times.\n","type":"object","properties":{"open24x7":{"description":"Boolean value indicating if the charging location is open 24\nhours a day, 7 days per week. If true, the regularSchedule and\nexceptions fields should be empty. Absence can be interpreted\nas false and the schedule should then be provided.\n","type":"boolean","example":true},"chargingWhenClosed":{"description":"Indicates if it is allowed to leave vehicles in the charging location to\ncontinue charging outside opening hours. Only present if the location\nhas some closing hours defined, either regular or exceptional.\n","type":"boolean"},"regularSchedule":{"type":"array","items":{"$ref":"#/components/schemas/OpeningHoursDetailsType"}},"exceptions":{"type":"array","items":{"$ref":"#/components/schemas/AnnualOpeningHoursDetailType"}}}},"PowerType":{"description":"* `ac1Phase`: Alternating current, single phase.\n* `ac2Phase`: Alternating current, two phases, only two of the three\navailable phases connected.\n* `ac2PhaseSplit`: Alternating current, two phases using split phase\nsystem.\n* `ac3Phase`: Alternating current, three phases.\n* `dc`: Direct current.\n","enum":["ac1Phase","ac2Phase","ac2PhaseSplit","ac3Phase","dc"],"type":"string"},"Prediction":{"description":"**RESTRICTED** Availability prediction data.\n","type":"object","properties":{"date":{"description":"The date the predictions are for. Format YYYY-MM-DD.\n\nNote: Both the date and the time periods for predictions data are\nusing the time zone of the charging location for which the predictions\nare made.\n","type":"string","format":"date","example":"2023-12-24"},"confidence":{"description":"Confidence describes the prediction accuracy over the recent history.\n\n0.0 is the lowest confidence, which means predictions point totally\ninto the opposite direction, for example availabilityProbability is\n1.0 when availability was 0.0.\n\n1.0 is the highest possible confidence, which means the predictions\nhave exactly matched the usage.\n\nIf it has not been possible to measure and calculate the confidence,\nthe value is also 0.\n","type":"number"},"periodsPerDay":{"description":"The amount of periods in a day the predictions are provided for in\nthe availabilityProbabilities and predictedWaitTimes arrays.\n\nFor example, if the periodsPerDay is 96, one period length is 15\nminutes. If the periodsPerDay is 24, one period length is 60 minutes\ni.e. 1 hour.\n","type":"integer","minimum":24,"maximum":1440},"availabilityProbabilities":{"description":"Availability probability prediction - probability for at least one\ncharger to be available for each period of the day starting from\nmidnight 00:00 in local time of the charging location for which\nthe predictions are made.\n\nThe amount of items in the array is equal to the number in the\nperiodsPerDay field.\n\nFor example, if the periodsPerDay is 24, the predicted availability\nprobability for 2AM/02:00 - 3AM/03:00 is available at the index:\navailabilityProbabilities[2].\n","type":"array","items":{"type":"number","minimum":0,"maximum":1},"minItems":24,"maxItems":1440},"predictedWaitTimes":{"description":"Predicted wait time to a charger in minutes - predicted wait time\nfor a charger to be available for each period of the day starting\nfrom midnight 00:00 in local time of the charging location for which\nthe predictions are made.\n\nThe amount of items in the array is equal to the number in the\nperiodsPerDay field.\n\nFor example, if the periodsPerDay is 96, the predicted wait time for\n2AM/02:00 - 2:15AM/02:15 is available at the index:\npredictedWaitTime[8].\n","type":"array","items":{"type":"integer","minimum":0},"minItems":24,"maxItems":1440},"predictedOccupancies":{"description":"Predicted overall occupancy of the chargers - predicted occupancy\nfor each period of the day starting from midnight 00:00 in local time of the\ncharging location for which the predictions are made. This value represents\nthe fraction of chargers expected to be occupied. 0.0 means no chargers are\noccupied, 1.0 means all chargers are occupied, values in between represent\npartial occupancy. This can be used e.g. to easily represent the busyness during\nthe day.\n\nThe amount of items in the array is equal to the number in the\nperiodsPerDay field.\n\nFor example, if the periodsPerDay is 96, the predicted occupancy for\n2AM/04:00 - 2:15AM/04:15 is available at the index:\npredictedOccupancies[16].\n","type":"array","items":{"type":"number","minimum":0,"maximum":1},"minItems":24,"maxItems":1440}},"required":["date","confidence","periodsPerDay","availabilityProbabilities","predictedWaitTimes"]},"Reliability":{"x-maturity":"alpha","description":"**ALPHA** **RESTRICTED** Reliability indicators.\nNote: The properties `operational` and `statusReliability` are only\npresent for EVSEs in the first phase. They may be present for\nconnector groups in future phases.\n","type":"object","properties":{"operational":{"description":"Operational reliability indicator reflecting the EVSE's\noperational state.\n\nValues:\n* `1` (red): EVSE has significant reliability issues\n* `2` (yellow): EVSE may have reliability issues\n* `3` (green): EVSE is operating reliably\n","type":"integer","minimum":1,"maximum":3,"example":3},"statusReliability":{"description":"Extensible enum: `reliable` `unreliable` `outdated` `...`  \nStatus delivery reliability indicator reflecting the freshness\nand consistency of status data.\n\n* `reliable`: Status data is current and consistent\n* `unreliable`: Status data has anomalies\n* `outdated`: Status data delivery is clearly delayed\n\nAs it is possible that new indicator values are supported in the future,\nunknown values should be ignored.\n","type":"string","x-extensible-enum":["reliable","unreliable","outdated"],"example":"reliable"},"chargingSessions":{"description":"Reliability related information about charging sessions.\n\nCharging session is considered successful when it has (for example) a valid duration.\n","type":"object","properties":{"lastSuccessful":{"description":"Timestamp when the last successful charging session was completed.\n","type":"string","format":"date-time","example":"2024-05-31T13:41:49.270Z"},"successfulCount":{"description":"Total number of successful charging sessions during the last 28 days.\n","type":"integer","example":38}}}}},"TimePeriodType":{"type":"object","description":"Time period during a day defined by start and end time.\n","properties":{"from":{"type":"string","pattern":"^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$","example":"06:00:00","description":"Start time of day, in hh:mm:ss format, if absent, beginning of the day.","default":"00:00:00"},"to":{"type":"string","pattern":"^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$","example":"21:30:00","description":"End time of day, in hh:mm:ss format, if absent, end of the day. The period is exclusive of the given value.","default":"00:00:00"}}},"VehicleLimitations":{"description":"**RESTRICTED** Size-related limitations for vehicles entering the `ChargingLocation` or charging at an EVSE.\n","type":"object","properties":{"weight":{"description":"Maximum weight for the vehicles, in kilograms.\n\nIt specifies the maximum weight the location or EVSE is designed\nfor, and can correspond either to the maximum gross weight\nor the actual weight of the vehicle, if that is known.\n\nWhile the `truckAccess` specifies the category the EV\ncharging location is designed for and by that way includes an\nillustrative weight limit, the `weight` can be used to\nspecify a more detailed restriction within the category,\nwhen there is a reason to limit the weight of the vehicles\nentering the location.\n\nFor example, `medium` category covers vehicles up to 12\ntonnes, but if the location is designed for vehicles only\nup to 10 tonnes, the category is expected to include\n`medium` and the `weight` is expected to be set as 10000.\n","type":"number"},"height":{"description":"Maximum vehicle height, in centimeters, also known as clearance height.\n\nThere is for example a gate or a canopy that limits the height of vehicles.\n\nWhen used in the `ChargingLocation`, it represents the highest limit of the\nEVSEs.\n\nAbsence means there is no known restriction.\n","type":"number"},"width":{"description":"Maximum vehicle width, in centimeters.\n\nThis is expected to correspond to the width of the parking space\nassociated with a single EVSE.\n\nWhen used in the `ChargingLocation`, it represents the widest limit of the\nEVSEs.\n\nAbsence means the restriction is not known.\n","type":"number"},"length":{"description":"Maximum vehicle length, in centimeters.\n\nA longer vehicle may block other EVSEs or the by-passing traffic.\n\nWhen used in the `ChargingLocation`, it represents the longest limit of the\nEVSEs.\n\nAbsence means the restriction is not known.\n","type":"number"},"permittedTrailers":{"description":"Indication if entrance with trailers / semi-trailer is permitted at the EV\nCharging Location. This field is currently not used with EVSEs, but trailer\nsupport is indicated via `EvVehicleTypes`.\n\nThe dimensional limits (height, width, length), if present, are\nexpected to cover trailers too, but some operators may indicate\ntrailer support additionally or solely via this dedicated attribute.\nThe exact number of trailers is typically not relevant for\nEV charging, hence the most common value would be `1`. Access\nwith trailers can be prohibited by specifying value `0`.\n\nIf dimensional limits are not available, default trailer sizes can\nbe assumed based on the truck access category, i.e., `light` trucks\ntow smaller trailers than `heavy` trucks.\n\nAbsence means the trailer support is not specified separately but is\neither not known or can be derived from dimensional limits, if\navailable.\n\nFor example, if max length is 25 meters, and `permittedTrailers` is\nabsent, (semi-)trailer trucks up to 25 meters long can enter.\n","type":"number"}}},"Tariff":{"description":"Tariff or price plan from the charge point operator or eMSP.\nA tariff is composed of one or more elements, each having at least one component.\nIt is client's responsibility to pick the elements whose conditions match the state\nof the charging session.\n","type":"object","properties":{"name":{"description":"Name of the tariff.\nThe name is not mandatory for ad-hoc tariffs, but may exist.\n","type":"string"},"type":{"description":"Type of the tariff. The type can be one of the following:\n* `adhoc` - Ad-hoc tariff (pay as you go), no subscription required.\n* `emsp` - Tariff provided by an eMSP.\n* `cpo` - Tariff provided by a CPO.\n\nIf not present, `adhoc` tariff is assumed.\n","type":"string","enum":["adhoc","emsp","cpo"],"example":"adhoc"},"partner":{"description":"Name of the partner providing the tariff, either the charge point\noperator or eMSP.\n","type":"string"},"partnerId":{"description":"A unique ID representing the partner. The same id is used also in other parts\nof the API and other related HERE APIs.\n","type":"string"},"currency":{"description":"The currency in which the prices are given. The currency code is\nbased on the ISO 4217 standard.\n","type":"string","example":"EUR"},"elements":{"description":"Elements composing the tariff. Each element can have multiple components,\nat most one per dimension.\n\nWhen multiple elements are present, the associated condition enables the\nclient to select the element(s) that match the state of the charging\nsession.\n\nPrice components of different dimensions from more than one element\nmay be needed at the same time. For example, one element for energy and\nanother one for time dimension. Often the time dimension has a condition on\ncharging duration while energy dimension may have a condition on the time of\nthe day. Hence they are present in different elements and must be selected\nseparately.\n\nThe precedence is defined by the order of the elements in the data, the first\nelement having the highest precedence. The first matching element per\ndimension should be used. An element without any condition is typically\npresent for charging sessions that do not meet any of the conditions.\n\nPlease note that tariff elements or conditions requiring access to vehicle\nAPIs are not present in this API. The provided elements can only be used to\nderive a price estimate, which in most cases is reasonably close to the final\nprice.\n","type":"array","items":{"$ref":"#/components/schemas/TariffElement"},"uniqueItems":true,"minItems":1}},"required":["partner","partnerId","currency","elements"],"example":{"type":"adhoc","partner":"Apcoa Parking Danmark A/S","partnerId":"4888af6c-9a42-11ee-8af8-42010aa40050","currency":"DKK","elements":[{"components":[{"dimension":"energy","price":3.75,"vat":25},{"dimension":"time","price":5.25,"vat":25,"step":300}]}]}},"PriceComponent":{"description":"Price component, presenting a price for a single dimension.\nThe dimensions are explained below.\n","type":"object","properties":{"dimension":{"description":"The dimension or type of the price component.\n* `time` - time-based rate, defined in hours.\n* `energy` - energy-based rate, defined in kWh.\n* `flat` - single fee charged once per charging session.\n* `parkingTime` - time-based rate when not charging but parked at the charger,\n  defined in hours.\n\nAny non-present dimension can be assumed to have `price` = 0.00.\n\nFree of charge tariff is expressed as `dimension` = `flat` and `price` = 0.00.\n","type":"string","enum":["time","energy","flat","parkingTime"]},"price":{"description":"The price per unit, excluding VAT. The units are defined by the `dimension`.\n","type":"number","example":0.25},"vat":{"description":"The VAT percentage of the price component. If not present, no VAT is applicable.\n","type":"number","example":24},"step":{"description":"Dimension quantity used as a unit of billing. Present for all other dimensions\nexcept `flat`.\nThe customer is charged `price` for each full or partial `step` of the\n`dimension` consumed.\nFor `energy`, the step size unit is 1 Wh, for `time` and `parking-time` it is\n1 second.\nFor example, if `step` is 300 for `time`, then time is billed in 5 minute\nsteps, rounded upwards. Similarly, if step is 100 for `energy`, then energy\nis billed in 100 Wh = 0.1 kWh steps.\n","type":"number"}},"required":["dimension","price"],"example":{"dimension":"energy","price":0.45,"vat":24,"step":100}},"TariffElement":{"description":"Tariff element. One element can have more than one components, one per component\ndimension. For example, a tariff element can consist of components for flat price\nand energy price.\n","type":"object","properties":{"components":{"description":"List of price components that describe the tariff. Each of the components\nshould have a different dimension.\n","type":"array","items":{"$ref":"#/components/schemas/PriceComponent"},"uniqueItems":true,"minItems":1,"maxItems":4},"condition":{"description":"Condition that the charging session needs to meet to apply the tariff element.\nAn element without any condition is typically present for charging sessions\nthat do not meet any of the conditions.\n\nFor example, a tariff element with a lower price can be valid only during\nnighttime, while a generic tariff element without conditions applies for\ndaytime charging sessions.\n\nIn the data the elements are in the order of precedence, i.e. the first element\nwhose condition matches the charging session should be used per dimension.\n","type":"object","properties":{"date":{"description":"Date range when the tariff element is valid.\nThis is typically used to indicate seasonal tariffs or to announce\nan update to the tariff in advance.\nIt may also be used to indicate spot prices, together with time period.\n","type":"object","properties":{"from":{"description":"First date when the element is valid.\n\nIf absent the element becomes valid as soon as other conditions allow.\n","type":"string","format":"date"},"to":{"description":"First date when the element is no longer valid, exclusive and later\nthan `from`.\n\nIf absent the element is valid until some other element takes over.\n","type":"string","format":"date"}}},"days":{"description":"Day(s) of the week when the tariff element is valid. An example would be to specify lower prices for weekends.\n","type":"array","maxItems":7,"uniqueItems":true,"items":{"$ref":"#/components/schemas/DayOfWeek"}},"duration":{"description":"Duration of the charging session when the tariff element is valid, in\nseconds.\n\nOften only either one of the values is present, indicating the minimum or\nmaximum duration.\n","type":"object","properties":{"min":{"description":"Minimum duration of the charging session that the element applies for,\ninclusive. Often used to indicate additional or higher cost for\nlong-lasting charging sessions.\n\nIf absent the element becomes valid as soon as other conditions allow.\n","type":"integer","minimum":0},"max":{"description":"Maximum duration of the charging session that the element applies for,\nexclusive.\n\nIf absent the element is valid until the end of the charging session\nor until some other element takes over.\n","type":"integer","minimum":0}}},"time":{"description":"Time period when the tariff element is valid, in local time.\nThe time period wraps around to the next day, when end time of the period\n(`to`) is smaller than the beginning (`from`).\n","allOf":[{"$ref":"#/components/schemas/TimePeriodType"}]},"overstayBatteryLevel":{"description":"Minimum battery level when the tariff element is valid, in percentages.\nThis can be used to set additional fees for charging a full or nearly full battery.\n","type":"integer","minimum":0,"maximum":100}},"example":{"time":{"from":"22:00:00","to":"06:00:00"},"duration":{"min":3600},"days":["sa","su"]}}},"required":["components"],"example":{"components":[{"dimension":"energy","price":0.45,"vat":24,"step":1},{"dimension":"time","price":2.5,"vat":24,"step":300}],"condition":{"time":{"from":"07:00:00","to":"18:00:00"}}}},"TruckRestrictions":{"description":"**RESTRICTED** Access restrictions for trucks and light commercial vehicles.\n","type":"object","properties":{"truckAccess":{"description":"Access categories for trucks and light commercial vehicles that the EV\ncharging location is designed to serve.\n\nWhile the classifications used as basis for the categories are solely based\non vehicle mass, in EV charging context they can be interpreted to give an\nidea of the dimensional class too, as well as possible other restrictions set\nby the operator. If there are true dimensional or weight limits at the EV\ncharging location, they are specified separately in `vehicleLimitations`.\n\nThe classification is available only to a subset of EV charging locations,\ndepending on the information available from the operators. Hence, at least\nvehicles belonging to the `light` category can be charged also in many EV\ncharging locations not having explicit signaling for the `light` category.\n\nFurthermore, although the classification is based on mass/weight ranges in\ngrowing order, an upper class does not automatically mean that also all lower\nclass vehicles are welcome to charge. For example, a location marked only\nwith category `heavy` is reserved for long-haul trucks only.\n\nIn EU the categorization used as basis can be found in:\nhttps://wiki.unece.org/download/attachments/27459612/VIAQ-02-06%20-%20Vehicle%20Categories.pdf?api=v2.\nFor US market, the categories are specified in\nhttps://afdc.energy.gov/data/10380\n\n* `light`: Light commercial vehicles, for example vans.\nThis category is used only when `supportedVehicles` includes `car`.\nThe vehicles in this category require a bit more space for parking while charging\nthan passenger cars, but many EV charging locations for passenger cars can also\nbe used to charge vehicles of this size.\nIn EU this refers to vehicles from category N1, having a maximum mass not\nexceeding 4.25 tonnes.\nIn USA this refers to classes 1 and 2, with somewhat different weight limits.\n\n* `medium`: Medium-size trucks often used in short-haul transportation, known as\ndelivery or box trucks. Corresponds to `semiTractor` in `EvVehicleTypes`.\nAlso, `rigid` in `EvVehicleTypes` is mapped by default to `medium`, unless\nparking space dimensions or weight limit indicate support for `heavy` category.\nThis category is used only when `supportedVehicles` includes `truck`.\nTrucks like these require clearly more space at the charger than passenger cars.\nIn EU this refers to vehicles from category N2, having a maximum mass exceeding\n3.5 tonnes but not exceeding 12 tonnes. In USA this refers to classes 3 to 6.\n\n* `heavy`: Large-size / heavy-duty trucks, typically used in long-haul\ntransportation.\nCorresponds to `truckWithTrailer` or `rigid` in `EvVehicleTypes`.\nThis category is used only when `supportedVehicles` includes `truck`.\nTrucks of this category require significantly more space at the charger than\npassenger cars.\nEV charging locations are typically located near highways or industrial areas.\nSometimes a location may be prioritized for long-haul trucks only, although\ntechnically smaller ones could charge there too.\nIn EU this refers to vehicles from category N3, having a maximum mass exceeding\n12 tonnes. In USA this refers to classes 7 and 8.\n","type":"array","items":{"$ref":"#/components/schemas/EvTruckAccessCategory"},"uniqueItems":true,"minItems":1,"maxItems":3},"hazardousGoodsRestricted":{"description":"Indication if vehicles carrying hazardous / dangerous goods (ADR) can enter\nthe EV Charging Location.\n\n* True: the access is restricted. The client should assume the restriction\ncovers all ADR classes.\n* False: there are no restrictions.\n* Absent: the information is not known.\n","type":"boolean"},"noClearanceHeight":{"description":"Indication if EVSEs have explicit presence or absence of clearance height\nlimit.\n\nThis is a more explicit indication for absence of height restriction than the\nabsence of the `height` field.\n\n* True: there is at least one EVSE in the location with no clearance\nheight restriction.\n* False: all the EVSEs in the location have restricted clearance height,\nor the information is not known for some EVSEs.\n* Absent: the information is not known for any of the EVSEs.\n","type":"boolean"},"trailerParking":{"description":"Indication if there is a dedicated parking area for trailers at the EV\nCharging Location.\n\n* True: there is a dedicated parking area for trailers.\n* False: there is no dedicated parking area for trailers.\n* Absent: the availability is not known.\n","type":"boolean"},"overnightParking":{"description":"Indication if overnight parking is allowed at the EV Charging Location.\n\n* True: overnight parking is allowed.\n* False: overnight parking is not allowed.\n* Absent: the availability is not known.\n","type":"boolean"},"amenities":{"description":"List of truck-related amenities available at the `ChargingLocation`.\n\nExtensible enum: `truckParking` `truckWash` `truckRepair` `truckDealership` `secureTruckParking` `foodDelivery` `toilet` `washingMachine` `shower` `eateryRestaurant` `vendingMachine` `driverLounge` `outdoorGym` `powerSupply` `atm` `accessControlledArea` `licensePlateRecognition` `perimeterFence` `pedestrianTurnstiles` `cameraSurveillance` `guard` `floodLighting` `entryGate` `exitGate` `...`  \n\n* `truckParking`: There is a truck parking at the location.\n* `truckWash`: There is a truck wash service available at the location.\n* `truckRepair`: There is a truck repair service available at the location.\n* `truckDealership`: There is a truck dealership available at the location.\n* `secureTruckParking`: The location provides secure truck parking.\n* `foodDelivery`: There is a food delivery available to the location.\n* `toilet`: There is a toilet available at the location.\n* `washingMachine`: There is a washing/laundry machine available at the location.\n* `shower`: There is a shower available at the location for drivers.\n* `eateryRestaurant`: There is a restaurant or eatery available at the location.\n* `vendingMachine`: There is a vending machine available at the location.\n* `driverLounge`: There is a driver lounge available at the location.\n* `outdoorGym`: There is an outdoor gym available at the location.\n* `powerSupply`: There is a power supply available at the location, for example for truck's refrigerator.\n* `atm`: There is an ATM available at the location.\n* `accessControlledArea`: Access to the EV charging location / parking area is controlled.\n* `licensePlateRecognition`: There is a license plate recognition at the gate when entering the EV charging location / parking area.\n* `perimeterFence`: There is a perimeter fence surrounding the location.\n* `pedestrianTurnstiles`: There are turnstiles for pedestrians to access the location.\n* `cameraSurveillance`: There is a camera surveillance at the location.\n* `guard`: The location is guarded.\n* `floodLighting`: The location has flood lighting.\n* `entryGate`: There is an entry gate to access the location.\n* `exitGate`: There is an exit gate.\n\nAs it is possible that new amenities are supported in the future, unknown\namenities should be ignored.\n","type":"array","items":{"$ref":"#/components/schemas/EvTruckAmenity"},"uniqueItems":true}},"example":{"truckAccess":["medium","heavy"],"hazardousGoodsRestricted":true,"trailerParking":false,"overnightParking":true,"amenities":["driverLounge","shower"]}},"VersionResponse":{"description":"Returns the versions of the service components.","type":"object","properties":{"apiVersion":{"type":"string","description":"The current version of the API.","example":"3.8.0"},"serviceVersion":{"type":"string","description":"The current version of the service.","example":"2.0.5000"}},"required":["apiVersion"]}},"responses":{"BadRequestErrorResponse":{"description":"API response in case of bad request.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/ErrorResponse"}]},"examples":{"errorResponseExample":{"$ref":"#/components/examples/BadRequestErrorResponse"}}}}},"ForbiddenErrorResponse":{"description":"API response in case of forbidden access to restricted data.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GenericErrorResponse"},"examples":{"errorResponseExample":{"$ref":"#/components/examples/ForbiddenErrorResponse"}}}}},"GenericErrorResponse":{"description":"API response in case of errors not specified separately.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/GenericErrorResponse"}]},"examples":{"errorResponseExample":{"$ref":"#/components/examples/GenericErrorResponse"}}}}},"InternalErrorResponse":{"description":"API response in case of internal errors.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/ErrorResponse"}]},"examples":{"errorResponseExample":{"$ref":"#/components/examples/InternalErrorResponse"}}}}},"NotFoundResponse":{"description":"API response in case of no content found.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/NotFoundResponse"},"examples":{"errorResponseExample":{"$ref":"#/components/examples/NotFoundErrorResponse"}}}}},"ServiceUnavailableErrorResponse":{"description":"API response in case of service unavailability.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"},"examples":{"errorResponseExample":{"$ref":"#/components/examples/ServiceUnavailableErrorResponse"}}}}},"UnauthorizedErrorResponse":{"description":"API response in case of unauthorized access.","headers":{"X-Correlation-ID":{"$ref":"#/components/headers/X-Correlation-ID"},"X-Request-ID":{"$ref":"#/components/headers/X-Request-ID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GenericErrorResponse"},"examples":{"errorResponseExample":{"$ref":"#/components/examples/UnauthorizedErrorResponse"}}}}}},"examples":{"BadRequestErrorResponse":{"summary":"Bad request error response example","value":{"title":"Bad Request","status":400,"code":"E629400","cause":"querystring/fields/2 must be equal to one of the allowed values","action":"Ensure that the request is according to API schema","correlationId":"4199533b-6290-41db-8d79-edf4f4019a74"}},"ForbiddenErrorResponse":{"summary":"Forbidden error response example","value":{"error":"Predictions requested without required authorization","error_description":"Get authorization for predictions usage or make request without predictions","status":403}},"GenericErrorResponse":{"summary":"Generic error response example","value":{"error":"Method not allowed for this action","error_description":"Method not allowed for this action"}},"InternalErrorResponse":{"summary":"Internal error response example","value":{"title":"Internal Error","status":500,"code":"E629500","cause":"Service had an internal error while handling the request","action":"Retry the request after some time, and contact support channels if the issue is not resolved","correlationId":"4199533b-6290-41db-8d79-edf4f4019a74"}},"NotFoundErrorResponse":{"summary":"Not found error response example","value":{"title":"No content found with provided ID","status":404,"code":"E629000","cause":"No location exists with the given identifier","action":"Request a valid id","correlationId":"4199533b-6290-41db-8d79-edf4f4019a74"}},"OpenapiResponse":{"summary":"OpenAPI response example","value":{"openapi":"3.0.2","info":{"title":"HERE EV Charge Points API v3","description":"This API is intended to provide detailed information about charging locations after\nretrieving initial information from the HERE Geocoding and Search API v7 or from HERE\nMap Content data.\n","version":"3.8.0"},"servers":{},"security":[],"paths":{}}},"ServiceUnavailableErrorResponse":{"summary":"Service unavailable error response example","value":{"title":"Database operation failed","status":503,"code":"E629503","cause":"Unexpected failure when querying database","action":"Retry the request after some time, and contact support channels if the issue is not resolved","correlationId":"4199533b-6290-41db-8d79-edf4f4019a74"}},"UnauthorizedErrorResponse":{"summary":"Unauthorized error response example","value":{"error":"Unauthorized","error_description":"No credentials found"}}}}}