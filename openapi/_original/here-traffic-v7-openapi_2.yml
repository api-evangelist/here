nt":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/OpenApiResponse"}]},"examples":{"openapi":{"$ref":"#/components/examples/OpenApiResponse"}}},"application/x-yaml":{"schema":{"allOf":[{"$ref":"#/components/schemas/OpenApiResponse"}]},"examples":{"openapi":{"$ref":"#/components/examples/OpenApiResponse"}}}}},"IncidentItemResponseInvalidRequest":{"description":"Failure to parse the request, it may have invalid incident id or query parameters.\n","headers":{"X-Correlation-Id":{"$ref":"#/components/headers/X-Correlation-Id"},"X-Request-Id":{"$ref":"#/components/headers/X-Request-Id"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"},"examples":{"errorResponseExample":{"$ref":"#/components/examples/ErrorIncidentItemResponseExampleInvalidId"}}}}},"IncidentItemResponseNotFound":{"description":"Failure to parse the request, caused by, for example, invalid parameter values such as\n`in=planet:mars`.\n","headers":{"X-Correlation-Id":{"$ref":"#/components/headers/X-Correlation-Id"},"X-Request-Id":{"$ref":"#/components/headers/X-Request-Id"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"},"examples":{"errorResponseExample":{"$ref":"#/components/examples/ErrorIncidentItemResponseExampleNotFound"}}}}},"UnauthorizedErrorResponse":{"description":"API response in case of unauthorized access.","headers":{"X-Correlation-Id":{"$ref":"#/components/headers/X-Correlation-Id"},"X-Request-Id":{"$ref":"#/components/headers/X-Request-Id"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AuthError"},"examples":{"errorResponseExample":{"$ref":"#/components/examples/UnauthorizedErrorResponse"}}}}},"ErrorResponse":{"description":"API response in case of errors.","headers":{"X-Correlation-Id":{"$ref":"#/components/headers/X-Correlation-Id"},"X-Request-Id":{"$ref":"#/components/headers/X-Request-Id"}},"content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/ErrorResponse"}]}}}}},"examples":{"ErrorResponseExampleInternalServerError":{"value":{"title":"Internal server error","status":500,"code":"E608666","cause":"Internal Server Error","action":"please contact system administrator","correlationId":"895f87ec-5373-4940-b9c0-670f5b8da682"}},"ErrorResponseExampleBadGateway":{"value":{"title":"failed with reason: bad gateway","status":502,"code":"E600002","cause":"Bad Gateway","action":"","correlationId":""}},"ErrorResponseExampleServiceUnavailable":{"value":{"title":"Traffic information failure","status":503,"code":"E608021","cause":"failed to fetch traffic information","action":"try again later or contact system administrator","correlationId":"87a6fe3b-6290-41db-8d79-edf4f4019a74"}},"ErrorResponseExampleGatewayTimeout":{"value":{"title":"failed with reason: gateway timeout","status":504,"code":"E600000","cause":"Gateway Timeout","action":"","correlationId":""}},"ErrorResponseExampleUriTooLong":{"value":{"title":"Malformed request","status":414,"code":"E608045","cause":"Request URI is too long. Actual length is 1001 while maximal allowed is 1000","action":"request must adhere to API specification","correlationId":"SAMPLE_CORRELATION_ID"}},"ErrorIncidentsResponseExampleInvalidRequest":{"value":{"title":"Malformed request","status":400,"code":"E608002","cause":"parameter `in` is missing","action":"request must adhere to API specification","correlationId":"87a6fe3b-6290-41db-8d79-edf4f4019a74"}},"ErrorIncidentsResponseExampleInternalServerError":{"value":{"title":"Internal server error","status":500,"code":"E608666","cause":"Internal Server Error","action":"please contact system administrator","correlationId":"895f87ec-5373-4940-b9c0-670f5b8da682"}},"ErrorResponseExampleServiceUnavailableError":{"value":{"title":"Traffic information failure","status":503,"code":"E608021","cause":"failed to fetch traffic information","action":"try again later or contact system administrator","correlationId":"87a6fe3b-6290-41db-8d79-edf4f4019a74"}},"ErrorFlowResponseExampleInvalidRequest":{"value":{"title":"Malformed request","status":400,"code":"E608002","cause":"parameter `in` is missing","action":"request must adhere to API specification","correlationId":"87a6fe3b-6290-41db-8d79-edf4f4019a74"}},"ErrorFlowResponseExampleInternalServerError":{"value":{"title":"Internal server error","status":500,"code":"E608666","cause":"Internal Server Error","action":"please contact system administrator","correlationId":"895f87ec-5373-4940-b9c0-670f5b8da682"}},"ErrorIncidentItemResponseExampleInvalidId":{"value":{"title":"Malformed request","status":400,"code":"E608039","cause":"Incident id failed validation","action":"request must contain valid incident id","correlationId":"87a6fe3b-6290-41db-8d79-edf4f4019a74"}},"ErrorIncidentItemResponseExampleNotFound":{"value":{"title":"Incident item not found or removed from system","status":404,"code":"E608038","cause":"Incident item for given id not found","action":"request must contain valid incident id","correlationId":"87a6fe3b-6290-41db-8d79-edf4f4019a74"}},"OpenApiResponse":{"value":{"openapi":"3.0.2","info":{"title":"Reference API v2"},"servers":{},"paths":{}}},"UnauthorizedErrorResponse":{"value":{"error":"Unauthorized","error_description":"No credentials found"}}},"requestBodies":{"geospatialFiltersBodyFlow":{"content":{"application/json":{"schema":{"type":"object","properties":{"in":{"$ref":"#/components/schemas/RequestBodyIn"},"locationReferencing":{"description":"The location referencing scheme (or schemes) to be used in the response. Multiple location\nreferencing schemes can be specified separated by commas (`,`).\n\n|Location Referencing | Description |\n|------------------|-------------|\n| `none`           | The response will not contain any location references such as tmc, olr, HMC topology segments or shape points. |\n| `olr`            | Open Location References is a TISA location referencing standard also called TPEGOpenLR. Please visit https://tisa.org/ for more details. TISA Specifications are also published by ISO https://www.iso.org/ Specifications: ISO/TS 21219-22:2017 |\n| `shape`          | Shape points. Defines a location by a series of geo-coordinates. |\n| `tmc`            | Traffic Message Channel (TMC) location referencing method uses tables of pre-coded locations. For details please refer ISO specifications ISO 14819-3:2013 and ISO 14819-2:2013. |\n| `segmentRef`     | Topology Segment references. Defines a location by a series of reference to the HMC Topology Segment. |\n","type":"array","items":{"type":"string","enum":["none","olr","shape","tmc","segmentRef"]},"minItems":1,"uniqueItems":true},"minJamFactor":{"description":"The maximum jam factor value for flow items to be included in the response. All flow items\nwith a _higher_ jam factor than the value specified by the `maxJamFactor` parameter are\nomitted. This parameter can be used by clients that require flow data only for\ncongestion-free roads.\n\nThe values must be in the range `0.0` to `10.0` (inclusive).\n\nDefault: `1.0`\n","type":"number","default":10},"maxJamFactor":{"description":"The minimum jam factor value for flow items to be included in the response. All flow items\nwith a _lower_ jam factor than the value specified by the `minJamFactor` parameter are\nomitted. The parameter can be used by clients that require flow data for congested roadways\nonly.\n\nThe value must be in the range `0.0` to `10.0` (inclusive).\n\nDefault: `0.0`\n","type":"number","default":0},"functionalClasses":{"description":"A list of functional classes separated by commas (`,`), to return results for. The\nfunctional class is used to group roads depending on speed, importance, and\nconnectivity.\n\nFunctional classes are integers from `1` to `5` inclusive where functional class `1` are\nthe most important and functional class `5` are the least important. The table below\ndescribes the roads that fall into each class.\n\n| Functional Class | Description |\n|------------------|-------------|\n| 1                | These roads are meant for high volume, maximum speed traffic between and through major metropolitan areas. There are very few, if any, speed changes. Access to this road is usually controlled. |\n| 2                | These roads are used to channel traffic to Main Roads (functionalClass=1) for travel between and through cities in the shortest amount of time. There are very few, if any speed changes. |\n| 3                | These roads interconnect First Class Roads (2) and provide a high volume of traffic movement at a lower level of mobility than First Class Roads (2). |\n| 4                | These roads provide for a high volume of traffic movement at moderate speeds between neighborhoods. These roads connect with higher Functional Class roads to collect and distribute traffic between neighborhoods. |\n| 5                | These roads' volume and traffic movements are below the level of any other road. |\n","type":"array","items":{"type":"integer","enum":[1,2,3,4,5]}},"advancedFeatures":{"description":"A list of advanced features separated by commas (`,`), to return results for.\n\n| Feature        | Description |\n|----------------|-------------|\n| `deepCoverage` | More complete flow coverage |\n| `lanes`        | Lane level traffic information about lanes designated for High Occupancy Vehicles or at highway forks/splits |\n\n**NOTE:** Advanced features are billed at a separate price point to normal requests. Please\ncontact HERE sales for further details.\n","type":"array","items":{"type":"string","enum":["deepCoverage","lanes"]},"uniqueItems":true},"useRefReplacements":{"description":"Use replacement strings for compact representation of HMC topology segment references.\n","type":"boolean","default":true},"exactSegmentRefMatching":{"description":"Match segment references exactly with catalog versions when the value is set to true.\nCatalog versions are ignored to match when the value is set to false.\n","type":"boolean","default":false}}}}}},"geospatialFiltersBodyIncidents":{"content":{"application/json":{"schema":{"type":"object","properties":{"in":{"$ref":"#/components/schemas/RequestBodyIn"},"locationReferencing":{"description":"The location referencing scheme (or schemes) to be used in the response. Multiple location\nreferencing schemes can be specified separated by commas (`,`).\n\n|Location Referencing | Description |\n|------------------|-------------|\n| `none`           | The response will not contain any location references such as tmc, olr, HMC topology segments or shape points. |\n| `olr`            | Open Location References is a TISA location referencing standard also called TPEGOpenLR. Please visit https://tisa.org/ for more details. TISA Specifications are also published by ISO https://www.iso.org/ Specifications: ISO/TS 21219-22:2017 |\n| `shape`          | Shape points. Defines a location by a series of geo-coordinates. |\n| `tmc`            | Traffic Message Channel (TMC) location referencing method uses tables of pre-coded locations. For details please refer ISO specifications ISO 14819-3:2013 and ISO 14819-2:2013. |\n| `segmentRef`     | Topology Segment references. Defines a location by a series of reference to the HMC Topology Segment. |\n","type":"array","items":{"type":"string","enum":["none","olr","shape","tmc","segmentRef"]},"minItems":1,"uniqueItems":true},"functionalClasses":{"description":"A list of functional classes separated by commas (`,`), to return results for. The\nfunctional class is used to group roads depending on speed, importance, and\nconnectivity.\n\nFunctional classes are integers from `1` to `5` inclusive where functional class `1` are\nthe most important and functional class `5` are the least important. The table below\ndescribes the roads that fall into each class.\n\n| Functional Class | Description |\n|------------------|-------------|\n| 1                | These roads are meant for high volume, maximum speed traffic between and through major metropolitan areas. There are very few, if any, speed changes. Access to this road is usually controlled. |\n| 2                | These roads are used to channel traffic to Main Roads (functionalClass=1) for travel between and through cities in the shortest amount of time. There are very few, if any speed changes. |\n| 3                | These roads interconnect First Class Roads (2) and provide a high volume of traffic movement at a lower level of mobility than First Class Roads (2). |\n| 4                | These roads provide for a high volume of traffic movement at moderate speeds between neighborhoods. These roads connect with higher Functional Class roads to collect and distribute traffic between neighborhoods. |\n| 5                | These roads' volume and traffic movements are below the level of any other road. |\n","type":"array","items":{"type":"integer","enum":[1,2,3,4,5]}},"criticality":{"description":"The severity of the incident that has occured, with the following possible values: low (least severe), minor, major, and critical (most severe).\nA list of criticality values separated by commas (`,`), to return results for.\n","type":"array","items":{"type":"string","enum":["low","minor","major","critical"]}},"type":{"description":"A list of incident type values separated by commas (`,`), to return results for.\n\n| Type              | Description |\n|-------------------|-------------|\n| `accident`        | | Indicates that there has been a collision\n| `construction`    | | Indicates that building or roadworks are taking place\n| `congestion`      | | Indicates that there has been a build up of vehicles\n| `disabledVehicle` | | Indicates that a vehicle is unable to move and is obstructing the road\n| `massTransit`     | | Indicates that a large amount of people are migrating from one location to another\n| `plannedEvent`    | | Indicates that an organised event is taking place causing disruption\n| `roadHazard`      | | Indicates that there are dangerous objects on the surface of the road\n| `roadClosure`     | | Indicates that the road has been closed, e.g. police presence\n| `weather`         | | Indicates that weather conditions are causing disruptions\n| `laneRestriction` | | Indicates that some of the lanes have access restrictions\n| `other`           | | Indicates that an incident not explainable with the types above has occurred\n","type":"string"},"earliestStartTime":{"$ref":"#/components/schemas/Time"},"latestEndTime":{"$ref":"#/components/schemas/Time"},"lang":{"description":"The language to be used for the incident descriptions. Parameter value must follow\nspecification: BCP47. Supported values are available on  [iana.org](https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry)\n","type":"string"},"units":{"description":"Units of measurement to be used in incident descriptions.\nThe default is metric.\n","type":"string","enum":["metric","imperial"],"default":"metric"},"useRefReplacements":{"description":"Use replacement strings for compact representation of HMC topology segment references.\n","type":"boolean","default":true},"exactSegmentRefMatching":{"description":"Match segment references exactly with catalog versions when the value is set to true.\nCatalog versions are ignored to match when the value is set to false.\n","type":"boolean","default":false}}}}}},"geospatialFiltersBodyIncidentsId":{"content":{"application/json":{"schema":{"type":"object","properties":{"locationReferencing":{"description":"The location referencing scheme (or schemes) to be used in the response. Multiple location\nreferencing schemes can be specified separated by commas (`,`).\n\n|Location Referencing | Description |\n|------------------|-------------|\n| `none`           | The response will not contain any location references such as tmc, olr, HMC topology segments or shape points. |\n| `olr`            | Open Location References is a TISA location referencing standard also called TPEGOpenLR. Please visit https://tisa.org/ for more details. TISA Specifications are also published by ISO https://www.iso.org/ Specifications: ISO/TS 21219-22:2017 |\n| `shape`          | Shape points. Defines a location by a series of geo-coordinates. |\n| `tmc`            | Traffic Message Channel (TMC) location referencing method uses tables of pre-coded locations. For details please refer ISO specifications ISO 14819-3:2013 and ISO 14819-2:2013. |\n| `segmentRef`     | Topology Segment references. Defines a location by a series of reference to the HMC Topology Segment. |\n","type":"array","items":{"type":"string","enum":["none","olr","shape","tmc","segmentRef"]},"minItems":1,"uniqueItems":true},"lang":{"description":"The language to be used for the incident descriptions. Parameter value must follow\nspecification: BCP47. Supported values are available on  [iana.org](https://www.iana.org/assignments/language-subtag-registry/language-subtag-registry)\n","type":"string"},"units":{"description":"Units of measurement to be used in incident descriptions.\nThe default is metric.\n","type":"string","enum":["metric","imperial"],"default":"metric"},"useRefReplacements":{"description":"Use replacement strings for compact representation of HMC topology segment references.\n","type":"boolean","default":true}}}}}}}}}