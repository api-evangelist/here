{"openapi":"3.0.2","info":{"title":"Fuel Prices API v3","version":"3.1.0","description":"What is the Fuel Prices API?  \n\nThe HERE Fuel Prices API is a RESTful API that: \n\n- provides dynamic data on the price of fuel at fuel stations within a specified area and filtered by desired fuel type\n- provides lists of fuel stations within a specified area, including data on fuel types available, prices and location\n- provides data such as fuel prices and location information for individual fuel stations\n- provides a price index for a specified geometry that ranks the fuel stations using current prices and statistically-modelled prices where the price data is unavailable\n\nWhy use the Fuel Prices API?\n\nThe Fuel Prices API provides solutions for the following high level use cases.\n\n- Show lists of fuel stations with information on location and prices along a planned route or based on a location\n- Allow the user to sort fuel stations based on the price index\n"},"security":[{"Bearer":[]},{"ApiKey":[]}],"tags":[{"name":"Fuel stations","description":"Search fuel stations"},{"name":"Fuel types and brands","description":"Get available fuel types and brands"},{"name":"API Information","description":"API Information"}],"paths":{"/stations":{"get":{"tags":["Fuel stations"],"summary":"Fuel stations search","description":"Retrieves fuel stations within geospatial area","operationId":"Fuel Prices API v3 fuelStationsSearch","parameters":[{"$ref":"#/components/parameters/X-Request-Id"},{"$ref":"#/components/parameters/in"},{"$ref":"#/components/parameters/fuelType"},{"$ref":"#/components/parameters/limit"},{"$ref":"#/components/parameters/offset"},{"$ref":"#/components/parameters/sort"},{"$ref":"#/components/parameters/brands"},{"$ref":"#/components/parameters/returnAllStations"},{"$ref":"#/components/parameters/iconSize"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-Id":{"$ref":"#/components/headers/X-Correlation-Id"},"X-Request-Id":{"$ref":"#/components/