ed. They are\ntraversed in the order they are specified in the request.\n","type":"array","items":{"$ref":"#/components/schemas/Passthrough"}},"summary":{"description":"Total value of key attributes (e.g. duration, length) summed up for the entire section, including `preActions`, `postActions`,\nand the travel portion of the section.\n","allOf":[{"$ref":"#/components/schemas/PedestrianSummary"}]},"travelSummary":{"description":"Total value of key attributes (e.g., duration, length) summed up for just the travel portion of the section,\nbetween `departure` and `arrival`. `preActions` and `postActions` are excluded.\n","allOf":[{"$ref":"#/components/schemas/BaseSummary"}]},"polyline":{"$ref":"#/components/schemas/Polyline"},"notices":{"description":"Contains a list of issues related to this section of the route.\n","type":"array","items":{"$ref":"#/components/schemas/PedestrianNotice"}},"transport":{"$ref":"#/components/schemas/PedestrianTransport"},"spans":{"description":"Spans attached to a `Section` describing pedestrian content.\n","type":"array","items":{"$ref":"#/components/schemas/PedestrianSpan"}},"refReplacements":{"$ref":"#/components/schemas/RefReplacements"}},"required":["id","type","departure","arrival","transport"]},"VehicleSection":{"type":"object","description":"Represent a section of a route","properties":{"id":{"description":"Unique identifier of the section","type":"string"},"type":{"description":"Section type used by the client to identify what extension to the BaseSection are available.","type":"string","enum":["vehicle"]},"preActions":{"description":"Actions that must be done prior to `departure`.","type":"array","items":{"$ref":"#/components/schemas/BaseAction"}},"actions":{"description":"Actions to be performed at or during a specific portion of a section.\n\nAction offsets represent the coordinate index in the polyline.\n\n*NOTE:* The following attributes are valid for turnByTurnActions only and are not populated for actions\n  * currentRoad\n  * nextRoad\n  * exitSign\n  * signPost\n  * intersectionName\n  * turnAngle\n","type":"array","items":{"$ref":"#/components/schemas/VehicleAction"}},"language":{"description":"Language of the localized strings in the section, if any, in BCP47 format.","type":"string"},"postActions":{"description":"Actions that must be done after `arrival`.","type":"array","items":{"$ref":"#/components/schemas/VehiclePostAction"}},"turnByTurnActions":{"description":"Turn-by-turn guidance actions.\n\nAction offsets represent the coordinate index in the polyline.\n","type":"array","items":{"$ref":"#/components/schemas/VehicleAction"}},"departure":{"$ref":"#/components/schemas/VehicleDeparture"},"arrival":{"$ref":"#/components/schemas/VehicleDeparture"},"passthrough":{"description":"List of via waypoints this section is passing through.\n\nEach via waypoint of the request that is a `passThrough=true` waypoint, appears as a\n`Passthrough` in the response. It appears in the section that starts with the closest\nnon-passthrough via specified before it or origin.\n\nThe passthrough vias appear in this list in the order they are traversed. They are\ntraversed in the order they are specified in the request.\n","type":"array","items":{"$ref":"#/components/schemas/Passthrough"}},"summary":{"description":"The total value of key attributes, such as duration, length, and consumption, summed up for the entire section, including `preActions`, `postActions`, and the travel portion of the section.\n","allOf":[{"$ref":"#/components/schemas/VehicleSummary"}]},"travelSummary":{"description":"The total value of key attributes, such as duration, length, and consumption, summed up only for the travel portion of the section,\nbetween `departure` and `arrival`. `preActions` and `postActions` are excluded.\n","allOf":[{"$ref":"#/components/schemas/VehicleTravelSummary"}]},"polyline":{"$ref":"#/components/schemas/Polyline"},"notices":{"description":"Contains a list of issues related to this section of the route.\n\nNotices must be carefully evaluated and, if deemed necessary, the route section should be discarded accordingly.\nIn particular, the user should be aware that new notice codes may be added at any time. If an unrecognized\nnotice code appears with a `critical` severity level, the route section must be discarded.\nPlease refer to the `code` attribute for possible values.\n","type":"array","items":{"$ref":"#/components/schemas/VehicleNotice"}},"spans":{"description":"Spans attached to a `Section` describing vehicle content.\n","type":"array","items":{"$ref":"#/components/schemas/VehicleSpan"}},"routingZones":{"description":"A list of routing zones that are applicable to the section.\n\nElements of this list will be referenced by indexes within the `span` attribute of the section.\n","type":"array","items":{"$ref":"#/components/schemas/RoutingZone"}},"truckRoadTypes":{"description":"A list of truck road types that are applicable to the section.\n\nElements of this list will be referenced by indexes within the `span` attribute of the section.\n\nA truck road type is an identifier associated with roads that have additional regulations applied by local administration for\ntraversal by heavy vehicles like trucks. For example, the BK Bearing Class regulations in Sweden, and ET categories in Mexico.\nThe identifiers of supported truck road types are specified at HERE Map Content\n[TruckRoadType](https://docs.here.com/map-content/docs/truckroadtypeattribute).\n\nThese names should be provided when avoiding a certain truck road type.\n","type":"array","items":{"type":"string"}},"incidents":{"description":"A list of all incidents that apply to the section.","type":"array","items":{"$ref":"#/components/schemas/TrafficIncident"}},"refReplacements":{"$ref":"#/components/schemas/RefReplacements"},"tollSystems":{"description":"An array of toll authorities that collect payments for the use of (part of) the specified section of the route.\n","type":"array","items":{"$ref":"#/com