{"openapi":"3.0.2","info":{"title":"Fuel Prices API v2","version":"2.1.0","description":"What is the Fuel Prices API?  \n\nThe HERE Fuel Prices API is a RESTful API that:\n\n- provides dynamic data on the price of fuel at fuel stations within a specified area and filtered by desired fuel type\n- provides lists of fuel stations within a specified area, including data on fuel types available, prices and location\n- provides data such as fuel prices and location information for individual fuel stations\n- provides a price index for a specified geometry that ranks the fuel stations using current prices and statistically-modelled prices where the price data is unavailable\n\nWhy use the Fuel Prices API?\n\nThe Fuel Prices API provides solutions for the following high level use cases.\n\n- Show lists of fuel stations with information on location and prices along a planned route or based on a location\n- Allow the user to sort fuel stations based on the price index\n"},"externalDocs":{"description":"The developer guide and related API references are available here.","url":"https://www.here.com/docs/category/fuel-prices"},"security":[{"Bearer":[]}],"tags":[{"name":"Fuel stations","description":"Search fuel stations"},{"name":"Fuel types and brands","description":"Get available fuel types and brands"},{"name":"API Information","description":"API Information"}],"paths":{"/fuel/stations":{"get":{"tags":["Fuel stations"],"summary":"Fuel stations search","description":"Retrieves fuel stations within geospatial area","operationId":"Fuel Prices API v2 fuelStationsSearch","parameters":[{"name":"prox","in":"query","description":"A circular search area defined by the latitude and longitude of its center (compliant with WGS 84) and an integer representing the radius of the area in meters, all separated by commas.","required":false,"schema":{"type":"string"}},{"name":"bbox","in":"query","description":"Bounding box defined by the latitude and longitude (compliant with WGS 84) of its top left and bottom right corners. The top left and bottom right pairs are separated by a semicolon and the latitude and longitude pairs are separated by commas.","required":false,"schema":{"type":"string"}},{"name":"corridor","in":"query","description":"A strip defined as a semicolon-separated list of points (pairs of comma-separated latitude and longitude WGS 84","required":false,"schema":{"type":"string"}},{"name":"corridorwidth","in":"query","description":"The width of the corridor in meters. This parameter takes effect only if corridor are included in the request.","required":false,"schema":{"type":"integer","format":"int32","default":5000}},{"name":"fueltype","in":"query","description":"An integer identifying the fuel type or category included in the response.\nAvailable types (all can be retrieved from `/fuel/fueltypes` endpoint):\n|Fuel type ID|Name|\n|---|---|\n|-1|All Truck Diesel|\n|-2|All Diesel\n|-3|All Petrol\"\n|-4|All LPG|\n|-5|All CNG|\n|-6|All Ethanol|\n|-7|All Methanol|\n|-8|All Additives|\n|1|Diesel|\n|2|Regular|\n|3|Mid-grade|\n|4|Premium|\n|5|E-85|\n|6|Bio-Diesel|\n|7|Bio-Diesel 10|\n|8|Bio-Diesel 15|\n|9|Bio-Diesel 20|\n|10|Diesel plus|\n|11|Truck-Diesel|\n|12|Red-Diesel|\n|13|E-10|\n|14|LPG-GLP|\n|15|LRP|\n|16|Methane|\n|17|Midgrade-self|\n|18|Diesel-self|\n|19|AdBlue|\n|20|V-Power-95|\n|21|CNG|\n|22|Ethanol|\n|23|Ethanol w. additives|\n|24|GPL self|\n|25|Premium self|\n|26|Leaded Four|\n|27|Super Unleaded|\n|28|Super Unleaded Ultimate|\n|29|Diesel-plus self|\n|30|Methanol self|\n|31|Mid-grade E10|\n|32|Super-Diesel|\n|33|Unleaded E5|\n|34|Unleaded E25|\n|35|Unleaded|\n|36|Unleaded 91|\n|37|Unleaded 93|\n|38|Unleaded 97|\n|39|Unleaded 99|\n|40|Unleaded 100|\n|41|Unleaded 102|\n|42|Methanol|\n|43|Unleaded E10|\n|44|Shell V-Power Racing|\n|45|Shell V-Power 100|\n|46|Shell V-Power Diesel|\n|47|Aral Ultimate 102|\n|48|Aral Ultimate Diesel|\n|49|BP Ultimate Super|\n|50|BP Ultimate Diesel|\n|51|Blue One 95|\n|52|Diesel Cleanline|\n|53|Super E5|\n|54|Super E10|\n|55|Premium Diesel|\n|56|Unleaded 95|\n|57|Simple gasoline|\n|58|Simple diesel|\n|59|Super Unleaded 98|\n|60|Unleaded 98|\n|61|Premium gasoline|\n|62|Synergy Supreme+ Diesel|\n|63|Supreme Diesel|\n|64|Unleaded 92|\n|65|Unleaded 80|\n|66|Super Unleaded 95|\n|67|Super Unleaded 92|\n|68|LNG|\n|69|Super E5 Premium|\n|70|Heating oil|\n|71|AdBlue Car|\n|72|AdBlue Truck|\n|73|Hydrotreated vegetable oil|\n|74|Hydrogen|\n|75|E-85 cash (US ONLY)|\n|76|Diesel cash (US ONLY)|\n|77|Mid-grade cash (US ONLY)|\n|78|Regular cash (US ONLY)|\n|79|Regular clear - without ethanol (US ONLY)|\n|80|Premium cash (US ONLY)|\n|81|Two stroke petrol|\n|82|Unleaded 87|\n|83|Unleaded 89|\n|84|GTL - Gas to liquid fuel|\n|85|HVO 30 - Diesel with 30% of hydrotreated vegetable oil|\n|86|Premium Diesel cash|\n|87|Red-Diesel cash|\n|88|Bio-Diesel 20 cash|\n|89|Super E15|\n|90|Heating oil cash|\n|91|AdBlue cash|\n|92|AdBlue Truck cash|\n|93|Bio-Diesel cash|\n|94|Bio-Diesel 10 cash|\n|95|LPG-GLP cash|\n|96|CNG cash|\n|97|Truck Diesel cash|\n","required":false,"schema":{"type":"integer","format":"int32"}},{"name":"maxresults","in":"query","description":"The maximum number of results a response can contain. This parameter together with the offset parameter in the query and HasMore in the response can be used for pagination.","required":false,"schema":{"type":"integer","format":"int32","default":50}},{"name":"offset","in":"query","description":"A value specifying the index of the first result. This parameter together with the maxresults parameter in the query and HasMore in the response can be used for pagination.","required":false,"schema":{"type":"integer","format":"int32","default":0}},{"name":"sortkey","in":"query","description":"Criteria for sorting a list of search results.","required":false,"schema":{"type":"string","enum":["price","distance"]}},{"name":"sortorder","in":"query","description":"The sort order of the results.","required":false,"schema":{"type":"string","enum":["asc","desc"]}},{"name":"brand","in":"query","description":"|\nList of brands to filter the stations in the response. The brand names in the list are separated with commas.\nThe result will contain only the stations that have brand field that match to the one of those specified in the list.\nThe matching is caseinsensitive.\nList of brands can be retireved using `/fuel/fuelbrands` endpoint\n","required":false,"explode":false,"schema":{"type":"array","items":{"type":"string"}}},{"name":"showallstations","in":"query","description":"Also fuel stations with unknown price or fuel type information will be included in the result set. This parameter works together with fueltype parameter.","required":false,"schema":{"type":"boolean","default":false}},{"name":"imagedimensions","in":"query","description":"Request specific maximum size of brand icon image to match UI and bandwidth requirements The format is that specifies dimension for a scaled image by providing either the desired width, desired heigh, or both","example":"w20-h20","required":false,"schema":{"type":"string"}},{"$ref":"#/components/parameters/X-Request-Id"}],"responses":{"200":{"description":"OK","headers":{"X-Correlation-Id":{"$ref":"#/components/headers/X-Correlation-Id"},"X-Request-Id":{"$ref":"#/components/headers/X-Request-Id"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/FuelStationsResult"}},"application/xml":{"schema":{"$ref":"#/components/schemas/FuelStationsResult"}}}},"400":{"description":"Invalid parameters were provided","headers":{"X-Correlation-Id":{"$ref":"#/components/headers/X-Correlation-Id"},"X-Request-Id":{"$ref":"#/components/headers/X-Request-Id"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}},"application/xml":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"$ref":"#/components/responses/Error401Response"},"403":{"$ref":"#/components/responses/Error403Response"},"429":{"$ref":"#/components/responses/Error429Response"},"500":{"$ref":"#