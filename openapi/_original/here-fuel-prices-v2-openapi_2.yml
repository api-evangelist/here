"50664035","description":"PVID identifier.","xml":{"attribute":true}},"lastUpdateTimestamp":{"type":"string","format":"datetime","example":"2020-04-23T14:32:20.371Z","description":"Timestamp of the last update of information about this POI by the content supplier. Represents a datetime in ISO 8601 format. If time is UTC, 'Z' is added directly after the time without a space (e.g. 2014-01-14T10:00Z). Otherwise, time offsets from UTC is added after time in format Â±[hh][mm] (e.g. 2014-01-14T10:00:00+0100)","xml":{"attribute":true}},"timeZone":{"type":"string","example":"Europe/Berlin","description":"Time zone of the POI. Represents the standard denominator of the time zone.","xml":{"attribute":true}},"name":{"type":"string","example":"Shell","description":"Fuel station name"},"brand":{"type":"string","example":"Shell","description":"Fuel station brand"},"brandIcon":{"type":"string","example":"https://download.vcdn.cc.data.here.com/p/d/autox/pr/icons/2015-09-11/shell.png","description":"Link to fuel station brand icon"},"distance":{"type":"integer","format":"int32","example":125,"description":"Air distance to the station in meters from given location"},"open24x7":{"type":"boolean","example":true,"description":"Boolean value indicating if the fuel station is open 24 hours a day."},"address":{"$ref":"#/components/schemas/AddressType"},"contacts":{"$ref":"#/components/schemas/ContactType"},"position":{"$ref":"#/components/schemas/PositionType"},"entrancePosition":{"$ref":"#/components/schemas/PositionType"},"fuelPrice":{"type":"array","items":{"$ref":"#/components/schemas/FuelPriceType"}},"stationDetails":{"$ref":"#/components/schemas/FuelStationDetailType"}}},"AddressType":{"type":"object","description":"Fuel station address","properties":{"city":{"type":"string","example":"Berlin","description":"City name"},"street":{"type":"string","example":"Sonnenallee","description":"Street name of the fuel station"},"streetNumber":{"type":"string","example":"56","description":"House number of the fuel station"},"region":{"type":"string","example":"Berlin","description":"Region"},"district":{"type":"string","example":"Mitte","description":"District"},"country":{"type":"string","example":"DEU","description":"ISO 3166 3-lettre country code"},"postalCode":{"type":"string","example":"12045","description":"Postal code"},"unparsedAddress":{"type":"string","example":"Sonnenallee 56 Berlin 12045 DEU","description":"The string with unparsed address"}}},"ContactType":{"type":"object","description":"Fuel station contacts","properties":{"phone":{"type":"array","items":{"$ref":"#/components/schemas/KeyValueType"},"example":[{"value":"+49306811313","label":"PHONE"}]},"fax":{"type":"array","items":{"$ref":"#/components/schemas/KeyValueType"},"example":[{"value":"+493068893007","label":"FAX"}]},"email":{"type":"array","items":{"$ref":"#/components/schemas/KeyValueType"},"example":[{"value":"shellcustomercare@shell.com","label":"EMAIL"}]},"website":{"type":"array","items":{"$ref":"#/components/schemas/KeyValueType"},"example":[{"value":"https://find.shell.com/de/fuel/10024324-berlin-karl-marx-str","label":"WEBADDRESS"}]}}},"PositionType":{"type":"object","description":"WGS84 format co-ordinates for the fuel station","properties":{"latitude":{"type":"number","format":"double","example":52.48468,"description":"Latitude in WGS84 format of the fuel station."},"longitude":{"type":"number","format":"double","example":13.42942,"description":"Longitude in WGS84 format of the fuel station."}}},"FuelPriceType":{"type":"object","description":"Information on the prices for fuels at the station.","properties":{"price":{"type":"number","format":"double","example":1.169,"description":"Real-time price for the fuel."},"errorMargin":{"type":"number","format":"double","example":0.038,"description":"The difference between estimated and real-time prices averaged over all reported fuel prices for the specified fuel type and for this particular station and rounded to the nearest hund