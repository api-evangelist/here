d in the request, one is generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.","example":"cb72fb52-9efa-11e7-abc4-cec278b6b50a"}}},"Response400":{"type":"object","properties":{"title":{"type":"string","description":"The reason why validation failed. The possible reasons are: Input data failed validation, Message processing error, No handler found","example":"Input data failed validation"},"status":{"type":"string","description":"An HTTP status code.","example":"400"},"code":{"type":"string","description":"Ingestion code E221 + XXX where XXX is an ingestion-specific error number or 000 for general errors. Possible values include: E221000 - Generic error; E221001 - Layer for provided App ID is not found.","example":"E221000"},"cause":{"type":"string","description":"A description of the cause of the error.","example":"Missing request header Authorization-Claims for method parameter of type AuthClaims"},"action":{"type":"string","description":"An action that could possibly solve the issue.","example":"Check request for correctness"},"correlationId":{"type":"string","description":"A unique ID for the request. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response.  You can use this ID to track your request.","example":"a739c6e7-cbb6-43d8-bb94-377a2db6439e"},"traceId":{"type":"string","description":"A unique ID for the message. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.","example":"c0d3ebd4-8768-4191-95d6-e5a5dda88f14"}}},"Response404":{"type":"object","properties":{"title":{"type":"string","description":"A general description of the error. Possible values include: Input data failed validation, Message processing error, No handler found.","example":"No handler found"},"status":{"type":"string","description":"An HTTP status code.","example":"404"},"code":{"type":"string","description":"Ingestion code E221 + XXX where XXX is an ingestion-specific error number or 000 for general errors. Possible values include: E221000 - Generic error; E221001 - Layer for provided App ID is not found.","example":"E221000"},"cause":{"type":"string","description":"A description of the cause of the error.","example":"No handler found for POST /not_existing_endpoint/v1/catalogs/a-catalog/layers/data"},"action":{"type":"string","description":"An action that could possibly solve the issue.","example":"Check request for correctness"},"correlationId":{"type":"string","description":"A unique ID for the request. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response.  You can use this ID to track your request.","example":"a739c6e7-cbb6-43d8-bb94-377a2db6439e"},"traceId":{"type":"string","description":"A unique ID for the message. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.","example":"c0d3ebd4-8768-4191-95d6-e5a5dda88f14"}}},"Response415":{"type":"object","properties":{"title":{"type":"string","description":"A general description of the error. Possible values include: Input data failed validation; Message processing error; No handler found.","example":"No handler found"},"status":{"type":"string","description":"An HTTP status code.","example":"415"},"code":{"type":"string","description":"Ingestion code E221 + XXX where XXX is an ingestion-specific error number or 000 for general errors. Possible values include: E221000 - Generic error; E221001 - Layer for provided App ID is not found.","example":"E221000"},"cause":{"type":"string","description":"A description of the cause of the error.","example":"Invalid mime type \"wrongMediaType\": does not contain '/'"},"action":{"type":"string","description":"Actions to take to possibly solve the issue.","example":"Check request for correctness"},"correlationId":{"type":"string","description":"A unique ID for the request. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response.  You can use this ID to track your request.","example":"a739c6e7-cbb6-43d8-bb94-377a2db6439e"},"traceId":{"type":"string","description":"A unique ID for the message. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.","example":"c0d3ebd4-8768-4191-95d6-e5a5dda88f14"}}},"Response413":{"type":"object","properties":{"title":{"type":"string","description":"A general description of the error.","example":"Request Body Too Large"},"status":{"type":"string","description":"An HTTP status code.","example":"413"},"code":{"type":"string","description":"Ingestion code E221 + XXX where XXX is an ingestion-specific error number.","example":"E221002"},"cause":{"type":"string","description":"A description of the cause of the error.","example":"Body of request is over than 20Mb"},"action":{"type":"string","description":"Actions to take to possibly solve the issue.","example":"Please reduce body size to be lower than 20Mb"},"correlationId":{"type":"string","description":"Empty as request is terminated on Sentry nginx.","example":""}}},"Response500":{"type":"object","properties":{"title":{"type":"string","description":"A general description of the error. Possible values include: Input data failed validation; Message processing error; No handler found.","example":"Message processing error"},"status":{"type":"string","description":"An HTTP status code.","example":"500"},"code":{"type":"string","description":"Ingestion code E221 + XXX where XXX is an ingestion-specific error number or 000 for general errors. Possible values include: E221000 - Generic error; E221001 - Layer for provided App ID is not found.","example":"E221000"},"cause":{"type":"string","description":"A description of the cause of the error.","example":"Internal Server Error"},"action":{"type":"string","description":"Actions to take to possibly solve the issue.","example":"Try again later"},"correlationId":{"type":"string","description":"A unique ID for the request. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response.  You can use this ID to track your request.","example":"a739c6e7-cbb6-43d8-bb94-377a2db6439e"},"traceId":{"type":"string","description":"A unique ID for the message. This can be a user-defined trace ID included in the request. If a trace ID was not included in the request, one is generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.","example":"c0d3ebd4-8768-4191-95d6-e5a5dda88f14"}}},"PublishPartition":{"required":["partition"],"type":"object","properties":{"partition":{"type":"string","description":"A key that specifies the partition that the content is related to. It is required. If the layer's partitioning scheme is set to `heretile`, the partition key is the tile key. The maximum length of the partition key is 500 characters. Partition field is used as a `key` field within Kafka message.","example":"314010583"},"checksum":{"type":"string","description":"The checksum of the content when published to Blob API. The algorithm used to calculate the checksum is user specific which is defined in catalog configuration for the layer. Algorithms that you can use are, for example, MD5 or SHA1. This is not a secure hash, so you should only use it to detect changes in content. Checksum is passed as `dsChecksum` kafka record header.","format":"[0-9a-fA-F]+","example":"ff7494d6f17da702862e550c907c0a91"},"compressedDataSize":{"type":"integer","description":"The compressed size in bytes of the content published to Blob API. Applicable when Content-Encoding is set to gzip when uploading and downloading data in the Blob API. CompressedDataSize is passed as `dsCompressedDataSize` kafka record header.","format":"int64","example":152417},"dataSize":{"type":"integer","description":"The nominal size in bytes of the content published to Blob API. When compression is enabled, this is the size of the uncompressed content. DataSize is passed as `dsDataSize` kafka record header.","format":"int64","example":250110},"data":{"pattern":"^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$","type":"string","description":"The content published directly in the metadata and encoded in base64. The size of the content is limited to 1MB before base64 encryption. Either `data` or `dataHandle` must be present. Data is passed as `value` field kafka record.","format":"byte","example":"c3RyZWFtIGxheWVyIHBheWxvYWQ="},"dataHandle":{"type":"string","description":"The handle created when uploading the content to the Blob API, that is used to retrieve the content at a later stage. Either `data` or `dataHandle` must be present. DataHandle is passed as `dsDataHandle` kafka record header.","example":"1b2ca68f-d4a0-4379-8120-cd025640510c"},"timestamp":{"type":"integer","description":"The timestamp of the content, in milliseconds since the Unix epoch. The format of the timestamp is user specific. If the content contains multiple elements each having its own timestamp, we recommend setting the metadata timestamp to the earliest of them. This field if present is used as kafka record timestamp.","format":"int64","example":1648139982000},"crc":{"type":"string","description":"User provided CRC of the partition data in bytes. Should be lowercase. Crc is passed as `dsCrc` kafka record header.","example":"c3f276d7"}},"description":"Metadata describing the partition being published."},"PublishPartitions":{"type":"object","properties":{"partitions":{"type":"array","description":"Array of partitions.","items":{"$ref":"#/components/schemas/PublishPartition"}}}}},"securitySchemes":{"Bearer":{"type":"http","scheme":"bearer","bearerFormat":"JWT","description":"A token obtained from a separate endpoint using client credentials and an OAuth 1.0a HMAC-SHA256 signed request.\n\nFor more information on how to get a bearer token, see the [Identity & Access Management Guide](https://www.here.com/docs/bundle/identity-and-access-management-developer-guide/page/README.html).\n"}}}}