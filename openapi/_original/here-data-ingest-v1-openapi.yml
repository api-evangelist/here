{"openapi":"3.0.1","info":{"title":"Ingest API v1","description":"The `ingestion` service provides the way to submit data to stream layers using REST API.","contact":{},"version":"1.1.3","x-olp-service":{"name":"ingest","version":"v1"}},"externalDocs":{"description":"The developer guide and related API references are available here.","url":"https://www.here.com/docs/category/data-api"},"servers":[{"url":"https://use.apilookup.for.a.base.url/"}],"security":[{"Bearer":[]}],"tags":[{"name":"ingestion","description":"A generic data endpoint to send any kind of data to stream layers. See [Publish Data to a Stream layer](href=\"https://www.here.com/docs/bundle/data-api-developer-guide/page/rest/publishing-data-stream.html)."},{"name":"CORS","description":"Endpoints for Cross-Origin Resource Sharing (CORS)"}],"paths":{"/layers/{layerId}":{"options":{"tags":["CORS"],"summary":"CORS support for the endpoint for ingesting generic data","description":"Enable CORS by returning correct headers","operationId":"Ingest API v1 ingestDataCors","parameters":[{"name":"layerId","in":"path","description":"The ID of the layer where you want the data ingested.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Default response for CORS method","headers":{"Access-Control-Allow-Headers":{"schema":{"type":"string"}},"Access-Control-Allow-Methods":{"schema":{"type":"string"}},"Access-Control-Allow-Origin":{"schema":{"type":"string"}}}}}},"post":{"tags":["ingestion"],"summary":"Endpoint for ingesting generic data","description":"Sends streaming data to a specified layer in the HERE platform","operationId":"Ingest API v1 ingestData","parameters":[{"name":"layerId","in":"path","description":"The ID of the layer where you want the data ingested.","required":true,"schema":{"type":"string"}},{"name":"X-HERE-Checksum","in":"header","description":"A base64 encoded SHA-256 hash you can provide for validation against the calculated value on the request body hash. This verifies the integrity of your request and prevents modification by a third party.It will be created by the service if not provided. A SHA-256 hash consists of 256 bits or 64 chars.","schema":{"type":"string"}},{"name":"X-HERE-TraceId","in":"header","description":"A unique message ID, such as a UUID. This can be included in the request if you want to use an ID that you define. If you do not include an ID, one will be generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.","schema":{"type":"string"}},{"name":"X-HERE-Message-Key","in":"header","description":"A unique message ID, such as a UUID. This can be included in the request if you want to use an ID that you define. If you do not include an ID, X-HERE-TraceId will be used instead. You can use this ID to specify the partition for the message in the data catalog.","schema":{"type":"string"}},{"name":"billingTag","in":"query","description":"Optional billing tag provided by customer. It will be used in grouping of billing records.","schema":{"type":"string"}}],"requestBody":{"description":"A byte array of data to send to the HERE platform for ingestion. The maximum size is 20 MB. Decode the example from base64 before using.","content":{"application/octet-stream":{"schema":{"type":"string","format":"binary","example":""}}},"required":true},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResponseOkSingle"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response400"}}}},"401":{"description":"Unauthorized","content":{}},"404":{"description":"No handler found","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response404"}}}},"413":{"description":"Payload Too Large","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response413"}}}},"415":{"description":"Unsupported Media Type","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response415"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response500"}}}}},"x-olp-access-type":"resource","x-codegen-request-body-name":"byteArray"}},"/layers/{layerId}/partitions":{"options":{"tags":["CORS"],"summary":"CORS support for sending a list of partitions to a stream layer","description":"Enable CORS by returning correct headers","operationId":"Ingest API v1 ingestPartitionsCors","parameters":[{"name":"layerId","in":"path","description":"The ID of the layer where you want the data ingested.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Default response for CORS method","headers":{"Access-Control-Allow-Headers":{"schema":{"type":"string"}},"Access-Control-Allow-Methods":{"schema":{"type":"string"}},"Access-Control-Allow-Origin":{"schema":{"type":"string"}}}}}},"post":{"tags":["ingestion"],"summary":"Send a list of partitions to a stream layer","description":"Upload partitions to the given layer. For better performance batch your partitions (e.g. 1000 per request), rather than uploading them individually.","operationId":"Ingest API v1 ingestPartitions","parameters":[{"name":"layerId","in":"path","description":"The ID of the layer where you want the data ingested.","required":true,"schema":{"type":"string"}},{"name":"X-HERE-TraceId","in":"header","description":"A unique message ID, such as a UUID. This can be included in the request if you want to use an ID that you define. If you do not include an ID, one will be generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog. X-HERE-TraceId is passed as `dsTraceId` kafka record header.","schema":{"type":"string"}},{"name":"billingTag","in":"query","description":"Optional billing tag provided by customer. It will be used in grouping of billing records.","schema":{"type":"string"}}],"requestBody":{"description":"Publication partitions. Data and DataHandle fields cannot be populated at the same time. See Partition object for more details on body fields","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PublishPartitions"}}},"required":true},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResponseOk"}}}},"400":{"description":"Bad Request","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response400"}}}},"401":{"description":"Unauthorized","content":{}},"404":{"description":"No handler found","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response404"}}}},"413":{"description":"Payload Too Large","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response413"}}}},"415":{"description":"Unsupported Media Type","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response415"}}}},"500":{"description":"Internal Server Error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Response500"}}}}},"x-olp-access-type":"resource","x-codegen-request-body-name":"body"}},"/layers/{layerId}/sdiiMessageList":{"options":{"tags":["CORS"],"summary":"CORS support for sending a list of SDII messages to a stream layer","description":"Enable CORS by returning correct headers","operationId":"Ingest API v1 ingestSDIICors","parameters":[{"name":"layerId","in":"path","description":"The ID of the layer where you want the data ingested.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Default response for CORS method","headers":{"Access-Control-Allow-Headers":{"schema":{"type":"string"}},"Access-Control-Allow-Methods":{"schema":{"type":"string"}},"Access-Control-Allow-Origin":{"schema":{"type":"string"}}}}}},"post":{"tags":["ingestion"],"summary":"Send a list of SDII messages to a stream layer","description":"Consumes individual SDII messages and SDII MessageLists. The endpoint automatically breaks SDII MessageLists down and stores the data as individual SDII messages. Note that this endpoint does not support compression. If you are sending data to stream layer that has compression enabled, you must use the `/layers/<layerID>` endpoint and all compression and decompression must be handled by your application.","operationId":"Ingest API v1 ingestSDII","parameters":[{"name":"layerId","in":"path","description":"The ID of the layer where you want the data ingested.","required":true,"schema":{"type":"string"}},{"name":"X-HERE-Checksum","in":"header","description":"A base64 encoded SHA-256 hash you can provide for validation against the calculated value on the request body hash. This verifies the integrity of your request and prevents modification by a third party.It will be created by the service if not provided. A SHA-256 hash consists of 256 bits or 64 chars.","schema":{"type":"string"}},{"name":"X-HERE-TraceId","in":"header","description":"A unique message ID, such as a UUID. This can be included in the request if you want to use an ID that you define. If you do not include an ID, one will be generated during ingestion and included in the response. You can use this ID to track your request and identify the message in the catalog.","schema":{"type":"string"}},{"name":"X-HERE-Message-Key","in":"header","description":"A unique message ID, such as a UUID. This can be included in the request if you want to use an ID that you define. If you do not include an ID, X-HERE-TraceId will be used instead. You can use this ID to specify the partition for the message in the data catalog.","schema":{"type":"string"}},{"name":"billingTag","in":"query","description":"Optional billing tag provided by customer. It will be used in grouping of billing records.","schema":{"type":"string"}}],"requestBody":{"description":"A byte array of data in SDII MessageList protobuf format to send to the HERE platform for ingestion. The maximum size 