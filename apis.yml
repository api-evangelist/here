- aid: here:here-data-blob-v1
  name: HERE Blob API v1
  description: 'HERE Blob API v1 — 9 operation(s) across 4 path(s), OpenAPI 3.0.2 version 1.0.8, harvested verbatim from the HERE developer documentation. The blob service supports the upload and retrieval of large volumes of data from the storage of a catalog. Each discrete chunk of data is stored as a blob (Binary Large Object). Each blob has its own unique ID (data handle). The data handles can be stored in services like metadata , index or stream . To get data, use your preferred service to retrieve the data handle of the relevant blobs. Then use the data handle to pull the data using the blob service. Currently, the blob service supports REST API versions v1 and v2. Version v1 should be used to access versioned, index and stream (if the stream payload is larger than 1MB) layers. Version v2 should be used to access the object store layer. Always pick the proper API version from API Lookup to ensure  Base URL is not fixed: the spec directs clients to resolve it at runtime through the HERE API Lookup Service (https://api-lookup.data.api.platform.here.com/lookup/v1).'
