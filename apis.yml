description: >-
  As global mobility becomes increasingly connected, electrified and automated, HERE
  Technologies is leading the way to a safer, greener future. Our location platform
  is integrated into more than 160 million vehicles across the planet, using fresh
  and accurate data that we have been building for over 35 years - and continue to
  refresh daily. Our experience in mapmaking has made HERE one of the leading innovators
  in location technology and spatial intelligence.
