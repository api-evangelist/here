  name: HERE Metadata API v1
  description: 'HERE Metadata API v1 — 10 operation(s) across 9 path(s), OpenAPI 3.0.2 version 1.2.0, harvested verbatim from the HERE developer documentation. The metadata service provides a way to get information (metadata) about layers and partitions stored in a catalog. This service exposes the metadata for all the partitions or all the changed partitions. For a catalog with versioned layers, the metadata can be retrieved for a particular version or version range of the catalog. The following operations can be performed for a catalog with versioned layers: - List versions of the catalog - Get latest and minimum version of the catalog - Get metadata of the specific layers For a volatile layer, the metadata can be fetched for all or a subset of partitions of the layer. Base URL is not fixed: the spec directs clients to resolve it at runtime through the HERE API Lookup Service (https://api-lookup.data.api.platform.here.com/lookup/v1).'
