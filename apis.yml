- aid: here:here-matrix-calculation-api
  name: HERE Matrix Calculation API
  description: >-
    Calculation of routing matrices in one of the following modes:

    * Flexible

    * Region

    * Profile


    The values of the `regionDefinition` and `profile` parameters determine which mode is used.

    The following table describes the capabilities and limitations of each mode.


    | Mode     | regionDefinition parameter   | profile parameter provided?   | Custom Options & Time
    Awareness<br>(incl. live traffic) | Unlimited region                                                              |
    Matrix size limit<br>(synchronous) | Matrix size limit<br>(asynchronous) |

    |----------|------------------------------|-------------------------------|---------------------------------------------------------|-------------------------------------------------------------------------------|------------------------------------|-------------------------------------|

    | Flexible | `world`                      | no                            | yes                                                     |
    yes                                                                           | 15 x 100 or 100 x
    1                | 15 x 100 or 100 x 1                 |

    | Region   | one of:<ul><li>`circle`<li>`boundingBox`<li>`polygon`<li>`autoCircle`| no | yes                                        |
    no<br>origins and destinations must be within a region of max 400 km diameter | 500 x 500                          |
    10,000 x 10,000                     |

    | Profile  | `world`                      | yes                           | no                                                      |
    yes                                                                           | 500 x 500 or 1 x 2000
    or 2000 x 1  | 10,000 x 10,000                     |


    Note that the combination of specifying a `profile` along with a `regionDefinition` not equal to `world`
    is not allowed.


    ## Synchronous vs. Asynchronous Requests


    Matrix requests can be synchronous or asynchronous.

