identifier_conventions:
- id: HRN
  shape: hrn:here:<service>:<realm>:<resource>
  used_by: Every HERE platform resource — catalogs, layers, subscriptions, roles, groups, access filters, realms,
    pipelines
  detail: The HERE Resource Name is the platform-wide identifier. It is also the key the API Lookup Service resolves
    into a base URL, which is why most platform specs carry a placeholder server.
- id: apiKey / appId
  shape: opaque string
  used_by: IAM Authentication — applications and their API keys
- id: jobId
  shape: UUID
  used_by: Batch API v7, Tour Planning v3 (asynchronous problems)
  note: Valid for 24 hours in Tour Planning; batch jobs are retained 30 days.
- id: trackingId
  shape: opaque string
  used_by: HERE Tracking — the most-referenced foreign key in the portfolio (14 schemas)
- id: segmentId / extSegmentId
  shape: HERE map topology segment reference
  used_by: Traffic v7, Route Matching v8, Map Attributes
- id: partitionId
  shape: string
  used_by: Data API versioned, volatile, index and stream layers
- id: cpoId
  shape: string
  used_by: EV Charge Points v3 — charge point operator
- id: geofenceId
  shape: string
  used_by: Geofencing API
- id: pipelineVersionId
  shape: UUID
  used_by: Workspace Pipeline Management v2
- id: correlationId
  shape: UUID
  used_by: Cross-cutting request tracing; echoed as X-Correlation-ID
core_domains:
- domain: Place / address
  root: Item
  spec: openapi/here-geocoding-and-search-v7-openapi.json
  detail: SearchResponse has_many Item; Item has_one Address, Position, MapView, Scoring, and has_many Category,
    FoodType, Contact, TimeZone, AccessPoint. `id` on an Item is the HERE location id consumed by /lookup.
- domain: Route
  root: Route
  spec: openapi/here-routing-v8-openapi.yml
  detail: Route has_many Section; Section has_one Departure/Arrival Place, Transport, Summary, Polyline (Flexible
    Polyline encoded), and has_many Action, Notice, TollSystem.
- domain: Catalog
  root: Catalog
  spec: openapi/here-data-config-v1-openapi.yml
  detail: Catalog (addressed by HRN) has_many Layer; Layer has_one Schema, Partitioning, ContentType, Volume; Subscription
    belongs_to Catalog.
- domain: Identity and access
  root: Realm
  spec: openapi/here-authorization-v1-1-openapi.yml
  detail: Realm has_many Group, Role, Application, User; Grant binds an entity (user/app/group) to an action on
    a resource HRN; AccessFilter constrains a grant.
- domain: Tracked asset
  root: Device
  spec: openapi/here-tracking-v2-openapi.json
  detail: Device belongs_to a tracking account, has_many Geofence associations and position/telemetry ingest records
    keyed on trackingId.
- domain: Fleet tour
  root: Problem
  spec: openapi/here-tour-planning-v3-openapi.yml
  detail: Problem has_many Fleet Vehicle Type, Job and Relation; Solution has_many Tour; Tour has_many Stop; Stop
    has_many Activity.
- domain: Pipeline
  root: Pipeline
  spec: openapi/here-pipeline-management-v2-openapi.yml
  detail: Pipeline has_many PipelineVersion; PipelineVersion has_one PipelineTemplate and a JobConfiguration; a
    Job belongs_to a PipelineVersion.
