  finding: 'HERE ships first-party clients in every major ecosystem, but the registry dates split them sharply.
    The Data SDK for TypeScript is current (six @here/olp-sdk-* packages all at 3.0.0, published 2026-08-20) and
    the platform artifact resolvers are recent (2025). Everything aimed at the location-services APIs is stale:
    the official Python client last shipped in 2021, the Flex Polyline decoder in 2024, harp.gl in 2022 and the
    XYZ CLI in 2021 — while the APIs they wrap (Routing 8.162.0, Geocoding and Search 7.155) released this month.
    The flagship JavaScript map API is not on npm at all; it is an unpinned CDN script.'
