idempotency:
  coverage: none
  mechanism: null
  header: null
  detail: No Idempotency-Key (or equivalent) request header is declared in any of the 48 harvested HERE OpenAPI
    documents, and no replay-protection mechanism is documented. 316 of the 797 operations are mutating (POST/PUT/PATCH/DELETE)
    and none of them offers a client-supplied idempotency key. The nearest safety property HERE does offer is
    that most long-running work is modelled as an explicitly-identified job or resource (jobId, HRN, subscriptionHrn)
    created by POST and then addressed by PUT/DELETE, so a retried PUT or DELETE on a known id is naturally idempotent
    — but a retried create is not.
  evidence: grep across openapi/ for `Idempotency` returns zero matches; 0 of 316 write operations declare a key
    header.
reversibility:
  grade: documented
  detail: Reversal paths exist across the platform — 64 of the 316 mutating operations are cancel/stop/delete/remove/restore-shaped
    — but HERE states a time window for only one of them, so the overall grade is `documented` rather than `verified`.
  surfaces:
  - surface: HERE Batch API v7 (geocoding batch jobs)
    write: postJob (POST /batch/jobs)
    reversal: stopJob (PUT /batch/jobs/{jobId}/stop) and deleteJob (DELETE /batch/jobs/{jobId})
    window: The server stores jobs for 30 days after creation, so a completed job stays re-retrievable for 30
      days.
    window_source: https://docs.here.com/geocoding-and-search/docs/job-lifecycle
    grade: verified
  - surface: HERE Data API catalogs
    write: createCatalog (POST /catalogs)
    reversal: changeCatalogState (PATCH /catalogs/{catalogHrn}/status) marks a catalog disabled and re-enables
      it; deleteCatalog (DELETE /catalogs/{catalogHrn}) is terminal
    window: null
    window_source: null
    grade: documented
    note: The disable/re-enable pair is a true reversal; no window is stated, and deletion is not reversible.
  - surface: IAM applications, API keys, access keys, groups, grants
    write: createApplication / createAPIKey / createGroup / addGrant
    reversal: deleteApplication, deleteAPIKey, deleteAccessKey, deleteGroup, removeGrant
    window: null
    window_source: null
    grade: documented
  - surface: HERE Data API blob multipart uploads
    write: startMultipartUpload / uploadPart
    reversal: cancelMultipartUpload (and cancelMultipartUploadByKey in v2)
    window: null
    window_source: null
    grade: documented
  - surface: Notifications / subscriptions (Data API, Batch API v7)
    write: subscribe / postNotification / createSubscription
    reversal: deleteSubscriptions, deleteNotification, deleteSubscription
    window: null
    window_source: null
    grade: documented
  - surface: Workspace pipelines
    write: createPipeline / activatePipelineVersion
    reversal: deactivate / cancel / delete pipeline version operations
    window: null
    window_source: null
    grade: documented
  read_only_surfaces:
  - Geocoding and Search v7
  - Routing v8
  - Isoline Routing v8
  - Matrix Routing v8
  - Traffic v7
  - Traffic tiles
  - Map Image v3
